<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BM&amp;V Map</title>
<style>
:root{--bg:#14181c;--panel:#1e242a;--fg:#e4e6e8;--mut:#9aa3ab;--acc:#e8b04a;--line:#38424c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif}
#bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;gap:8px;align-items:center;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2;flex-wrap:wrap}
#bar select,#bar input,#bar button{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px 6px;border-radius:4px}
#bar button{cursor:pointer}#bar button:hover{border-color:var(--acc)}
#q{width:200px}#res{position:absolute;top:44px;left:300px;background:var(--panel);border:1px solid var(--line);max-height:50vh;overflow:auto;z-index:3;display:none;min-width:300px}
#res div{padding:4px 8px;cursor:pointer}#res div:hover{background:var(--line)}
#layers label{margin-right:8px;white-space:nowrap;color:var(--mut)}
#cv{position:absolute;top:44px;left:0;width:100%;height:calc(100% - 44px);display:block;cursor:crosshair}
#hud{position:absolute;left:8px;bottom:8px;background:rgba(20,24,28,.85);padding:4px 8px;border-radius:4px;font-family:ui-monospace,monospace;z-index:2}
#note{position:absolute;top:52px;left:8px;width:430px;max-width:calc(100% - 16px);max-height:calc(100% - 100px);overflow:auto;background:rgba(30,36,42,.94);border:1px solid var(--line);border-radius:6px;padding:10px 14px;z-index:2;display:none}
#note h2{margin:0 0 6px;font-size:15px;color:var(--acc)}#note p{margin:6px 0}#note table{border-collapse:collapse;width:100%;margin:6px 0}#note td,#note th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right}#note td:first-child,#note th:first-child{text-align:left}
#note li{margin:3px 0}.mut{color:var(--mut)}
#side{position:absolute;top:44px;right:0;bottom:0;width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 14px;display:none;z-index:2}
#side h3{margin:4px 0 8px;color:var(--acc)}#side h4{margin:10px 0 4px}#side table{border-collapse:collapse;width:100%}#side td{vertical-align:top;padding:2px 4px;border-bottom:1px solid var(--line)}#side td:first-child{color:var(--mut);width:34%}
a.fly{color:#7dd3fc;cursor:pointer;text-decoration:underline}
.st-mapped{color:#4ade80}.st-name{color:#facc15}.st-absent{color:#f87171}
#x{float:right;cursor:pointer;color:var(--mut)}#toast{position:absolute;bottom:40px;left:8px;background:var(--acc);color:#000;padding:3px 8px;border-radius:4px;display:none;z-index:3}
</style></head><body>
<div id="bar"><select id="ws"></select><button id="lorebtn">Lore places</button><input id="q" placeholder="Search names"><span id="layers"></span></div>
<div id="res"></div><canvas id="cv"></canvas><div id="hud">-</div><div id="toast"></div><div id="note"></div>
<div id="side"><span id="x">close</span><div id="sb"></div></div>
<script>
const DATA = /*DATA*/null;
const IMAGES = /*IMAGES*/null;
const OV = /*OVERVIEW*/null;
const G=4096, cv=document.getElementById('cv'), cx=cv.getContext('2d');
const LAYERS={grid:'Grid',settlements:'Settlements',doors:'Load doors',people:'People',creatures:'Creatures',nav:'Navmesh cells',islands:'Islands',bmvmarkers:'BM&V map markers',places:'Our places',markers:'Our markers'};
const on={grid:true,settlements:true,doors:true,people:true,creatures:true,nav:false,islands:false,bmvmarkers:true,places:true,markers:true};
const lay=document.getElementById('layers');
for(const k in LAYERS){const l=document.createElement('label');l.innerHTML=`<input type=checkbox ${on[k]?'checked':''}> ${LAYERS[k]}`;l.firstChild.onchange=e=>{on[k]=e.target.checked;draw()};lay.appendChild(l)}
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-GB');
const role=w=>DATA[w]&&DATA[w].role?DATA[w].role[0]:(DATA[w]?(DATA[w].name||w)+' (vanilla, BM&V edits)':w);
// the switcher: the overview, BM&V's own worldspaces, then the vanilla ones BM&V only edits
const wsSel=document.getElementById('ws');
{const o=document.createElement('option');o.value='';o.textContent='Overview: all worldspaces';wsSel.appendChild(o);
 const g1=document.createElement('optgroup');g1.label="BM&V's own worldspaces (separate maps)";
 for(const w of OV.order){const d=DATA[w],o=document.createElement('option');o.value=w;o.textContent=`${d.role[0]} (${d.size.km2} km²; ${d.role[1]})`;g1.appendChild(o)}
 wsSel.appendChild(g1);const g2=document.createElement('optgroup');g2.label="Vanilla worldspaces BM&V edits";
 for(const w in DATA)if(!OV.order.includes(w)){const d=DATA[w],o=document.createElement('option');o.value=w;const n=Object.keys(d.cells).length;if(!n)continue;o.textContent=`${d.name||w}: ${n} vanilla cell${n>1?'s':''} BM&V edits (no BM&V land)`;g2.appendChild(o)}
 wsSel.appendChild(g2)}
let W=null, Wk=null, img, view={s:1,x:0,y:0}, sel=null, hover=null;
const imgs={};for(const w in IMAGES){const i=new Image();i.src=IMAGES[w];i.onload=()=>draw();imgs[w]=i}
function setWorld(w,keep){if(!w){return setOverview()}W=DATA[w];Wk=w;img=imgs[w];wsSel.value=w;document.getElementById('note').style.display='none';if(!keep){fit();sel={kind:'world',o:W};panel(sel)}draw();history.replaceState(null,'','#ws='+w)}
wsSel.onchange=()=>setWorld(wsSel.value);
// game units -> screen (a worldspace)
function tx(x){return (x/G-W.terrain.x0)*view.s+view.x}
function ty(y){return (W.terrain.y1+1-y/G)*view.s+view.y}
function gx(px){return ((px-view.x)/view.s+W.terrain.x0)*G}
function gy(py){return (W.terrain.y1+1-(py-view.y)/view.s)*G}
function fit(){const t=W.terrain,w=t.x1-t.x0+1,h=t.y1-t.y0+1;view.s=Math.min(cv.width/w,cv.height/h)*.95;view.x=(cv.width-w*view.s)/2;view.y=(cv.height-h*view.s)/2}
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;if(!W)ovFit();draw()}
window.onresize=resize;
const CONF={high:'#4ade80',medium:'#facc15',low:'#f97316'};
function dot(x,y,r,f,s){cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=f;cx.fill();if(s){cx.strokeStyle=s;cx.lineWidth=1.5;cx.stroke()}}
const txt=(...a)=>TXT(...a);
const ours=e=>e.replace(/^ARG_/,'').replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().replace(/^./,c=>c.toUpperCase())+' (ours)';
function TXT(t,x,y,f,font){cx.font=font||'bold 12px sans-serif';cx.lineWidth=3;cx.strokeStyle='rgba(0,0,0,.85)';cx.strokeText(t,x,y);cx.fillStyle=f;cx.fillText(t,x,y)}
const nm=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
// ---------------------------------------------------------------- the overview
// frames in cell units: BM&V's worldspaces side by side at one scale (one cell = 58.5 m), Skyrim below
let FR={}, OVB=null, ovHover=null;
(function layout(){let x=0;const gap={Valenwood:30};let H=0;
 for(const w of OV.order){const t=DATA[w].terrain,fw=t.x1-t.x0+1,fh=t.y1-t.y0+1;FR[w]={x,y:0,w:fw,h:fh};x+=fw+(gap[w]||14);H=Math.max(H,fh)}
 const bm=OV.order.filter(w=>w!=='Valenwood');const bx0=FR[bm[0]].x,bx1=FR[bm[bm.length-1]].x+FR[bm[bm.length-1]].w;
 FR._sky={x:FR.Valenwood?FR.Valenwood.x:0,y:H+40,w:bx1-(FR.Valenwood?FR.Valenwood.x:0),h:12};
 FR._bm={x0:bx0,x1:bx1};OVB={x0:-4,y0:-(48+18*OV.links.filter(l=>!l.skyrim.length&&!l.ends.some(e=>e.ws==='Tamriel')).length),x1:x+40-14,y1:H+56}})();
function ovFit(){const left=Math.min(450,cv.width*.45),w=OVB.x1-OVB.x0,h=OVB.y1-OVB.y0;view.s=Math.min((cv.width-left-20)/w,(cv.height-20)/h);view.x=left+10-OVB.x0*view.s+((cv.width-left-20)-w*view.s)/2;view.y=10-OVB.y0*view.s}
function ou(u){return u*view.s+view.x} function ovv(v){return v*view.s+view.y}
function opt(w,x,y){const f=FR[w],t=DATA[w].terrain;return [ou(f.x+x/G-t.x0),ovv(f.y+t.y1+1-y/G)]}
function setOverview(){W=null;Wk=null;wsSel.value='';ovFit();document.getElementById('note').style.display='block';document.getElementById('side').style.display='none';history.replaceState(null,'','#');draw()}
function note(){const T=OV.total,B=OV.black_marsh,S=OV.tamriel;let h=`<h2>BM&amp;V is ${OV.order.length} separate worldspaces, not one land</h2>`;
 h+=`<p>Black Marsh &amp; Valenwood builds each region as its own worldspace: three for Black Marsh (the south, the interior, the north) and one for Valenwood. Each has its own map and coordinates; the edge of one never runs into another, and the gaps and placement on this page are only for comparison. They are drawn at one scale (a cell is 58.5 m a side). The player moves between them only by load doors: the ships, a house with a door in two worlds and a book portal (the lines above). From Skyrim, a book in Dawnstar's Windpeak Inn opens on Lilmoth, Cragslane Cavern's door leads into the interior, and two portals in Riverwood's Sleeping Giant Inn and a cave in Tamriel lead to Valenwood (the lines below). Valenwood has no door to Black Marsh. Click a worldspace to open it.</p>`;
 if(S)h+=`<p><b>Size.</b> All four together hold ${fmt(T.cells)} LAND cells, ${T.km2} km²: ${Math.round(100*T.km2/S.km2)}% of Skyrim's Tamriel (${fmt(S.cells)} cells, ${S.km2} km², measured the same way from Skyrim.esm and Update.esm). Black Marsh's three are ${B.km2} km² (${Math.round(100*B.km2/S.km2)}%). Counting only ground above the water, BM&amp;V has ${T.dry_km2} km² (Black Marsh ${B.dry_km2}) against Tamriel's ${S.dry_km2}. The mod's description is said to claim about 4 times the size of Skyrim (the claim as reported to us; no copy is in our records); the files do not bear it out: together they are a little smaller than Skyrim.</p>`;
 h+=`<table><tr><th>worldspace</th><th>LAND cells</th><th>km²</th><th>above water</th></tr>`+OV.order.map(w=>{const z=DATA[w].size;return `<tr><td><a class=fly data-w="${w}">${esc(DATA[w].role[0])}</a></td><td>${fmt(z.cells)}</td><td>${z.km2}</td><td>${z.dry_km2}</td></tr>`}).join('')+`<tr><td><b>all four</b></td><td>${fmt(T.cells)}</td><td>${T.km2}</td><td>${T.dry_km2}</td></tr>`+(S?`<tr><td>Skyrim's Tamriel</td><td>${fmt(S.cells)}</td><td>${S.km2}</td><td>${S.dry_km2}</td></tr>`:'')+`</table>`;
 h+=`<p class=mut>Cells counted are exterior cells with a LAND record, as the engine stores them (both totals include sea and land beyond the playable border). "Above water" counts the height points standing above each cell's water.</p>`;
 h+=`<h2 style="margin-top:10px">The ways between worldspaces</h2><ul>`+OV.links.map(l=>`<li><b>${esc(l.kind)}</b> via ${esc(viaName(l))}${l.skyrim.length?' <span class=mut>(a Skyrim interior)</span>':''}: `+uniq(l.ends).map(e=>`<a class=fly data-w="${e.ws}" data-x="${e.x}" data-y="${e.y}">${esc(e.ws==='Tamriel'?'Skyrim, Tamriel':role(e.ws))}${e.at?', '+esc(e.at):''}</a>`).join(' · ')+`</li>`).join('')+`</ul>`;
 const n=document.getElementById('note');n.innerHTML=h;n.querySelectorAll('a.fly').forEach(a=>a.onclick=()=>a.dataset.x?flyTo(a.dataset.w,+a.dataset.x,+a.dataset.y):setWorld(a.dataset.w))}
function uniq(E){const s=new Set();return E.filter(e=>{const k=e.ws+'|'+(e.at||Math.floor(e.x/G)+','+Math.floor(e.y/G));if(s.has(k))return false;s.add(k);return true})}
function viaName(l){return l.via.split(', ').map(v=>{const n=v.replace(/ \(.*\)$/,'');return n==='no name'?'an unnamed interior':n}).join(', ')}
function linkShort(l){const v=l.via.split(' (')[0];return l.kind+(v&&v!=='no name'&&v.toLowerCase()!==l.kind?': '+v:'')}
function drawOverview(){const s=view.s;
 for(const w of OV.order){const f=FR[w],t=DATA[w].terrain,X=ou(f.x),Y=ovv(f.y);cx.fillStyle='rgba(255,255,255,.03)';cx.fillRect(X,Y,f.w*s,f.h*s);
  if(imgs[w].complete)cx.drawImage(imgs[w],X,Y,f.w*s,f.h*s);cx.strokeStyle=ovHover===w?'#e8b04a':'rgba(255,255,255,.25)';cx.lineWidth=ovHover===w?2.5:1;cx.strokeRect(X,Y,f.w*s,f.h*s);
  const d=DATA[w];txt(d.role[0],X,ovv(f.y+f.h)+18,'#e8b04a','bold 15px sans-serif');if(d.name&&d.name!==d.role[0])txt('in game: "'+d.name+'"',X,ovv(f.y+f.h)+66,'#9aa3ab','11px sans-serif');
  txt(`${d.size.km2} km²`,X,ovv(f.y+f.h)+34,'#e4e6e8','12px sans-serif');txt(`${fmt(d.size.cells)} LAND cells`,X,ovv(f.y+f.h)+50,'#e4e6e8','12px sans-serif');
  const boxes=[],seenN=new Set();for(const m of d.bmvmarkers){if(/test/i.test(m.name))continue;const [a,b]=opt(w,m.x,m.y),soon=/coming soon/i.test(m.name),col=soon?'#fb923c':'#fff';dot(a,b,2.5,col);if(seenN.has(m.name))continue;cx.font='10px sans-serif';const bw=cx.measureText(m.name).width,bx=[a+4,b-12,a+4+bw,b];if(boxes.some(o=>bx[0]<o[2]&&bx[2]>o[0]&&bx[1]<o[3]&&bx[3]>o[1]))continue;boxes.push(bx);seenN.add(m.name);txt(m.name,a+4,b-3,col,'10px sans-serif')}}
 // brackets: Valenwood apart, Black Marsh's three together
 // Skyrim
 const k=FR._sky;cx.fillStyle='rgba(148,163,184,.12)';cx.fillRect(ou(k.x),ovv(k.y),k.w*s,k.h*s);cx.strokeStyle='rgba(148,163,184,.6)';cx.lineWidth=1;cx.strokeRect(ou(k.x),ovv(k.y),k.w*s,k.h*s);
 txt("Skyrim (vanilla Tamriel and its interiors): the ways in",ou(k.x)+8,ovv(k.y)+18,'#cbd5e1','bold 13px sans-serif');
 // the links: between BM&V's worlds arcs above the row, from Skyrim lines from the box below
 let up=0,sk=0;const skyN=OV.links.filter(l=>l.skyrim.length||l.ends.some(e=>e.ws==='Tamriel')).length;
 for(const l of OV.links){const ends=l.ends.filter(e=>FR[e.ws]&&e.ws!=='Tamriel');
  for(const e of ends){const [a,b]=opt(e.ws,e.x,e.y);dot(a,b,4,l.kind.includes('portal')?'#22d3ee':'#c084fc','#000')}
  const fromSky=l.skyrim.length||l.ends.some(e=>e.ws==='Tamriel');
  if(fromSky){const kx=ou(k.x+k.w*(sk+.5)/skyN),ky=ovv(k.y+k.h);sk++;const col='#94a3b8';
   const seen=new Set();for(const e of ends){if(seen.has(e.ws))continue;seen.add(e.ws);const [a,b]=opt(e.ws,e.x,e.y);cx.strokeStyle=col;cx.setLineDash([5,4]);cx.lineWidth=1.5;cx.beginPath();cx.moveTo(kx,ovv(k.y));cx.quadraticCurveTo(a,ovv(k.y-14),a,b);cx.stroke();cx.setLineDash([])}
   const where=l.skyrim.length?l.skyrim.join(', '):'a cave in Tamriel ('+l.ends.filter(e=>e.ws==='Tamriel').map(e=>Math.floor(e.x/G)+','+Math.floor(e.y/G)).join(' ')+')';
   txt(l.kind+': '+where,kx-60,ky+16-(sk%2)*0,'#cbd5e1','11px sans-serif');continue}
  const per=[],seen=new Set();for(const e of ends)if(!seen.has(e.ws)){seen.add(e.ws);per.push(e)}
  per.sort((a,b)=>OV.order.indexOf(a.ws)-OV.order.indexOf(b.ws));
  const hgt=40+up*18;up++;const col=l.kind.includes('portal')?'#22d3ee':'#c084fc';
  for(let i=0;i+1<per.length;i++){const [a,b]=opt(per[i].ws,per[i].x,per[i].y),[c,d]=opt(per[i+1].ws,per[i+1].x,per[i+1].y);const top=ovv(-hgt);
   cx.strokeStyle=col;cx.lineWidth=2;cx.beginPath();cx.moveTo(a,b);cx.bezierCurveTo(a,top,c,top,c,d);cx.stroke();
   if(i===0){const nd=uniq(l.ends).length,lab=up+'. '+linkShort(l)+': '+per.map(e=>role(e.ws).replace('Black Marsh: ','')).join(' ↔ ')+' ('+nd+' landings: '+uniq(l.ends).map(e=>e.at||Math.floor(e.x/G)+','+Math.floor(e.y/G)).join(', ')+')';cx.font='bold 11px sans-serif';const lw=cx.measureText(lab).width;txt(lab,Math.max(ou(OVB.x0),(a+c)/2-lw/2),.25*Math.min(b,d)+.75*top-4,col,'bold 11px sans-serif')}}}
 const bm=FR._bm;cx.strokeStyle='rgba(232,176,74,.7)';cx.lineWidth=2;cx.beginPath();const by=ovv(-6);cx.moveTo(ou(bm.x0),by+8);cx.lineTo(ou(bm.x0),by);cx.lineTo(ou(bm.x1),by);cx.lineTo(ou(bm.x1),by+8);cx.stroke();
 txt('Black Marsh: three separate worldspaces',ou(bm.x0),by-6,'#e8b04a','bold 14px sans-serif');
 if(FR.Valenwood){const f=FR.Valenwood;cx.beginPath();cx.moveTo(ou(f.x),by+8);cx.lineTo(ou(f.x),by);cx.lineTo(ou(f.x+f.w),by);cx.lineTo(ou(f.x+f.w),by+8);cx.stroke();txt('Valenwood: one worldspace',ou(f.x),by-6,'#e8b04a','bold 14px sans-serif')}
}
// ---------------------------------------------------------------- a worldspace
function draw(){cx.fillStyle='#0b0e11';cx.fillRect(0,0,cv.width,cv.height);if(!W){drawOverview();return}
 const t=W.terrain,s=view.s;cx.imageSmoothingEnabled=s/t.ppc<2;
 if(img.complete)cx.drawImage(img,view.x,view.y,(t.x1-t.x0+1)*s,(t.y1-t.y0+1)*s);
 if(!t.land.length){cx.fillStyle='rgba(160,170,180,.25)';for(const k in W.cells){const [a,b]=k.split(',').map(Number);cx.fillRect(tx(a*G),ty((b+1)*G),s,s)}}
 if(on.nav){cx.fillStyle='rgba(120,200,255,.22)';for(const k in W.cells)if(W.cells[k].nav){const [a,b]=k.split(',').map(Number);cx.fillRect(tx(a*G),ty((b+1)*G),s,s)}}
 if(on.islands){for(const k in W.island_of){const I=W.islands[W.island_of[k]];if(I.refs&&(W.cells[k]||{}).refs)continue;const [a,b]=k.split(',').map(Number);cx.fillStyle='rgba(251,146,60,.30)';cx.fillRect(tx(a*G),ty((b+1)*G),s,s)}}
 if(on.grid&&s>6){cx.strokeStyle='rgba(255,255,255,'+Math.min(.25,s/200)+')';cx.lineWidth=1;cx.beginPath();
  for(let a=t.x0;a<=t.x1+1;a++){cx.moveTo(tx(a*G),ty((t.y1+1)*G));cx.lineTo(tx(a*G),ty(t.y0*G))}
  for(let b=t.y0;b<=t.y1+1;b++){cx.moveTo(tx(t.x0*G),ty(b*G));cx.lineTo(tx((t.x1+1)*G),ty(b*G))}cx.stroke();
  if(s>60){cx.fillStyle='rgba(255,255,255,.5)';cx.font='10px monospace';for(let a=t.x0;a<=t.x1;a++)for(let b=t.y0;b<=t.y1;b++){const X=tx(a*G),Y=ty((b+1)*G);if(X>-s&&X<cv.width&&Y>-s&&Y<cv.height)cx.fillText(a+','+b,X+3,Y+11)}}}
 if(hover){cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.strokeRect(tx(hover[0]*G),ty((hover[1]+1)*G),s,s)}
 if(on.settlements)for(const st of W.settlements){
  const hi=sel&&sel.kind==='settlement'&&sel.o===st,c=st.test?'148,163,184':'232,176,74';
  cx.fillStyle=hi?`rgba(${c},.35)`:`rgba(${c},.12)`;cx.strokeStyle=`rgba(${c},${st.test?.6:.9})`;cx.lineWidth=1;if(st.test)cx.setLineDash([3,3]);
  const set=new Set(st.cells.map(c=>c[0]+','+c[1]));
  for(const [a,b] of st.cells){const X=tx(a*G),Y=ty((b+1)*G);cx.fillRect(X,Y,s,s);cx.beginPath();
   if(!set.has(a+','+(b+1))){cx.moveTo(X,Y);cx.lineTo(X+s,Y)}if(!set.has(a+','+(b-1))){cx.moveTo(X,Y+s);cx.lineTo(X+s,Y+s)}
   if(!set.has((a-1)+','+b)){cx.moveTo(X,Y);cx.lineTo(X,Y+s)}if(!set.has((a+1)+','+b)){cx.moveTo(X+s,Y);cx.lineTo(X+s,Y+s)}cx.stroke()}cx.setLineDash([])}
 if(on.doors)for(const d of W.doors){const X=tx(d.x),Y=ty(d.y);
  if(d.to.ws===W.id&&!d.to.interior&&s>4){cx.strokeStyle='rgba(192,132,252,.6)';cx.beginPath();cx.moveTo(X,Y);cx.lineTo(tx(d.to.x),ty(d.to.y));cx.stroke()}
  cx.fillStyle=d.portal?'#22d3ee':'#c084fc';if(d.portal){cx.beginPath();cx.arc(X,Y,5,0,7);cx.fill()}else cx.fillRect(X-3,Y-3,6,6);
  if(s>90)txt('→ '+doorTo(d),X+5,Y-4,'#e9d5ff','11px sans-serif')}
 for(const a of W.actors){const p=a.person;if(p?!on.people:!on.creatures)continue;dot(tx(a.x),ty(a.y),s>40?3.5:2.2,p?'#38bdf8':'#f87171',a.disabled?'#000':null)}
 if(on.places)for(const p of W.places){const X=tx((p.gx+.5)*G),Y=ty((p.gy+.5)*G);cx.beginPath();cx.arc(X,Y,Math.max(8,s*.6),0,7);cx.strokeStyle=CONF[p.confidence]||'#fff';cx.lineWidth=3;cx.stroke()}
 if(on.bmvmarkers)for(const m of W.bmvmarkers){const X=tx(m.x),Y=ty(m.y);cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X,Y-14);cx.lineTo(X+9,Y-10);cx.lineTo(X,Y-6);cx.strokeStyle='#000';cx.lineWidth=3;cx.stroke();cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.stroke()}
 if(on.markers)for(const m of W.markers){const X=tx(m.x),Y=ty(m.y);cx.beginPath();cx.moveTo(X,Y-9);cx.lineTo(X+7,Y);cx.lineTo(X,Y+9);cx.lineTo(X-7,Y);cx.closePath();cx.fillStyle='#fde047';cx.fill();cx.strokeStyle='#000';cx.lineWidth=1.5;cx.stroke()}
 // labels: in-game names only (map markers; a settlement's own marker names; our places), each name once nearby
 const shown=[],boxes=[];const near4=(n,x,y)=>shown.some(o=>o.n===nm(n)&&Math.hypot(o.x-x,o.y-y)<4*G);

 if(on.bmvmarkers)for(const m of W.bmvmarkers){const X=tx(m.x),Y=ty(m.y),soon=/coming soon/i.test(m.name);txt((m.name||'')+(soon?' (unfinished: BM&V marker)':''),X+11,Y-8,soon?'#fb923c':'#fff');shown.push({n:nm(m.name),x:m.x,y:m.y})}
 if(on.settlements)for(const st of W.settlements){if(!st.label)continue;const x=(st.grid_x+.5)*G,y=(st.grid_y+.5)*G,ns=st.label.split('; ').filter(n=>!near4(n,x,y)&&!W.bmvmarkers.some(m=>m.name===n));if(!ns.length)continue;txt(ns.join('; '),tx(x)+6,ty(y),'#fde68a');ns.forEach(n=>shown.push({n:nm(n),x,y}))}
 if(on.places)for(const p of W.places){const x=(p.gx+.5)*G,y=(p.gy+.5)*G;if(near4(p.place_name,x,y))continue;txt(p.place_name,tx(x)+6,ty(y)+16,CONF[p.confidence]||'#fff')}
 if(on.markers)for(const m of W.markers)txt(ours(m.edid),tx(m.x)+10,ty(m.y)+4,'#fde047');
}
function doorTo(d){const t=d.to;if(t.elsewhere)return 'Skyrim (a master\'s door)';if(t.test)return t.settlement?'an interior of '+(t.label||'this place'):'an interior';
 if(t.ws&&t.ws!==W.id){const e=Object.keys(DATA).find(k=>DATA[k].id===t.ws);return (t.label||'')+' ('+role(e)+')'}return t.label||(t.interior?'an interior':'elsewhere here')}

 cv.style.cursor='crosshair';
 const x=gx(X),y=gy(Y),a=Math.floor(x/G),b=Math.floor(y/G);hover=[a,b];const c=W.cells[a+','+b];
 document.getElementById('hud').textContent=`${role(Wk)}  cell ${a},${b}  x ${x.toFixed(0)}  y ${y.toFixed(0)}`+(c&&c.name&&!c.test?'  "'+c.name+'"':'')+(c&&c.settlement?'  ['+(W.settlements.find(s=>s.name===c.settlement)?.label||'unnamed place')+']':'');draw()};
cv.onwheel=e=>{e.preventDefault();const f=Math.exp(-e.deltaY*.0015),X=e.offsetX,Y=e.offsetY;view.x=X-(X-view.x)*f;view.y=Y-(Y-view.y)*f;view.s*=f;draw()};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2500)}
function copy(txt){const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
 if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(fb);else fb();toast('Copied: '+txt)}
function near(X,Y){let best=null,bd=10;const t=(o,kind,x,y)=>{const d=Math.hypot(tx(x)-X,ty(y)-Y);if(d<bd){bd=d;best={kind,o}}};
 if(on.markers)W.markers.forEach(m=>t(m,'marker',m.x,m.y));
 if(on.doors)W.doors.forEach(d=>t(d,'door',d.x,d.y));
 if(on.bmvmarkers)W.bmvmarkers.forEach(m=>t(m,'bmvmarker',m.x,m.y));
 W.actors.forEach(a=>{if(a.person?on.people:on.creatures)t(a,'actor',a.x,a.y)});
 if(on.places)W.places.forEach(p=>t(p,'place',(p.gx+.5)*G,(p.gy+.5)*G));
 if(!best&&on.settlements){const a=Math.floor(gx(X)/G),b=Math.floor(gy(Y)/G);const st=W.settlements.find(s=>s.cells.some(c=>c[0]===a&&c[1]===b));if(st)best={kind:'settlement',o:st}}
 return best}
cv.onclick=e=>{if(moved>4)return;if(!W){const w=ovAt(e.offsetX,e.offsetY);if(w)setWorld(w);return}
 const x=gx(e.offsetX),y=gy(e.offsetY),a=Math.floor(x/G),b=Math.floor(y/G);
 copy(`${Wk}, ${a},${b}, ${x.toFixed(0)}, ${y.toFixed(0)}`);
 const f=near(e.offsetX,e.offsetY);sel=f||{kind:'cell',o:{key:a+','+b,...(W.cells[a+','+b]||{})}};panel(sel);draw()};
function rows(o){return '<table>'+Object.entries(o).filter(([k,v])=>v!==null&&v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${Array.isArray(v)?v.map(esc).join('<br>'):esc(v)}</td></tr>`).join('')+'</table>'}
function placeRows(ps){return (ps||[]).map(p=>`<h4>Our place: ${esc(p.place_name)}</h4>`+rows({place:p.place,confidence:p.confidence,reason:p.reason,lore:p.source})).join('')}
function count(list){const c={};list.forEach(n=>c[n]=(c[n]||0)+1);return Object.entries(c).map(([n,k])=>k>1?`${n} x${k}`:n)}
function islandRows(I){return rows({island:`${I.cells} dry cells (${I.km2} km²), cells ${I.x0}..${I.x1}, ${I.y0}..${I.y1}`,'on it':I.verdict,'objects (refs)':fmt(I.refs),'actors placed':fmt(I.placements),'load doors':I.doors,'map markers':I.markers,'settlements':I.settlements})}
function flyLink(w,x,y,t){return `<a class=fly data-w="${w}" data-x="${x}" data-y="${y}">${esc(t)}</a>`}
function panel(f){const o=f.o;let h='';
 if(f.kind==='world'){const d=o;h=`<h3>${esc(d.role?d.role[0]:(d.name||Wk))}</h3>`+rows({worldspace:`${Wk} (${d.id})`,'in-game name':d.name,plugin:d.plugin,places:d.role?d.role[1]:null,size:d.size&&d.size.cells?`${fmt(d.size.cells)} LAND cells, ${d.size.km2} km² (${d.size.dry_km2} km² above water)`:'no LAND of its own: a vanilla worldspace BM&V edits',
   note:'A separate worldspace: its edges reach no other land. The way in and out is by the load doors listed below.'});
  if(d.unfinished.length)h+=`<h4>Unfinished</h4>`+d.unfinished.map(m=>flyLink(Wk,m.x,m.y,`BM&V's own map marker "${m.name}"`)+` at ${m.grid_x},${m.grid_y}`).join('<br>');
  const L=OV.links.filter(l=>l.ends.some(e=>e.ws===Wk));
  if(L.length)h+=`<h4>Ways in and out</h4>`+L.map(l=>`<b>${esc(l.kind)}</b> via ${esc(l.via)}${l.skyrim.length?' (Skyrim: '+esc(l.skyrim.join(', '))+')':''}: `+uniq(l.ends).map(e=>e.ws===Wk?flyLink(Wk,e.x,e.y,e.at||`${Math.floor(e.x/G)},${Math.floor(e.y/G)}`):esc(e.ws==='Tamriel'?'Tamriel':role(e.ws))+(e.at?', '+esc(e.at):'')).join(' · ')).join('<br>');
  if(d.wet)h+=`<p class=mut>The island counts cover dry ground only. ${fmt(d.wet.cells)} LAND cells under water hold ${fmt(d.wet.refs)} more objects and ${fmt(d.wet.placements)} actors.`+(d.noland.cells?` ${fmt(d.noland.cells)} cells with no LAND at all hold ${fmt(d.noland.refs)} objects and ${fmt(d.noland.placements)} actors (drawn as empty squares; ${esc(d.noland.keys.slice(0,8).join(' '))}${d.noland.cells>8?' ...':''}).`:'')+`</p>`;
  if(d.islands&&d.islands.length){h+=`<h4>Islands (dry ground; tick "Islands" to tint the bare ones)</h4><table>`+d.islands.filter(I=>I.cells>=3).map(I=>`<tr><td>${I.part_of==null?(I.i+1)+'. ':'↳ '}${flyLink(Wk,I.cx*G,I.cy*G,I.cells+' cells')}<br><span class=mut>${I.x0}..${I.x1}, ${I.y0}..${I.y1}</span></td><td>${esc(I.verdict)}; ${fmt(I.refs)} objects, ${fmt(I.placements)} actors${I.markers.length?'; '+esc(I.markers.join(', ')):''}</td></tr>`).join('')+`</table>`}}
 else if(f.kind==='settlement')h=`<h3>${esc(o.label||'Unnamed place')}</h3>`+rows({'in-game name':o.label||'none: BM&V gives it no map marker or cell name','editor id':o.name,'settlement id':o.id,'internal test cell':o.test?'yes (BM&V\'s own test label)':null,kind:o.kind,anchor:o.grid_x+','+o.grid_y,why:o.why,'exterior cells':o.cells.length,interiors:o.interiors,'NPCs there':count(o.npcs)})+placeRows(o.places);
 else if(f.kind==='door')h=`<h3>${o.portal?'Book portal':'Load door'} to ${esc(doorTo(o))}</h3>`+rows({'form key':o.id,base:o.base,'base name':o.base_name,plugin:o.plugin,cell:o.cell,'exterior cell':o.ext_cell,position:`${o.x.toFixed(0)}, ${o.y.toFixed(0)}, ${o.z.toFixed(0)}`,'leads to':o.to.label||(o.to.elsewhere?'a master: '+o.to.elsewhere:''),'target cell editor id':o.to.edid,'target door':o.to.door,'target cell':o.to.cell,'target settlement':o.to.settlement,'target world':o.to.ws,'note':o.to.test?'the target interior\'s in-game name is BM&V\'s leftover "Quick Test Cell" or a test label':null});
 else if(f.kind==='actor')h=`<h3>${esc(o.name||o.edid)}</h3>`+rows({'placement':o.id,'base':o.npc,'editor id':o.edid,name:o.name,record:o.rec,kind:o.person?'person':'creature',disabled:o.disabled?'yes':'',cell:o.cell,settlement:o.settlement,position:`${o.x.toFixed(0)}, ${o.y.toFixed(0)}, ${o.z.toFixed(0)}`});
 else if(f.kind==='bmvmarker')h=`<h3>${esc(o.name)}</h3>`+rows({source:'BM&V map marker (the in-game name)',id:o.id,plugin:o.plugin,'overridden by':o.overridden_by,cell:o.grid_x+','+o.grid_y,position:`${o.x}, ${o.y}`,'settlement editor id':o.settlement,note:/coming soon/i.test(o.name)?'BM&V marks this area as unfinished':null});
 else if(f.kind==='place')h=`<h3>${esc(o.place_name)}</h3>`+rows({place:o.place,'lands on':o.at,settlement:o.settlement,cell:o.cell,confidence:o.confidence,reason:o.reason,lore:o.source});
 else if(f.kind==='marker')h=`<h3>${esc(o.edid)}</h3>`+rows({source:'plugin/Argonia (ours)',worldspace:o.ws,position:`${o.x}, ${o.y}, ${o.z}`,cell:Math.floor(o.x/G)+','+Math.floor(o.y/G)});
 else if(f.kind==='lore')h=lorePanel();
 else{const I=W.island_of&&W.islands[W.island_of[o.key]];h=`<h3>Cell ${esc(o.key)}</h3>`+rows({'in-game name':o.name&&!o.test?o.name:null,'settlement':o.settlement?(W.settlements.find(s=>s.name===o.settlement)?.label||'unnamed')+' (editor id '+o.settlement+')':null,'form key':o.id,'editor id':o.edid,'internal test cell':o.test?'yes':null,navmesh:o.nav?'yes':(o.id?'no':''),'objects (refs)':o.refs,'LAND':W.terrain.land.includes(o.key)?'yes':'no'})+(I?islandRows(I):(W.terrain.land.includes(o.key)?'<p class=mut>Water: no dry ground in this cell.</p>':''))+placeRows(o.places)}
 if(W&&W.waiting.length&&f.kind==='place')h+=`<h4>Waiting (no BM&amp;V place yet)</h4>`+W.waiting.map(p=>esc(p.place_name)).join(', ');
 const sb=document.getElementById('sb');sb.innerHTML=h;sb.querySelectorAll('a.fly').forEach(a=>a.onclick=()=>flyTo(a.dataset.w,+a.dataset.x,+a.dataset.y));document.getElementById('side').style.display='block'}
function lorePanel(){const L=OV.lore,c=k=>L.filter(p=>p.status===k).length;
 return `<h3>Lore places in BM&amp;V</h3><p class=mut>Every Black Marsh place named in story/lore: the place table's places whose name the lore's text uses, every name in the place tables of the province and region dossiers, and the province's sub-regions: <span class=st-mapped>${c('mapped')} ruled mappings</span>, <span class=st-name>${c('name')} name matches only</span>, <span class=st-absent>${c('absent')} not in BM&amp;V</span>. A ruled mapping carries its confidence (high, medium, low: medium and low are judgements). "Not in BM&amp;V" says whether the census searched every record or only no name matches.</p><table>`+
  L.map(p=>`<tr><td>${esc(p.name)}<br><span class=mut>${esc(p.kind==='water'?'water':(p.region||'from '+(p.source||'').split('/').pop()))}</span></td><td class=st-${p.status}>${p.ws&&p.x!=null&&DATA[p.ws]?flyLink(p.ws,p.x,p.y,role(p.ws)):''} ${esc(p.what)}</td></tr>`).join('')+'</table>'}

function index(){const out=[];for(const w in DATA){const d=DATA[w];
