<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Place Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/studio.css">
<script type="importmap">{"imports": {"three": "./vendor/three-0.170.0/three.module.min.js"}}</script>
</head>
<body>
<header id="top">
  <div class="choosers">
    <label class="pick"><span class="pick-label">Place</span><select id="place-pick" aria-label="Place to edit"></select></label>
    <span id="fingerprint" class="fp" title="The game world this view is built from"></span>
  </div>
  <div class="state">
    <button id="undo" class="icon-btn" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span></button>
    <button id="redo" class="icon-btn" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span>Redo</span></button>
    <span id="save-state" class="save-state" data-state="saved">All changes saved</span>
    <button id="settings-btn" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Detail</span></button>
    <button id="finalise-btn" class="primary">Save and finalise</button>
  </div>
</header>
<div id="warn" class="warn" hidden></div>
<main id="stage">
  <nav id="rail" aria-label="Tools"></nav>
  <section id="views" data-layout="side">
    <div class="view" id="view-ours">
      <div class="canvas-holder"></div>
      <div class="view-bar">
        <span class="view-title">Our place</span>
        <nav class="crumbs" aria-label="Where you are"></nav>
        <button class="icon-btn small fs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <span class="bar-gap"></span>
        <button id="show-src" class="bar-btn" hidden aria-label="Show the source place"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Source</span></button>
      </div>
      <div class="gizmo" hidden></div>
      <svg class="sketch" aria-hidden="true"></svg>
    </div>
    <div class="view-link">
      <button id="link" class="icon-btn small" aria-pressed="false" aria-label="Move both views together"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Link views</span></button>
      <button id="swap" class="icon-btn small" aria-label="Swap the views"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4m0 16-4-4m4 4 4-4"/></svg><span>Swap</span></button>
    </div>
    <div class="view" id="view-src">
      <div class="canvas-holder"></div>
      <div class="view-bar">
        <label class="pick"><span class="pick-label">Source</span><select id="source-pick" aria-label="Source place"></select></label>
        <nav class="crumbs" aria-label="Where you are"></nav>
        <button class="icon-btn small fs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="hide-src" class="bar-btn" aria-label="Hide the source place"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span>Hide</span></button>
      </div>
      <svg class="sketch" aria-hidden="true"></svg>
    </div>
  </section>
  <aside id="panel" aria-live="polite" hidden>
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" class="icon-btn small" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="panel-body"></div>
  </aside>
</main>
<footer id="timebar" hidden>
  <span class="time-label">Time of day</span>
  <input id="time" type="range" min="0" max="24" step="0.25" value="9" aria-label="Time of day">
  <output id="time-out">09:00</output>
</footer>
<div id="chip" class="chip" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="loading" class="loading"><div class="spinner"></div><p id="loading-text">Loading the place</p></div>
<div id="progress" class="progress" hidden><span></span><b><i></i></b></div>
<div id="intro" class="intro" hidden></div>
<div id="start" class="intro" hidden></div>
<div id="settings" class="intro" hidden></div>
<script>
// If the studio's code has not started after a few seconds, the usual cause is a sign-in that has run out (the page
// itself came from the browser's memory, and every request behind it is turned away). Say so and offer the way out.
setTimeout(function () {
  if (window.__studioBooted) return;
  var t = document.getElementById('loading-text'), l = document.getElementById('loading');
  function offer(msg, label, go) {
    t.textContent = msg; var b = document.createElement('button'); b.className = 'primary retry'; b.textContent = label; b.onclick = go; l.appendChild(b);
    var s = l.querySelector('.spinner'); if (s) s.hidden = true;
  }
  fetch('/api/status', { redirect: 'manual', cache: 'no-store', credentials: 'same-origin' }).then(function (r) {
    if (window.__studioBooted) return;
    if (r.type === 'opaqueredirect' || r.status === 401 || r.status === 403) offer('Your sign-in to the studio has run out. Sign in again to carry on; nothing has been lost.', 'Sign in again', function () { location.href = location.origin + '/?signin=' + Date.now(); });
    else offer('The studio did not start. Reload it; if that does not help, clear this site\'s stored data in the browser and sign in again.', 'Reload', function () { location.reload(); });
  }).catch(function () {
    if (!window.__studioBooted) offer('The studio could not be reached. Check that the build machine is running, then reload.', 'Reload', function () { location.reload(); });
  });
}, 8000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
