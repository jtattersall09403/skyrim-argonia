<title>Black Marsh Atlas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  --bg: #111715; --panel: #172019; --ink: #e2e8e1; --muted: #98a59d; --line: #2d3a33; --chip: #212b25;
  --accent: #e0a24f; --link: #74b9b0; --hilite: rgba(224, 162, 79, .16); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111715; --panel: #172019; --ink: #e2e8e1; --muted: #98a59d; --line: #2d3a33; --chip: #212b25;
  --accent: #e0a24f; --link: #74b9b0; --hilite: rgba(224, 162, 79, .16); color-scheme: dark }
html, body { height: 100%; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100%; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: #33463f; touch-action: none; overflow: hidden; }

.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

.kindb[aria-pressed="true"], .seg button[aria-pressed="true"], .act.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.seg { display: flex; gap: 6px; margin: 4px 0 8px; } .seg button { flex: 1; justify-content: center; }
.act { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.namerow { display: flex; gap: 6px; } .namerow input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 1rem var(--f-body); }
.brush { display: grid; gap: 4px; margin: 6px 0; font-size: .95rem; } .brush input { width: 100%; }
.strk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 0; font-size: .92rem; }
.chip.own { background: #ffd34d; color: #1c2420; border-color: transparent; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 46%; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .ph, .body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<div class="app">
  <div class="mapwrap" id="wrap">
    <canvas id="map" aria-label="Map of Black Marsh: drag to move, pinch or scroll to zoom, tap a place or region to read about it" role="img"></canvas>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Show the whole province">⤢</button></div>
    <div class="coord" id="coord">Morrowind cell –</div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="panel">
    <div class="ph">
      <div><h1>Black Marsh Atlas</h1><div class="sub">Project Tamriel's map of Black Marsh, read into our database and researched for 4E 201</div></div>
      <div class="search"><input id="q" type="search" placeholder="Find a place, region or culture" autocomplete="off" aria-label="Search"><div class="results" id="res" hidden></div></div>
      <div class="layers" id="layers"></div>
    </div>
    <div class="body" id="body"></div>
  </aside>
</div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);

// ---- layers ----
const LAYERS = [

    const k = b.dataset.k; on[k] = !on[k];
    if (k === "pt" && on.pt) on.base = false; if (k === "base" && on.base) on.pt = false;
    try { localStorage.setItem("bm-layers", JSON.stringify(on)); } catch (e) {}
    drawLayerButtons(); draw(); if (state.view === "home") home();

}

// ---- canvas, view ----
const cv = $("#map"), ctx = cv.getContext("2d"), wrap = $("#wrap");
// ---- tiled layers: a pyramid of 512 px tiles per layer, the level picked for the zoom, coarser tiles under finer ones ----
const tileCache = new Map();
function tile(name, z, c, r) {
  const k = name + "/" + z + "/" + c + "_" + r; let t = tileCache.get(k);

}
let drawQueued = false;
function scheduleDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(() => { drawQueued = false; draw(); }); } }
function drawTiles(name) {
  const T = D.tiles && D.tiles[name]; if (!T) return;
  const need = view.s * dpr;            // device px per page unit
  let L = T.levels.length - 1; while (L > 0 && T.levels[L - 1].s >= need) L--;

  for (let z = Math.max(0, L - 2); z <= L; z++) {     // coarser levels first, as a backdrop while finer tiles load
    const lv = T.levels[z], ts = T.tile / lv.s;           // a tile's size in page units
    const c0 = Math.max(0, Math.floor(x0 / ts)), c1 = Math.min(lv.c - 1, Math.floor(x1 / ts));
    const r0 = Math.max(0, Math.floor(y0 / ts)), r1 = Math.min(lv.r - 1, Math.floor(y1 / ts));
    if ((c1 - c0 + 1) * (r1 - r0 + 1) > 400) continue;
    for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
      const t = tile(name, lv.z, c, r);
      if (t.complete && t.naturalWidth) ctx.drawImage(t, c * ts, r * ts, t.naturalWidth / lv.s, t.naturalHeight / lv.s);
    }

}
const [W, H] = D.size;
const view = { s: 1, x: 0, y: 0 };
let dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = wrap.clientWidth * dpr; cv.height = wrap.clientHeight * dpr; draw();
}
function fit() {
  // the province: places' extent with a margin
  const xs = D.places.map(p => p.x), ys = D.places.map(p => p.y);
  const x0 = Math.min(...xs) - 30, x1 = Math.max(...xs) + 30, y0 = Math.min(...ys) - 30, y1 = Math.max(...ys) + 30;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  view.s = Math.min(cw / (x1 - x0), ch / (y1 - y0));
  view.x = cw / 2 - view.s * (x0 + x1) / 2; view.y = ch / 2 - view.s * (y0 + y1) / 2; draw();
}
const toScreen = (x, y) => [x * view.s + view.x, y * view.s + view.y];
const toMap = (sx, sy) => [(sx - view.x) / view.s, (sy - view.y) / view.s];
const F = D.frame;
const cellOf = (x, y) => [Math.floor((x - F.x0) / F.cell), -Math.floor((y - F.y0) / F.cell) - 1];
const cellBox = (cx, cy) => [F.x0 + cx * F.cell, F.y0 - (cy + 1) * F.cell];

const cellRegion = new Map(D.cells.map(c => [c[0] + "," + c[1], c]));
let sel = null;   // {type, id}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#33463f"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.s, view.s);
  ctx.imageSmoothingEnabled = true;
  if (on.pt) drawTiles("pt");
  else if (on.base) drawTiles("terrain");
  drawWater();
  if (on.danger) {
    ctx.globalAlpha = .38;
    for (const c of D.cells) { if (!c[3]) continue; const [x, y] = cellBox(c[0], c[1]); ctx.fillStyle = BANDCOL(c[3]); ctx.fillRect(x, y, F.cell, F.cell); }
    ctx.globalAlpha = 1;
  }
  if (on.regions) {
    ctx.lineWidth = 1.6 / view.s; ctx.strokeStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    for (const c of D.cells) {
      const [x, y] = cellBox(c[0], c[1]);
      const r = k => (cellRegion.get(k) || [])[2];
      if (r((c[0] + 1) + "," + c[1]) !== c[2]) { ctx.moveTo(x + F.cell, y); ctx.lineTo(x + F.cell, y + F.cell); }
      if (r(c[0] + "," + (c[1] - 1)) !== c[2]) { ctx.moveTo(x, y + F.cell); ctx.lineTo(x + F.cell, y + F.cell); }
      if (r((c[0] - 1) + "," + c[1]) !== c[2]) { ctx.moveTo(x, y); ctx.lineTo(x, y + F.cell); }
      if (r(c[0] + "," + (c[1] + 1)) !== c[2]) { ctx.moveTo(x, y); ctx.lineTo(x + F.cell, y); }
    }
    ctx.stroke();
    if (sel && sel.type === "region") {
      ctx.fillStyle = "rgba(255,255,255,.22)";
      for (const c of D.cells) if (c[2] === sel.id) { const [x, y] = cellBox(c[0], c[1]); ctx.fillRect(x, y, F.cell, F.cell); }
    }
  }
  if (on.borders) for (const b of D.borders) {
    ctx.setLineDash(b.k === "province" ? [9 / view.s, 4 / view.s, 2 / view.s, 4 / view.s] : [6 / view.s, 4 / view.s]);
    ctx.strokeStyle = b.k === "province" ? "#d23c2e" : "rgba(24,34,80,.85)"; ctx.lineWidth = (b.k === "province" ? 2.6 : 1.8) / view.s;

    if (r.c === "minor") { ctx.setLineDash([4 / view.s, 3 / view.s]); ctx.strokeStyle = "#e8a676"; ctx.lineWidth = 1.5 / view.s; }

function poly(a) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) ctx.lineTo(a[i], a[i + 1]); }
const TIER_R = { "settlement.metropolis": 9, "settlement.large-city": 8, "settlement.small-city": 7, "settlement.small-city-seat": 7, "settlement.town": 6, "settlement.town-seat": 6, "settlement.village": 5, "settlement.village-seat": 5, "settlement.outpost": 5, "settlement.minor": 3 };
const SIDES = { "settlement.metropolis": 8, "settlement.large-city": 7, "settlement.small-city": 6, "settlement.small-city-seat": 6, "settlement.town": 5, "settlement.town-seat": 5, "settlement.village": 4, "settlement.village-seat": 4, "settlement.outpost": 3 };
const FAMCOL = { ruin: "#efe2c6", cave: "#b7b2a8", camp: "#f2c33a", landmark: "#dfe8e4", wreck: "#8fb7c9", sunken: "#5fa58b", work: "#cfc6b0", military: "#cfc6b0", settlement: "#cfc6b0" };
function glyph(p) {
  const [sx, sy] = toScreen(p.x, p.y);
  if (sx < -20 || sy < -20 || sx > wrap.clientWidth + 20 || sy > wrap.clientHeight + 20) return;

  const selected = sel && sel.type === "place" && sel.id === p.id;

  } else {
    const r = 4.2 * z;
    ctx.fillStyle = FAMCOL[p.fam] || "#ddd"; ctx.strokeStyle = "#1c2420";
    ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy); ctx.lineTo(sx, sy + r); ctx.lineTo(sx - r, sy); ctx.closePath(); ctx.fill(); ctx.stroke();

    if (!big && view.s < 1.6) continue;
    if (!p.symid.startsWith("settlement") && view.s < 2.6) continue;
    if (p.n.startsWith("Unnamed") && view.s < 4) continue;

    if (placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
    placed.push(box);

    ctx.fillStyle = "#f6f4ec"; ctx.fillText(t, sx + 10, sy);

  for (let i = 1; i < WB.length; i++) {               // owner-drawn directions on bodies too small to carry build arrows
    if (!WB[i] || !W2.edits[WB[i][0]]) continue; const s = bodyState(i); if (!s.flows || s.deg == null) continue;
    const [sx, sy] = toScreen(s.x, s.y); arrowAt(sx, sy, s.deg, 22, "rgba(20,26,22,.8)", 4.5); arrowAt(sx, sy, s.deg, 22, "#ffd34d", 2);
  }
  if (W2.stroke) { ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.s, view.s); const col = WCOL[W2.brush.kind]; ctx.strokeStyle = `rgba(${col},.75)`; ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = 2 * brushPx() * WS; poly2(ctx, W2.stroke); ctx.stroke(); ctx.restore(); }
  if (W2.arrow) { const [a, b] = [toScreen(W2.arrow[0], W2.arrow[1]), toScreen(W2.arrow[2], W2.arrow[3])]; const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len > 4) arrowAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (Math.atan2(b[0] - a[0], -(b[1] - a[1])) * 180 / Math.PI + 360) % 360, len, "#ffd34d", 3); }
}
const M_PX = 2.9257;   // metres per map pixel at full resolution
const brushPx = () => W2.brush.radiusM / M_PX;
function waterAt(mx, my) {       // page units -> the body under that point, read from the full-resolution body raster
  if (!widx) return 0; const x = Math.floor(mx / WS), y = Math.floor(my / WS);
  if (x < 0 || y < 0 || x >= FW || y >= FH) return 0; return widx[y * FW + x];
}

// drawing tools take a single pen, mouse or finger; two fingers still move and zoom the map
function toolDown(e) {
  if (W2.mode === "pan" || ptrs.size) return false;
  const [mx, my] = toMap(e.offsetX, e.offsetY);
  cv.setPointerCapture(e.pointerId); W2.toolPtr = e.pointerId;
  if (W2.mode === "paint") W2.stroke = [mx, my]; else W2.arrow = [mx, my, mx, my];
  return true;
}
function toolMove(e) {
  if (W2.toolPtr !== e.pointerId) return false;
  const [mx, my] = toMap(e.offsetX, e.offsetY);
  if (W2.stroke) { const n = W2.stroke.length; if (Math.hypot(mx - W2.stroke[n - 2], my - W2.stroke[n - 1]) * view.s > 4) W2.stroke.push(mx, my); }
  if (W2.arrow) { W2.arrow[2] = mx; W2.arrow[3] = my; }
  draw(); return true;
}
function toolUp(e, cancel) {
  if (W2.toolPtr !== e.pointerId) return false;
  W2.toolPtr = null;
  if (!cancel && W2.stroke) savePaint(W2.stroke);
  if (!cancel && W2.arrow) { const [x0, y0, x1, y1] = W2.arrow; if (Math.hypot(x1 - x0, y1 - y0) * view.s > 8) {
      const deg = Math.round((Math.atan2(x1 - x0, -(y1 - y0)) * 180 / Math.PI + 360) % 360);
      const i = W2.arrowFor || waterAt(x0, y0); if (i) { saveEdit(i, { flows: true, flow_deg: deg }); showWater(i); } }
    W2.mode = "pan"; W2.arrowFor = null; }
  W2.stroke = null; W2.arrow = null; draw(); return true;
}

// ---- the shared store ----
(async () => {
  let db = null, user = null;
  try { db = await window.claude?.use?.("db"); user = await window.claude?.use?.("user"); } catch (e) {}
  if (!db) { W2.status = "View only: the shared store is not available here, so edits cannot be saved."; refreshWaterPanel(); return; }
  W2.db = db; try { W2.me = user ? await user.id() : null; } catch (e) {}
  const timer = setTimeout(() => { W2.status = "The shared store is slow to answer; edits will show when it does."; refreshWaterPanel(); }, 10000);
  db.collection("water_edits").onSnapshot(snap => { clearTimeout(timer); W2.raw = snap.docs.map(d => [d.id, d.data()]); resolveEdits(); W2.status = ""; buildWaterOverlay(); draw(); refreshWaterPanel(); },
    err => { W2.status = "Could not read the shared edits: " + (err && err.message || err); refreshWaterPanel(); });
  db.collection("water_paint").onSnapshot(snap => { W2.paint = {}; snap.docs.forEach(d => W2.paint[d.id] = d.data()); buildWaterOverlay(); draw(); refreshWaterPanel(); }, () => {});
})();
async function saveEdit(i, patch) {
  const id = WB[i][0];
  const doc = Object.assign({}, W2.edits[id] || {}, patch, { at: new Date().toISOString(), by: W2.me || null,
    point: [Math.round(WB[i][5] / WS), Math.round(WB[i][6] / WS)] });   // a point inside: finds the body after a rebuild
  W2.edits[id] = doc; buildWaterOverlay(); draw();
  if (!W2.db) { W2.status = "Not saved: the shared store is not available here."; return; }
  try { await W2.db.collection("water_edits").doc((W2.docOf || {})[id] || id).set(doc); W2.status = ""; }
  catch (e) { W2.status = "Not saved: " + (e.message || e.code || e) + ". You may only have view access."; refreshWaterPanel(); }
}
async function clearEdit(i) {
  const id = WB[i][0]; delete W2.edits[id]; buildWaterOverlay(); draw(); showWater(i);
  if (W2.db) try { await W2.db.collection("water_edits").doc((W2.docOf || {})[id] || id).delete(); } catch (e) { W2.status = "Not removed: " + (e.message || e); refreshWaterPanel(); }
}
async function savePaint(pts) {
  const full = pts.map(v => Math.round(v / WS));
  const doc = { kind: W2.brush.kind, flows: W2.brush.flows, radius_px: Math.round(brushPx()), pts: full, at: new Date().toISOString(), by: W2.me || null };
  const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  W2.paint[id] = doc; buildWaterOverlay(); draw(); refreshWaterPanel();
  if (!W2.db) { W2.status = "Not saved: the shared store is not available here."; refreshWaterPanel(); return; }
  try { await W2.db.collection("water_paint").doc(id).set(doc); } catch (e) { W2.status = "Not saved: " + (e.message || e); refreshWaterPanel(); }
}
async function deletePaint(id) {
  delete W2.paint[id]; buildWaterOverlay(); draw(); refreshWaterPanel();
  if (W2.db) try { await W2.db.collection("water_paint").doc(id).delete(); } catch (e) { W2.status = "Not removed: " + (e.message || e); refreshWaterPanel(); }
}

// ---- water panels ----
function refreshWaterPanel() { if (state.view === "water" && sel && sel.type === "water") showWater(sel.i); else if (state.view === "waterhome") showWaterHome(); }
const statusLine = () => W2.status ? `<p class="wstatus">${esc(W2.status)}</p>` : "";
const kindButtons = (cur, attr) => `<div class="kinds">${Object.entries(WK).map(([k, n]) => `<button class="kindb" aria-pressed="${k === cur}" ${attr}="${k}"><span class="sw" style="background:rgb(${WCOL[k]})"></span>${esc(n)}</button>`).join("")}</div>`;
function showWater(i) {
  sel = { type: "water", i }; const s = bodyState(i); const b = WB[i]; draw();
  const down = s.down && WB[s.down] ? bodyState(s.down) : null;
  const flowText = !s.flows ? "Still water" : s.deg == null ? "Flowing; direction not set" : `Flows toward ${compass(s.deg)} (${s.deg}°)`;
  setBody(`<button class="back" data-waterhome>← Water</button>
  <h2>${esc(bodyTitle(s))}</h2>
  <div class="chips"><span class="chip"><span class="sw" style="display:inline-block;vertical-align:-2px;background:rgb(${WCOL[s.kind]})"></span> ${esc(WK[s.kind] || s.kind)}</span><span class="chip">${esc(SPEED[s.speed] || s.speed)}</span>${s.edited ? `<span class="chip own">Your edit</span>` : `<span class="chip">Worked out from the map</span>`}</div>
  ${statusLine()}
  <dl class="facts"><dt>Flow</dt><dd>${flowText}</dd><dt>Size</dt><dd>${s.ha >= 100 ? (s.ha / 100).toFixed(2) + " km²" : s.ha + " ha"}${s.width ? `, about ${Math.round(s.width)} m across` : ""}</dd><dt>Region</dt><dd>${esc(s.region)}</dd>
  ${down ? `<dt>Runs into</dt><dd><button class="chip" data-wgo="${s.down}">${esc(bodyTitle(down))}</button></dd>` : ""}
  <dt>Why this kind</dt><dd>${esc(s.edited && W2.edits[s.id].kind ? "You set it." : s.why)}</dd></dl>
  <h3>Kind</h3>${kindButtons(s.kind, "data-wkind")}
  <h3>Flow</h3><div class="seg"><button aria-pressed="${!s.flows}" data-wflow="0">Still</button><button aria-pressed="${s.flows}" data-wflow="1">Flowing</button></div>
  ${s.flows ? `<div class="seg"><button aria-pressed="${s.speed === "slow"}" data-wspeed="slow">Slow</button><button aria-pressed="${s.speed === "moderate"}" data-wspeed="moderate">Moderate</button><button aria-pressed="${s.speed === "fast"}" data-wspeed="fast">Fast</button></div>
  <p><button class="act" data-warrow>${W2.mode === "arrow" ? "Now draw on the map: from upstream to downstream" : "Draw the direction on the map"}</button></p>` : ""}
  <h3>Name</h3><div class="namerow"><input id="wname" type="text" value="${esc(s.name || "")}" placeholder="Unnamed" aria-label="Name of this water"><button class="act" data-wname>Save name</button></div>
  ${s.edited ? `<p><button class="back" data-wclear>Undo my edits to this water</button></p>` : ""}
  <p class="sub mono" style="color:var(--muted)">${esc(s.id)}</p>`, "water");
}
function compass(d) { return ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"][Math.round(d / 45) % 8]; }
function showWaterHome() {
  sel = null; draw();
  const n = {}; let flowing = 0;
  for (let i = 1; i < WB.length; i++) if (WB[i]) { const s = bodyState(i); n[s.kind] = (n[s.kind] || 0) + 1; if (s.flows) flowing++; }
  const strokes = Object.entries(W2.paint).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)));
  setBody(`<button class="back" data-home>← Overview</button><h2>Water</h2>
  <p class="lead">Every body of water on the map, with the kind and flow worked out from its shape and its region's research. Change any of it here; the world build reads your edits.</p>
  ${statusLine()}
  <p>Tap water on the map to see and change its kind, whether it flows, its speed and its name. Arrows follow each channel's course and point the way its water runs toward the sea; a gold arrow is one you set.</p>
  <div class="legend">${Object.entries(WK).map(([k, nm]) => `<div class="row"><span class="sw" style="background:rgb(${WCOL[k]})"></span>${esc(nm)} <span class="mono" style="color:var(--muted)">${n[k] || 0}</span></div>`).join("")}</div>
  <p class="sub" style="color:var(--muted)">${flowing} flowing, ${WB.length - 1 - flowing} still. ${Object.keys(W2.edits).length} edited by hand.</p>
  <h3>Paint a kind over an area</h3>
  <p>Paint where one kind becomes another, for example where a river spreads into marsh. The painted part becomes its own body. Use a pen or one finger to paint; two fingers still move the map.</p>
  ${kindButtons(W2.brush.kind, "data-bkind")}
  <div class="seg"><button aria-pressed="${!W2.brush.flows}" data-bflow="0">Still</button><button aria-pressed="${W2.brush.flows}" data-bflow="1">Flowing</button></div>
  <label class="brush" for="bsize">Brush width: <b>${W2.brush.radiusM * 2} m</b><input id="bsize" type="range" min="10" max="400" step="10" value="${W2.brush.radiusM}"></label>
  <p><button class="act ${W2.mode === "paint" ? "on" : ""}" data-bpaint>${W2.mode === "paint" ? "Painting: tap here to stop" : "Start painting"}</button></p>
  ${strokes.length ? `<h3>Painted areas (${strokes.length})</h3><div class="list">${strokes.map(([id, st]) => `<div class="strk"><span class="sw" style="background:rgb(${WCOL[st.kind]})"></span>${esc(WK[st.kind] || st.kind)}, ${st.flows ? "flowing" : "still"}, ${Math.round(st.radius_px * 2 * M_PX)} m wide <button class="chip" data-bgo="${id}">Show</button><button class="chip" data-bdel="${id}">Remove</button></div>`).join("")}</div>` : ""}`, "waterhome");
}
function wireWater() {
  body.querySelectorAll("[data-waterhome]").forEach(b => b.onclick = () => { W2.mode = "pan"; showWaterHome(); });
  body.querySelectorAll("[data-wgo]").forEach(b => b.onclick = () => { const i = +b.dataset.wgo; showWater(i); goTo(WB[i][5], WB[i][6], 3); });
  const i = sel && sel.type === "water" ? sel.i : null;
  body.querySelectorAll("[data-wkind]").forEach(b => b.onclick = () => { const k = b.dataset.wkind; saveEdit(i, { kind: k, flows: RUNS.has(k) }); showWater(i); });
  body.querySelectorAll("[data-wflow]").forEach(b => b.onclick = () => { const f = b.dataset.wflow === "1"; saveEdit(i, f ? { flows: true } : { flows: false, speed: "still" }); showWater(i); });
  body.querySelectorAll("[data-wspeed]").forEach(b => b.onclick = () => { saveEdit(i, { speed: b.dataset.wspeed }); showWater(i); });
  body.querySelectorAll("[data-warrow]").forEach(b => b.onclick = () => { W2.mode = "arrow"; W2.arrowFor = i; showWater(i); });
  body.querySelectorAll("[data-wname]").forEach(b => b.onclick = () => { saveEdit(i, { name: $("#wname").value.trim() || null }); showWater(i); });
  body.querySelectorAll("[data-wclear]").forEach(b => b.onclick = () => clearEdit(i));
  body.querySelectorAll("[data-bkind]").forEach(b => b.onclick = () => { W2.brush.kind = b.dataset.bkind; W2.brush.flows = RUNS.has(b.dataset.bkind); showWaterHome(); });
  body.querySelectorAll("[data-bflow]").forEach(b => b.onclick = () => { W2.brush.flows = b.dataset.bflow === "1"; showWaterHome(); });
  const bs = body.querySelector("#bsize"); if (bs) bs.oninput = () => { W2.brush.radiusM = +bs.value; bs.previousSibling.textContent = W2.brush.radiusM * 2 + " m"; };
  body.querySelectorAll("[data-bpaint]").forEach(b => b.onclick = () => { W2.mode = W2.mode === "paint" ? "pan" : "paint"; if (W2.mode === "paint" && !on.water) { on.water = true; drawLayerButtons(); } showWaterHome(); draw(); });
  body.querySelectorAll("[data-bdel]").forEach(b => b.onclick = () => deletePaint(b.dataset.bdel));
  body.querySelectorAll("[data-bgo]").forEach(b => b.onclick = () => { const st = W2.paint[b.dataset.bgo]; goTo(st.pts[0] * WS, st.pts[1] * WS, 3); });
  body.querySelectorAll("[data-water]").forEach(b => b.onclick = () => { if (!on.water) { on.water = true; drawLayerButtons(); } showWaterHome(); });
}

// ---- search ----
const idx = [
  ...D.places.map(p => ({ t: p.n, s: `${p.kind} · ${D.regionNames[p.reg]}`, k: [p.n, p.label, ...p.alias].join(" ").toLowerCase(), go: () => { showPlace(p.id); goTo(p.x, p.y, 3); } })),
  ...D.regions.map(r => ({ t: r.n, s: "Region", k: r.n.toLowerCase(), go: () => { showRegion(r.id); goTo(r.x, r.y, 1.2); } })),
  ...Object.entries(D.cultures).map(([id, c]) => ({ t: c.n, s: "Culture", k: (c.n + " " + c.people).toLowerCase(), go: () => showCulture(id) })),
];
let hits = [], hi = 0;
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  hits = q.length < 2 ? [] : idx.filter(i => i.k.includes(q)).sort((a, b) => (a.k.startsWith(q) ? 0 : 1) - (b.k.startsWith(q) ? 0 : 1)).slice(0, 12);
  hi = 0; renderHits();
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { hi = Math.min(hi + 1, hits.length - 1); renderHits(); e.preventDefault(); }
  if (e.key === "ArrowUp") { hi = Math.max(hi - 1, 0); renderHits(); e.preventDefault(); }
  if (e.key === "Enter" && hits[hi]) { hits[hi].go(); $("#res").hidden = true; }
  if (e.key === "Escape") $("#res").hidden = true;
});
function renderHits() {
  const r = $("#res"); r.hidden = !hits.length;
  r.innerHTML = hits.map((h, i) => `<button class="${i === hi ? "on" : ""}" data-i="${i}">${esc(h.t)} <small>${esc(h.s)}</small></button>`).join("");
  r.querySelectorAll("button").forEach(b => b.onclick = () => { hits[+b.dataset.i].go(); r.hidden = true; });
}
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#res").hidden = true; });

window.addEventListener("resize", resize);
drawLayerButtons(); resize(); fit(); home();
// a link may name a place to open on: #place=<place id> centres the map on it, zooms in and opens its card
function openFromHash() {
  const m = /(?:^#|&)place=([^&]+)/.exec(location.hash), p = m && placeById[decodeURIComponent(m[1])];
  if (p) { showPlace(p.id); goTo(p.x, p.y, 3); }
}
openFromHash(); window.addEventListener("hashchange", openFromHash);
</script>
