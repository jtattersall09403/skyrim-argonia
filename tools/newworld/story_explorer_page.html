<style>

  --accent:#93a8ff; --accent-ink:#0f1430; --mark:#5b4b12; --mark-ink:#fff3c9;

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS = {outlined:"Outlined", written:"Written", reviewed:"Reviewed", built:"Built"};
const STATUS_HELP = {outlined:"Told at arc level in its line's story; not yet written out stage by stage.",
  written:"Written out in full: people, stages, endings.", reviewed:"Written in full and read on paper by fresh readers.",
  built:"A record of this quest is in our plugin."};
const KIND = {plot:"Main quest plot", line:"Line story", ledger:"Ledger", world:"Province digest", region:"Region"};
let CAT = null; const DOCS = {}; let db = null, dbState = "connecting", batches = [], dreplies = {};
const DKEY = "story-explorer-drafts";
let drafts = []; try { drafts = JSON.parse(localStorage.getItem(DKEY) || "[]"); } catch (e) { drafts = []; }
const GKEY = "story-explorer-drafts-gone";
let gone = {}; try { gone = JSON.parse(localStorage.getItem(GKEY) || "{}") || {}; } catch (e) { gone = {}; }
/* merge:start (tested by tools/tests/test_newworld_story_explorer.py) */
/* Merge this device's drafts and removals with the account's drafts collection, by note id, newest change wins.
   local: notes [{id, ..., updatedAt?}]; gone: {id: removedAt}; remote: docs [{id, ..., updatedAt, deleted}].
   Returns the drafts to keep, the removals to remember, the notes to upload and the ids to mark removed there. */
function mergeDrafts(local, gone, remote) {
  const L = new Map(local.map(d => [d.id, d])), R = new Map(remote.map(d => [d.id, d]));
  const keep = [], upload = [], tomb = [], g = {...gone};
  const strip = r => { const {by, deleted, ...n} = r; return n; };
  for (const id of new Set([...L.keys(), ...R.keys(), ...Object.keys(gone)])) {
    const l = L.get(id), r = R.get(id), lt = l ? (l.updatedAt || 0) : (g[id] || 0), rt = r ? (r.updatedAt || 0) : -1;
    if (!r) { if (l) { keep.push(l); upload.push(l); } else tomb.push(id); continue; }
    if (r.deleted) {
      if (l && lt > rt) { keep.push(l); upload.push(l); delete g[id]; } else g[id] = Math.max(g[id] || 0, rt);
      continue;
    }
    if (!l && g[id] !== undefined && g[id] >= rt) { tomb.push(id); continue; }
    if (l && lt > rt) { keep.push(l); upload.push(l); continue; }
    keep.push(strip(r)); delete g[id];
  }
  keep.sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  return {drafts: keep, gone: g, upload, tomb};
}
/* merge:end */
let uid = null, synced = false, syncT = null;
const saveLocal = () => { try { localStorage.setItem(DKEY, JSON.stringify(drafts)); localStorage.setItem(GKEY, JSON.stringify(gone)); } catch (e) {} paintCount(); };
const saveDrafts = () => { const now = Date.now(); for (const d of drafts) if (d._dirty) { d.updatedAt = now; delete d._dirty; } saveLocal(); queueSync(); };
const removeDraft = id => { drafts = drafts.filter(d => d.id !== id); gone[id] = Date.now(); saveDrafts(); };
const queueSync = () => { clearTimeout(syncT); syncT = setTimeout(syncDrafts, 400); };
let syncing = false;
async function syncDrafts() {
  if (!db || syncing) { if (syncing) queueSync(); return; }
  syncing = true;
  try {
    const col = db.collection("drafts"), snap = await col.get();
    const remote = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(r => !uid || r.by === uid);
    const m = mergeDrafts(drafts, gone, remote);
    const write = async (id, data) => col.doc(id).set({...data, by: uid});
    for (const n of m.upload) await write(n.id, {...n, updatedAt: n.updatedAt || Date.now(), deleted: false});
    for (const id of m.tomb) await write(id, {updatedAt: gone[id] || Date.now(), deleted: true});
    const before = JSON.stringify(drafts.map(d => d.id + d.note));
    drafts = m.drafts; gone = m.gone; for (const n of drafts) if (!n.updatedAt) n.updatedAt = Date.now();
    saveLocal(); synced = true;
    if (JSON.stringify(drafts.map(d => d.id + d.note)) !== before) paintHighlights();
  } catch (e) { synced = false; setTimeout(queueSync, 60000); }
  finally { syncing = false; if ($(".sheet") && $("#submitB")) openTray(); }
}
addEventListener("online", queueSync);
const quest = id => CAT.quests.find(q => q.id === id);
const qsort = (a, b) => a.id.localeCompare(b.id);
const pill = s => `<span class="pill st-${s}" title="${esc(STATUS_HELP[s])}">${STATUS[s]}</span>`;
const hashId = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const personById = id => CAT.people.find(p => p.id === id), placeById = id => CAT.places.find(p => p.id === id);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
const PAL = ["#0f7a5c","#c2410c","#3156a8","#8a3ffc","#b8860b","#0e7490","#be185d","#4d7c0f","#9a3412","#6d28d9","#047857","#a16207","#1d4ed8","#b91c1c","#0369a1","#7c3aed"];
const lineColor = id => { const i = CAT.lines.findIndex(l => l.id === id); return i < 0 ? "var(--muted)" : PAL[i % PAL.length]; };
const shortLine = l => l.title.split(":")[0].replace(/^The /, "").replace(/ in the new world$/i, "").replace(/^Blackrose /, "");
let CUR = {item: "home", label: "The story home page"};
let toastT; function toast(m) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.append(el); } el.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }
async function loadDoc(id) { if (!DOCS[id]) DOCS[id] = await (await fetch(`data/doc-${id}.json`)).json(); return DOCS[id]; }

function blockHtml(b, item, field) {
  const noted = drafts.some(d => d.block === b.id) ? " noted" : "";
  let inner = "";
  if (b.t === "p") inner = `<p>${b.html}</p>`;
  else if (b.t === "h") { const l = Math.min(4, Math.max(2, b.level)); inner = `<h${l}>${b.html}</h${l}>`; }
  else if (b.t === "list") inner = `<${b.ordered ? "ol" : "ul"}>${b.items.map(i => `<li>${i}</li>`).join("")}</${b.ordered ? "ol" : "ul"}>`;
  else if (b.t === "table") inner = `<div class="tbl"><table><thead><tr>${b.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
      b.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else inner = `<pre>${esc(b.text)}</pre>`;
  return `<div class="blk${noted}" data-block="${esc(b.id)}" data-item="${esc(item)}" data-field="${esc(field || b.section)}">${inner}</div>`;
}

/* ---------- views ---------- */
function setNav(n) { document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === n)); }
function stamp() { return `<p class="msg">Story data version ${esc(CAT.version)}, generated ${esc(CAT.generated)}. Select any passage, or tap a paragraph or a table row, to leave a note.</p>`; }

    <p class="lede">Every story line written for the new world: the main quest and the fourteen faction lines, each quest in them,

    <p class="lede">Highlight any words to note or react to them; tap an underlined name to see who or what it is. Notes gather in the tray at the top until you send them as one batch. <a href="#map">The link map</a> shows how the lines meet.</p>
    ${stamp()}
    <section class="wrap" style="gap:12px"><h2>The main quest</h2><div class="grid">

      ${CAT.docs.filter(d => d.kind === "ledger").map(d => `<a class="card" href="#d-${d.id}"><span class="eyebrow">${KIND[d.kind]}</span><b>${esc(d.title)}</b></a>`).join("")}</div></section>`;
}
function lineCard(l, sub) {

}

let F = {q: "", line: "", status: ""};

async function fullText() {
  const t = F.q.trim().toLowerCase(), out = $("#ftsOut");

  out.innerHTML = `<p class="msg">Reading ${CAT.docs.length} files…</p>`;
  await Promise.all(CAT.docs.map(d => loadDoc(d.id)));
  const hits = [];
  for (const d of CAT.docs) for (const b of DOCS[d.id].blocks) {
    const txt = (b.html || (b.items || []).join(" ") || (b.rows || []).flat().join(" ") || b.text || "").replace(/<[^>]+>/g, "");
    const i = txt.toLowerCase().indexOf(t);
    if (i >= 0) hits.push({d, b, s: esc(txt.slice(Math.max(0, i - 70), i)) + "<mark>" + esc(txt.substr(i, t.length)) + "</mark>" + esc(txt.slice(i + t.length, i + t.length + 90))});
    if (hits.length > 200) break;

  out.innerHTML = hits.length ? `<p class="msg">${hits.length > 200 ? "The first 200" : hits.length} matches.</p>` + hits.map(h => `<div class="fhit"><a href="#d-${h.d.id}" data-jump="${esc(h.b.id)}"><b>${esc(h.d.title)}</b> <span class="msg">${esc(h.b.section)}</span><div class="s">…${h.s}…</div></a></div>`).join("") : `<p class="empty">Nothing found.</p>`;
}

async function route() {
  const h = location.hash.slice(1) || "home"; const v = $("#view"); let html;
  try {
    if (h === "home") html = viewHome();
    else if (h === "quests") html = viewQuests();
    else if (h === "people" || h === "places") html = viewPeople(h);
    else if (h === "world") html = viewWorld();
    else if (h === "map" || h.startsWith("map-")) html = viewMap();
    else if (h === "notes") { html = viewHome(); setTimeout(openTray); }
    else if (h.startsWith("q-")) html = await viewQuest(h.slice(2));
    else if (h.startsWith("d-")) html = await viewDoc(h.slice(2));
    else if (h.startsWith("pl-")) html = await viewEntity("pl", h.slice(3));
    else if (h.startsWith("p-")) html = await viewEntity("p", h.slice(2));
    else html = notFound();
  } catch (e) { html = `<h1>Could not load this</h1><p class="lede">${esc(e.message)}. Reload the page to try again.</p>`; }
  v.innerHTML = html; window.scrollTo(0, 0); clearActive();
  if ($("#qlist")) { fillQuests();
    $("#qq").oninput = e => { F.q = e.target.value; fillQuests(); };
    document.querySelectorAll("[data-ln]").forEach(b => b.onclick = () => { F.line = b.dataset.ln; document.querySelectorAll("[data-ln]").forEach(x => x.setAttribute("aria-pressed", x === b)); fillQuests(); });
    document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { F.status = b.dataset.st; document.querySelectorAll("[data-st]").forEach(x => x.setAttribute("aria-pressed", x === b)); fillQuests(); });
    $("#fts").onclick = fullText; }
  if ($("#plist")) { fillPeople(); $("#pq").oninput = e => { F.p = e.target.value; fillPeople(); };
    $("#inq").onclick = e => { F.inQuests = !F.inQuests; e.target.setAttribute("aria-pressed", F.inQuests); fillPeople(); }; }
  if ($("#toc")) $("#toc").onchange = e => { const el = document.querySelector(`[data-block="${CSS.escape(e.target.value)}"]`); if (el) el.scrollIntoView({block: "start"}); };
  if ($("#map")) wireMap(h.startsWith("map-") ? h.slice(4) : "");
  xray(); readMemory(h); paintHighlights();
  if (pendingJump) { const el = document.querySelector(`[data-block="${CSS.escape(pendingJump)}"]`); pendingJump = null; if (el) { el.scrollIntoView({block: "center"}); el.classList.add("active"); } }
}
let pendingJump = null;

/* ---------- selecting and noting ---------- */
let target = null; // {item, field, block, quote, label}
const act = $("#act"), actBtn = $("#actBtn");
function itemLabel(item) { const q = quest(item); if (q) return `${q.id} ${q.title}`; const d = CAT.docs.find(x => x.id === item); return d ? d.title : item; }
function clearActive() { document.querySelectorAll(".blk.active,tr.active").forEach(e => e.classList.remove("active")); target = null; act.hidden = true; }
function showAct(t, text) { target = t; actBtn.textContent = text; act.hidden = false; }
document.addEventListener("selectionchange", () => {
  const sel = getSelection(); if (!sel || sel.isCollapsed) { if (target && target.fromSel) { target = null; act.hidden = true; } return; }
  const node = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
  if (!node || node.closest(".sheet,.bar,.act,input,textarea")) return;
  const quote = sel.toString().trim(); if (!quote) return;
  const blk = node.closest(".blk"), lk = node.closest("[data-link]");
  const head = blk ? null : [...document.querySelectorAll("#view h1,#view h2")].filter(h => h.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING).pop();
  const t = blk ? {item: blk.dataset.item, field: blk.dataset.field, block: blk.dataset.block}
    : lk ? {item: lk.dataset.link, field: "link", block: null, label: lk.dataset.label, kind: "link"}
    : {item: CUR.item, field: head ? head.textContent.trim() : "page", block: null, label: CUR.label};
  showAct({...t, quote: quote.slice(0, 1200), view: location.hash || "#home", fromSel: true}, "Note on the highlighted words");
});
document.addEventListener("click", e => {
  const xr = e.target.closest("[data-xr]"); if (xr) { openXray(xr.dataset.xr); return; }
  const whole = e.target.closest("[data-whole]");
  if (whole) { openComposer({item: whole.dataset.whole, field: whole.dataset.field || "whole", block: null, quote: whole.dataset.quote || "", label: whole.dataset.label, kind: whole.dataset.kind || null, view: location.hash || "#home"}); return; }
  const hl = e.target.closest(".hl"); if (hl && !(getSelection() && !getSelection().isCollapsed)) { openComposer(null, hl.dataset.note); return; }
  const jump = e.target.closest("[data-jump]"); if (jump) pendingJump = jump.dataset.jump;
  if (e.target.closest("a,button,select,input,textarea,.sheet,.act")) return;
  const sel = getSelection(); if (sel && !sel.isCollapsed) return;
  const blk = e.target.closest(".blk");
  if (!blk) { clearActive(); return; }
  const tr = e.target.closest("tbody tr"); const was = blk.classList.contains("active") && !tr;
  clearActive(); if (was) return;
  if (tr) { tr.classList.add("active"); const head = [...blk.querySelectorAll("th")].map(t => t.textContent.trim());
    const cellsT = [...tr.children].map(c => c.textContent.trim());
    const rowName = /stage/i.test(head[0] || "") ? `Stage ${cellsT[0]}` : cellsT[0];
    showAct({item: blk.dataset.item, field: `${blk.dataset.field} / ${rowName}`, block: blk.dataset.block, quote: cellsT.join(" | ").slice(0, 1200)}, `Add a note on ${rowName.length > 28 ? "this row" : rowName}`); return; }
  blk.classList.add("active");
  showAct({item: blk.dataset.item, field: blk.dataset.field, block: blk.dataset.block, quote: blk.innerText.trim().slice(0, 1200), view: location.hash || "#home"}, "Note on this paragraph");
});
actBtn.addEventListener("click", () => { if (target) openComposer(target); });
document.querySelectorAll("[data-react]").forEach(b => b.addEventListener("click", () => {
  if (!target) return; const a = {...target, label: target.label || itemLabel(target.item)};
  drafts.push({id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), item: a.item, label: a.label, field: a.field, block: a.block,
    quote: a.quote, note: `Reaction: ${b.dataset.react}.`, version: CAT.version, at: new Date().toISOString(), view: a.view || location.hash || "#home", kind: "reaction", _dirty: true});
  saveDrafts(); clearActive(); getSelection()?.removeAllRanges(); paintHighlights(); toast(`${b.dataset.react}: added to the tray`);
}));

function sheet(html, onClose) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { closeSheet(); onClose && onClose(); });
  return root;
}
const closeSheet = () => { $("#sheetRoot").innerHTML = ""; };
function openComposer(t, editId) {
  const ex = editId ? drafts.find(d => d.id === editId) : null;
  if (!ex && !t) return;

function unmark() { document.querySelectorAll("#view .hl").forEach(m => { m.replaceWith(...m.childNodes); }); document.querySelectorAll("#view .noted").forEach(b => b.classList.remove("noted")); }
function markQuote(root, quote, noteId) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = []; let txt = "", n;
  while ((n = tw.nextNode())) { if (n.parentElement.closest(".act,.sheet,button,select,svg")) continue; nodes.push([n, txt.length]); txt += n.data; }
  let at = txt.indexOf(quote), len = quote.length;
  if (at < 0) { const norm = quote.replace(/\s+/g, " "); at = txt.replace(/\s/g, " ").indexOf(norm); len = norm.length; }
  if (at < 0) return false;
  const end = at + len;
  for (const [node, off] of nodes) {
    const s0 = Math.max(at, off), e0 = Math.min(end, off + node.data.length);
    if (s0 >= e0 || !node.data.slice(s0 - off, e0 - off).trim()) continue;
    const r = document.createRange(); r.setStart(node, s0 - off); r.setEnd(node, e0 - off);
    const m = document.createElement("mark"); m.className = "hl"; m.dataset.note = noteId; m.title = "Your note: tap to edit"; r.surroundContents(m);
  }
  return true;
}

  const v = $("#view"); if (!v || !CAT) return; unmark(); const here = location.hash || "#home";

    if (blk && blk.innerText.trim().slice(0, 1200) === d.quote) continue;
    if (blk) markQuote(blk, d.quote, d.id); else if (d.view === here) markQuote(v, d.quote, d.id);
  }
}

/* ---------- X-ray: tap a name ---------- */
let NAMES = null;
function xray() {
  const art = $("#view .doc"); if (!art) return;
  if (!NAMES) {
    const all = [...CAT.people.map(p => ["p", p]), ...CAT.places.map(p => ["pl", p])].filter(([, p]) => p.quests.length && p.name.length >= 4 && /^[A-Z]/.test(p.name));
    NAMES = {map: Object.fromEntries(all.map(([k, p]) => [p.name, `${k}:${p.id}`])),
      re: new RegExp(`(?<![\\w-])(${all.map(([, p]) => p.name).sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w-])`, "g")};
  }
  const tw = document.createTreeWalker(art, NodeFilter.SHOW_TEXT); const nodes = []; let n;
  while ((n = tw.nextNode())) if (!n.parentElement.closest("a,button,code,pre,th,.xr,mark")) nodes.push(n);
  for (const node of nodes) {
    NAMES.re.lastIndex = 0; if (!NAMES.re.test(node.data)) continue;
    const frag = document.createDocumentFragment(); let last = 0; NAMES.re.lastIndex = 0; let m;
    while ((m = NAMES.re.exec(node.data))) {
      frag.append(node.data.slice(last, m.index));
      const b = document.createElement("button"); b.type = "button"; b.className = "xr"; b.dataset.xr = NAMES.map[m[1]]; b.textContent = m[1]; frag.append(b);
      last = m.index + m[1].length;
    }
    frag.append(node.data.slice(last)); node.replaceWith(frag);
  }
}

  const line = CAT.lines.find(l => l.id === q.line), sib = line.quests.slice().sort(), i = sib.indexOf(q.id);

  const row = (qid, why, e) => { const o = quest(qid); if (!o) return "";
    return `<div class="row" ${e ? `data-link="${esc(e.id)}" data-label="${esc(`Link: ${q.id} and ${qid}, ${e.label}`)}"` : ""}><a class="li" style="flex:1;border:0;padding:6px 0" href="#q-${hashId(qid)}"><span class="swatch" style="--lc:${lineColor(o.line)}"></span><span class="id">${qid}</span><span class="t">${esc(o.title)}<span class="sub">${esc(why)}</span></span></a>

  const d = DOCS[key]; if (!d) return;
  const mem = readMem(), old = mem[key], hs = Object.fromEntries(d.blocks.map(b => [b.id, b.h]));
  const els = [...art.querySelectorAll(".blk")];

    $("#nextChange").onclick = () => { changed[k % changed.length].scrollIntoView({behavior: "smooth", block: "center"}); k++; };

  clearTimeout(t); dbState = db ? "ready" : "absent";
  if (db) { try { const u = window.claude ? await window.claude.use("user") : null; uid = u ? await u.id() : null; } catch (e) { uid = null; } syncDrafts(); }
  if (db) db.collection("batches").onSnapshot(s => { batches = s.docs.map(d => ({id: d.id, ...d.data()})); if ($(".sheet") && $("#submitB")) openTray(); },
    () => { dbState = "absent"; });
  if (db) db.collection("draftReplies").onSnapshot(s => { dreplies = Object.fromEntries(s.docs.map(d => [d.id, d.data().reply || ""])); if ($(".sheet") && $("#submitB")) openTray(); }, () => {});
})();
})();
</script>
