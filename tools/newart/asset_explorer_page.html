<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argonia Asset Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: pick a thing, see its best version large with a person beside it, step through its making, compare, note. */
:root{--bg:#eceee8;--panel:#f7f8f4;--ink:#1c2420;--mute:#5a6760;--line:#cdd5cb;--accent:#2f6b57;--accent-ink:#f4f7f2;--stage:#4a5054;--ok:#2f6b57;--warn:#8f5a14;--bad:#9b2f2a;
  --body:"Inter",system-ui,sans-serif;--head:"Space Grotesk","Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--panel:#1a211f;--ink:#e3e9e3;--mute:#97a49b;--line:#2e3934;--accent:#6fc0a3;--accent-ink:#0f1513;--stage:#2a2f33;--ok:#6fc0a3;--warn:#e0a558;--bad:#ef8b83;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131816;--panel:#1a211f;--ink:#e3e9e3;--mute:#97a49b;--line:#2e3934;--accent:#6fc0a3;--accent-ink:#0f1513;--stage:#2a2f33;--ok:#6fc0a3;--warn:#e0a558;--bad:#ef8b83;color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:1.1rem;color:var(--mute);letter-spacing:.02em}h2{font-size:1.3rem}h3{font-size:1rem}
.things{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thing{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px}
.thing strong{display:block;font-family:var(--head);font-size:1.02rem}.thing small{color:var(--mute)}
.thing[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
#viewer{position:relative;background:var(--stage);border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;touch-action:none}
@media (max-width:700px){#viewer{aspect-ratio:4/5}}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
.tagbox{position:absolute;color:#eef2ee;font-size:.8rem;background:#000a;padding:3px 8px;border-radius:4px;font-variant-numeric:tabular-nums;max-width:calc(50% - 16px);pointer-events:none}
#hudA{left:8px;bottom:8px}#hudB{right:8px;bottom:8px;text-align:right}
#viewer.portrait.cmp #hudA{bottom:calc(50% + 8px)}#viewer.portrait #hudB{right:auto;left:8px;text-align:left}
#split{position:absolute;background:#000b}
#pinhint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;color:#fff;padding:5px 12px;border-radius:4px;font-size:.85rem;white-space:nowrap}
.vtools{position:absolute;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:70%}
.vtools button{font:inherit;font-size:.8rem;color:#eef2ee;background:#000a;border:1px solid #ffffff33;border-radius:999px;padding:4px 10px;cursor:pointer;min-height:32px}
.vtools button[aria-pressed="true"]{background:#eef2ee;color:#1c2420}
.steps{flex:1 1 auto;min-width:0;display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:2px}
.step{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-width:0;flex:1 1 0;min-height:44px}
.step b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.step[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.arrow{font:inherit;font-size:1.2rem;background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;padding:0 12px;cursor:pointer;min-height:44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--mute)}
.pill{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.kept{color:var(--ok)}.pill.rejected{color:var(--bad)}.pill.comparison,.pill.alternative{color:var(--warn)}.pill.best{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.btn{font:inherit;font-weight:500;color:var(--accent-ink);background:var(--accent);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-height:40px;max-width:100%}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%}
.li:first-child{border-top:0}.li .n{color:var(--mute);font-variant-numeric:tabular-nums}.li .p{font-variant-numeric:tabular-nums;color:var(--mute)}
.li .why{grid-column:2/4;color:var(--mute);font-size:.88rem}
.li[aria-current="true"]{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fail{color:var(--mute);font-size:.88rem;padding-top:6px;border-top:1px dashed var(--line)}
details>summary{cursor:pointer;color:var(--mute);font-size:.9rem;min-height:32px;display:flex;align-items:center}
.tw{overflow-x:auto}table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}th,td{padding:2px 12px 2px 0;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.shots figure{margin:0}.shots img{width:100%;border-radius:4px;border:1px solid var(--line);cursor:zoom-in;display:block}.shots figcaption{font-size:.8rem;color:var(--mute)}
pre{white-space:pre-wrap;font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;margin:0}
.stagetext p{margin:4px 0;max-width:72ch}
#zoom{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;cursor:zoom-out}#zoom img{max-width:100%;max-height:100%}
.note{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.note .where{font-size:.8rem;color:var(--mute)}.note .reply{border-left:3px solid var(--accent);padding-left:8px}
textarea{width:100%;min-height:80px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;box-sizing:border-box}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div class="wrap">
  <h1>Argonia Asset Explorer</h1>
  <nav class="things" id="things" aria-label="Things"></nav>
  <div id="viewer">
    <div class="vtools" id="vtools"></div>
    <div class="tagbox" id="hudA"></div><div class="tagbox" id="hudB" hidden></div><div id="split" hidden></div>
    <div id="pinhint" hidden>Tap the spot you mean</div>
  </div>
  <div class="row" id="stepsrow" style="flex-wrap:nowrap"></div>
  <section class="card" id="version"></section>
  <div class="two">
    <section class="card" id="others"></section>
    <section class="card" id="notes"></section>
  </div>
  <section class="card" id="about"></section>
</div>
<div id="zoom" hidden><img alt=""></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
"use strict";
// The models carry their textures inside one file; with createImageBitmap off the loader draws them as plain images (the host refuses its fetch()).

const $ = (s, r = document) => r.querySelector(s);

const S = { cat: null, asset: null, model: null, compare: null, mode: "tex", person: true, plate: true, pinning: false, notes: [], batches: [], db: null, uid: "me", pending: null };
const LS = "argonia-asset-explorer-drafts";
const money = p => p == null ? "" : p === 0 ? "no fee" : "$" + p.toFixed(3).replace(/0$/, "");

/* ---------- data and the note store (contract: drafts and batches, see asset_explorer.json) ---------- */
async function boot() {

function route() { const id = (location.hash || "").slice(1); pick(S.cat.assets.some(a => a.id === id) ? id : S.cat.assets[0].id); }
async function connect() {

  S.db = db; try { if (user) S.uid = await user.id(); } catch (e) {}

    db.collection("drafts").onSnapshot(s => { const live = []; s.forEach(d => { const v = d.data(); if (v && !v.deleted) live.push(v); });
      const by = new Map(S.notes.map(n => [n.id, n])); for (const n of live) { const o = by.get(n.id); if (!o || (n.updatedAt || 0) >= (o.updatedAt || 0)) by.set(n.id, n); }
      S.notes = [...by.values()]; saveLocal(); renderNotes(); drawPins(); }, () => {});
    db.collection("batches").onSnapshot(s => { const b = []; s.forEach(d => b.push({ id: d.id, ...d.data() })); S.batches = b.sort((a, c) => (c.submittedAt || 0) - (a.submittedAt || 0)); renderNotes(); drawPins(); }, () => {});
  } catch (e) {}
  renderNotes();
}
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(S.notes)); } catch (e) {} };
async function putDraft(n) { n.updatedAt = Date.now(); n.by = S.uid; const i = S.notes.findIndex(x => x.id === n.id); if (i < 0) S.notes.push(n); else S.notes[i] = n; saveLocal();
  if (S.db) { try { await S.db.doc("drafts/" + n.id).set(n); } catch (e) {} } renderNotes(); drawPins(); }

async function sendNotes() {
  const mine = S.notes.filter(n => n.note && n.note.trim()); if (!mine.length || !S.db) return; const id = "b" + Date.now();
  try { await S.db.doc("batches/" + id).set({ status: "submitted", submittedAt: Date.now(), dataVersion: S.cat.version, notes: mine.map(n => ({ ...n, reply: null })) });
    for (const n of mine) await S.db.doc("drafts/" + n.id).set({ id: n.id, deleted: true, updatedAt: Date.now() });
    S.notes = S.notes.filter(n => !mine.includes(n)); saveLocal(); renderNotes(); drawPins(); }
  catch (e) { const m = $("#sendmsg"); if (m) m.textContent = "Not sent: the store did not answer. Your notes are still here as drafts; try again."; }
}

/* ---------- one thing ---------- */
function pick(id) {
  const a = S.cat.assets.find(x => x.id === id); S.asset = a; S.compare = null;
  for (const b of document.querySelectorAll("#things .thing")) b.setAttribute("aria-current", String(b.dataset.id === id));
  renderAbout(); renderOthers(); show(a.best, true); renderNotes();
}
function making() { return S.asset.versions.filter(v => v.group === "making"); }
function show(id, reframe) { S.model = id; S.pending = null; setPinning(false); renderSteps(); renderVersion(); renderOthers(); loadInto("A", id, reframe); renderTools(); }

function renderSteps() {
  const steps = making(), i = steps.findIndex(v => v.id === S.model);
  const go = d => { const j = (i < 0 ? steps.length - 1 : i) + d; if (j >= 0 && j < steps.length) show(steps[j].id); };
  $("#stepsrow").replaceChildren(el("button", { class: "arrow", "aria-label": "Previous stage", onclick: () => go(-1), disabled: i <= 0 ? "" : null, text: "‹" }),
    el("div", { class: "steps", role: "list", "aria-label": "How it was made" }, ...steps.map((v, k) => el("button", { class: "step", role: "listitem", "aria-current": String(v.id === S.model), onclick: () => show(v.id) },
      el("b", { text: (k + 1) + (v.id === S.asset.best ? " · best" : "") }), document.createTextNode(v.label)))),
    el("button", { class: "arrow", "aria-label": "Next stage", onclick: () => go(1), disabled: i < 0 || i >= steps.length - 1 ? "" : null, text: "›" }));
}
function pillFor(v) { if (v.id === S.asset.best) return el("span", { class: "pill best", text: "best version" }); return el("span", { class: "pill " + v.verdict, text: v.verdict === "comparison" ? "for comparison" : v.verdict }); }
function measures(id) { const m = (S.asset.measures || {})[id]; if (!m) return null; const sz = m.size_m || [];
  const rows = [["Size", sz.map(x => x.toFixed(2)).join(" × ") + " m (along, up, across)"], ["Triangles", (m.triangles || 0).toLocaleString()], ["Pieces", m.components], ["Closed", m.watertight ? "yes" : "no"], ["Open edges", m.open_edges], ["Surface", m.surface_m2 + " m²"]];
  if (m.to_brief && m.to_brief.scale_applied) rows.push(["Scaled to the brief", "×" + m.to_brief.scale_applied + (m.to_brief.beam_scale && m.to_brief.beam_scale !== 1 ? ", cross-section ×" + m.to_brief.beam_scale : "")]);
  return el("div", { class: "tw" }, el("table", {}, ...rows.map(([k, v]) => el("tr", {}, el("th", { text: k }), el("td", { text: String(v) }))))); }
function stageBlock(s) {
  const kv = s.measured ? el("div", { class: "tw" }, el("table", {}, ...Object.entries(s.measured).map(([k, v]) => el("tr", {}, el("th", { text: k.replace(/_/g, " ") }), el("td", { text: String(v) }))))) : null;
  return el("div", { class: "stagetext" }, el("h3", { text: s.name }), el("p", { text: s.did }), kv, s.looked ? el("p", {}, el("strong", { text: "Seen: " }), document.createTextNode(s.looked)) : null, s.decision ? el("p", {}, el("strong", { text: "Decided: " }), document.createTextNode(s.decision)) : null,
    s.images && s.images.length ? el("div", { class: "shots" }, ...s.images.map(([f, c]) => el("figure", {}, el("img", { src: "img/" + f, alt: c, loading: "lazy", onclick: e => zoom(e.target.src) }), el("figcaption", { text: c })))) : null,
    s.prompt || s.requests ? el("pre", { text: (s.prompt ? s.prompt + "\n\n" : "") + (s.requests ? Object.entries(s.requests).map(([k, v]) => k + ": " + v).join("\n") : "") }) : null);
}
function renderVersion() {
  const v = ver(S.model), stages = S.asset.stages.filter(s => (s.models || []).includes(v.id) || (s.measured_models || []).includes(v.id));
  const opts = S.asset.versions.filter(x => x.id !== v.id);
  const cmp = el("select", { id: "cmpsel", "aria-label": "Compare with" }, el("option", { value: "", text: "Compare with…" }), ...opts.map(x => el("option", { value: x.id, text: x.label + (x.group === "tried" ? " (other generator)" : "") })));
  cmp.value = S.compare || ""; cmp.addEventListener("change", () => setCompare(cmp.value || null));
  const req = [v.endpoint ? "Endpoint: " + v.endpoint : null, v.options ? "Options: " + JSON.stringify(v.options) : null, v.request ? "Request: " + v.request : null].filter(Boolean).join("\n");
  $("#version").replaceChildren(
    el("div", { class: "row" }, el("h2", { text: S.asset.short + ": " + v.label }), pillFor(v)),
    el("p", { style: "margin:0;max-width:72ch", text: v.line }),
    el("p", { class: "muted", style: "margin:0", text: v.made_by + " · " + money(v.price_usd) + (v.why ? " · " + v.why : "") }),
    el("div", { class: "row" }, cmp, el("button", { class: "btn", id: "pinbtn", onclick: () => setPinning(!S.pinning), text: "Note on a spot" }), el("button", { class: "btn ghost", onclick: () => startNote({ kind: "stage", field: v.id, label: label(v.id) }), text: "Note on this version" })),
    el("div", { id: "pinform" }),
    el("details", {}, el("summary", { text: "Details: measures, what was done, the request" }), measures(v.id), ...stages.map(stageBlock), req ? el("pre", { text: req }) : null));
}
function renderOthers() {
  const a = S.asset, tried = a.versions.filter(v => v.group === "tried").sort((p, q) => (p.rank || 99) - (q.rank || 99)), comps = a.versions.filter(v => v.group === "comparison");
  const pick0 = making()[0];
  const row = (n, v, extra) => el("button", { class: "li", "aria-current": String(S.model === v.id), onclick: () => { show(v.id, true); $("#viewer").scrollIntoView({ behavior: "smooth", block: "center" }); } },
    el("span", { class: "n", text: n }), el("span", {}, el("strong", { text: extra || v.label }), document.createTextNode(" "), pillFor(v)), el("span", { class: "p", text: money(v.price_usd) }), el("span", { class: "why", text: v.why }));
  $("#others").replaceChildren(el("h3", { text: "Other generators tried" }), el("p", { class: "muted", style: "margin:0", text: "Same reference, ranked by look and measure. Tap one to see it; use Compare to put it beside the best." }),
    el("div", { class: "list" }, row("1", { ...pick0, verdict: "kept" }, "Tripo H3.1 · owner's pick"), ...tried.map(v => row(String(v.rank), v))),
    ...(a.failed || []).map(f => el("div", { class: "fail", text: "Failed: " + f })),
    comps.length ? el("h3", { style: "margin-top:8px", text: "Comparisons" }) : null, comps.length ? el("div", { class: "list" }, ...comps.map(v => row("·", v))) : null);
}
function renderAbout() { const a = S.asset;
  $("#about").replaceChildren(el("details", {}, el("summary", { text: "About the " + (a.short || a.name).toLowerCase() + ": brief, why we make it, fees" }),
    el("p", { style: "margin:0;max-width:72ch", text: a.summary }),
    el("div", { class: "tw" }, el("table", {}, ...[["Brief", a.brief.text], ["Why make it", a.need.why], ["Lore", a.need.lore], ["Where it goes", a.need.use], ["Status", a.status],
      ["Fees so far", "$" + a.fees.total.toFixed(2) + ": " + a.fees.lines.map(([k, v]) => k + " $" + v.toFixed(2)).join("; ") + ". " + a.fees.note]].map(([k, v]) => el("tr", {}, el("th", { text: k }), el("td", { text: v }))))),
    ...a.stages.filter(s => !(s.models || []).length && !(s.measured_models || []).length).map(stageBlock))); }
function zoom(src) { const z = $("#zoom"); z.firstElementChild.src = src; z.hidden = false; } $("#zoom").addEventListener("click", () => { $("#zoom").hidden = true; });

/* ---------- 3D: one camera, true metres, a 1.8 m person ---------- */
let R = null;
function person() { const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: 0xc9d3cc, roughness: 1 });
  const add = (geo, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.userData.overlay = true; g.add(o); };
  add(new THREE.CylinderGeometry(0.075, 0.06, 0.86, 10), -0.1, 0.43, 0); add(new THREE.CylinderGeometry(0.075, 0.06, 0.86, 10), 0.1, 0.43, 0);   // legs
  add(new THREE.CylinderGeometry(0.19, 0.16, 0.62, 12), 0, 1.17, 0); add(new THREE.CylinderGeometry(0.05, 0.045, 0.62, 8), -0.25, 1.15, 0); add(new THREE.CylinderGeometry(0.05, 0.045, 0.62, 8), 0.25, 1.15, 0);
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.08, 8), 0, 1.52, 0); add(new THREE.SphereGeometry(0.11, 14, 10), 0, 1.68, 0);                         // neck, head: top at 1.79 m
  return g; }
function sceneSet() { const sc = new THREE.Scene(); sc.background = new THREE.Color(0x5b6066); sc.add(new THREE.HemisphereLight(0xffffff, 0x4a4f48, 0.95)); const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(4, 8, 5); sc.add(sun);

function initViewer() {
