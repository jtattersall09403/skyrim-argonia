<title>Argonia Asset Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a list of assets at the left, one asset at the right: its 3D view on top, then its stages as a ledger. */

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--head);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin-bottom:14px}
.top p{margin:0;color:var(--mute);max-width:65ch}
.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}

.list{display:flex;flex-direction:column;gap:8px}

#split{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#0009}
#pinhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000b;color:#fff;padding:4px 12px;border-radius:4px;font-size:.85rem}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.stage{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.stage:first-of-type{border-top:0;margin-top:6px;padding-top:0}
.stage header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 22px;margin-top:8px}
.two h4{margin:0;font:600 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.two p{margin:2px 0 0}
.two.wide{grid-template-columns:minmax(0,1fr)}
td:first-child{white-space:nowrap}
table{border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums;margin-top:4px}
th,td{padding:2px 12px 2px 0;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:500}

#zoom img{max-width:100%;max-height:100%}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

</div>

function setCompare(id) { const was = !!S.compare; if (was !== !!id) { const k = id ? 1.7 : 1 / 1.7; R.cam.position.sub(R.ctl.target).multiplyScalar(k).add(R.ctl.target); } S.compare = id; $("#split").hidden = !id; $("#hud2").hidden = !id; if (R.root2) { R.scene2.remove(R.root2); R.root2 = null; } R.size(); renderBars(); markModel();
  if (!id) return; $("#hud2").textContent = "Loading " + modelLabel(id);
  new THREE.GLTFLoader().load("models/" + S.asset.id + "." + id + ".gltf.json", g => { if (S.compare !== id) return; R.root2 = g.scene; R.scene2.add(R.root2); place(R.root2); R.man2.position.copy(R.man.position); $("#hud2").textContent = modelLabel(id); applyMode(); },
    undefined, () => { $("#hud2").textContent = "This version could not be loaded."; }); }

    const s = place(R.root);      // stand every version on the ground at the middle, whatever frame it came in

    $("#hud").textContent = modelLabel(id) + " · " + (mm.triangles ? mm.triangles.toLocaleString() + " triangles · " : "") + dims[0].toFixed(2) + " m long";
    R.man.position.set(-dims[0] * 0.25, 0, -(Math.max(s.z, 0.6) / 2 + 0.6)); R.man2.position.copy(R.man.position); R.ctl.target.set(0, s.y / 2, 0); const d = Math.max(dims[0], 1.5); R.cam.position.set(d * 0.95, d * 0.5, d * 0.95);
    applyMode(); drawPins();
  }, undefined, () => { $("#hud").textContent = "This version could not be loaded."; });
}
function applyMode() { if (!R) return; for (const root of [R.root, R.root2]) if (root) root.traverse(o => { if (!o.isMesh) return;
  if (S.mode === "tex") o.material = o.userData.mat; else if (S.mode === "clay") o.material = new THREE.MeshStandardMaterial({ color: 0x9c978c, roughness: 0.95, side: THREE.DoubleSide }); else o.material = new THREE.MeshBasicMaterial({ color: 0xe9ede8, wireframe: true }); }); }
function drawPins() { if (!R) return; while (R.pins.children.length) R.pins.remove(R.pins.children[0]);
  const all = S.notes.concat(...S.batches.map(b => b.notes || [])).filter(n => n.kind === "pin" && n.item === S.asset.id && n.model === S.model && n.point);
  for (const n of all) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), new THREE.MeshBasicMaterial({ color: n.reply ? 0x6fc0a3 : 0xffb347, depthTest: false })); m.position.fromArray(n.point); m.renderOrder = 5; R.pins.add(m); } }

/* ---------- notes ---------- */
function startNote(base) { S.pendingPin = { id: "n" + Date.now() + Math.random().toString(36).slice(2, 6), item: S.asset.id, view: location.hash || "#" + S.asset.id, version: S.cat.version, note: "", ...base };
  const f = $("#pinform"); const ta = el("textarea", { id: "note-text", placeholder: "What should change, or what do you think of this?" });
  f.replaceChildren(el("div", { class: "note" }, el("div", { class: "where", text: S.pendingPin.label }), ta, el("div", { class: "row" }, el("button", { class: "btn", onclick: () => { const t = ta.value.trim(); if (!t) return; S.pendingPin.note = t; const n = S.pendingPin; S.pendingPin = null; f.replaceChildren(); putDraft(n); }, text: "Keep note" }), el("button", { class: "btn ghost", onclick: () => { S.pendingPin = null; f.replaceChildren(); }, text: "Cancel" }))));
  f.scrollIntoView({ behavior: "smooth", block: "center" }); ta.focus(); }
function noteNode(n, draft) { const k = el("div", { class: "note" }, el("div", { class: "where", text: (n.label || n.field) + (n.kind === "pin" && n.model ? " · " + modelLabel(n.model) : "") }), el("div", { text: n.note }));
  if (n.kind === "pin" && n.camera) k.append(el("button", { class: "chip", style: "margin-top:6px", onclick: () => { const go = () => { R.cam.position.fromArray(n.camera.position); R.ctl.target.fromArray(n.camera.target); }; if (S.model !== n.model) { loadModel(n.model); setTimeout(go, 900); } else go(); $("#viewer").scrollIntoView({ behavior: "smooth", block: "center" }); }, text: "Show the spot" }));
  if (draft) k.append(el("button", { class: "chip", style: "margin:6px 0 0 6px", onclick: () => dropDraft(n.id), text: "Remove" }));
  if (n.reply) k.append(el("div", { class: "reply", text: n.reply })); return k; }

  box.replaceChildren(el("h3", { text: "Your notes" }), el("p", { class: "muted", style: "margin:4px 0 0", text: S.db ? "Notes wait here as drafts until you send them. An agent picks up each sent batch and answers every note here." : "Notes are kept in this browser only until the page can reach its store. Sending is off." }),
    ...(drafts.length ? drafts.map(n => noteNode(n, true)) : [el("p", { class: "muted", text: "No drafts. Pin a note on the model, or use a stage's note button." })]),
    el("div", { class: "row" }, S.db && drafts.length ? el("button", { class: "btn", onclick: submitNotes, text: "Send " + drafts.length + (drafts.length === 1 ? " note" : " notes") }) : null, el("span", { id: "sendmsg", class: "muted" })),
    ...S.batches.filter(b => (b.notes || []).some(n => n.item === S.asset.id)).map(b => el("details", { open: "" }, el("summary", { text: "Sent " + new Date(b.submittedAt).toLocaleString() + " · " + b.status }), b.reply ? el("div", { class: "note", text: b.reply }) : null, ...(b.notes || []).filter(n => n.item === S.asset.id).map(n => noteNode(n, false))))); }
boot();
</script>
