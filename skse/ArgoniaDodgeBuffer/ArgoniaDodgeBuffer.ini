; ArgoniaDodgeBuffer: an attack pressed during a dodge is queued for straight after it.
[General]
bEnabled=1
; seconds a press stays valid after the dodge ends
fBufferSeconds=0.6
; a button still held at fire time for longer than this fires the power attack instead of the light one
fPowerHoldSeconds=0.4
; the control map's user event to watch (any device bound to it; rebinding in the game's controls is honoured)
sUserEvent=Right Attack/Block
; animation graph events (comma separated, case-insensitive)
; TK Dodge RE's behaviour sends TKDR_DodgeStart and TKDR_DodgeEnd (TKDodgeStop is also in its event list); tailCombatIdle is the fallback end
sDodgeStartEvents=TKDR_DodgeStart
sDodgeEndEvents=TKDR_DodgeEnd,TKDodgeStop,tailCombatIdle
sAttackEvent=attackStart
sPowerEvent=attackPowerStartInPlace

[Backstab]
; Dark Souls backstab (owner walks 3 and 4): a light attack started behind a hostile, living actor casts Rim Parry's
; backstab (EldenBlockCounterSA, the spell its bash clips cast) at it, with no stamina or magicka cost; once its stagger
; lands and the swing ends, the player plays Rim Parry's execution on it (EldenSkillSA) without a second press
; (bBackstabExecute); Rim Parry's own mark, which comes seconds later, is then dispelled
bBackstab=1
bBackstabExecute=1
; flat distance, units (Rim Parry's feeler reaches 250); height difference, units
fBackstabReach=200
fBackstabHeight=100
; the player within this many degrees of straight behind the target, each side
fBackstabBehindDegrees=60
; the player facing within this many degrees of the target's heading, each side (Rim Parry's own check, set to 45 by Argonia.esp)
fBackstabFacingDegrees=45
