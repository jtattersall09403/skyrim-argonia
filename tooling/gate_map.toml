# The scoped gate's map (read by tooling/gate.py). A changed path picks stages and test files in three ways:
#   1. automatically: a test file (or a stage's module) runs when the path is in its import closure inside the repo,
#      or is a repo path its code names in a string or in a `REPO / "a" / "b"` chain;
#   2. by a rule below: path globs -> make stages and pytest files or directories;
#   3. by `full` below, or by matching nothing at all: the whole gate runs.
# An edit to this file is scoped like any other change: only the rules added, removed or altered count as changed
# (their stages, their tests and the paths they name run); an edit to a structural part (`full`, `named_direct`, the
# `[stages]` table, each of which applies to every change) runs the whole gate.
# A path of a rule marked `only` (a place's edits/: the owner's saves and notes, read by no build or check) picks that
# rule's stages and nothing else: a save's commit costs seconds, whatever else the gate would reach.
# THE LINE for a place's own files (newworld/places/<id>/...): a change reaches the checks that read that place's data
# (the consistency stage and the tests that assert facts about the committed place files), and the quest stages and
# the story explorer only when a file they read from a place folder changes (quests.jsonl, ledger.jsonl). A tool that
# names the whole newworld/places tree only reads whichever place it is given: it is not reached by one place's file
# (`trees`), so one moved barrel runs seconds-to-a-minute of checks, never the tool tests, the quest stages or the explorer.
# The guard and ruff always run. Globs are fnmatch patterns on repo-relative paths ("*" crosses "/").

# A change to any of these runs the whole gate: the gate, test set-up, the build of the gate, and the
# shell libraries every tool leans on.
full = [
  "tooling/gate.py",
  "Makefile",
  "*conftest.py",
  "ruff.toml",
  "pyproject.toml",
  "*requirements*.txt",
  "tooling/job_guard.sh",
  "tooling/job_resume.sh",
  "tools/__init__.py",
  "tools/tests/places_fixture.py",
  "tools/tests/stock_fixture.py",
]

# Stages: guard and lint always; unit is the picked pytest files; the rest run when a rule or their module's closure
# names them. Each stage's module is what its make target runs, for the automatic closure.
# modules that read a whole story tree: the paths they name reach only the tests and stages that import them directly
named_direct = ["tools/places/needs.py"]
# folders of independent members: code that names the whole folder is reached by a root file of it, or by a file of a
# member it names itself (newworld/places/<id>), never by a file inside some other member
trees = ["newworld/places"]

[stages]
adaptation = "tools.argonia_world.adaptation_check"
questtext = "tools.argonia_world.quest_text_check"
questform = "tools.questform.__main__"
reach = "tools.playtest.__main__"
storyexplorer = "tools.newworld.story_explorer"
atlas = "tools.newworld.atlas_state"
consistency = "tools.newworld.consistency"

# Story design and the docs: the explorer and the story tests read them.
[[rule]]
globs = ["story/design/*", "docs/*", "story/lore/*", "newworld/story/*"]
stages = ["storyexplorer"]
tests = [
  "tools/tests/test_newworld_story_explorer.py",
  "tools/tests/test_newworld_plot_check.py",
  "tools/tests/test_places_needs.py",
  "tools/tests/test_newworld_story_digest.py",
]

# The new world's sources and story data: the place database and everything derived from it.
[[rule]]
globs = ["newworld/sources/*", "newworld/story/data/*"]
stages = ["storyexplorer"]
tests = [
  "tools/tests/test_newworld_place.py",
  "tools/tests/test_newworld_danger.py",
  "tools/tests/test_newworld_story_digest.py",
  "tools/tests/test_newworld_travel_menu.py",
  "tools/tests/test_newworld_story_explorer.py",
  "tools/tests/test_newworld_plot_check.py",
  "tools/tests/test_newworld_source_note.py",
]

# The rest of the new world's committed files: the place tests and the explorer. A place's own folder has its rules
# below.
[[rule]]
globs = ["newworld/*"]
not = ["newworld/places/*/*"]
stages = ["storyexplorer"]
tests = ["tools/tests/test_newworld_place.py", "tools/tests/test_places_check.py"]

# Our SKSE plugin: its own C++ tests.
[[rule]]
globs = ["skse/*"]
stages = ["skse"]

# Our plugin's records and its C# tool.
[[rule]]
globs = ["plugin/*", "tools/ArgoniaPlugin/*", "papyrus/*"]
tests = [
  "tools/tests/test_questform_build.py",
  "tools/tests/test_questform_records.py",
  "tools/tests/test_questform_diff.py",
  "tools/tests/test_newworld_formids.py",
]
stages = ["questform", "reach"]

# Quest records and the old world's story data (the first-act quests stay and are checked whenever they change).
[[rule]]
globs = ["story/data/*", "story/quests/*", "story/*.json"]
stages = ["adaptation", "questtext", "questform", "reach", "storyexplorer"]
tests = [
  "tools/tests/test_adaptation_check.py",
  "tools/tests/test_quest_text_check.py",
  "tools/tests/test_questform.py",
  "tools/tests/test_playtest.py",
]

# Any other story file: the explorer and the story tests.
[[rule]]
globs = ["story/*"]
stages = ["storyexplorer"]
tests = [
  "tools/tests/test_newworld_story_explorer.py",
  "tools/tests/test_newworld_plot_check.py",
  "tools/tests/test_newworld_story_digest.py",
]

# Test fixtures that no test names by repo path: every test beside them.
[[rule]]
globs = ["tools/tests/data/*", "tools/tests/fixtures/*", "tools/tests/places_edits/*"]
tests = ["tools/tests"]

# Code under tools/ and tooling/ that no test or stage imports: ruff (always run) is its whole check. Code that is
# imported is picked by the closure above.
[[rule]]
globs = ["tools/*", "tooling/*", ".claude/*", "infra/*", "mods/*", ".github/*"]

# Top-level prose and licences.
[[rule]]
globs = ["README.md", "CLAUDE.md", "LICENSE*", ".gitignore"]

# The Atlas: the place and region tables, the fast travel network and the page it shows them in.
[[rule]]
globs = ["newworld/story/data/db/place*", "newworld/story/data/db/region*", "newworld/story/data/db/source_place*", "newworld/story/data/db/road*",
         "newworld/story/data/db/border_vertex*", "newworld/story/data/db/cell.jsonl", "newworld/story/data/db/culture.jsonl",
         "newworld/story/data/db/symbol.jsonl", "newworld/story/data/db/travel_*", "newworld/sources/travel/network.json",
         "tools/newworld/map_page.*", "tools/newworld/atlas*"]
stages = ["atlas"]
tests = ["tools/tests/test_newworld_atlas_state.py"]

# The agent view of the studio (the look tool) and the studio's page it drives.
[[rule]]
globs = ["tools/places/look*", "tools/places/studio/web/js/agent.js"]
tests = ["tools/tests/test_places_look.py", "tools/tests/test_places_playwalk.py", "tools/tests/test_studio_web.py"]

# The consistency checker (decision 0040): every new-world record against every other. It runs when the place
# records and their sources, the quests, the story pages, the drafts, the faction records or the checker change.
[[rule]]
globs = ["newworld/story/data/*", "newworld/sources/research/*", "newworld/sources/people/*", "newworld/story/quests/*",
         "story/design/quests/lines/*", "newworld/places/*", "story/data/db/faction*", "tools/newworld/consistency.py",
         "tools/newworld/record_check.py"]
stages = ["consistency"]
tests = ["tools/tests/test_newworld_consistency.py", "tools/tests/test_newworld_record_check.py"]

# The measuring tools and their golden place: every number a drafter is shown, against known answers
# (docs/design/place-truth.md).
[[rule]]
globs = ["tools/places/classify.py", "tools/places/truth.py", "tools/places/units.py", "tools/places/seat.py",
         "tools/places/look/geom.py", "tools/places/look/scene.py", "tools/places/look/mesh.py",
         "tools/places/draft/geom.py", "tools/places/draft/obvious.py", "tools/places/draft/overlap.py",
         "tools/places/draft/sap.py", "tools/places/check.py", "tools/places/build.py",
         "tools/tests/fixtures/truth_place.json", "tools/places/shape.py", "tools/tests/fixtures/truth_meshes.json"]
tests = ["tools/tests/test_places_truth.py", "tools/tests/test_places_shape.py"]

# A wholesale place's carried walking mesh (docs/design/place-studio.md, Navmesh): the cut, the join, the hand-change
# rules and the build's hook.
[[rule]]
globs = ["tools/places/carrynav.py", "tools/places/draft/srcnav.py", "tools/places/build.py", "tools/navmesh/nvnm.py"]
tests = ["tools/tests/test_carrynav.py", "tools/tests/test_srcnav.py"]

# One place's own files: the consistency stage (above, `newworld/places/*`) guards them against the records, quests and
# story. These tests read the real committed place folders and assert facts about them (found by tracing which of the
# tests a place file used to pick opened a real place file: the helstrom edits round trip, the committed variant, the
# needs of the drafted places); every other test that names newworld/places builds its own fixture places.
[[rule]]
globs = ["newworld/places/*/*"]
tests = ["tools/tests/test_places_edits.py", "tools/tests/test_places_variant.py", "tools/tests/test_places_needs.py"]

# What the quest compiler and the story explorer read from a place folder: the quest spots (quests.jsonl, read by
# tools/questform/compile.py) and the drafted mark (ledger.jsonl, read by tools/newworld/story_digest.py). A change to
# one of them runs the quest stages and the explorer; a change to the rest of a place's files does not.
[[rule]]
globs = ["newworld/places/*/quests.jsonl", "newworld/places/*/ledger.jsonl"]
stages = ["questform", "reach", "questtext", "storyexplorer"]
tests = ["tools/tests/test_questform_spots.py", "tools/tests/test_places_quest_spots.py"]

# The owner's saves and notes under a place's (or a variant's) edits/: only their own validity check, nothing else.
[[rule]]
globs = ["newworld/places/*/edits/*"]
only = true
stages = ["editsvalid"]

# The place skills' text (.claude/skills/place-*): recipes the place chain's lessons step rewrites and the place agents
# read; no test or stage checks their words (the dialogue-write lints read the dialogue-write skill, which is not here).
[[rule]]
globs = [".claude/skills/place-*"]
only = true
