# Game machines: name, AWS region, and the address the build VM reaches it by. One place for the machine-to-region
# map (#27): run.sh, the build VM's idle-stop and the play switch (cloudflare_gate.py worker) read it. A machine
# outside the build VM's region (London) has no private route, so it is reached on its public IP, SSH open only to
# the build VM's address. A name not listed is in eu-west-2, private.
# pool=<label>: a standby of the pool (1.8 §7): the play page and run.sh pick choose among them by spot placement
# score; each has its own tunnel (named as the machine) and hostnames play-<label>.<domain> ... (cloudflare_gate.py).
#name               region     address  pool
argonia-play        eu-west-3  public   pool=paris
argonia-play-london eu-west-2  private   # retired 2026-10-31 (kept: the records cite it)
argonia-play-ie     eu-west-1  public   pool=ireland   # the pool's Ireland standby (owner 2026-10-31)
argonia-play-3      eu-west-3  private  # the LOD box: a non-GPU clone of argonia-play for xLODGen, TexGen and DynDOLOD (owner, 2026-11-02: LOD need not run on the play machine)
