BookText:
  TargetLanguage: English
  Value: "Three leaves in the Rose's hand, singed at the edges. \"Walks-Far. Words in the yard. Three seasons.\" \"Mends-Nets. Drowned Reckoner Otheel in a net. To be put under.\" \"Seven-Floods. A roof. Standing.\" Under each, where the held one was hatched, and the same line: by this the hunters know where to look."
