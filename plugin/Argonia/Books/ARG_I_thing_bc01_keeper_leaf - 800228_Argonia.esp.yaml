BookText:
  TargetLanguage: English
  Value: "Hulm-Tei, hatched owing on this ground. What any leaf is short at the reckoning is written here. If this leaf is lost, the shortfall is shared among all. Under it, eleven shortfalls in his own hand: a runaway's two seasons, a drowned hand's four, a boat lost, a fever's months; none of them Rows-For-Another's."
