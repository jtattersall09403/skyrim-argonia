BookText:
  TargetLanguage: English
  Value: "Rows-For-Another, boat-hand. Holed the second boat off the bank: four nushmeekos. [The next lines are in a small, exact hand.] First year: bread, roof, net and the boat's upkeep, eleven; worked, six. A fever in the rains: one more. Second year: the same. [From the third year the hand is larger, and the same line runs on for nine years more.] Owed at the last reckoning: sixty nushmeekos."
