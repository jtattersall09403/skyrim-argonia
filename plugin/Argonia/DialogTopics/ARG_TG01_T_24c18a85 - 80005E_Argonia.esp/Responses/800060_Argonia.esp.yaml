Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: There is, if the hands are careful enough. The Chapter takes from those who can bear the loss. It takes no more than that.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A hand that breaks what it touches is no use to us, so I must see how yours work.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Keeps-What-Floats keeps to the shore by the houses, a short walk from this door.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He took a necklace of polished blue jaspers from a Lookout of ours, one of the Chapter, while that Lookout slept.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He keeps it in a locked strongbox by the houses at the water's edge. Bring the necklace back, so that the Lookout has it again.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Do Keeps-What-Floats no harm. If he is hurt, there is no pay and no place with us. Here are three lockpicks. There are three ways open.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You can open his strongbox with the picks, or you can take his key, which he may give for good talk or sell for coin.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Sits-By-The-Water is his friend, and she keeps her stall near him. Ask her about his habits, because I will not tell them.
  ScriptNotes: ''
  Edits: ''
