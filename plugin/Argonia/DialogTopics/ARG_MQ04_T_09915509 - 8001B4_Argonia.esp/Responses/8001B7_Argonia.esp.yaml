Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You do not shout it to the village. You ask me quietly. I have carried this alone too long.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A root of the Hist was cut under the stilts, and its sap was drawn off. The cut was sealed with black gum made here in the village.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It was my gum, and my knife was gone from my things.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I knew how it would look, so I hid the cut and told only Turns-The-Clutch, who tends the eggs in the pool.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The drips led north to the leech water, and there I lost them. A boat came in from the north reeds that night and went back out. She saw it too.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you want to know where the sap went, ask me.
  ScriptNotes: ''
  Edits: ''
