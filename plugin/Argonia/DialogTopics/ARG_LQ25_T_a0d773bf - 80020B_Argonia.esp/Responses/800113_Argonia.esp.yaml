PreviousDialog: 800112:Argonia.esp
Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Yes. I tipped the offal into the shallows myself, so that the traders would believe in a beast and keep away from Sells-Dear's boat.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Hear my reason before you judge me. Sells-Dear carries many travellers on her boat at once. They used to hire our rafts, one traveller to a raft.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We had no other work. We were losing the landing to her.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I thought it a fair fight, because she had a boat and we had our poles and a bucket of scraps. I never meant a real beast. I wanted a story.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A real crocodile came. It took one of our own rafts. You have killed it and I am glad, but the fault is mine.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Here are 60 gold, all the crew has put by. Say nothing to Sells-Dear. Then we keep the landing and our rafts. I am asking you to weigh us against her.
  ScriptNotes: ''
  Edits: ''
