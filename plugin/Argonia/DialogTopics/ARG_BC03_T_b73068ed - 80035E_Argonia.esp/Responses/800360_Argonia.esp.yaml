  Text:
    TargetLanguage: English
    Value: Because the last season is not mine to spend.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Ra'Jhan, the berth-master, pays this season's hire when it is sailed, and all of it is promised to the price of eleven people held at Thorn.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Thorn is the saltrice country in the north-east of Black Marsh, and it is where an Owing is held hardest. I keep their names.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I know of no other buyer for them, and I fear there is none. Heavy-Rope's crew have worked their season and one more.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I know what that is, and I will not call it just. If they are freed now, the eleven stay at Thorn, and I do not know who else will ever pay for them.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Carry that to the crew. Heavy-Rope keeps about the shore by the docks. I would have him hear it from you.
  ScriptNotes: ''
  Edits: ''
