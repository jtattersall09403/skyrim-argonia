    Value: A debt in Black Marsh is paid in work. An arbitrator turns the loss into months of labour, which we count in nushmeekos. When the months are worked, it is over. A holder owed months can also sell them to a man who needs hands. The worker goes with them. I do not say that to be pitied. Ha.
