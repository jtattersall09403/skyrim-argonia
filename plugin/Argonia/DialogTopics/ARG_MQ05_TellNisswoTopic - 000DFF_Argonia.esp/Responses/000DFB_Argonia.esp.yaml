  Text:
    TargetLanguage: English
    Value: You have seen it yourself, and you tell it plainly. The silence and the cut are two things. A Hist is silent as its own act. Nobody does that to it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A cut is done to it by someone else, and it is not an act of the Hist at all. I will give you my reading freely, and I ask nothing for it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A reading that is sold stops being a reading. It becomes a favour that someone has bought. I will carry this to every village where I preach.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will say that you told it to me, if you wish it. If you wish it unsaid, I will say it unsaid. Either way, folk in the villages will hear it.
  ScriptNotes: ''
  Edits: ''
