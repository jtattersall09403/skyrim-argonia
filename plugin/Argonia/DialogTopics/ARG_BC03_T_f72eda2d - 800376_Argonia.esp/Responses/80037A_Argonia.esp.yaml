  Text:
    TargetLanguage: English
    Value: You argue as a trader does. This one listens. A deal is a deal, and Khajiit does not like to break one.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: But the crew are tired, and there are other crews on this coast for coin. Very well. This one gives up the season.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Khajiit will not pay the hire for it, and the crew are not his to put to work. Tell Heavy-Rope this one said so.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'Do not think it is for love of the crew. It is because you were right: hands can be found, and this one will find them.'
  ScriptNotes: ''
  Edits: ''
