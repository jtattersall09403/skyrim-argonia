  Text:
    TargetLanguage: English
    Value: You say it well, and I cannot answer it. Haj-Wan has waited for me, and I knew she would. I climbed up here knowing it. I will come home.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will come in my own time, not at your heels like a hatchling led by the hand. But I will not count the walk-out as mine.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I went out to come back alone, and a viper stopped me, and a stranger cleared my road. Tell Haj-Wan I am coming, and that I am ashamed.
  ScriptNotes: ''
  Edits: ''
