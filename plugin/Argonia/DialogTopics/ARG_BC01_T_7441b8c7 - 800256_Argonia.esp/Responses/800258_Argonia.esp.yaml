Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Her name is Rows-For-Another.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Eleven years ago she holed a boat on the Tulm-Varo estate north of town, and the estate's keeper set her four nushmeekos, four months of work.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She owes more now than she did then. I give you a leaf in my own hand, five picks and 100 gold.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: "Her leaf lies in the estate's count-box: take it, and leave mine in its place. The gold is the first price."
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: By custom an Owing paid at its first price is closed for good, and Hulm-Tei, the keeper, has refused it from me twice.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He may not refuse it from someone who brings more than coin.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'There are three doors, and any one will do: rob the box, make Hulm-Tei strike her leaf himself, or get past Brings-Them-Back, the fetcher on the channel.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Each door costs. Seen at the box, you are a thief on the estate's ground. Kill the fetcher and you have a death on you.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 9
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go north past the farm with its cattle and its big house, to the channel bank beyond. Hear from Rows-For-Another how she is held.
  ScriptNotes: ''
  Edits: ''
