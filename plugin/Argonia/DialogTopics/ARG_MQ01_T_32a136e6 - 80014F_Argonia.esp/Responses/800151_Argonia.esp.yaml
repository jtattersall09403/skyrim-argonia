Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Sit. Salts-The-Catch told me what Buys-The-Months said of you. I am Nesh-Deeka, and I do not lie well to a face, so I will tell you plainly.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Two nights ago the gang's camp up the estuary burned. A woman with a knotted cord at her wrist killed the courier who walked with the gang.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She took his satchel. The satchel was mine.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Her people also cut the camp's Hist cutting, a slip of the sacred tree from which the families draw their lives.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: They cut it away from the eggs at its roots. The eggs died. The gang say she looked at you lying by the fire and let you live.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I serve the Veiled Reed, the quiet service of the An-Xileel, the state that rules Black Marsh. Do not say that name to a stranger.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Not here, not where others can hear. I have work for a hand whose name is on no roll. Ask me whatever you like about it before you answer.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will tell you what I can, and where I am holding back.
  ScriptNotes: ''
  Edits: ''
