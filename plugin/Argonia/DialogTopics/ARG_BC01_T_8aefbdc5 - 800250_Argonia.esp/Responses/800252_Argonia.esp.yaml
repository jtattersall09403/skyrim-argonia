  Text:
    TargetLanguage: English
    Value: We are a few dozen, in Blackrose and round it, and we get the held out. Our oath is three words. Bones go home. An Owing stands on three legs.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The first is the count, which the holder keeps under lock. The second is the word that says it stands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The third is the hand, someone paid to fetch a runaway back. Take one leg away and the whole Owing falls.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We take them with a key lifted off a belt, a lock opened in the dark, a keeper faced down at his own door and a fetcher met on a channel bank.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Nobody else is going to do it.
  ScriptNotes: ''
  Edits: ''
