  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: My own black gum sealed the cut on that root, and my knife had vanished from my things. I hid the cut, because I knew it would be called my work.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
