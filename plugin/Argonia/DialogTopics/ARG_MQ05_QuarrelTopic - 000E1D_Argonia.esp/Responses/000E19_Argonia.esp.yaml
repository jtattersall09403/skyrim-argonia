  Text:
    TargetLanguage: English
    Value: Sit by the root with me. You ask about the quarrel. I am glad of it. A Hist is silent when it chooses. The Hist chooses its silence. No one makes it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We should read it. We should never force it open. Kaska-Meen and I have argued this for many days, and I hope we never finish.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She keeps her watch by the young Hist, the tree she minds, in the grove behind the hall. Go to her and hear her side, then come back to me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am a Nisswo, and I interpret at the debating house. I will read a silence for you. If you can persuade Kaska-Meen or me, speak.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I only ask that you have a reason, because I will not take a side for nothing.
  ScriptNotes: ''
  Edits: ''
