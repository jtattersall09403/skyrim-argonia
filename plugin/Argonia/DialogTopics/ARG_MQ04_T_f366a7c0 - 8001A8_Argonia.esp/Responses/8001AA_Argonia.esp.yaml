Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Hires-By-The-Season, the root-herald of Low-Reed Village.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I speak for our people to strangers, and I have little reason to trust anyone from Lilmoth. The Hist is the great tree our people hold sacred.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Its eggs hatch in the pool under our stilts. Eleven nights ago its light went out and its leaves shut. The eggs in the pool died.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Our people say the leeches came up the roots. Then the tree shut.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: They blame Pays-Late too, the tree-minder who keeps the tree, because he let the leeches in.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He stands on the bank under the stilts on the south side of the village, day and night. He will not say why.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If a stranger can get the truth out of him, let the stranger try.
  ScriptNotes: ''
  Edits: ''
