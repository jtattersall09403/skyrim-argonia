Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I have my book, and I will not speak of it again. Hear what the rest of it was worth. If you broke the hire and freed the crew, I am satisfied.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The eleven people held at Thorn, whose names he keeps, are the cost. Here are ten lockpicks, and you are a full Chainbreaker.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If the old man let them go himself, I will say only this. He would. That is the worst of him. Here are ten lockpicks, and you are a full Chainbreaker.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If the season is to be sailed, the hire goes to the price of the eleven. Eleven.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I cannot tell you that you were wrong, and I can tell you he will ask again. I name you a full Chainbreaker and give you nothing else.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Come to me when you want more work.
  ScriptNotes: ''
  Edits: ''
