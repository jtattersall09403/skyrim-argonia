  Text:
    TargetLanguage: English
    Value: Then they did cut that Hist as well. From a dropped jar I learned that the cutters draw sap.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: These jars show me they cut trees with villages standing round them, which is what I feared. I take them, and here is fifty gold.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Reed pays its hands. I will not dress up what this costs Low-Reed.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: While I keep the jars they are not poured back at the cut root, and the village's Hist stays dark. The Reed wants them as proof.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I can hold up a jar where I must. I cannot hold up the word of a hand with no name.
  ScriptNotes: ''
  Edits: ''
