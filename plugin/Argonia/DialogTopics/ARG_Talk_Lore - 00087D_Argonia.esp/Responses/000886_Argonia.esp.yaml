    Value: Ah, my good friend, you ask me about boats. You could not have asked a better man. Lilmoth sits over water too shallow for the big ships, so they lie out at anchor and the lighters bring the goods in. I was a lighterman, did I tell you that? And out in the deep water are the sea-drakes, great crocodile things with paddles for legs. I never once liked the look of them.
