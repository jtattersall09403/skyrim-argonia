  Text:
    TargetLanguage: English
    Value: In the lowlands east of Lilmoth stands the Xinchei-Konu Monument. It is an old stone calendar that is said to change the weather. It has a keeper of its own. Lilmoth's Hist is tended in the open behind a wall. The tree-minder's post rotates so that a single person never listens to it alone. I asked to sit beside it and take notes. I found the answer narrow-minded.
  ScriptNotes: ''
