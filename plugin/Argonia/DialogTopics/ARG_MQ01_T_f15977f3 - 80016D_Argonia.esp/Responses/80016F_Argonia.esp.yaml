Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Come in. Salts-The-Catch described you to me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You are the one the gang carried aboard Buys-The-Months's ship, off the bank by the fire, the night their camp burned.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That same night a woman with a knotted cord at her wrist killed the courier who walked with the gang. She took his satchel. The satchel was mine.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Her people also cut the camp's Hist cutting, a slip of the sacred tree from which the families draw their lives.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: They cut it away from the eggs at its roots. The eggs died. The gang say she saw you by the fire and let you live.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I serve the Veiled Reed, the quiet service of the An-Xileel, the state that rules Black Marsh. Do not say that name to a stranger.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I need a hand whose name is on no roll, and you may be that hand. Ask me what you like before you answer.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will not lie to you about what I keep back.
  ScriptNotes: ''
  Edits: ''
