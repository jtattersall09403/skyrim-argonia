  Text:
    TargetLanguage: English
    Value: His name was Otheel. He was a shelter-reckoner of the Rose, one who reckoned what a household owes the heirs for its roof.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He was drowned in a net in the wash-pool, the pool in the Rose where the held wash. I say how he died. I do not say who did it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Whoever reads the leaves will know who. I can say who stands before me, and I cannot say what their hands did.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The three are east of me, on the water's edge. Speak to them, and think about what you hear.
  ScriptNotes: ''
  Edits: ''
