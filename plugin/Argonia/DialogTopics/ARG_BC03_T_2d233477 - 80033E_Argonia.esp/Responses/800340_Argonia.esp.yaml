Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then hear the plan, and better it if you can. When the Broker bought a person out of an Owing, he carved a token for them and kept it in his chest.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A person has it back when they have worked a season's hire for him. My crew worked theirs and another. The tokens are still in the chest.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The chest is in the north one of the three Dock Houses, up from the shore by Soulrest's docks.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The old man is usually in his room near it, and he keeps the key on him, so I am told.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Feldril Nethri, a Dunmer who says he works off his own months, keeps about outside the north door, which is locked.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He might leave it unbarred for coin or a good word. A season is paid for by Ra'Jhan, the Khajiit berth-master, who keeps the bare shore by the docks.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He pays when it is sailed. Without him there is no season.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The old man says the hire is promised to the price of eleven people held at Thorn, where it is worst. Hear my side.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 9
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A last season that becomes two is an Owing with a new name, and we were promised an ending.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 10
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If the old man wins, my crew row again and I do not know where it stops. Hear his. If we win, the eleven stay at Thorn.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 11
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will not tell you he is a bad man. He freed me. Lift the key or talk the door open, or go to Ra'Jhan.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 12
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Whatever you do in that house, the old man is in the room, and if he sees you, you are a thief.
  ScriptNotes: ''
  Edits: ''
