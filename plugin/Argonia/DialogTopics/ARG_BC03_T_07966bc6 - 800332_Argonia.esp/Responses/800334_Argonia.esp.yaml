Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Ussa-Rekh, the Broker, bought hundreds of people out of their Owings on Soulrest's dock, on the shore a short way east of Lilmoth, and now he hires them out, and each freed person's carved token stays in his chest until they have worked a season for him.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Heavy-Rope's crew have worked theirs and one more, and I want their tokens in their hands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: There is also a bound book on his shelf with my name on it, and I want that too.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The tokens lie in his chest in his house, the north house of Soulrest.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The old man keeps the key on him, so I am told, and Feldril Nethri keeps about outside the locked north door. You have three ways in.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You can lift the key and open the chest. You can talk Feldril Nethri into leaving the door unbarred, or the old man himself into letting the crew go.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Or you can go to the berth-master, the man who finds hands for the boats and pays their hire.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Heavy-Rope keeps about the shore by the docks, and he has the plan. Hear it, and better it if you can. Know what each way costs.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 9
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The old man is usually in his room, near the chest, so every way through that house is under his eye, and seen, you are a thief.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 10
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: And remember what he is.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 11
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He bought people out for thirty years and keeps nothing for himself, though one year a berth-master paid coin and a season became two.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 12
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not ask you to hate him. I ask you for the tokens.
  ScriptNotes: ''
  Edits: ''
