  Text:
    TargetLanguage: English
    Value: No, friend, I will not stop you. The custom of Helstrom's Agaceph forbids our own to follow a walk-out. It does not bind an outsider.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: But hear me, for I would not see you lost. Anyone who walks into the basin round Helstrom may die there. A warning is posted at the gate.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: What lies in the reed roots bites. The bite kills. The levy will send none of its own after you. If we followed every youth out, no walk-out would be his own.
  ScriptNotes: ''
  Edits: ''
