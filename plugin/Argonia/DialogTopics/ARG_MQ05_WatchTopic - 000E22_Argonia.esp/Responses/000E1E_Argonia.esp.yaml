  Text:
    TargetLanguage: English
    Value: You ask about my watch, so I will tell you what I hold. A Hist that falls silent must be watched by tree-minders alone.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We know the Hist and we know its roots. We do not need others sitting beside it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Nisswo Ei-Tuja stands at the root's foot, and you can speak to him there.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you want the assembly, the Hall of the Scalded Throne is the low-roofed house by the first street, on the left as you come in from the gate.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The seat is in the inner room. The merchants stay in the outer room. Argue with me here, if you wish. I will listen.
  ScriptNotes: ''
  Edits: ''
