Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You ask it gently. Nobody has asked me anything gently at this post, and I am too tired to hold myself against it. It was Mends-Nets.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Otheel wrote a third winter on my roof, and I am old, and I could not pay for the first two.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She did it in a night, and then she came back to me and held the cup to my mouth. She has never spoken of it. I did not ask it of her.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I did not need to. She is not a hard woman. She is the gentlest hand I have had. When the reckoner's leaves are read, she is put under for it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Take her before me, if you take any.
  ScriptNotes: ''
  Edits: ''
