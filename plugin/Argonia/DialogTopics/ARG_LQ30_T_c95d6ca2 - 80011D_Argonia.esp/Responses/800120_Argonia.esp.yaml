Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I wait for Sei-Wan, my kin. He walked out into the basin alone, to prove himself to the Agaceph, and he has not come back. I am Agaceph too.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: By our custom none of us may follow a walk-out, so I stay by this road. An outsider may follow him.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He went out east, a long way past the houses, and he is out among the trees there. Vipers lie out there. Nothing that walks in the basin lives long.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Gih-Xaleel, the levy warden, keeps watch near this road and will say the same. I want him alive.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He wants the walk-out to count, and it counts only if he comes home on his own feet. If another brings him in, the Agaceph will say he did not finish.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I would have him alive and shamed sooner than proud and dead. Bring him home if you must. But if he can walk, let the walk-out be his own.
  ScriptNotes: ''
  Edits: ''
