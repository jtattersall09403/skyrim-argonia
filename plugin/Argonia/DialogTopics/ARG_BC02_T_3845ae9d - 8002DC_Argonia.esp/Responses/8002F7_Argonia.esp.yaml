Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Seven-Floods, an old woman who owes the Rose's heirs for a roof, and always will.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: An Owing is the work a debt sets on you, and mine will outlast me. The smoke from the Rose's fire is in my chest, and it does not leave.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I cough through the night, and the younger woman here sits up with me. I want one thing, to die near my Hist.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That is the tree I was hatched under, and a woman who dies in the heirs' hands dies far from it. My daughter is Rows-For-Another.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She works off an Owing of her own on the land north of the town.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'About that Owing I will tell you this much: the girl who kept the count wept when she wrote my daughter down, and then she wrote it.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you have come to take one of us out, I ask that you do not choose me.
  ScriptNotes: ''
  Edits: ''
