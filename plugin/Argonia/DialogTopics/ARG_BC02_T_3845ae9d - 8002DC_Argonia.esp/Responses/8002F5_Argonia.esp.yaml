Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Walks-Far. I am the one the heirs hold for words. They run the Rose, the old prison far to the north of here, and they hold me at this post.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I said it in the Rose's yard, and I say it again.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: '"The gate to the dead levels should be opened, and the Rose left." The dead levels are the floors below the Rose, where the dead still walk.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I said it loud, so everyone would hear. Three seasons. That is what I owe for it, and I will not take back one word.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The woman here says she is the one held for words. She stood in the yard. She can say it as well as I can.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Saying a thing is not the same as saying it first. I heard Tsaxi talk, so I know one of us may go.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you take her, a woman who said nothing walks out under my name. I stay, the gate stays shut, and the next man who says it will know what it earns.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Take me. I am sick of this water.
  ScriptNotes: ''
  Edits: ''
