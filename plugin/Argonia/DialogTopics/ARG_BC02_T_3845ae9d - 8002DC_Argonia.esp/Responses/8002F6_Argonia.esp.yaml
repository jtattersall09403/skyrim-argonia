Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Mends-Nets.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I was set to mend the heirs' nets, and at night I sit with the old woman, because she coughs through the night with the smoke in her chest.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Forgive me if I speak low. She sleeps badly. I am the one they hold for words. I said them in the yard, and the words are these.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: '"Open the gate to the dead levels, and leave the Rose." The whole yard heard it, so I have them by heart. The man here says they are his.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not argue with him. He is frightened, and a frightened man holds hard to what he has. Think of what is lost if he goes.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He is loud, and he cannot keep still.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He will say it again at the first wall he finds, and the heirs will hear him, and the hunt will follow the sound to the old woman's tree.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I know how to be quiet. I have been quiet at this post a long time. If he goes, I stay. I sit with her until she is gone, and then I sit alone.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 9
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not ask for pity. I ask you to think about it.
  ScriptNotes: ''
  Edits: ''
