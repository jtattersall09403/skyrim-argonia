Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Third-Born Tsaxi, gate-keeper of the Rose's outer post. The Rose is the old prison, far to the north of here.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The heirs hold it now as their home, and they set me to watch these three. I was born in the Rose, and the heirs fed me and raised me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: They keep the gate shut on the dead levels below it, and they set me to watch the three at their post.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I have never been further from the Rose than this shore.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I cannot read a leaf or a mark, so I know these three by looking, and I say what I see to the heirs without a mistake.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If my count is wrong, my neck answers for it. Ask what you want to know, and ask it plain. I answer plain.
  ScriptNotes: ''
  Edits: ''
