- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Yes. It is Kothringi glass out of an old cairn. I bought the strand from the robbers who broke it out, and I paid them too much.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I called it family work because I had nothing to show that I came by it honestly. Buyers do not ask a family for proof of its own work.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Fifty-five gold is what it is worth, and I will pay that.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Neeta-Haj lied about her statue, and Okan-Tei about his charm, and now I have owned my lie as they did.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Each of us has our own again, and none of us will speak well of you.
  ScriptNotes: ''
  Edits: ''
