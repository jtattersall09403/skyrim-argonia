  Text:
    TargetLanguage: English
    Value: Someone from Lilmoth. We do not trust strangers now. The Hist's light is out. Its leaves are shut. Our uxith is dark.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That is where the eggs lie. Leeches crowd its roots, and they closed the tree. Pays-Late, our tree-minder, let them in.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Pays-Late goes down to the roots at night. Folk in the village see him go. I will not open the tree to you yet.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Win me round with your words, or bring me two piles of salt. We cannot make salt here, because our water is fresh.
  ScriptNotes: ''
  Edits: ''
