Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You speak well, and you speak as one of us. I am glad the Reed has you. Take what you found at Low-Reed Village to Helstrom, and tell it plainly.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Reed wants Helstrom's tree-minders and Nisswo to hear what a cut Hist looks like. We want it said by someone we can deny.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Kaska-Meen sits in the assembly and keeps watch in the grove. Ei-Tuja is a travelling Nisswo who lodges at the debating house. Start with either.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We of the Reed sent you, and we want that kept unsaid. Never name it in Helstrom, not to the warden at the gate and not to the people in the grove.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will not go with you. If I walk into Helstrom, people will name me as the one who sent you. The ship runs between Lilmoth and Helstrom's landing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: From the landing, the way in is root and shallows through the Heart-Mud. Go slowly, and keep to the roots.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Reed's house is the fish-trader's, Salts-The-Catch's, on the stilts of Lilmoth's channel. Its back room is behind the screen.
  ScriptNotes: ''
  Edits: ''
