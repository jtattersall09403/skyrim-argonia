  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Reed wants Helstrom's tree-minders and Nisswo to hear what a cut Hist looks like. We want it said by someone we can deny. That is you now.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We of the Reed sent you, and we want that kept unsaid. Never name it in Helstrom, not to the warden at the gate and not to anyone in the hall.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go alone. The ship runs between Lilmoth and Helstrom's landing. From the landing, the way in is root and shallows through the Heart-Mud. Go slowly.
  ScriptNotes: ''
  Edits: ''
