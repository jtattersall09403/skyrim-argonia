  Text:
    TargetLanguage: English
    Value: I wait for Sei-Wan, my kin. He walked out into the basin alone four hours ago, to prove himself to Helstrom's Agaceph, the tribe that rules this city and that we belong to.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The custom of the Agaceph forbids our own to follow a walk-out. The levy will not go, and I may not. It does not apply to an outsider.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He went east from the gate, through the shallows. Vipers live in the roots there. Anyone who walks into the basin may die there. A warning is posted at the gate.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you go, bring him home alive. If he can walk home himself, let the walk-out be his own.
  ScriptNotes: ''
  Edits: ''
