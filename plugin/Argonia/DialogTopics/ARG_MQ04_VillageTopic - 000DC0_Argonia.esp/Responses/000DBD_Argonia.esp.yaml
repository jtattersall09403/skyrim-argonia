  Text:
    TargetLanguage: English
    Value: You are from Lilmoth. I do not trust you. The Hist's light is out. Its leaves are shut. Our uxith is dark. That is where the eggs lie.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Leeches crowd its roots. They closed the tree. Pays-Late, our tree-minder, let them in. He goes down to the roots at night.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Folk in the village see him go. I hold back my welcome. I will not open the tree to you yet. Win me round with words, or bring me two piles of salt.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: We cannot make salt here. Our water is fresh.
  ScriptNotes: ''
  Edits: ''
