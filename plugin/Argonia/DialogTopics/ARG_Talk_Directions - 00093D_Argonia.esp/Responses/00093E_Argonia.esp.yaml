    Value: Alten Merihall is a long haul. Follow the shore north-east, three hundred paces, until Lilmoth is on your right. Then east, a hundred and ninety, to the burnt-out house on your left. South-east a hundred and thirty to Lilmoth Dock, then east, three hundred paces or so, until the big ship is on your right. Climb south-east, two hundred and sixty, past Soulrest, until the Dwemer ruin is on your left. South-east another two hundred and sixty and you are at Alten Merihall. Keep out of the shallows, passenger.
