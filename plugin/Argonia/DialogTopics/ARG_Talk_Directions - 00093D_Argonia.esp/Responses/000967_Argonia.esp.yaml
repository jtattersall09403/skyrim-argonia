    Value: The Dwarven Ruins lie beyond Helstrom. Follow the shore south about one hundred and forty paces past the old stone columns until Helstrom is on your right. Go along the boards south-east about one hundred and thirty-four paces until the big ship is on your right. Then climb south-east over open ground about five hundred and twelve paces until the standing stone is on your left. Then follow the shore south-east about one hundred and seventy-six paces to the ruins.
