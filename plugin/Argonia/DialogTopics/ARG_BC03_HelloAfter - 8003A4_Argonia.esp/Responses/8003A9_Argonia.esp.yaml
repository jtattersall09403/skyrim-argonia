- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If the hire was not paid, they wait and no one else will buy them. If it was paid, they are bought and you have my thanks.
  ScriptNotes: ''
