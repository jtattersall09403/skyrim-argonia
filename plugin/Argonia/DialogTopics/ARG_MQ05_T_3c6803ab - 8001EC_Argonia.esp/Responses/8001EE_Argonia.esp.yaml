  Text:
    TargetLanguage: English
    Value: Then it is not a silence at all. It is a thing done to a tree. I will preach that in every village I walk to.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The cutters will hear it with everyone else, and I will say it all the same. Hear this as well.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: When a Hist dies it leaves a Mnemic Egg, a seed of its sap that holds the tree's memories.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Aldmeri Dominion used one, long ago, to stop a generation of eggs hatching. Whoever gathers a living tree's sap may be after such a thing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not say it is so. I say you should keep it in mind.
  ScriptNotes: ''
  Edits: ''
