Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I have fetched her back twice already, in my head, on nights I could not sleep. I never meant to, either time. You have given me a reason I can carry.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will be looking at the water when she goes, and a man cannot fetch what he does not see. Hear what I keep.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I still know the way to her tree, and no word of yours takes it out of me. I look away. I do not lead her home.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go to her, and be quick, before I think better of it.
  ScriptNotes: ''
  Edits: ''
