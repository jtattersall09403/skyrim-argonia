Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Dead? Truly dead?
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then my raft goes back on the water and I can breathe again, and I must tell you everything now, quickly, before I think better of it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It was our doing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Wuleen-Taza, who poled with me, dumped fish offal from our bait bucket in the shallows east of the scaffold, night after night, so that traders would think a beast lived there and keep away from Sells-Dear's boat.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: And it drew in a real one, a true crocodile, the one you killed.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The bucket was left in the shallows east of the scaffold; none of us dared go down for it. Sells-Dear, the boat captain, must not see it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I beg you to say nothing, because she would take the whole river trade from us if she heard. I will say it plainly, so that you choose with open eyes.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Wuleen-Taza will pay you to keep quiet, and you will find her east of me, near the bridge.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 9
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Sells-Dear will pay to see the bucket, and she stands far north of here, on bare ground by the houses, with tents a short walk east of her.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 10
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Fetch it for her and the river trade is hers and the crew is finished. Leave it, and we keep our rafts. I am asking you to leave it.
  ScriptNotes: ''
  Edits: ''
