  Text:
    TargetLanguage: English
    Value: That is a kind hand. The weight lifts a little, and I can say three words without coughing. I will use them well. Speak low.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The younger woman who nurses me is close by, and I will say this once. Mends-Nets drowned Otheel.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He was the Rose's shelter-reckoner, the man who sets down what each roof owes. He wrote a third winter on mine, and she drowned him for it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Take her first, if you take anyone.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: When the reckoner's leaves are read, the heirs will put her under, down beneath the Rose, and no one is seen again after that.
  ScriptNotes: ''
  Edits: ''
