  Text:
    TargetLanguage: English
    Value: No. I keep this gate, and what a tribe does with its own young is for that tribe to do.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The levy has never stood in the way of a rite, and I will not stand in your way. Sei-Wan went out into the basin days ago, and he is not back.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Haj-Wan, who waits beside me, will tell you why he went. If you go after him, I will not stop you. But hear this.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: What lies in the reed roots bites, and what it bites dies. The levy will not come in after you, so you go alone. I do not like what the rite costs.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I watch young ones walk out here and I do not follow, because the levy keeps to the gate. When one does not come back, I have stood here and watched.
  ScriptNotes: ''
  Edits: ''
