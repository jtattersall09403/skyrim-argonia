  Text:
    TargetLanguage: English
    Value: You speak like one who has sat by a bed like mine. Say it slowly. Nobody who has sat with me has known what to give. Yes.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That is what I wanted, and nobody here had it for me. I owe you for that, and I will pay with something I did not mean to say.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The younger woman here, Mends-Nets, has no skill with a chest, only patience.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She put Otheel, the Rose's shelter-reckoner, under the water because he wrote a third winter onto my roof.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The heirs will put her under when his leaves are read, down beneath the Rose where nobody is seen again. Take her out of here before any of us.
  ScriptNotes: ''
  Edits: ''
