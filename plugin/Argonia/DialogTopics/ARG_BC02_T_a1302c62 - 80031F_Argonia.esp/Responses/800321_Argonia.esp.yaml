- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: So the keeper is dead. I did not wish it, and I do not weep for it. He counted us every morning, and now nobody is left to count.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: All three go, then, when you have gone. Do not take it for a gift. The heirs will find the water empty and a dead man. They will hunt.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The hunt goes to our homes. I will not run to mine. I go where the hunters would not think to look.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Ask Never-Sold, in the Chainbreakers' house on the north side of the town, what a dead keeper's count is worth. She will tell you.
  ScriptNotes: ''
  Edits: ''
