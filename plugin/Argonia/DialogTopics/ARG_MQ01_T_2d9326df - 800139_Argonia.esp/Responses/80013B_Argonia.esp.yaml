  Text:
    TargetLanguage: English
    Value: You are in the hold of a ship. It belongs to Buys-The-Months, a broker who hires out the work of others.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The ship is moored at the pier at Hereguard Plantation, west of Lilmoth. I am Wuleen-Sei, his overseer.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: My gang carried you aboard, hurt, from the bank by the fire at our camp, the night it burned. We brought you down the estuary in our longboat.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go up the stairs and out of the door onto the deck. Buys-The-Months waits on the pier. Ask him what is owed in this hold, and why.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That is for him to say, not me.
  ScriptNotes: ''
  Edits: ''
