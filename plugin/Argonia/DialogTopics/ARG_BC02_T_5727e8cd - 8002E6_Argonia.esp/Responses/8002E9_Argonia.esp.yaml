- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You say it plain, and you argue it well enough. I am tired of carrying the whole count on my own neck. One is smoke.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will swear it before the heirs, and I will swear it to anyone who asks. If you ask me for a second, I will say you lie.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Now choose which, and tell the one you choose. The other two stay as the heirs set them, and I will keep them on this shore.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you have found my reckoner's leaves, read them before you choose. I cannot read them, so I cannot tell you if you are wrong.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Do not send out the wrong one because you were in a hurry.
  ScriptNotes: ''
  Edits: ''
