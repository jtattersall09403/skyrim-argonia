    Value: Okan-Wul is usually about five paces north of here; I mother that hatchling, whatever they say. Stares-At-Clouds is about twenty-five paces north-north-east, lazy and sweet. For Uleesh, go about forty-five paces east to the shallows below the walls of Lilmoth; he fishes there. He is the most honest man outside the walls.
