  Text:
    TargetLanguage: English
    Value: I asked you not to choose me. You have, and I will not make you say it twice. I go to my daughter, if she is still where they keep her.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Tell her I am coming, if you pass that way. After her, if I am let, I go home to my Hist, though the smoke may not let me reach it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I go when you have gone from here. I leave two behind me at this post, and I have not told you all there is to tell of either.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will carry that with me, and it will not ease my chest.
  ScriptNotes: ''
  Edits: ''
