- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You chose me. If you have read the reckoner's leaves, you know what they say of me, and you chose me knowing. I will not tell you they are wrong.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I said his words to you, and I said them well. They were never mine. I am sorry for that lie, and not for the rest. I do not thank you.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You could have chosen the old woman, and she asked you not to. And I do thank you. I did not think anyone would choose me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I go when you have gone from this water. Neither of the others will follow.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Three on the road leaves three trails, and every trail ends at somebody's home.
  ScriptNotes: ''
  Edits: ''
