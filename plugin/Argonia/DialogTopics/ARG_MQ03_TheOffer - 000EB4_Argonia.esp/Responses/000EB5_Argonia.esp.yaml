    TargetLanguage: English
    Value: I am of the Veiled Reed. It is the state's quiet service. We show no face. We want a hand we can deny.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: No master can claim you now. The roll burnt in the camp's fire, so the broker cannot show what you owe, or that you were ever on it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I offer you the Reed's protection, a door in Lilmoth and a stipend. The condition is that you serve the Reed. Think before you answer.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I want the survivor's account of the cell's work. When I have it, the Reed's people see the survivor home.
  ScriptNotes: ''
  Edits: ''
