  Text:
    TargetLanguage: English
    Value: Sit, please. Tell me what you saw at the camp. Take your time, but leave nothing out.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Did you see jars at the camp? Think it over. I am in no hurry.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You are carrying a phial. Give it to me, and I will take care with it. I want to look at it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Tell me about the jars once more. How many ring-marks did you see?
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Reed has word of a cell. It cuts a Hist's roots and draws its sap into jars. I tell you this because I trust you.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Your camp is the first work of it that the Reed has seen.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The roll burnt in the camp's fire. No hand can show what you owe, or that you were ever on it. I am glad of that for your sake.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The courier's satchel was mine to see carried. I say no more of it. I am sorry I cannot.
  ScriptNotes: ''
  Edits: ''
