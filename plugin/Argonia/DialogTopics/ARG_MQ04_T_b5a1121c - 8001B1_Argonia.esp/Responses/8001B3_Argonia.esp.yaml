  Text:
    TargetLanguage: English
    Value: I am Pays-Late, the tree-minder of this village. I tend the Hist, our sacred tree. The pool where the eggs lie at its roots is mine to tend as well.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I wash the roots where the leeches crowd. That is my work, and I do it alone. A face from Lilmoth will get no more from me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not speak for the villagers. Their root-herald does that. The box at my feet is my gum box, where I keep the black gum for the roots.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It is locked, and it stays so.
  ScriptNotes: ''
  Edits: ''
