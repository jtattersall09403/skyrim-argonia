PreviousDialog: 80027D:Argonia.esp
Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: My leaf. Then you have been in the box, and you know what is written on it. I will not ask how. Give it here, and the price with it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Hers I strike now, in front of you. If anyone asks where mine went, the damp had it, and that is all I will say.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will not be on this ground at the reckoning.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Whatever any leaf is short is written onto the keeper's own, and there will be no keeper's leaf to take it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The dozen hands who stay will share it between them. They have done nothing to you, and that is the price of this. They are good hands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: They will row it, and not one of them will know whose months they rowed. Go and tell the boat-hand on the bank she owes nothing.
  ScriptNotes: ''
  Edits: ''
