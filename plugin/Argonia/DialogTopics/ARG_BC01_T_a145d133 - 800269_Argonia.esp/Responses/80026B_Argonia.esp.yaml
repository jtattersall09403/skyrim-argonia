  Text:
    TargetLanguage: English
    Value: He looks away. Then he is bought or talked round, and either way he is still alive.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: He still knows the way to my tree, and he will know it all my life. I can leave this bank, and I cannot go home while he lives.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I said I wanted it closed, not fled. I do not blame you for this. You did what could be done.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go now, and I will be on the water when you are out of sight. Tell Never-Sold I have gone by the channel, and that the road home is shut to me.
  ScriptNotes: ''
  Edits: ''
