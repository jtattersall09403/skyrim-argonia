  Text:
    TargetLanguage: English
    Value: I asked you to take Mends-Nets, not me. You have chosen me all the same, and I will not make you say it twice.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I go to my daughter, if she is still where they keep her. Tell her I am coming, if you pass that way.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: After her, if I am let, I go home to my Hist, though the smoke may not let me reach it. I go when you have gone from here.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I leave two behind me at this post, and I have not told you all there is to tell of either. I will carry that with me, and it will not ease my chest.
  ScriptNotes: ''
  Edits: ''
