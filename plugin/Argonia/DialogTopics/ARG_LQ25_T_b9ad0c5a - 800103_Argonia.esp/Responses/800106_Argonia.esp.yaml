Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Under it? Not under, off the end of it. A crocodile lairs in the shallows past the last plank of our walk, and it has taken one of our rafts.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It was a raft, not a person. I thank the Hist for that. No raft of this crew goes out while the beast lives, so we have no work at all.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I would end it myself, but my hands are for the current, not the blade. Follow the plank walk east along the shore, beside this tower, to its end.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Kill it with a blade if you can stand in the shallows, or with a bow or a spell from the shore, by day, when you can see it plainly.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not care how, only that it dies.
  ScriptNotes: ''
  Edits: ''
