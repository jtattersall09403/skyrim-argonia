- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I'm a guest in this marsh, outlander, no more than you, and a door is only a door. I bar it because I'm told to. I hold nothing behind it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I'll say this once. I am held here on the same terms as the crew, months owing and worked off, and I want to be left out of it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Leave my name out and I leave the bar off. It is off. Go in, and mind yourself.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The old man is usually in his room near his chest, and he is old, not blind. Do not say who let you in.
  ScriptNotes: ''
  Edits: ''
