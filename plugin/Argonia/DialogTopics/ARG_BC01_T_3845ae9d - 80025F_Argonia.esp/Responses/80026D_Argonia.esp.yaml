Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Hulm-Tei, keeper of the count for the Tulm-Varo, who hold this farm. The count is the written account of what each hand on this farm owes.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: My mistress, who winters in Gideon, far from here, leaves it to me. I was hatched owing on this ground.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A debt came with my egg, and the work that pays a debt is called an Owing. Every line I write on a hand's leaf, the page that holds the debt, is true.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Forty people eat because the boats go out, and the hands are the ones who row them.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: When the count is short at the reckoning, when the season's count is closed, the shortage is written on me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: So I am hard about a line, and I will not be shamed for it. The keeper before me wrote smaller than I do, and more exactly.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You will see it in the first lines of the oldest leaves in the count-box.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 8
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I keep by the count-box, on the farm by the cattle, because the box is mine to keep.
  ScriptNotes: ''
  Edits: ''
