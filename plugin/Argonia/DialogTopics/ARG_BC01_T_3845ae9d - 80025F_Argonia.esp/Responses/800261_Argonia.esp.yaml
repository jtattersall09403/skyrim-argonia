Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Rows-For-Another, who was a boat-hand of the Tulm-Varo, and I wait on this bank.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A boat I holed put me in an Owing, which is the work a debt sets on you, and that was eleven years ago. I do not ask strangers for anything.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will say that I have not stood under my Hist, the tree I was hatched under, in all those years, and I am afraid of going grey before I do.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The big house on the farm south of this bank is the estate house, and its keeper stands inside it, by the cattle.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The man who fetches runaways keeps to the channel where it runs on north of here.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you want the rest, go back south past the farm to the Chainbreakers' house on the town's north side. The woman who keeps it can tell you my debt.
  ScriptNotes: ''
  Edits: ''
