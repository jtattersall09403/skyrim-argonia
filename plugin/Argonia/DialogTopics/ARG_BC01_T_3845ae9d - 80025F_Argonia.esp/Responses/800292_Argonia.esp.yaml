Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Brings-Them-Back.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I fetch runaways for the Tulm-Varo, who hold the farm south of here, and for each one I bring home they pay me a head-price, which is a fee for every head.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It is 150 gold. Every hand on that farm has a home tree, the Hist their tribe was hatched under, and I alone know the way to each one.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A runaway who gets past me can never walk home. I call fetching the kind part of this trade. The Tulm-Varo punish the hands left behind when one runs.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The runaway I bring back they treat more kindly, and I would sooner bring one home than watch the others pay for it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I stand where the channel runs on north of the bank, and I keep to it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 7
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Rows-For-Another, on the bank just south of here, can tell you what I am to her.
  ScriptNotes: ''
  Edits: ''
