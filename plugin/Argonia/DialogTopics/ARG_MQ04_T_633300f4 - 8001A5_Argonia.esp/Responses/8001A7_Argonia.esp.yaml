  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I need to know whether they cut the Hist of Low-Reed Village as well. Follow the shore east out of Lilmoth until you reach the village.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It stands on stilts over fresh water. Hires-By-The-Season is its root-herald, the one who speaks for the village to strangers.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She stands on the raised ground at the village's middle. Do not name the Reed there.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You are a stranger who heard that the tree turned its face, and that is all you need be. I fear the cutters did not stop at the cutting.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
