Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I saw a boat. I will tell you, though it shames me. It came in from the north reeds the night the tree shut, and it went back out again.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I took it for a netter's boat and gave it no more thought. I stood by this pool and did not go to look. I did not even call out.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That is mine to carry. Whoever cut the root closed the cut with black gum.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That gum is made in our own sap-workshop, and Pays-Late, who minds the tree, keeps it in the box at his feet.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you would know more, look in that box. He stands on the bank by the roots, under the stilts on the village's south side. I will say no more of him.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If you want more of him, ask him.
  ScriptNotes: ''
  Edits: ''
