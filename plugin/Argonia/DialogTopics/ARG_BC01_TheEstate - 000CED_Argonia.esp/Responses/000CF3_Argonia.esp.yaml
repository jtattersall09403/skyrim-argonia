    Value: Rows-For-Another took a boat from the estate north of Blackrose. She took it on an Owing of four months. An Owing is a debt paid in work. That was eleven years ago. She works it still. I have saved enough to buy out the Owing. Hulm-Tei, the steward, keeps the debt book in a locked chest on the landing. Take the swamp road north out of Blackrose. The landing is a short walk on, on the channel side, with boats at the water. I will meet you there.
