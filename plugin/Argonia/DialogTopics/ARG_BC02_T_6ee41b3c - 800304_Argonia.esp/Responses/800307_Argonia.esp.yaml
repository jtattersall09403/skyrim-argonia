Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then you know it, and I will not tell you it was not so. Mends-Nets drowned Otheel, and she did it for me. Otheel put one more winter on what I owed.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I was old and coughing, and I owed more than I could ever work off, and that third winter was one more to die inside.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She took him at the wash-pool with a net. He did not come out. If those leaves reach the Rose, she is put under, down where nobody comes up.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You have read that too. Take her anyway. Take her before me. I am an old woman with smoke in my chest, and I will be dead soon wherever I am.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She is young, and she did it for me. Do not mistake me. I want to die near my Hist, and I would give much to lie under it at the end.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will not buy it with her.
  ScriptNotes: ''
  Edits: ''
