Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You read it as a tester does. Good. It is fresh sap, drawn from cut roots.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The stopper and the neck of the jar show the marks of other jars filled beside it. I will note that.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then you tasted, and I wrote what you said while you were under it. A ship's hold with roots through its deck.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A door that was never built, and a voice, dry, that made no words. I cannot tell you what it means, and I will not guess.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Keep the page and twenty-five gold, and I will keep the jar. We pay our hands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'One more thing, because you are one of mine now: the Hist at Low-Reed, a village east of here, has turned its face from its people.'
  ScriptNotes: ''
  Edits: ''
