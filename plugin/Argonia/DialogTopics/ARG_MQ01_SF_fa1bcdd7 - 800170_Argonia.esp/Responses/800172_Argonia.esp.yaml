  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am Buys-The-Months, a broker. This is my ship, moored below Hereguard Plantation. Lilmoth lies a fair way east along the shore.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The water at Lilmoth is too shallow for a ship her size, so she lies here. The Argonians in her hold are an Owing gang.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Each of them works off months of work owed for a debt or a wrong.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I keep those months written on my work roll, and I hire the gang out to unload the lighters, the cargo boats, at Lilmoth's dock.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: You came down the estuary with them, but you are on no line of my roll. You owe me nothing, so I cannot hire you out. You are no affair of mine.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Get off my ship.
  ScriptNotes: ''
  Edits: ''
