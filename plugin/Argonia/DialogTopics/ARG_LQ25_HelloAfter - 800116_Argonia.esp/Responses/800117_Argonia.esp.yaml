  Text:
    TargetLanguage: English
    Value: Every trader will come to me now, and the rafts will go unhired.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The rafters fed a crocodile with their own scraps, and I still laugh when I think of it. I will tell you what I did not tell the crew.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: For a year I sold below cost on the landing side. I lost coin every week to starve the rafters out of their trade.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Now I need not, and I will charge what a crossing is worth. I was not the only one playing a dirty game on this landing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I only played it where the traders could see the price. Wuleen-Taza will have to find other work, and I will not be hiring.
  ScriptNotes: ''
  Edits: ''
