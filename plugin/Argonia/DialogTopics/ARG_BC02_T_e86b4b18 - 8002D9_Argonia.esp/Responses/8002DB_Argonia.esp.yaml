Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If that is so, you have done what nobody at this post could do. I will not thank you for it, and I will not weep for him. I am Seven-Floods.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The man is Walks-Far. The younger woman, who nurses my cough, is Mends-Nets.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Rose's heirs hold us, and a fire in the Rose, the old prison where they keep their held, is why they brought us north to this post.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Tsaxi counted us each day, and his word was the only count. Now nobody can swear how many we are. Any one of us could walk out of here.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: So could all three of us. No one is left to say it was wrong. Ask Never-Sold, who keeps the Chainbreakers' house on the north side of the town.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: She knows what that count is worth.
  ScriptNotes: ''
  Edits: ''
