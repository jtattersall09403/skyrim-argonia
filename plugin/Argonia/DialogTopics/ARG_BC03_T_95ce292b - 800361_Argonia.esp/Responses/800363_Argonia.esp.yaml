  Text:
    TargetLanguage: English
    Value: Another way for the eleven. I have looked for one, and I have found none.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: But you speak as if there were one to find, and I find I cannot say you are wrong.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then Ra'Jhan is still short of hands and Thorn is still short of its price. I have two hands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will sign my own season to Ra'Jhan, and the crew are done with me.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The eleven will wait longer than they would have, and that cost is on my hands and on yours. Take this key. It opens the door and the chest.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The crew's tokens are in it, so put them in Heavy-Rope's hand.
  ScriptNotes: ''
  Edits: ''
