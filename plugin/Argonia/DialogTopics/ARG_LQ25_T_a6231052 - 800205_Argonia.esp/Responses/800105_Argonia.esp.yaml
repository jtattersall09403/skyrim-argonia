Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A crocodile lairs in the shallows east of the scaffold, and it has taken one of our rafts. It was a raft, not a person. I thank the Hist for that.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: No raft of this crew goes out while the beast lives, so we have no work at all. I would end it myself, but my hands know the current, not the blade.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go east from here, through the shallows, to where it lairs.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Kill it with a blade if you can stand in the shallows, or with a bow or a spell from the shore, by day, when you can see it plainly.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I do not care how, only that it dies.
  ScriptNotes: ''
  Edits: ''
