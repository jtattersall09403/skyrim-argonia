PreviousDialog: 800270:Argonia.esp
Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I have carried worse than a boat-hand. I have carried it since I was hatched, and I am still on my feet.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then I will take the hundred, and I will strike her leaf with my own hand. Every line on it was true, and I strike it all the same.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The eleven years I write onto my own leaf, with my eyes open. Hear what that costs, so that you do not think it nothing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Whatever any leaf is short at the reckoning is written onto the keeper's own, and I am the keeper.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: If my leaf were ever lost, the hands would share it between them, and I will keep mine where it is. You argued it fairly, and I do not say that often.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go and tell her on the channel bank.
  ScriptNotes: ''
  Edits: ''
