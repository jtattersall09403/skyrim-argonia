Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A cut is done to a tree. A silence is the tree's own. I held them to be one thing, and I do not like to be shown I was wrong.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I will carry it to the interior's tree-minders. They will guard their trees and let no stranger near.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Some of the strangers they turn away will be honest ones in need. I know that cost, and I pay it. There is more.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: When a Hist dies it leaves a Mnemic Egg, a seed of its sap that holds the tree's memories.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The Aldmeri Dominion used one, long ago, to stop a whole generation of eggs hatching. Whoever gathers a living tree's sap may be after such a thing.
  ScriptNotes: ''
  Edits: ''
