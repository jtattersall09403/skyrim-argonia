PreviousDialog: 800289:Argonia.esp
Responses:
- ResponseNumber: 1
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The whole of it, and no first price. Then hear how I wrote it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'Every line on her leaf is true: the four months for the boat, then her food, then a fever. It has outgrown her.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I could not have written it smaller and written it true. Pay it, and I strike it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The estate is paid to the last line, and nobody is short of anything. Nobody carries a month of it, neither I nor the hands.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: That has not happened on this ground in my time. The cost is yours, and it is a great deal for a stranger to set down for a boat-hand.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 6
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I take it because the count is true and it is paid. Tell her it is struck. She stands on the channel bank north of the farm.
  ScriptNotes: ''
  Edits: ''
