  Text:
    TargetLanguage: English
    Value: I found the cut root and hid it. The gum was mine and my knife was gone. Folk in the village would say it was my work.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The black gum is the gum the village's sap-workshop works. The knife-peg by its door is empty. I go down to the cut root after dark to wash it.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: It is under the stilts. Turns-The-Clutch, the egg-tender, keeps the uxith by day. North of the village the reeds open onto the leech water.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Past it, bent reed stems lead to a dry rise beyond the last stilt house. That is all I owe a stranger.
  ScriptNotes: ''
  Edits: ''
