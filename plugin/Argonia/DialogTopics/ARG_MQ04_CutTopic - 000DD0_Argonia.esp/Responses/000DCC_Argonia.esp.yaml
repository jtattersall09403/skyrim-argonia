  Text:
    TargetLanguage: English
    Value: I found the cut root and hid it. I will tell you why, friend. The black gum is the gum the village's sap-workshop works.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The knife-peg by its door is empty. The gum was mine and my knife was gone, so folk in the village would say it was my work. I could not bear that.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: So I go down to the cut root after dark and wash it. It is under the stilts. Turns-The-Clutch, the egg-tender, keeps the uxith by day.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: North of the village the reeds open onto the leech water. Past it, bent reed stems lead to a dry rise beyond the last stilt house.
  ScriptNotes: ''
  Edits: ''
