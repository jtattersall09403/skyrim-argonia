  Text:
    TargetLanguage: English
    Value: Empty, and a lamia keeps it. Then he is not coming, and no one is coming after him. I told myself he was only slow. Give them here.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I cannot read them, so I will not know what you read. If you have not read them, you should have, because they will not be yours after this.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Then the count is mine, and I say one died. One of the three is smoke, and I will say so to the heirs. Choose which, and tell the one you choose.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I ask one thing. Do not tell the Rose he is dead. A man no one has seen dead may still come in.
  ScriptNotes: ''
  Edits: ''
