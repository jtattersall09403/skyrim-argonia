  Text:
    TargetLanguage: English
    Value: There are no jails in Black Marsh. When a person does a wrong, they pay it in work, in nushmeekos.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A nushmeeko is one month of work that nobody thanks you for, and once it is worked off nobody mentions it again. In the south that has gone bad.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Whoever holds the estate or the landing does the reckoning, and he writes food, breakage and sickness onto the months until they never end.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: A person can be born owing and die owing. I was born owing, and I got out. That is why I do what I do.
  ScriptNotes: ''
  Edits: ''
