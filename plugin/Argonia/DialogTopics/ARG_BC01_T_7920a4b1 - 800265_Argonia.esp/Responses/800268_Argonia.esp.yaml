  Text:
    TargetLanguage: English
    Value: Dead. Then nobody knows the way to my tree but me. I did not ask for his death, and I will not call it a pity.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Every runaway he turned back was a head-price to him, and I would have been one more. I will go when you have gone from the bank.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: 'I have been watched for eleven years, and I will not be watched leaving. Take a word to Never-Sold: the leaf can stay in its box and rot.'
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: I am going home, and nothing written on this farm will reach me.
  ScriptNotes: ''
  Edits: ''
