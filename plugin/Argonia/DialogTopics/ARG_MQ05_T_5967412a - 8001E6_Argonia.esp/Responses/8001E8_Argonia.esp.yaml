  Text:
    TargetLanguage: English
    Value: The coast ship lies at Lilmoth's stop on the east side of the town.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Go up to its upper deck and through the inner door, and that door opens on Helstrom's landing.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: From the landing the way runs inland over roots and through shallows.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 4
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: Where it bends, two giant wasps keep the root, unless they have been cleared since. Past them you come to a soldier at the city's gate.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 5
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The grove is just inside, to the west. Ei-Tuja the Nisswo and Kaska-Meen the tree-minder are there. Go alone, and do not name the Reed.
  ScriptNotes: ''
  Edits: ''
