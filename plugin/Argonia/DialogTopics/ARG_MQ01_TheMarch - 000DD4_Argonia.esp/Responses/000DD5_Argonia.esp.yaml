  Text:
    TargetLanguage: English
    Value: Two of us in this gang have been kept from the Hist so long that our colour and markings have thinned. Mine is going.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 2
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The gang families keep a cutting of the Hist from Nine Bends at the camp. Their egg clutch lies at its roots. I cannot stand beside my own Hist, so I want to stand beside the cutting before my colour is gone.
  ScriptNotes: ''
  Edits: ''
- ResponseNumber: 3
  Unknown2: 0x000000
  Unknown3: 0x000000
  Text:
    TargetLanguage: English
    Value: The camp is where the shore path meets the reeds. You will see the huts, the fire and the hatching shed. The shed stands beside the cutting at the far end.
  ScriptNotes: ''
  Edits: ''
