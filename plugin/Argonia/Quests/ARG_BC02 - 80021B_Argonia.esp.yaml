Name:
  TargetLanguage: English
  Value: One Out of the Smoke
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Never-Sold sent me to the heirs' post on Blackrose's east shore, where the heirs of the Rose keep three of their held. One of the three can be got out. She wants the one held for words, not the one held for a killing. I'm to speak to Third-Born Tsaxi, who keeps the post.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Tsaxi can count one of the three lost to the Rose's fire, and no more. Walks-Far and Mends-Nets each claim to be held for words; one killed a man. The leaves that say which are with the Rose's reckoner, lost in the western swamp. I'm to learn who is who, and read the leaves if I find them.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I took the singed leaves from the reckoner's strongbox in the western swamp and read them. Walks-Far is held for words; Mends-Nets drowned Reckoner Otheel and is to be put under, sent down below the Rose where the dead walk; Seven-Floods owes for a roof. Before I choose who goes, I'm to tell Seven-Floods what I read.
- Index: 32
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Seven-Floods what the leaves say. Mends-Nets drowned Otheel for her, after Otheel wrote a third winter on her roof, and Seven-Floods asks me to take Mends-Nets out anyway, before her. Now I'm to choose who goes.
- Index: 35
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Tsaxi round. He will count one of the three lost to the smoke. I'm to tell the one I choose to go.
- Index: 36
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Tsaxi 300 gold. He will count one of the three lost to the smoke. I'm to tell the one I choose to go.
- Index: 37
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gave Tsaxi the reckoner's leaves and told him his hut was empty but for a lamia. He kept them. The count is his now, and he will say one died of the smoke. I'm to tell the one I choose to go.
- Index: 38
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I killed Third-Born Tsaxi at the heirs' post. Nobody is left to keep the three, so any of them can go, or all of them. I'm to tell them.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Walks-Far to go when I had gone. The other two stay. I'm to tell Never-Sold.
- Index: 42
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Mends-Nets to go when I had gone. The other two stay. I'm to tell Never-Sold.
- Index: 43
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Seven-Floods to go when I had gone. She will go to her daughter first. The other two stay. I'm to tell Never-Sold.
- Index: 44
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told all three to go. I'm to tell Never-Sold the post is empty.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Walks-Far came out. Mends-Nets stays, to be put under if her leaf is ever read, and Seven-Floods stays far from her Hist. Never-Sold was pleased and uneasy, paid me 150 gold and said to come back to her for more work.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Mends-Nets came out. Walks-Far stays to work his three seasons, and Seven-Floods stays far from her Hist. Never-Sold said we will be called the people who loose killers, and that it will be true. She paid me 150 gold and said to come back to her for more work.
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Seven-Floods came out, to go to her daughter. Walks-Far stays to work his three seasons, and Mends-Nets stays, to be put under if her leaf is ever read. Never-Sold was silent a while, then kind, paid me 150 gold and said to come back to her for more work.
- Index: 94
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "I told Never-Sold the post is empty. She paid me nothing: the Rose's hunters, short three, will take a clutch-brother of Walks-Far's in their place, and the heirs will not treat with the Chainbreakers again. She said to come back to her for more work all the same."
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold is dead. Nobody will take word of who came out of the post.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Speak to Third-Born Tsaxi, keeper of the heirs' post on Blackrose's east shore.
  Targets:
  - AliasID: 6
  - AliasID: 4
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: "Learn which of the two killed: bring back the reckoner's leaves from his camp in the western swamp, or win the truth from Seven-Floods. Or pay Tsaxi to count one lost without knowing which."
  Targets:
  - AliasID: 8
  - AliasID: 6
  - AliasID: 4
- Index: 30
  DisplayText:
    TargetLanguage: English
    Value: Tell Seven-Floods at the heirs' post what the leaves say, before choosing who goes.
  Targets:
  - AliasID: 4
- Index: 32
  DisplayText:
    TargetLanguage: English
    Value: "Choose who goes, knowing Mends-Nets is the killer and Seven-Floods asks for her: tell one of the three to go while holding the leaves, or first give Tsaxi the leaves or win Tsaxi's word."
  Targets:
  - AliasID: 5
  - AliasID: 3
  - AliasID: 4
  - AliasID: 6
- Index: 35
  DisplayText:
    TargetLanguage: English
    Value: Tell one of the three at the post to go.
  Targets:
  - AliasID: 5
  - AliasID: 3
  - AliasID: 4
- Index: 38
  DisplayText:
    TargetLanguage: English
    Value: Tell one of the three at the post to go, or all of them.
  Targets:
  - AliasID: 5
  - AliasID: 3
  - AliasID: 4
- Index: 41
  DisplayText:
    TargetLanguage: English
    Value: Tell Never-Sold in the Chainbreakers' house who came out.
  Targets:
  - AliasID: 1
- Index: 44
  DisplayText:
    TargetLanguage: English
    Value: Tell Never-Sold in the Chainbreakers' house that the post is empty.
  Targets:
  - AliasID: 1
