Name:
  TargetLanguage: English
  Value: The Word Carried Inland
Flags:
- RunOnce
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The cell cut a Hist's root at Low-Reed Village for its sap, and I saw the cut. I'm to take what I found back to Nesh-Deeka at the fish-trader's house in Lilmoth, which is the Reed's.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The Reed wants the tree-minders and Nisswo of Helstrom to hear what a cut Hist looks like, from someone it can deny, and sends no escort. I'm to board the coast ship at Lilmoth, leave it at Helstrom's landing, and follow the marsh way north-east past the city's gate to the grove behind the Hall of the Scalded Throne.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Behind the hall Kaska-Meen keeps watch in the grove, and at the root's foot a Nisswo, Ei-Tuja, argues with her over what a silent Hist means. Neither has seen a cut root. I'm to tell one of them that a silent Hist and a cut one are two things, and the clutch died of the cut.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "In the grove I told Kaska-Meen what I saw at Low-Reed Village: that a Hist gone silent and a Hist cut at the root are two things, and the clutch died of the cut. She heard me out and will carry it to the interior's tree-minders. The Reed is not named in Helstrom."
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "At the root's foot I told Ei-Tuja what I saw at Low-Reed Village: that a Hist gone silent and a Hist cut at the root are two things, and the clutch died of the cut. He gave his reading freely, as the Nisswo do, and will carry it to the villages he preaches in. The Reed is not named in Helstrom."
