Name:
  TargetLanguage: English
  Value: The River Monster
Flags:
- StartGameEnabled
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A rafter at Helstrom's landing, Okan-Zish, wants the beast under the crew's plank walk killed. I'm to find its lair in the shallows under the walk and kill it, or shoot or burn it from the planks.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "The beast is dead. In its lair in the shallows under the plank walk lies the landing crew's bait bucket, offal in it: the crew's offal drew the beast that has kept traders off the river and off the boat captain's boat. I'm to take the bucket to the boat captain, who stands at Helstrom's north edge west of the levy's gate, or put it to Wuleen-Taza and take the crew's price to keep quiet."
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I showed the boat captain the crew's bait bucket. She paid me for what it showed her, and the crew have lost their trade on the river to her.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Wuleen-Taza paid me to keep the bait to myself. The crew keep their trade, and the boat captain still thinks the river took her customers.
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: The boat captain is dead. There is no one left on the river for the crew's bait to cheat.
