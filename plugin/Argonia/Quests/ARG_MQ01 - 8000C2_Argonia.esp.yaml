Name:
  TargetLanguage: English
  Value: No Name on the Work Roll
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: MainQuest
Stages:
- Index: 10
  Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I woke in the hold of a ship, moored below Hereguard Plantation, west of Lilmoth in Black Marsh, among a gang of Argonians I do not know. I'm to go up the stairs and out of the door to the deck, and speak to the man who stands there.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Buys-The-Months, the broker, holds his gang's Owing, the months of work they owe. I am on no line of his roll, so he will not keep me. He says Nesh-Deeka, a guest at Salts-The-Catch's house south of the second big ship off Lilmoth's dock, pays for work. I'm to find her there, east along the shore.
- Index: 21
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Buys-The-Months, the broker, died on the deck before he had said a word to me. The others on the deck have no help for a stranger. I'm to look for work in Lilmoth, east along the shore.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A woman with a knotted cord killed Nesh-Deeka's courier at the gang's camp the night it burned, took his satchel and let me live. Nesh-Deeka serves the Veiled Reed, the state's quiet service, and wants a hand whose name is on no roll. I'm to hear her out and say whether I will work for the Reed.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I took work with the Veiled Reed, and Nesh-Deeka put fifty gold in my hand. She has told me the first work the Reed wants of me. Why the woman with the knotted cord let me live, I still do not know.
- Index: 96
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka, who led the Veiled Reed's work in Lilmoth, is dead. The Reed has nothing more to ask of me.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Speak to Buys-The-Months on the deck of the ship.
  Targets:
  - {}
- Index: 21
  DisplayText:
    TargetLanguage: English
    Value: Look for work in Lilmoth.
  Targets:
  - AliasID: 2
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Find Nesh-Deeka in Salts-The-Catch's house, south of the second big ship, anchored off Lilmoth's own dock.
  Targets:
  - AliasID: 2
- Index: 30
  DisplayText:
    TargetLanguage: English
    Value: Hear Nesh-Deeka out, then give her an answer on the Veiled Reed's offer.
  Targets:
  - AliasID: 2
