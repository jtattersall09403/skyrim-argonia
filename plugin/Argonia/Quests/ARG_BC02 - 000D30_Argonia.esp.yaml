  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Never-Sold told me the heirs' outer post, the old stone house on the shore at Blackrose's east edge, is burning, with three people the heirs hold inside, Rows-For-Another's mother among them. I'm to get past Third-Born Tsaxi at the stone house's west wall, by talking him round or slipping by, and go inside.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "I'm inside the burning stone house on the shore at Blackrose's east edge. Three people whom the heirs hold are bound inside: Says-It-Plain, held for speaking against the heirs; Hides-In-Reeds, held for a killing; and Keeps-The-Old-Count, Rows-For-Another's mother, held on her Owing. The way out will bear one trip. I'm to choose one and tell them to come with me."
- Index: 31
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Says-It-Plain to come with me. The other two died in the fire. I'm to bring him out of the stone house, past Third-Born Tsaxi.
- Index: 32
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Hides-In-Reeds to come with me. The other two died in the fire. I'm to bring her out of the stone house, past Third-Born Tsaxi.
- Index: 33
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Keeps-The-Old-Count to come with me. The other two died in the fire. I'm to bring her out of the stone house, past Third-Born Tsaxi.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me into the heirs' burning stone house on the shore at Blackrose's east edge, where they held three. I brought Says-It-Plain out; the other two died in the fire. He walked free from the stone house, to speak their names to Never-Sold.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me into the heirs' burning stone house on the shore at Blackrose's east edge, where they held three. I brought Hides-In-Reeds out; the other two died in the fire. She does not deny her killing. She walked free from the stone house, to speak their names to Never-Sold.
- Index: 93
  LogEntries:
