  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A rafter at Helstrom's landing, Okan-Zish, wants the beast under the crew's plank walk killed. I'm to find its lair in the shallows under the walk and kill it, or shoot or burn it from the planks.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "The beast is dead. In its lair in the shallows under the plank walk lies the landing crew's bait bucket: the crew's offal drew the beast. I'm to take the bucket to Sells-Dear, the boat captain, at Helstrom's north edge west of the levy's gate, or put it to Wuleen-Taza and take the crew's price to keep quiet."
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I showed Sells-Dear the crew's bait bucket. She paid me for what I showed her, and the crew have lost their trade on the river to her.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Wuleen-Taza paid me to keep the bait to myself. The crew keep their trade, and Sells-Dear still thinks the beast drove off her customers.
