Name:
  TargetLanguage: English
  Value: A Dry Hand in a Wet City
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Tilts-The-Jug, in the house on Soulrest's dock, wants to see how I work: a dock thief, Keeps-What-Floats, took a necklace of blue jaspers from another thief, and it must come back with no harm done. I'm to follow Keeps-What-Floats on the dock until he goes to bed, or ask Sits-By-The-Water, who drinks with him, where he sleeps."
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Keeps-What-Floats keeps the necklace of blue jaspers on him on the dock by day, at the bench by the water in the evening, and on his bedroll at night. I'm to get it back to Tilts-The-Jug inside Soulrest's house without hurting him, by lifting it by day or while he sleeps, or by talking him out of it.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I brought the necklace of blue jaspers back to Tilts-The-Jug at Soulrest, and Keeps-What-Floats came to no harm. Tilts-The-Jug paid me and gave me three lockpicks. I'm to take the coast ship from Soulrest's dock to Lilmoth, open the locked trapdoor just north of Pusbottom and go down to the Chapter.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I brought the necklace of blue jaspers back to Tilts-The-Jug at Soulrest, but Keeps-What-Floats is dead. Tilts-The-Jug paid me nothing, said the Chapter wanted the necklace without a body, and gave me three lockpicks. I'm to take the coast ship from Soulrest's dock to Lilmoth, open the locked trapdoor north of Pusbottom and go down to the Chapter.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got the necklace of blue jaspers back from Keeps-What-Floats at Soulrest without hurting him, and Tilts-The-Jug paid me. I opened the trapdoor north of Pusbottom with my own hand and went down to the Chapter, and Bent-Spine took me in as a Lookout.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got the necklace of blue jaspers back at Soulrest, but Keeps-What-Floats died for it, and Tilts-The-Jug paid me nothing. I opened the trapdoor north of Pusbottom with my own hand and went down to the Chapter, and Bent-Spine took me in as a Lookout.
