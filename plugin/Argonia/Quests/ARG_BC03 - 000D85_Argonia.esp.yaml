Name:
  TargetLanguage: English
  Value: The Broker's Mercy
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: On Soulrest's open dock the broker Ussa-Rekh, who bought out Owings for thirty years, refused to let Heavy-Rope's crew end their last season early. The crew know me as the Chainbreakers'. I'm to hear Ussa-Rekh and Heavy-Rope on the dock and take one side.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I stood with Heavy-Rope's crew on Soulrest's open dock. Ussa-Rekh keeps their carved tokens in the chest beside him on the dock, and he promised that a crew who break their tokens before him are done with him. I'm to take the tokens from the chest and give them to Heavy-Rope.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I stood with Ussa-Rekh on Soulrest's open dock. Heavy-Rope will not take the refusal from a stranger's mouth. I'm to talk him into taking it, or pay his crew to take it.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "On Soulrest's open dock the broker Ussa-Rekh, who bought out Owings for thirty years and hires out the crews he freed, refused to let Heavy-Rope's crew end their last season early. I stood with the crew: I took their tokens from Ussa-Rekh's chest and gave them to Heavy-Rope, and the crew broke them before him. They are done with him a season early, and he will not hire them again."
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: On Soulrest's open dock the broker Ussa-Rekh, who bought out Owings for thirty years and hires out the crews he freed, refused to let Heavy-Rope's crew end their last season early. I stood with Ussa-Rekh and talked Heavy-Rope into taking the refusal. The crew will work their last season under him.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: On Soulrest's open dock the broker Ussa-Rekh, who bought out Owings for thirty years and hires out the crews he freed, refused to let Heavy-Rope's crew end their last season early. I stood with Ussa-Rekh and paid Heavy-Rope's crew 50 gold to take the refusal. The crew will work their last season under him.
- Index: 94
