Name:
  TargetLanguage: English
  Value: A Dry Hand in a Wet City
Flags:
- StartGameEnabled
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Tilts-The-Jug, inside the house on Soulrest's dock, keeps the Chapter's desk at Soulrest and wants to see how I work. Keeps-What-Floats, a dock thief, took a necklace of polished blue jaspers from another thief, and it must come back with no harm done to him. I'm to follow him on the dock until he goes to his bed for the night, or get out of Sits-By-The-Water, who drinks with him, where he sleeps.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Keeps-What-Floats, who took the necklace of blue jaspers, keeps it on him on the dock by day, at the bench by the water in the evening, and on his bedroll north-west of the house at night. I'm to get the necklace back without hurting him, by lifting it off him by day or while he sleeps, or by talking him out of it, and bring it to Tilts-The-Jug inside Soulrest's house.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I brought the necklace of blue jaspers back to Tilts-The-Jug at Soulrest, and Keeps-What-Floats came to no harm. She paid me and gave me three lockpicks. The Chapter's way down is a locked trapdoor just north of Pusbottom in Lilmoth. I'm to take the coast ship from Soulrest's dock to Lilmoth, open the trapdoor, go down to the Chapter and speak to whoever waits below.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I brought the necklace of blue jaspers back to Tilts-The-Jug at Soulrest, but Keeps-What-Floats is dead. She paid me nothing, and said the Chapter wanted the necklace without a body, but she gave me three lockpicks and sent me on. The Chapter's way down is a locked trapdoor just north of Pusbottom in Lilmoth. I'm to take the coast ship from Soulrest's dock to Lilmoth, open the trapdoor, go down to the Chapter and speak to whoever waits below.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got the necklace of blue jaspers back from Keeps-What-Floats at Soulrest without hurting him, and Tilts-The-Jug paid me. I opened the trapdoor north of Pusbottom with my own hand and went down to the Chapter, and Bent-Spine took me in as a Lookout.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got the necklace of blue jaspers back at Soulrest, but Keeps-What-Floats died for it, and Tilts-The-Jug paid me nothing. I opened the trapdoor north of Pusbottom with my own hand and went down to the Chapter, and Bent-Spine took me in as a Lookout.
