Name:
  TargetLanguage: English
  Value: The Broker's Mercy
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Never-Sold sent me to Soulrest's dock. The Broker, Ussa-Rekh, bought a crew free and keeps a carved token for each until they work a season for him; he has kept them a season more. Never-Sold wants the tokens, and the book on the Broker's shelf with Never-Sold on its spine. I'm to speak to Heavy-Rope by the docks.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Heavy-Rope told me the tokens are in the Broker's chest, in the north one of the three houses by the dock. The old man keeps the key on him, and Feldril Nethri keeps about outside the locked door. The berth-master Ra'Jhan pays for the season when it is sailed. I'm to free the crew by one of the three.
- Index: 21
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Feldril Nethri round. He unbarred the Broker's door for me. I'm to free the crew by the chest, the Broker or the berth-master.
- Index: 22
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Feldril Nethri 30 gold. He unbarred the Broker's door for me. I'm to free the crew by the chest, the Broker or the berth-master.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I took the crew's tokens from Ussa-Rekh's chest. His room was lit and cluttered, a chest, a shelf and three beds, and a book with Never-Sold's name on its spine stood on the shelf. He keeps the eleven names at Thorn on his table, a price beside each. I'm to bring the tokens to Heavy-Rope.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Ra'Jhan into giving up the season. The hire is void. I'm to tell Heavy-Rope.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Ra'Jhan 1,000 gold to give up the season. The hire is void. I'm to tell Heavy-Rope.
- Index: 45
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Ra'Jhan is dead. With the berth-master dead, the hire is void. I'm to tell Heavy-Rope.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Ussa-Rekh round. He let the crew go and will sign his own season to the berth-master. He gave me his key, for the tokens are in his chest. I'm to bring them to Heavy-Rope.
- Index: 51
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Ussa-Rekh the season's hire, 1,000 gold, out of my own purse. He let the crew go. He gave me his key, for the tokens are in his chest. I'm to bring them to Heavy-Rope.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The crew are free of the last season. Heavy-Rope gave me 150 gold of the crew's thanks. I'm to tell Never-Sold how it ended, and bring her the book from the Broker's shelf with her name on its spine.
- Index: 61
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gave Heavy-Rope the crew's tokens and told him the Broker let them go. He gave me 150 gold of the crew's thanks. I'm to tell Never-Sold how it ended, and bring her the book from the Broker's shelf with her name on its spine.
- Index: 62
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Heavy-Rope will sail the last season, for the eleven at Thorn. He chose it himself, and bitterly. I'm to tell Never-Sold how it ended, and bring her the book from the Broker's shelf with her name on its spine.
- Index: 63
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Feldril Nethri took the bar off the Broker's door: with the crew's matter settled, he said, it is no longer his to keep. I'm to bring Never-Sold the book from the Broker's shelf with her name on its spine, and tell her how it ended at the dock."
- Index: 70
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "I told Never-Sold what the Broker's house held: a shack, eleven names at Thorn on his table that his hire was to buy free, and her own name in his book as the keeper of the count at Tulm-Varo. She took the book and answered once, plainly. I'm to tell her how it ended at the dock."
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold the crew are free of the season. The eleven at Thorn have lost the hire that was to buy them out. She gave me lockpicks, named me a full Chainbreaker and said to come back to her for more work.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Ussa-Rekh let the crew go himself, and that somebody paid for it, the old man or my own purse. She went quiet, then said, "He would. That is the worst of him." She gave me lockpicks, named me a full Chainbreaker and said to come back to her for more work.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: 'I told Never-Sold that Heavy-Rope will sail the last season for the eleven at Thorn. The crew lose the ending they were promised. She named me a full Chainbreaker and gave me nothing else: "Eleven. I cannot tell you that you were wrong. I can tell you he will ask again." She said to come back to her for more work.'
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold or Heavy-Rope is dead. The crew have nobody to speak for them now.
