Name:
  TargetLanguage: English
  Value: The Cutters' Jar
Flags:
- RunOnce
Priority: 50
Type: MainQuest
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka gave me the Veiled Reed's first work. Dives-Without-A-Rope, one of the broker's gang, carried off a jar of sap that the cutters dropped at the burnt camp. Nesh-Deeka wants it to learn what the cutters wanted. I'm to ask Dives-Without-A-Rope for the jar in the ship's hold at the pier west of Lilmoth.
- Index: 12
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Dives-Without-A-Rope will not give up the jar. It is sap of her own tree, and she keeps it in her lockbox at the far side of the ship's hold, with the key on her. I'm to take the jar by picking the lock or by taking her key, and bring it to Nesh-Deeka.
- Index: 13
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Dives-Without-A-Rope is dead. Her lockbox is at the far side of the ship's hold, and the key is on her body. I'm to take the jar from the lockbox and bring it to Nesh-Deeka.
- Index: 15
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Dives-Without-A-Rope round. She gave me the key to her lockbox in the ship's hold. She asked me in return to find who cut her tree. I'm to take the jar from the lockbox and bring it to Nesh-Deeka.
- Index: 16
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Dives-Without-A-Rope twenty gold. She gave me the key to her lockbox in the ship's hold. I'm to take the jar from the lockbox and bring it to Nesh-Deeka.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "I tasted the cutters' sap in Salts-The-Catch's house. Nesh-Deeka wrote down what I said under it: a ship's hold with roots through its deck, a door that was never built, a dry voice. She gave me the page and twenty-five gold. She has heard that the Hist of Low-Reed Village, east of Lilmoth, has turned its face."
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka is dead. I will not learn from her what the cutters wanted with the jar.
