Name:
  TargetLanguage: English
  Value: No Name on the Work Roll
Flags:
- RunOnce
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came to in the hold of a broker's barge at Lilmoth's dock, among a gang of debtors who owe the broker months of work. I'm to speak to Wuleen-Sei, the overseer, who keeps the roll of what each of us owes.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gave Wuleen-Sei my answer to the blank line on the roll. I'm to leave the hold by the door at the top of its stairs, onto the pier.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came up out of the hold onto the pier at Lilmoth's dock. I'm to follow the gang along the dock to the fire at the families' camp, where the dock meets the land.
- Index: 32
  LogEntries:
  - Flags: []
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: At the camp's fire a tall Argonian woman with a knotted cord at her wrist killed the courier who walked with us and took his satchel. The camp is burning; I'm to reach Sal-Sei at the hatching shed to the north-east, where the woman's two cutters stand, or Deesh-Duun in the burning huts to the west; I cannot reach both.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I reached the hatching shed. The two cutters have cut the roots that tie the Hist cutting to the clutch, and Sal-Sei is on the ground beside the eggs. I'm to bring Sal-Sei to the shore just west of the camp, past the cutters or out of their sight.
- Index: 42
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I reached Deesh-Duun in the burning huts, under the boards. I'm to bring her to the shore just west of the camp, out of the cutters' sight, or kill them first.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp at Lilmoth's dock with Sal-Sei, the keeper of the clutch. The eggs under the cut roots are dead and the cutting has withdrawn. The roll burned in the fire, so nobody can say what I owe, and nobody can say what I do not.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp at Lilmoth's dock with Deesh-Duun, who saw the woman with the knotted cord as closely as I did. The roll burned in the fire, so nobody can say what I owe.
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp at Lilmoth's dock alone. Sal-Sei and Deesh-Duun are dead. The roll burned in the fire, so nobody can say what I owe.
