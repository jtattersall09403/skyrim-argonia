Name:
  TargetLanguage: English
  Value: A Dead Prisoner's Use
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The camp on Hereguard Plantation's paddy edge is a ruin and I came out of the fire burnt. Two strangers, who say a friend of the courier's sent them, are taking off the hurt. Sap the cutters spilled lies on the shed floor, and the courier Mee-Tuja's brass tag fell through the burnt plank boards at the fire into the deep water. I'm to taste the sap, take a phial of it or dive for the tag in the families' sunk fish-trap and pick the trap's lock, and then tell the stranger on the shore I am ready to go.
- Index: 11
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The strangers took the hurt to a house in Lilmoth that a fish-trader, Salts-The-Catch, keeps. In the back room, behind a screen, a woman who calls herself Nesh-Deeka sits by the mats, and Ties-The-Loose-Plank lies on one of them. Nesh-Deeka is of the Veiled Reed. The roll burnt at the camp, so nobody can show what I owe or that I was on it, and almost no one knows my face. I'm to tell her what I saw, and get Ties to tell it too, then answer her offer of the oath.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I lay down on the mats in the house in Lilmoth with the camp's sap still on my tongue, and dreamed. I stood in fog among a ring of trees whose roots climbed up and up, and at the top was a gap like a door that nobody has built. A dry voice spoke that I could not place. The dream walked me to the door.
- Index: 45
  LogEntries:
  - Flags: []
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "The dream led me to the door, and I woke in the house in Lilmoth. I have taken the Veiled Reed's oath: Nesh-Deeka says no one will come asking what I owe, the house's door is open to me, and she put the first of a stipend in my hand."
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: The dream led me to the door, and I woke in the house in Lilmoth. I have taken no oath. The house's door is not mine, but the Reed will send for me when it has work, and pay for it.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: In the hatching shed at the camp's far end, take a phial of the spilled sap, if I know the craft.
- Index: 11
  DisplayText:
    TargetLanguage: English
    Value: Or dive off the burnt plank boards at the camp's fire, pick the lock of the sunk fish-trap and bring up the courier Mee-Tuja's brass tag.
- Index: 12
  DisplayText:
    TargetLanguage: English
    Value: Having tasted the sap, and holding the phial or the tag, tell the stranger on the shore I am ready to go.
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Tell Nesh-Deeka what I saw at the camp.
- Index: 21
  DisplayText:
    TargetLanguage: English
    Value: "Get Ties-The-Loose-Plank to tell the night too: show him the courier's tag, or talk him round."
- Index: 22
  DisplayText:
    TargetLanguage: English
    Value: Take the Reed's oath, or not yet.
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: Walk the dream to the door at the top of the ring.
