Name:
  TargetLanguage: English
  Value: Four Months for a Boat
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Never-Sold of the Chainbreakers asked me to end Rows-For-Another's Owing on the Tulm-Varo estate: eleven years for one holed boat. She gave me a leaf in her own hand to leave in the count-box for the real one, five lockpicks, and 100 gold, the Owing's first price. I'm to speak to Rows-For-Another on the channel bank north of the farm."
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Rows-For-Another told me what holds her: her leaf in the count-box inside the estate house, whose key the keeper Hulm-Tei wears; Hulm-Tei's word, which could close the Owing; and Brings-Them-Back, the fetcher on the channel north of the bank, who knows the way to her home tree. I'm to break any one of the three."
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "I took Rows-For-Another's leaf from the count-box and left Never-Sold's in its place. Under it lay the keeper's own leaf, with Hulm-Tei's name on it: whatever any leaf comes up short is written onto his. If I hand hers in, her eleven years fall on him. I'm to bring hers to Never-Sold, or give Hulm-Tei back his own."
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Brings-Them-Back round. He will look the other way when Rows-For-Another goes by the channel, but he still knows the way to her home tree. I'm to tell her the channel is clear, unless I end it another way first.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Brings-Them-Back 150 gold, his head-price. He will look the other way when Rows-For-Another goes by the channel, but he still knows the way to her home tree. I'm to tell her the channel is clear, unless I end it another way first.
- Index: 45
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I killed Brings-Them-Back where the channel runs on north of the bank. Nobody living knows the way to Rows-For-Another's home tree now, to fetch her back from it. I'm to tell her the channel is clear, unless I end it another way first.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Rows-For-Another the channel is clear. She will go by it once I have gone, and she gave me a word for Never-Sold. I'm to tell Never-Sold she is going.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I talked Hulm-Tei round. He took the first price, struck Rows-For-Another's leaf and wrote her eleven years onto his own, knowing what he did. I'm to tell Never-Sold.
- Index: 61
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gave Hulm-Tei back his own leaf with the first price. He struck Rows-For-Another's leaf and said the damp had taken his. He leaves the estate at the reckoning, and what she owed will be shared among the hands who stay. I'm to tell Never-Sold.
- Index: 62
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I paid Hulm-Tei the whole of what Rows-For-Another's leaf had grown to, 1,000 gold. He struck her leaf, and nobody carries anything for it. I'm to tell Never-Sold.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I gave Never-Sold Rows-For-Another's leaf, and she will read it aloud and burn it. Rows-For-Another is free; her eleven years fall on Hulm-Tei's leaf, or on every hand of the estate if his leaf is gone too. Never-Sold paid me, named me one of the Chainbreakers and said to come back to her for more work.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Hulm-Tei struck Rows-For-Another's leaf with his own hand. She is free, and what it cost fell where his word put it. Never-Sold paid me, named me one of the Chainbreakers and said to come back to her for more work.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: 'I told Never-Sold that Rows-For-Another has gone by the channel. Her Owing was never closed: it will be written onto the keeper, and the fetcher still knows the way to her home tree, so she can never go back to it. Never-Sold paid me half, named me one of the Chainbreakers and said to come back to her for more work.'
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Never-Sold that Rows-For-Another has gone by the channel. Brings-Them-Back is dead, so nobody can follow her home, and her Owing will be written onto the keeper. Never-Sold paid me in full and named me one of the Chainbreakers, and did not thank me for how. She said to come back to her for more work.
- Index: 94
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I gave Never-Sold Rows-For-Another's leaf, which I had taken from the estate's count-box before she asked me. She will read it aloud and burn it, and the eleven years fall on the estate's keeper. Never-Sold paid me, named me one of the Chainbreakers and said to come back to her for more work.
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold or Rows-For-Another is dead. The Owing cannot be ended now.
