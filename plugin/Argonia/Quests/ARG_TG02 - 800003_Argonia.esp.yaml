Name:
  TargetLanguage: English
  Value: The Drowned Lockbox
Flags:
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Bent-Spine, the Night-Reed Chapter's fence, has work for me now that I am a Lookout. I'm to ask him about it, in the Chapter's inner room under Lilmoth.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A merchant drowned in the deep water north of Pusbottom, and his locked lockbox of pledges lies on the floor. Bent-Spine wants what is in it before three clients on the bank find a diver, and leaves the rest to me; he gave me three lockpicks. I'm to dive to the lockbox, pick its lock and take what is inside.
- Index: 21
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I went back to Bent-Spine for more lockpicks; he gave me three more and said there would be no others. I'm to dive to the lockbox in the deep water north of Pusbottom, pick its lock and take what is inside.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I opened the drowned merchant's lockbox. In it were a worn bone figurine, a Neesak charm (a green scrying crystal in a new silver mount) and Kothringi glass beads, each claimed by one of the three clients on the bank. I'm to give all three to one client, or sell each to the one who claims it.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Neeta-Haj said the bone figurine was carved for her clutch, but it is older than any clutch of hers. When I said so, she bought it for forty gold, its fair price. I'm to sell Okan-Tei the Neesak charm he claims.
- Index: 42
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Okan-Tei said the Neesak charm was only pledged, but no one sets a pledge in a new silver mount. When I said so, he bought it for ninety gold, its fair price. I'm to sell Dar-Zeel the glass beads he claims.
- Index: 43
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Okan-Tei said the Neesak charm was only pledged, but no one sets a pledge in a new silver mount. He haggled, and bought it back for forty-five gold. I'm to sell Dar-Zeel the glass beads he claims.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's figurine, charm and beads from the deep water north of Pusbottom and gave all three to Neeta-Haj on the bank, who paid me a hundred and twenty gold. Okan-Tei and Dar-Zeel will not forget it.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's figurine, charm and beads from the deep water north of Pusbottom and gave all three to Okan-Tei on the bank, who paid me a hundred and twenty gold. Neeta-Haj and Dar-Zeel will not forget it.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's figurine, charm and beads from the deep water north of Pusbottom and gave all three to Dar-Zeel on the bank, who paid me a hundred and twenty gold. Neeta-Haj and Okan-Tei will not forget it.
- Index: 95
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Dar-Zeel said the beads were old family work, but they are Kothringi glass of the kind the old cairns hold. He bought them for fifty-five gold, their fair price. Each of the drowned merchant's three clients has bought back the pledge they lied about, and none of them is pleased with me.
- Index: 96
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Dar-Zeel said the beads were old family work, but they are Kothringi glass of the kind the old cairns hold. He haggled, and bought them back for thirty gold. Each of the drowned merchant's three clients has bought back the pledge they lied about, and none of them is pleased with me.
- Index: 97
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Bent-Spine, the Night-Reed Chapter's fence, is dead, and the job he gave me died with him.
- Index: 98
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: One of the drowned merchant's three clients, Neeta-Haj, Okan-Tei or Dar-Zeel, is dead, and the pledges cannot be settled now. The job for Bent-Spine has come to nothing.
