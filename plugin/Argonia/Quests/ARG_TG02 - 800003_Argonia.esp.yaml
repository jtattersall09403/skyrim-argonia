Name:
  TargetLanguage: English
  Value: The Drowned Lockbox
Flags:
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Bent-Spine, the Night-Reed Chapter's fence, has work for me now that I am a Lookout. I'm to ask him about it, in the Night-Reed Chapter under Lilmoth, down the trapdoor east of Lilmoth.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Bent-Spine told me a merchant drowned in the deep water south-east of the trapdoor east of Lilmoth, and his lockbox of pledges lies on the floor. He wants it emptied before its three clients find a diver, and gave me three lockpicks. I'm to dive to the lockbox, pick its lock and take what is inside.
- Index: 21
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Bent-Spine gave me three more lockpicks and said there would be no others. The lockbox lies on the floor of the deep water a short walk south-east of the trapdoor east of Lilmoth, below the south bank. I'm to dive to it, pick its lock and take what is inside.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: In the drowned merchant's lockbox were a small bee statue, a Neesak charm in new silver and Kothringi glass beads. Neeta-Haj, Okan-Tei and Dar-Zeel each claim one, and each claim is a lie. I'm to give all three to one client, leaving the other two nothing, or sell each back the thing they lied about.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Neeta-Haj said the bee statue was made for her clutch, but it is worn smooth, far older than any clutch of hers. I did not press her on it, and I sold it back to her for twenty gold, half its fair price. I'm to sell Okan-Tei the Newly Mounted Neesak Charm he claims, on the south bank.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Neeta-Haj said the bee statue was made for her clutch, but it is worn smooth, far older than any clutch of hers. When I said so, she bought it for forty gold, its fair price. I'm to sell Okan-Tei the Newly Mounted Neesak Charm he claims, on the south bank.
- Index: 42
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Okan-Tei said the charm was only pledged, but no one sets a pledge in a new silver mount. When I said so, he bought it for ninety gold, its fair price. I'm to sell Dar-Zeel the Kothringi Glass Beads he claims, on the south bank.
- Index: 43
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Okan-Tei said the charm was only pledged, but no one sets a pledge in a new silver mount. I did not press him on it, and I sold it back to him for forty-five gold, half its fair price. I'm to sell Dar-Zeel the Kothringi Glass Beads he claims, on the south bank.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's statue, charm and beads from the deep water east of Lilmoth and gave all three to Neeta-Haj on the bank, who paid me a hundred and twenty gold. She gained all three, and Okan-Tei and Dar-Zeel lost theirs and will not forget who took them. The Chapter has the box off its hands.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's statue, charm and beads from the deep water east of Lilmoth and gave all three to Okan-Tei on the bank, who paid me a hundred and twenty gold. He gained all three, and Neeta-Haj and Dar-Zeel lost theirs and will not forget who took them. The Chapter has the box off its hands.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the drowned merchant's statue, charm and beads from the deep water east of Lilmoth and gave all three to Dar-Zeel on the bank, who paid me a hundred and twenty gold. He gained all three, and Neeta-Haj and Okan-Tei lost theirs and will not forget who took them. The Chapter has the box off its hands.
- Index: 95
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Dar-Zeel said the beads were old family work, but they are Kothringi glass of the kind the old cairns hold. When I said so, he bought them for fifty-five gold, their fair price. Neeta-Haj, Okan-Tei and Dar-Zeel each have their own pledge again, and none was ruined. None of them thanks me for it, but I sold no one's silence.
- Index: 96
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Dar-Zeel said the beads were old family work, but they are Kothringi glass of the kind the old cairns hold. I did not press him on it, and I sold them back to him for thirty gold. Neeta-Haj, Okan-Tei and Dar-Zeel each have their own pledge again, and none was ruined. None of them thanks me for it, but I sold no one's silence.
- Index: 97
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Bent-Spine is dead. He was the Night-Reed Chapter's fence, and the job he gave me ended with him. I will not be paid for the lockbox in the deep water east of Lilmoth.
- Index: 98
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: One of the drowned merchant's three clients on the bank is dead, and the pledges cannot be settled now. The job for Bent-Spine has come to nothing, and I will not be paid for it.
