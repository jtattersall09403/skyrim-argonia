Name:
  TargetLanguage: English
  Value: Four Months for a Boat
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers, in their house in Blackrose, wants Rows-For-Another freed from the estate north of the town, where she has worked the same Owing for eleven years. The steward, Hulm-Tei, keeps the debt book in a locked chest on the landing. I'm to bring Never-Sold the book, or speak to Rows-For-Another after dark, unseen by the estate's men.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me to free Rows-For-Another from the estate north of Blackrose. She will not wait on the steward's book. She is following me from the landing, past the two estate men, down the channel to where it leaves the estate. She cannot drown in it. I'm to take her there tonight.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me to free Rows-For-Another, who took a boat from an estate north of Blackrose on four months' work eleven years ago. I took Hulm-Tei's debt book from his chest on the landing. Never-Sold tore out Rows-For-Another's page and gave it to her, and left the first price, four months' worth in coin, in the steward's chest. She walks off the swamp road free, without her boat.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me to free Rows-For-Another, who took a boat from an estate north of Blackrose on four months' work eleven years ago. She would not wait on the steward's book. After dark I took her past the two estate men and down the channel until it left the estate. She is free and gone. She can never go back to the swamp road.
- Index: 94
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Never-Sold of the Chainbreakers sent me to free Rows-For-Another from the estate north of Blackrose. One of the two women died before Rows-For-Another was free. Never-Sold has no more to ask of me.
