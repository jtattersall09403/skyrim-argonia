Name:
  TargetLanguage: English
  Value: The Tree That Turned Its Face
Flags:
- RunOnce
Priority: 50
Type: MainQuest
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka told me the Hist of Low-Reed Village, a stilt village east of Lilmoth along the shore, has turned its face. She wants to know whether the cutters did this too. I'm to go there and speak to Hires-By-The-Season, the root-herald, who speaks for the village to strangers.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Hires-By-The-Season, the root-herald, told me the Hist of Low-Reed Village shut eleven nights ago and the eggs in its pool died. The village blames the leeches and Pays-Late, the tree-minder, who will not say why he stands on the bank. I'm to get the truth out of him, on the bank under the stilts.
- Index: 21
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Hires-By-The-Season, the root-herald of Low-Reed Village, is dead. Pays-Late, the tree-minder who keeps the village's Hist, stands on the bank under the stilts. I'm to ask him what happened to the tree.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Pays-Late told me what he hid: the Hist's root was cut, its sap drawn off and the cut sealed with his own black gum. He kept quiet, fearing blame. A boat came from the north reeds that night. I'm to cross the leech water to the giant tree's roots past the last stilt house and take the sap back."
- Index: 31
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I threatened to shame Pays-Late before the whole village, and he told me what he hid; he will not forget it. The Hist's root was cut, its sap drawn off and the cut sealed with his own black gum. I'm to cross the leech water to the giant tree's roots past the last stilt house and take the sap back.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I took the jars of Low-Reed Village's sap from two men at the giant tree's roots, jars like the one the cutters dropped at the burnt camp. Pays-Late can pour the sap back at the cut root, or Nesh-Deeka can keep it as proof. I'm to bring the jars to Pays-Late, on the bank under the stilts, and choose.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "I took the jars of Low-Reed Village's sap from two men at the giant tree's roots, jars like the one the cutters dropped at the burnt camp. Since I leaned on Pays-Late, he will not trust me to keep his secret. I'm to bring them to him and choose: back to his tree, or to Nesh-Deeka as proof."
- Index: 46
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I told Pays-Late the jars go to the people I work for, as proof of the cutters' work, and kept them. Low-Reed Village's Hist stays dark while they are gone. I'm to bring them to Nesh-Deeka at Salts-The-Catch's house in Lilmoth, west along the shore.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I gave the jars to Pays-Late and kept his secret. He will pour the sap back at the cut root, and Low-Reed Village will go on blaming him and the leeches. The cutters drew this tree's sap into jars, as they did at the burnt camp. What do they want with it?
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I gave the jars to Pays-Late on one condition, that he tells Hires-By-The-Season himself that he found the cut and hid it, and he gave his word. He will pour the sap back at the cut root. The cutters drew this tree's sap into jars, as they did at the burnt camp. What do they want with it?
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I gave the jars to Nesh-Deeka in Lilmoth, and she paid me fifty gold. She keeps them as proof of the cutters' work, so Low-Reed Village's Hist stays dark and the village still blames Pays-Late. The cutters drew that tree's sap into jars, as they did at the burnt camp. What do they want with it?
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Pays-Late, the tree-minder of Low-Reed Village, is dead. The villagers will not tell a stranger what happened to his tree now.
- Index: 96
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka, the Veiled Reed's handler in Lilmoth, is dead. I cannot report to anyone what I learned at Low-Reed Village.
