Name:
  TargetLanguage: English
  Value: The Tree That Turned Its Face
Flags:
- RunOnce
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The Reed sent me east of Lilmoth to Low-Reed Village, where the Hist has turned its face. The root-herald, on the platform at the Hist's foot, does not like strangers from Lilmoth. I'm to talk her round, or bring her two handfuls of salt, which the villagers cannot make on fresh water, for leave to see the tree.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The tending-ground at Low-Reed Village is closed, the Hist dark and its leaves shut, and the uxith is dark, as it was at the camp. The villagers say the leeches did it. I'm to go down into the water under the stilts, to the tree's lowest root, and see for myself.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A root of the Hist was cut at the ring and sealed with black gum, and the leeches only came to the weeping sap. Pays-Late, the tree-minder, whom the villagers blame, goes down to wash it after dark. I'm to watch him there after dark and lift the pot of gum he carries without his knowing, then show it him, or ask the egg-tender at the uxith by day, and find out who cut it.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A root of Low-Reed Village's Hist was cut and its sap drawn off. I'm to swim the leech water north of the village, follow the bent reeds to the camp on the dry rise, take the jars of the Hist's sap, and pour them back at the cut root under the stilts.
- Index: 45
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I took the jars of the Hist's sap from the cell's camp, and Pays-Late's knife with them. I'm to carry them back across the leech water and pour them out at the cut root under the stilts.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I poured the jars back at the cut root and left Pays-Late's knife with them. The villagers know now that it was strangers' work and not his keeping. The Hist's light is coming back, low and slow. The villagers have taken me in.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Win the root-herald's leave to see the tree.
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Go down among the leeches to the Hist's roots.
- Index: 30
  DisplayText:
    TargetLanguage: English
    Value: Lift Pays-Late's gum pot and put it to him, or learn what the egg-tender saw.
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: Take the jars of sap, and the knife with them, from the camp at the trail's end.
- Index: 45
  DisplayText:
    TargetLanguage: English
    Value: Pour the jars back at the cut root.
