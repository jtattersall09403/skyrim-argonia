Name:
  TargetLanguage: English
  Value: The Gates of Helstrom
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: A woman, Haj-Wan, waits inside Helstrom's basin gate, beside the levy warden Gih-Xaleel, for her kin Sei-Wan, who walked out alone into the basin. He went east through the shallows. I'm to find him.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The viper that kept Sei-Wan pinned among the roots in the basin is dead. I'm to go back west to Helstrom's basin gate, either without a word to him, letting him walk home alone, or after talking to him, bringing him back myself.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I am back at Helstrom's basin gate, and I left Sei-Wan without a word. He walks home alone, and his walk-out is his own.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I talked Sei-Wan into coming home. He knows he was followed, and he will not count the walk-out as his own or look at me.
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Sei-Wan is dead in the basin. His walk-out ended there, and Haj-Wan waits at the gate for no one.
