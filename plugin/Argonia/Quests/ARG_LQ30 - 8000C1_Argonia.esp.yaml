Name:
  TargetLanguage: English
  Value: The Gates of Helstrom
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Haj-Wan, waiting beside Gih-Xaleel, the levy warden at Helstrom's gate, told me her kin Sei-Wan walked out into the basin alone to prove himself to the Agaceph and has not come back. Their custom forbids his own to follow, but not an outsider. I'm to find him up among the roots east of the gate.
- Index: 35
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I found Sei-Wan up on the roots in the shallows east of Helstrom's gate. A viper lies in the roots west of him, between him and the gate, and he will not come down while it lives. I'm to kill the viper.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "The viper in the roots east of Helstrom's gate is dead, and Sei-Wan can come down. Haj-Wan wants him home alive; he wants the walk-out to be his own. I'm to speak to him and choose: talk him home, which costs him the walk-out, or tell him to walk home alone and say nothing at the gate."
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Sei-Wan gave in and said he will come home, though not at my heels, and he will not count the walk-out as his own. Haj-Wan has waited for him since he left. I'm to tell her at Helstrom's gate, back west through the shallows, beside Gih-Xaleel, the levy warden.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Sei-Wan to walk home on his own feet and left him among the roots in the shallows east of Helstrom's gate, and I said nothing of it to Haj-Wan. His walk-out stays his own. Haj-Wan keeps waiting at the gate and knows nothing.
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told Haj-Wan at Helstrom's gate that Sei-Wan is coming home, and she paid me 60 gold. She is glad he lives, and sorry that he lost the walk-out he went into the basin to win. I talked him out of it, and he will not thank me.
- Index: 93
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Sei-Wan, a young Agaceph of Helstrom, is dead in the basin. Whatever Haj-Wan asked of me for him ends with him, and the walk-out is lost to him for good.
- Index: 94
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Haj-Wan, who waited at Helstrom's gate for her kin Sei-Wan, is dead. Whatever she wanted of me ends with her.
