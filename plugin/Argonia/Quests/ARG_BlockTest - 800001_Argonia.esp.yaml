Name:
  TargetLanguage: English
  Value: Block Test
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Index: 10
  Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I am to take the block test on Lilmoth's dock. The Dock Keeper wants a word with me.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The Dock Keeper gave me ten gold and a lockpick, and sent me for the token in the barrel on the dock.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I have the token from the barrel. The Dock Keeper will want it.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gave the Dock Keeper the token. I am one of the dock hands now.
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I am a senior hand. The Dock Keeper says a mudcrab got into the ship, and he has unlocked its door.
- Index: 60
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I killed the mudcrab in the ship.
- Index: 70
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came out of the ship by its door. The Dock Keeper will want to hear the crab is dead.
- Index: 90
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: The Dock Keeper is dead. Nobody else can finish the block test with me.
- Index: 100
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I told the Dock Keeper the crab is dead. I passed the block test.
