Name:
  TargetLanguage: English
  Value: Helstrom Behind Its Marsh
Flags:
- RunOnce
Priority: 50
Type: MainQuest
Stages:
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "At Low-Reed Village I saw what the cutters do: a Hist cut at the root, its eggs dead and its sap drawn into jars. I'm to tell Nesh-Deeka at Salts-The-Catch's house in Lilmoth what I found."
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka told me a silent Hist kills no eggs but a cut one does, and the interior must learn the difference. Its tree-minders and Nisswo, the wandering priests who read the Hist, meet at Helstrom. I'm to go alone without naming the Reed and take the coast ship from Lilmoth's stop to Helstrom's river landing.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came ashore at Helstrom's river landing. In the grove inside the gate, Ei-Tuja, a Nisswo, would preach my word in every village; Kaska-Meen, a tree-minder who hears few strangers, would carry it to the tree-minders alone. I'm to tell Ei-Tuja what I saw at Low-Reed Village, or ask him about Kaska-Meen.
- Index: 45
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Ei-Tuja says Kaska-Meen hears few strangers, and he will not speak for me. I'm to talk her round myself, in the grove just inside Helstrom's gate, and tell her what I saw at Low-Reed Village.
- Index: 46
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: What I saw at Low-Reed Village will not reach Kaska-Meen through me. Ei-Tuja, the Nisswo, hears anyone. I'm to tell him, in the grove just inside Helstrom's gate.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: 'I told Kaska-Meen what I saw at Low-Reed Village, and the tree-minders will hear it from her and shut their trees to strangers. She told me what a dying Hist leaves: a Mnemic Egg, a seed of its sap holding its memories, once used to stop a generation of eggs hatching. Is that what the cutters are gathering sap for?'
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: 'I told Ei-Tuja what I saw at Low-Reed Village, and he will preach it openly in every village he walks to. He told me what a dying Hist leaves: a Mnemic Egg, a seed of its sap holding its memories, once used to stop a generation of eggs hatching. Is that what the cutters are gathering sap for?'
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Nesh-Deeka, the Veiled Reed's handler in Lilmoth, is dead. I cannot report to anyone what the Reed wanted said in Helstrom.
- Index: 96
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Ei-Tuja, the Nisswo who heard anyone and would have carried my word to the villages, is dead. What I saw at Low-Reed Village goes no further in Helstrom.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Tell Nesh-Deeka at Salts-The-Catch's house in Lilmoth what happened at Low-Reed Village.
  Targets:
  - AliasID: 4
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Board the coast ship at Lilmoth's stop and go ashore by its door to Helstrom's landing.
  Targets:
  - AliasID: 5
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: Tell Ei-Tuja, in the grove past Helstrom's gate, what you saw at Low-Reed Village.
  Targets:
  - AliasID: 3
- Index: 45
  DisplayText:
    TargetLanguage: English
    Value: Persuade Kaska-Meen to hear what you saw at Low-Reed Village (Speech 25).
  Targets:
  - AliasID: 2
- Index: 46
  DisplayText:
    TargetLanguage: English
    Value: Tell Ei-Tuja, in the grove past Helstrom's gate, what you saw at Low-Reed Village.
  Targets:
  - AliasID: 3
