Name:
  TargetLanguage: English
  Value: A Dead Prisoner's Use
Flags:
- RunOnce
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came out of the fire at Lilmoth's dock camp. Two strangers on the shore west of the camp are taking off the hurt. Sap lies in the hatching shed, and the courier Mee-Tuja's brass tag fell into the families' fish-trap. I'm to taste the sap, take the tag if I can, and tell the stranger I am ready.
- Index: 11
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The strangers took the hurt to a house in Lilmoth that a fish-trader, Salts-The-Catch, keeps. In the back room a woman who calls herself Nesh-Deeka, of the Veiled Reed, sits by the mats, and Ties-The-Loose-Plank lies on one. The roll burnt. I'm to tell Nesh-Deeka what I saw, and hear her offer of the Reed's oath.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I lay down on the mats in the house in Lilmoth with the camp's sap still on my tongue, and dreamed. I stood in the barge's hold again, empty now, with roots grown up through its deck, and the door at the top of the stairs stood where it had. I'm to walk to the door.
- Index: 45
  LogEntries:
  - Flags: []
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "I walked to the door in the dream, and I woke in the house in Lilmoth. I have taken the Veiled Reed's oath: Nesh-Deeka says no one will come asking what I owe, the house's door is open to me, and she put the first of a stipend in my hand."
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I walked to the door in the dream, and I woke in the house in Lilmoth. I have taken no oath. I have no place in the Reed's house, but Nesh-Deeka will send for me when the Reed has work, and pay for it.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Taste the spilled sap on the floor of the hatching shed.
  Targets:
  - AliasID: 2
- Index: 11
  DisplayText:
    TargetLanguage: English
    Value: Dive under the burnt boards by the fire, pick the lock of the sunk fish-trap and take Mee-Tuja's brass tag.
  Targets:
  - AliasID: 7
- Index: 12
  DisplayText:
    TargetLanguage: English
    Value: Tell the stranger on the shore the time has come to go.
  Targets:
  - {}
- Index: 13
  DisplayText:
    TargetLanguage: English
    Value: (Optional) Bottle a phial of the sap (Alchemy 25).
  Targets:
  - AliasID: 2
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Tell Nesh-Deeka what happened at the camp.
  Targets:
  - AliasID: 3
- Index: 21
  DisplayText:
    TargetLanguage: English
    Value: (Optional) Get Ties-The-Loose-Plank to tell the night too (the courier's tag, or Speechcraft 25).
  Targets:
  - AliasID: 5
- Index: 22
  DisplayText:
    TargetLanguage: English
    Value: Answer Nesh-Deeka's offer of the Reed's oath.
  Targets:
  - AliasID: 3
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: Walk to the door at the top of the barge hold's stairs.
  Targets:
  - AliasID: 8
