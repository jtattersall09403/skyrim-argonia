Name:
  TargetLanguage: English
  Value: The River Monster
Flags:
- StartGameEnabled
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: At Helstrom's landing, Okan-Zish of the landing crew told me a crocodile lairs in the shallows off the end of the crew's plank walk. It took one of their rafts, and no raft has gone out since. I'm to kill it; the plank walk runs east along the shore from the stone tower where he stands.
- Index: 30
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The crocodile in the shallows off the end of the plank walk at Helstrom's landing is dead. I'm to tell Okan-Zish, the rafter of the landing crew who wanted it gone; he stands by the stone tower at the landing, beside the plank walk.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "Okan-Zish admitted the beast was the crew's doing: Wuleen-Taza dumped offal off the end of the plank walk to scare traders off Sells-Dear's boat, and it drew a real crocodile. The crew left their bait bucket there. I'm to fetch it for Sells-Dear, the boat captain, which costs the crew their trade, or take Wuleen-Taza's price to keep quiet."
- Index: 50
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I have the crew's bait bucket, still sour with offal. I'm to show it to Sells-Dear, the boat captain, by a house door on the west side of Helstrom's street north of the landing, and the crew lose their trade; or take Wuleen-Taza's price by the bridge and keep quiet.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "I showed Sells-Dear, the boat captain, the crew's bait bucket. She kept it and paid me 60 gold, and with the rafters' trick known the river trade is hers. The landing crew have lost it: no trader hires their rafts now, and Okan-Zish and Wuleen-Taza have no work at the landing."
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: Wuleen-Taza paid me 60 gold to say nothing of the bait. The crew keep their trade and their rafts are on the river again, but I took coin to hide a trick that drew a real beast to their own plank walk, and Sells-Dear, the boat captain, still thinks the crocodile came up the river on its own.
- Index: 93
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Okan-Zish, a rafter of Helstrom's landing crew, is dead. What the crew asked of me ends with him.
- Index: 94
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Sells-Dear, the boat captain of Helstrom, is dead. What was asked of me at the landing ends with her.
- Index: 95
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: Wuleen-Taza, a rafter of Helstrom's landing crew, is dead. What was asked of me at the landing ends with her.
