Name:
  TargetLanguage: English
  Value: The Drowned Lockbox
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I'm in the Night-Reed Chapter now, under Pusbottom in Lilmoth. Bent-Spine, the Chapter's fence, wants the lockbox of a merchant whose stilt house fell into the deep water just north of Pusbottom, by the Chapter's trapdoor; it lies locked on the floor beside the house, and ripper eels hunt the water. Three clients on the bank want it. I'm to talk to each of them, Neeta-Haj, Okan-Tei and Dar-Zeel, and get out of each what they claim the box holds for them.
- Index: 21
  LogEntries:
  - Flags: []
- Index: 22
  LogEntries:
  - Flags: []
- Index: 23
  LogEntries:
  - Flags: []
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Neeta-Haj says the bone figurine in the lockbox was carved for her clutch, Okan-Tei that the charm was only pledged and never sold, and Dar-Zeel that the beads are old family work. The box lies locked on the floor of the deep water north of Pusbottom beside the fallen stilt house, and ripper eels hunt the water. I'm to swim down to it, slip past the eels, pick its lock and take the figurine, the charm and the beads, then settle it on the bank, by handing all three things to one client or by selling each client the thing they claimed.
- Index: 43
  LogEntries:
  - Flags: []
- Index: 44
  LogEntries:
  - Flags: []
- Index: 45
  LogEntries:
  - Flags: []
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the lockbox's figurine, charm and beads from the deep water north of Pusbottom, past the ripper eels, and gave all three to one of the clients on the bank, who paid me for them. The other two will not forget it.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the lockbox's figurine, charm and beads from the deep water north of Pusbottom, past the ripper eels, and sold each client the thing they claimed. Neeta-Haj, Okan-Tei and Dar-Zeel paid, and none of them will greet me kindly again.
- Index: 92
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: With one of Neeta-Haj, Okan-Tei or Dar-Zeel dead before I had settled with them, the lockbox's pledges cannot be settled, and the job for Bent-Spine has come to nothing.
Objectives:
- Index: 20
