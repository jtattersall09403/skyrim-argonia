Name:
  TargetLanguage: English
  Value: The Word Carried Inland
Flags:
- RunOnce
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The cell cut a Hist's root at Low-Reed Village for its sap, and I saw the cut. I'm to take what I found back to Nesh-Deeka at the fish-trader's house in Lilmoth, which is the Reed's.
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: "The Reed wants the tree-minders and Nisswo of Helstrom to hear what a cut Hist looks like, from someone the Reed can deny; it sends no escort. I'm to take the coast ship at Lilmoth's stop: one of its doors opens on Helstrom's river landing. From the landing I'm to follow the marsh way north-east, root and shallows, past the gate at the city's edge to the grove behind the Hall of the Scalded Throne."
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Behind the hall Kaska-Meen keeps her watch in the grove, and at the root's foot a Nisswo, Ei-Tuja, argues with her over what a silent Hist means. Neither has seen a cut root. I saw one. I'm to tell one of them that a Hist gone silent and a Hist cut at the root are two things, and the clutch died of the cut. The Hall of the Scalded Throne, by the first street on the left inside the gate, has a plain seat of root and reed, with no dais, swept with a broom, and people sell goods in the room before it.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "In the grove I told Kaska-Meen what I saw at Low-Reed Village: that a Hist gone silent and a Hist cut at the root are two things, and the clutch died of the cut. She heard me out and will carry it to the interior's tree-minders. The Reed is not named in Helstrom."
- Index: 92
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: "At the root's foot I told Ei-Tuja what I saw at Low-Reed Village: that a Hist gone silent and a Hist cut at the root are two things, and the clutch died of the cut. He gave his reading freely, as the Nisswo do, and will carry it to the villages he preaches in. The Reed is not named in Helstrom."
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: Take what I found back to Nesh-Deeka and hear what she wants done with it.
- Index: 20
  DisplayText:
    TargetLanguage: English
    Value: Take the coast ship's door at Lilmoth's stop to Helstrom's landing, and follow the marsh way to the grove behind the Hall of the Scalded Throne.
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: In the grove behind the hall, tell Kaska-Meen or Ei-Tuja that a cut Hist is not a silent one.
