Name:
  TargetLanguage: English
  Value: The Drowned Lockbox
Flags:
- RunOnce
Priority: 50
Type: SideQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 20
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I'm in the Night-Reed Chapter now, under Pusbottom in Lilmoth. Bent-Spine, the Chapter's fence, wants the lockbox of a merchant that lies in the deep water north of Pusbottom, where ripper eels hunt. Three clients on the bank want it. I'm to talk to Neeta-Haj, Okan-Tei and Dar-Zeel, and get out of each what they claim the box holds.
- Index: 21
  LogEntries:
  - Flags: []
- Index: 22
  LogEntries:
  - Flags: []
- Index: 23
  LogEntries:
  - Flags: []
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: Neeta-Haj says the bone figurine in the lockbox was carved for her clutch, Okan-Tei that the charm was only pledged, Dar-Zeel that the beads are old family work. I'm to swim down past the ripper eels, pick the box's lock, take all three, and settle it on the bank, all to one client or each thing to its claimant.
- Index: 43
  LogEntries:
  - Flags: []
- Index: 44
  LogEntries:
  - Flags: []
- Index: 45
  LogEntries:
  - Flags: []
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the lockbox's figurine, charm and beads from the deep water north of Pusbottom, past the ripper eels, and gave all three to one of the clients on the bank, who paid me for them. The other two will not forget it.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I brought up the lockbox's figurine, charm and beads from the deep water north of Pusbottom, past the ripper eels, and sold each client the thing they claimed. Neeta-Haj, Okan-Tei and Dar-Zeel paid, and none of them will greet me kindly again.
- Index: 92
  LogEntries:
  - Flags:
    - FailQuest
    Entry:
      TargetLanguage: English
      Value: With one of Neeta-Haj, Okan-Tei or Dar-Zeel dead before I had settled with them, the lockbox's pledges cannot be settled, and the job for Bent-Spine has come to nothing.
