Name:
  TargetLanguage: English
  Value: No Name on the Work Roll
Priority: 60
Type: MainQuest
Stages:
- Flags:
  - StartUpStage
  LogEntries:
  - Flags: []
- Index: 10
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I came to in the hold of a broker's barge at Lilmoth's dock, among an Owing gang. Wuleen-Sei, the overseer, is reading the roll aloud, each name, the months owed and the months added for food, and my line is blank. I'm to answer her when she reaches it, then follow Wuleen-Sei up the plank, past Buys-The-Months, the broker on the pier, and north and west along the shore path to the families' camp at the edge of Hereguard Plantation, to the camp's fire.
- Index: 40
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: As Wuleen-Sei read the roll at the camp's fire, in sight of the families' Hist cutting and the shed that holds their clutch, naming Sal-Sei, keeper of the clutch, and Deesh-Duun aloud, a tall Argonian woman with a knotted cord at her wrist came in off the water with two of her people, killed Mee-Tuja, the quiet man who walked with us, at the fire, took his satchel and looked at me, and left. In the struggle his strap with a brass tag was torn off and fell through the burnt boards into the deep water. The roll went into the fire. Her people are at the cutting and the huts are burning. Sal-Sei is at the shed and Deesh-Duun is hiding from the blades in the huts. I'm to reach one of them; I cannot reach both.
- Index: 41
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I ran for the hatching shed at the camp on Hereguard Plantation's paddy edge. Two of the woman's people have cut the roots that tie the cutting to the clutch, and Sal-Sei is on the ground beside the eggs. Behind me the huts have fallen in where Deesh-Duun was. I'm to drive the cutters off, or hide in the reeds until they leave, and get Sal-Sei out through the reeds to the shore.
- Index: 42
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I went into the burning huts at the camp on Hereguard Plantation's paddy edge and pulled Deesh-Duun out through the deep water under the plank boards. She saw the woman with the knotted cord as closely as I did. From the water I can hear the cutters on the plank boards over us, walking from the shed to the water's edge where they came in, and Sal-Sei has not come out. I'm to bring Deesh-Duun south under the plank boards to the shore below the camp, keeping out of the cutters' sight until they are gone, or kill them first.
- Index: 90
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp on Hereguard Plantation's paddy edge with Sal-Sei, the clutch-keeper. The eggs under the cut roots are dead and the cutting has withdrawn. The roll burned in the fire, so nobody can say what I owe, and nobody can say what I do not.
- Index: 91
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp on Hereguard Plantation's paddy edge with Deesh-Duun, who saw the woman with the knotted cord as closely as I did. The roll burned in the fire, so nobody can say what I owe.
- Index: 93
  LogEntries:
  - Flags:
    - CompleteQuest
    Entry:
      TargetLanguage: English
      Value: I got out of the burning camp on Hereguard Plantation's paddy edge alone. Sal-Sei and Deesh-Duun are dead. The roll burned in the fire, so nobody can say what I owe.
Objectives:
- Index: 10
  DisplayText:
    TargetLanguage: English
    Value: In the barge's hold, answer Wuleen-Sei when she reads the blank line (give a name, say nothing or tell her what she can do with it), then follow her up the plank and along the shore path to the fire in the middle of the camp.
- Index: 40
  DisplayText:
    TargetLanguage: English
    Value: "Reach one of the two before the fire does: Sal-Sei at the hatching shed at the camp's far end, past the two cutters, or Deesh-Duun in the burning huts, diving under the plank boards to reach her."
- Index: 41
  DisplayText:
    TargetLanguage: English
    Value: At the hatching shed, fight off the two cutters or hide in the reeds until they leave, and bring Sal-Sei south through the reeds to the shore below the camp.
- Index: 42
  DisplayText:
    TargetLanguage: English
    Value: Bring Deesh-Duun out of the burning huts and south through the deep water under the plank boards to the shore below the camp, out of the cutters' sight or past their bodies.
