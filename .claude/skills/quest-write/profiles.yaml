# Action-plan weights per line (principles/actions.md, "Profiles"). One entry per `quest_line` row (key = the line
# id's last part), the planned detectives' line (decision 0025), `local` and `default`. Each is read from the line's
# section of story/design/quests/40-factions.md (or its line story under story/design/quests/lines/) and its faction
# culture sheet, cited in `from`. `families` weigh first (shared by their skills), then `skills` within them (keys of
# skill-uses.yaml; 1 = default, 3 = strong lean, 0 = never; unlisted = 1). A line's signature skills are the ones it
# leans on most; a player should tell the faction from any three of its quests. The armour skills (`endure`) stay low:
# a quest uses them through the fights it sends the player into. `targets` and `settings` (keys of skill-uses.yaml)
# are favoured, never required. A local quest takes `local` and leans by its place.

default:
  families: {endure: 0.3}

local:
  from: "lines.json quest.line.local; 00-overview §4 (S-tier texture: mundane but one memorable thing)"
  families: {speech: 1.2, endure: 0.3}

main:
  from: "owner-bar (any build finishes the main quest, by two ways on different skills); 30-main-quest.md (per-act physical minimum); culture.faction.veiled-reed"
  faction: faction.veiled-reed
  families: {stealth: 1.3, speech: 1.2, combat: 1.2, magic: 1.2, craft: 1, endure: 0.3}
  skills: {sneak: 1.5, lockpicking: 1.3, speech: 1.3, alchemy: 1.2}
  settings: [household, ruin, underwater]

