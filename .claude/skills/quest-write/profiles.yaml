  from: "30-main-quest.md (per-act physical minimum); culture.faction.veiled-reed (nothing written that need not be)"
  faction: faction.veiled-reed
  families: {stealth: 1.5, traversal: 1.5, speech: 1.2, combat: 1.2, magic: 1, endure: 0.3}
  skills: {sneak: 2, athletics: 2, speechcraft: 1.5}
  settings: [underwater, night, boat]

