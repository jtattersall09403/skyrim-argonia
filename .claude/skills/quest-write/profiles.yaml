# Action-plan weights per questline (decision 0024 §9; principles/actions.md). One entry per line in
# world/sources/quests/lines.json (key = the line id's last part), plus the planned detectives' line (0025)
# and `default`. Each entry is read from the line's section of docs/design/quests/40-factions.md (premise,
# quest table, set pieces) and its faction culture sheet (world/sources/dialogue/cultures/factions/), cited in
# `from`. `families` weigh first (shared by their skills), then `skills` within them (1 = default, 3 = strong
# lean, 0 = never; unlisted = 1). `endure` (armour skills) stays low: a quest uses them through where it sends
# the player. `targets` and `settings` (keys of skill-uses.yaml) are favoured, never required.
# A local quest (line `local`) takes `default` and leans by its place (danger band, water, heights, work).

default:
  families: {endure: 0.3}

local:
  from: "lines.json quest.line.local; 00-overview §4 (S-tier texture: mundane but one memorable thing)"
  families: {speech: 1.2, endure: 0.3}

