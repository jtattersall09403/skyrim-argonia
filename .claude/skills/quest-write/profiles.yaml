# Action-plan weights per line (principles/actions.md, "Profiles"). One entry per `quest_line` row (key = the line
# id's last part), `local` and `default`. Each is read from the line's plot under story/design/quests/lines/ and the
# owner's words on its skills in docs/phases/nw-05c-factions-overhaul.md, cited in `from`. `families` weigh first (shared by their skills), then `skills` within them (keys of
# skill-uses.yaml; 1 = default, 3 = strong lean, 0 = never; unlisted = 1). A line's signature skills are the ones it
# leans on most; a player should tell the faction from any three of its quests. The armour skills (`endure`) stay low:
# a quest uses them through the fights it sends the player into. `targets` and `settings` (keys of skill-uses.yaml)
# are favoured, never required. A local quest takes `local` and leans by its place.

default:
  families: {endure: 0.3}

local:
  from: "lines.json quest.line.local (mundane but one memorable thing)"
  families: {speech: 1.2, endure: 0.3}

main:
  from: "owner-bar (any build finishes the main quest, by two ways on different skills); story/design/quests/lines/main-plot.md"
  faction: faction.toh-reel-ka
  families: {stealth: 1.3, speech: 1.2, combat: 1.2, magic: 1.2, craft: 1, endure: 0.3}
  skills: {sneak: 1.5, lockpicking: 1.3, speech: 1.3, alchemy: 1.2}
  settings: [household, ruin, underwater]

daedric:
  from: "lines.json quest.line.daedric (the WONDER seam)"
  families: {magic: 2.5, speech: 1, combat: 0.8, craft: 1, endure: 0.3}
  skills: {conjuration: 2, alteration: 2, enchanting: 1.5, illusion: 1.5}
  targets: [daedra, undead-and-spirits]
  settings: [ruin, height, underwater]

shadowscales:
  from: "story/design/quests/lines/shadowscales.md (writs, bonus conditions reward discovery and restraint); nw-05c (sneak, lockpicking, archery, one-handed, light armour, illusion)"
  faction: faction.shadowscales
  families: {stealth: 3, combat: 2, magic: 1.2, craft: 1, speech: 0.8, endure: 0.3}
  skills: {sneak: 3, one-handed: 2, archery: 2, illusion: 2, alchemy: 1.5, two-handed: 0.3, heavy-armor: 0.2}
  targets: [people]
  settings: [household, height, crowd]

eelskins:
  from: "story/design/quests/lines/thieves.md (the Eelskins: a first heist, preparations, the great heist); nw-05c (sneak, pickpocket, lockpicking, speech, enchanting)"
  faction: faction.eelskins
  families: {stealth: 3, speech: 1.5, craft: 1.2, magic: 0.5, combat: 0.3, endure: 0.2}
  skills: {lockpicking: 3, pickpocket: 3, sneak: 3, speech: 1.5, enchanting: 1.5}
  targets: [people]
  settings: [household, height, underwater, crowd]

chainbreakers:
  from: "story/design/quests/lines/chainbreakers-newworld.md §1 ('Their skills': every combat skill, Sneak and Lockpicking, and Speech used only to intimidate)"
  faction: faction.chainbreakers
  families: {stealth: 3, combat: 2.5, speech: 1, magic: 0.5, craft: 0.5, endure: 1}
  skills: {lockpicking: 3, sneak: 3, one-handed: 2, two-handed: 2, archery: 2, block: 2, heavy-armor: 1, speech: 1}
  targets: [people, undead-and-spirits]
  settings: [household, crowd, ruin]

lampbearers:
  from: "story/design/quests/lines/lamps.md (the Lampbearers' cases, rivals of the Eelskins and the Shadowscales); nw-05c (speech, sneak, lockpicking, illusion); principles/investigation.md"
  faction: faction.lampbearers
  families: {speech: 3, stealth: 2, craft: 1.5, magic: 1.2, combat: 0.7, endure: 0.2}
  skills: {speech: 3, sneak: 2, pickpocket: 1.5, lockpicking: 1.5, alchemy: 1.5, illusion: 1.5}
  targets: [people]
  settings: [household, crowd, ruin]

sisei-xul:
  from: "story/design/quests/lines/sisei-xul.md (healing and poisons, the Hist and the dead staked); nw-05c (alchemy, smithing, enchanting, alteration, restoration, maybe destruction)"
  faction: faction.sisei-xul
  families: {craft: 3, magic: 2, stealth: 1, combat: 0.8, speech: 0.8, endure: 0.3}
  skills: {alchemy: 3, restoration: 2.5, alteration: 2, enchanting: 2, smithing: 1.5, destruction: 1.2}
  targets: [undead-and-spirits, beasts]
  settings: [ruin, underwater, open-ground]

house-cardruhn:
  from: "story/design/quests/lines/house-cardruhn.md (tomb raids and the dead raised); nw-05c (conjuration, restoration's necromantic healing and anti-undead, enchanting, destruction)"
  faction: faction.house-cardruhn
  families: {magic: 3, craft: 1.2, stealth: 1, combat: 0.8, speech: 0.8, endure: 0.2}
  skills: {conjuration: 3, restoration: 2, enchanting: 2, destruction: 2}
  targets: [undead-and-spirits, people]
  settings: [ruin, household]

brammans-brethren:
  from: "story/design/quests/lines/pirates.md (boardings, wreck dives and the raid on Gideon); nw-05c (pure combat, light and heavy armour, water scrolls, mayhem and frenzy)"
  faction: faction.brammans-brethren
  families: {combat: 3, endure: 1, magic: 0.8, stealth: 0.8, speech: 0.6, craft: 0.4}
  skills: {one-handed: 2.5, two-handed: 2, archery: 2, block: 2, light-armor: 1.5, heavy-armor: 1.5, illusion: 1.2}
  targets: [people]
  settings: [underwater, open-ground, odds]

topal-bay-company:
  from: "story/design/quests/lines/merchants.md (trade, smithing goods, guarding shipping, taking down smugglers); nw-05c (speech, heavy armour, smithing, block, one- and two-handed)"
  faction: faction.topal-bay-company
  families: {combat: 2, speech: 2, craft: 2, endure: 1, stealth: 0.6, magic: 0.4}
  skills: {speech: 2.5, smithing: 2.5, block: 2, one-handed: 2, two-handed: 1.5, heavy-armor: 1.5}
  targets: [people, beasts]
  settings: [open-ground, household, odds]
