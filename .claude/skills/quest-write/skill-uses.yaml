# The skill-use catalogue: what a quest asks the player to DO, by Skyrim's eighteen skills and Mysticism (Magic
# Expanded), each use one the quest form can deliver (docs/design/quest-form.md; principles/general.md, "What a quest
# may use"). A quest's actions are drawn from here, so they use and build the player's real skills. Variety comes
# from crossing a use with a target and a setting.
#
#   skills:     skill -> family, uses, and `system` (the key in `systems` below that delivers it)
#   systems:    how the game delivers each kind of use, and the quest form's terms that read it
#   uses:       use -> `world`: what the world must hold for it (each becomes a `things` or `placements` row)
#   movement:   words that are movement, not skills (swimming, climbing): an action on one is a supporting act
#   supporting: acts with no skill (reading, handing over, going through a door); a stage may list them as
#               `{system: ..., use: ...}` beside its skill actions; they never stand alone
#   verbTags:   the dramatic centrepiece tags (story/design/quests/00-overview.md §4, "Dramatic register") -> the uses
#               that make a stage carry that tag. A record's `centrepiece` is one of these.

aliases:   # a record's skill word, lower case with letters only -> the key below
  onehanded: one-handed
  twohanded: two-handed
  heavyarmor: heavy-armor
  lightarmor: light-armor
  # older words in records written before the catalogue took Skyrim's names (remove when no record uses them)
  speechcraft: speech
  mercantile: speech
  security: lockpicking
  marksman: archery
  longblade: one-handed
  shortblade: one-handed
  axe: one-handed
  bluntweapon: one-handed
  spear: one-handed
  armorer: smithing
  enchant: enchanting

movement: [athletics, acrobatics, swimming, swim, climbing, climb]

targets:   # who or what a combat, stealth or magic use is aimed at; the danger band comes from the place
  vermin: [rats in the meal sacks, mudcrabs on a landing, a nest of fleshflies]
  beasts: [a hackwing, a wamasu, a pack of nix-hounds, a giant snapping turtle, a crocodile that holds a bend]
  people: [bandits on a road, a deserter, a fetcher paid to bring runaways back, a rival crew, a duellist, pirates, Naga raiders, a broker's enforcer]
  undead-and-spirits: [a restless ancestor, a Kothringi revenant, a staked corpse that will not stay down]
  daedra: [a summoned scamp, a Daedric guardian, a bound servant gone loose]
  bosses: [a warlord, a creature that guards a ruin, a named antagonist]

settings:   # where; action_plan.py picks only settings a use allows (settingsFor)
  open-ground: on open ground
  underwater: in a flooded ruin or under deep water
  height: high up (a roof, a ledge, a ruin's upper floor)
  ruin: in a cave or ruin
  household: inside a house or store, under the household's eyes
  crowd: in a market or among people
  odds: outnumbered, or one against one

skills:
  # combat
  one-handed:  {family: combat, system: combat, uses: [fight, duel, clear-a-place, hunt, sneak-attack]}
  two-handed:  {family: combat, system: combat, uses: [fight, duel, clear-a-place, hunt]}
  archery:     {family: combat, system: combat, uses: [fight, snipe, hunt, kill-from-range]}
  block:       {family: combat, system: combat, uses: [duel, stand-a-hard-fight]}
  heavy-armor: {family: endure, system: combat, uses: [stand-a-hard-fight]}
  light-armor: {family: endure, system: combat, uses: [stand-a-hard-fight]}
  # magic
  destruction: {family: magic, system: combat, uses: [fight, kill-from-range, clear-a-place]}
  restoration: {family: magic, system: combat, uses: [turn-the-dead, stand-a-hard-fight]}
  alteration:  {family: magic, system: magic, uses: [water-breathe, detect-life, telekinesis]}
  conjuration: {family: magic, system: combat, uses: [summon-help, banish, soul-trap]}
  illusion:    {family: magic, system: magic, uses: [calm, frenzy, become-invisible]}
  mysticism:   {family: magic, system: magic, uses: [detect-life, telekinesis, read-an-enchantment]}
  # craft
  alchemy:     {family: craft, system: checks, uses: [test-a-sample, identify-a-poison, gather-ingredients]}
  enchanting:  {family: craft, system: checks, uses: [read-an-enchantment]}
  smithing:    {family: craft, system: craft, uses: [smith-to-order, judge-a-weapon]}
  # stealth
  sneak:       {family: stealth, system: crime, uses: [sneak-past, steal, sneak-attack]}
  lockpicking: {family: stealth, system: locks, uses: [pick-a-lock, open-a-strongbox]}
  pickpocket:  {family: stealth, system: crime, uses: [pickpocket, lift-a-key]}
  # speech
  speech:      {family: speech, system: talk, uses: [persuade, intimidate, bribe, bargain, lie, interrogate, present-evidence, accuse, buy-out]}

systems:   # how each kind of use is delivered at the ceiling, and the quest form's terms that read it
  combat:  {needs: "a person or creature placed hostile, or a line whose result makes its speaker attack (speaker_hostile); its death moves the quest (a death trigger) or gates a line (alive, dead); fixed level, fixed reward"}
  magic:   {needs: "the player's own spells; the quest reads only what they lead to: a thing taken (take), a door used (use), a person dead (death), a person passed"}
  locks:   {needs: "a door or container with a lock level and an owner, and a key a person carries or a container holds; taking from it moves the quest (take) and Skyrim's crime system sees the theft"}
  crime:   {needs: "owned things and people with eyes: Skyrim's own crime system (theft, bounty, guards, a bungled pickpocket turning hostile); the quest never checks being seen"}
  talk:    {needs: "a line gated on skill_at_least speech, gold_at_least or item_count_at_least, with a written refusal for the failed check; results take gold or things and set a stage or a stored number"}
  checks:  {needs: "a line gated on skill_at_least of the skill (a fixed threshold) that tells what the player has worked out, with a written line for the failed check"}
  craft:   {needs: "a smithed vanilla item handed in (item_count_at_least on its base form), or a line gated on skill_at_least"}
  reading: {needs: "a book or note the player reads (a use trigger on the book)"}
  doors:   {needs: "a named door the player uses (a use trigger), locked or unlocked by a result"}
  handing: {needs: "a line gated on the thing held (item_count_at_least) whose result takes it"}
  movement: {needs: "swimming and climbing: they take the player somewhere and never win a stage"}

supporting:   # acts with no skill: listed beside a stage's skill actions, never alone
  read-a-thing:     {system: reading}
  hand-over:        {system: handing}
  use-a-door:       {system: doors}
  take-a-thing:     {system: handing}
  harvest-a-plant:  {system: handing}
  swim:             {system: movement}
  dive:             {system: movement}
  climb:            {system: movement}

verbTags:   # 00-overview §4; a quest's `centrepiece` must be one of these and one of its actions must carry it
  COMBAT:      [fight, duel, clear-a-place, hunt, snipe, kill-from-range, sneak-attack, stand-a-hard-fight, summon-help, banish, turn-the-dead]
  STEALTH:     [sneak-past, steal, sneak-attack, pickpocket, lift-a-key, pick-a-lock, open-a-strongbox, become-invisible]
  HEIST:       [steal, pick-a-lock, open-a-strongbox, pickpocket, lift-a-key]
  DIVE:        [dive, swim, water-breathe]
  SOCIAL:      [persuade, intimidate, bribe, bargain, lie, buy-out, calm]
  INVESTIGATE: [present-evidence, accuse, interrogate, identify-a-poison, test-a-sample, detect-life, read-an-enchantment, judge-a-weapon]

uses:   # what a use asks of the world (`world`, becomes things and placements rows); uses not listed need only a target or a person
  fight: {world: [a hostile person or creature of a stated band placed where the player must go]}
  duel: {world: [one named opponent who turns hostile on a line (speaker_hostile)]}
  clear-a-place: {world: [a cave or ruin or camp with its hostiles, one named hostile whose death moves the quest]}
  hunt: {world: [a creature with a territory and traces the player can find]}
  sneak-attack: {world: [a target standing unaware, a reason they must die, a way out past their people]}
  snipe: {world: [a height or cover with sight of the target]}
  kill-from-range: {world: [a hostile across water or a gap]}
  stand-a-hard-fight: {world: [one hard fixed opponent, a fixed reward]}
  turn-the-dead: {world: [restless dead placed hostile]}
  summon-help: {world: [a fight too big for the player alone]}
  banish: {world: [a Daedra placed hostile]}
  soul-trap: {world: [a creature or spirit, a soul gem the player brings]}
  sneak-past: {world: [people or creatures between the player and the goal, more than one way past them]}
  steal: {world: [a thing, its owner, where it is kept, who is near]}
  pickpocket: {world: [a person carrying the thing]}
  lift-a-key: {world: [a person carrying a key, the lock it opens]}
  pick-a-lock: {world: [a door or container with a stated lock level and a reason it is locked]}
  open-a-strongbox: {world: [a strongbox with a lock level, its owner, its contents]}
  water-breathe: {world: [a thing under water too deep for one breath]}
  detect-life: {world: [people or creatures hidden from sight]}
  telekinesis: {world: [a thing out of reach across a gap or water]}
  calm: {world: [a hostile who would let the player pass if calmed]}
  frenzy: {world: [two hostiles or a hostile and a guard who can be turned on each other]}
  become-invisible: {world: [watchers between the player and the goal]}
  test-a-sample: {world: [a sample to take (a thing row), a line gated on the skill that reads it]}
  identify-a-poison: {world: [a poisoned thing, a line gated on the skill that names the poison]}
  gather-ingredients: {world: [named plants or parts placed where the player can take them]}
  read-an-enchantment: {world: [an enchanted thing, a line gated on the skill that reads it]}
  smith-to-order: {world: [a forge, the materials, someone who needs the vanilla item made]}
  judge-a-weapon: {world: [a weapon, a line gated on the skill that judges it]}
  persuade: {world: [a person with a stated objection the player can answer, a fixed threshold and a refusal line]}
  intimidate: {world: [a person with a fear, a fixed threshold and a refusal line]}
  bribe: {world: [a person whose price is stated or findable]}
  bargain: {world: [a trader with something to sell or buy]}
  buy-out: {world: [a holder who must take a stated first price by custom]}
  lie: {world: [a person who believes the player for a stated reason]}
  interrogate: {world: [a person who holds a fact and a reason to hide it]}
  present-evidence: {world: [a thing held or a fact learnt, a statement it refutes]}
  accuse: {world: [a suspect, the things that convict, a person who hears it]}

settingsFor:   # which settings a use can take (keys of `settings`); uses not listed take any but underwater
  water-breathe: [underwater]
  telekinesis: [underwater, height, ruin]
  snipe: [height, open-ground]
  kill-from-range: [height, open-ground, underwater]
  sneak-past: [household, crowd, ruin]
  steal: [household, crowd]
  pickpocket: [household, crowd]
  lift-a-key: [household, crowd]
  pick-a-lock: [household, ruin, underwater]
  open-a-strongbox: [household, ruin, underwater]
  sneak-attack: [household, ruin, height]
  persuade: [household, crowd]
  intimidate: [household, crowd, ruin]
  bribe: [household, crowd]
  bargain: [crowd, household]
  buy-out: [household]
  lie: [household, crowd]
  present-evidence: [household, crowd]
  accuse: [household, crowd]
  interrogate: [household, ruin]
  test-a-sample: [household, open-ground]
  gather-ingredients: [open-ground, underwater, ruin]
  duel: [open-ground, odds]
  clear-a-place: [ruin, underwater, odds]
  stand-a-hard-fight: [open-ground, ruin, odds]

targetsFor:   # which target groups a use can be aimed at; uses not listed take no target
  fight: [vermin, beasts, people, undead-and-spirits, daedra, bosses]
  duel: [people, bosses]
  clear-a-place: [vermin, beasts, people, undead-and-spirits, daedra]
  hunt: [beasts]
  sneak-attack: [people, bosses]
  snipe: [beasts, people]
  kill-from-range: [beasts, people, daedra]
  stand-a-hard-fight: [people, bosses, beasts]
  turn-the-dead: [undead-and-spirits]
  summon-help: [beasts, people, undead-and-spirits, daedra, bosses]
  banish: [daedra]
  soul-trap: [beasts, undead-and-spirits, daedra]
  calm: [beasts, people]
  frenzy: [beasts, people]
  sneak-past: [people, beasts]
  pickpocket: [people]
  lift-a-key: [people]
  intimidate: [people]
  interrogate: [people]
