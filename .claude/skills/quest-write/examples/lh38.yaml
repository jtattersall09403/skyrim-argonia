# Worked example: LH38 redesigned with the owner, 2026-10-27. Persona details marked `invented` await the
# NPC registry import (P0); everything else cites the Greenspring place record and culture sheets as held in
# the old repo (world/sources/placement/facts/place.hist-heartland.greenspring.json, dialogue/cultures/).
id: quest.local.lh38
code: LH38
title: The Drinker at the Spring
place: place.hist-heartland.greenspring
status: design

sources:
  placeRecord: world/sources/placement/facts/place.hist-heartland.greenspring.json
  cultureSheets: [culture.settlement.greenspring, culture.group.greenspring.lodge, culture.household.greenspring.fire-stand-hut]

playerStart:
  # What any player can know on arrival: what they see, and what a sign or any villager says first.
  - fact.greenspring.why-founding-2   # the tribe's Hist grows over the spring
  - fact.greenspring.why-occupantsMotive-2   # the tribe charges nothing for water
  - fact.greenspring.vibe-approach-1   # a small clear pool lies under the Hist
  - fact.greenspring.vibe-silhouette-1   # huts stand round the spring

premise: A courier was murdered and staked in Greenspring's spring, travellers are falling sick from the water, and the player finds the body and the killer.

truth:
  - id: t1
    when: 12 days before
    who: [npc.courier-ahzi, npc.hist-heartland.greenspring.n3]
    where: place.hist-heartland.greenspring.lodge
    what: Ahzi-Tal, a Helstrom courier, lodges for one night. Reeh-Shaal, who travels the same road, sees that his satchel holds a sealed packet the courier's ledger does not list.
  - id: t2
    when: 12 days before, late evening
    who: [npc.hist-heartland.greenspring.n3, npc.hist-heartland.greenspring.n2-2]
    where: thing.rope-coil-yard
    what: Reeh-Shaal buys a length of rope from Tsono-Ra after the lodge has closed, saying he needs it to tie his pack.
  - id: t3
    when: 12 days before, night
    who: [npc.hist-heartland.greenspring.n3, npc.courier-ahzi]
    where: thing.spring-throat
    what: Reeh-Shaal kills Ahzi-Tal at the spring, takes the satchel, ties the body's wrists and pins it with a grave-stake deep in the spring's throat under the Hist's roots, so it will not float up. He leaves the stake's face uncarved.
  - id: t4
    when: 11 days before, dawn
    who: [npc.hist-heartland.greenspring.n1]
    where: place.hist-heartland.greenspring.lodge
    what: Haj-Tei finds the courier's bed empty and his pack still in the lodge store, with his bill unpaid. He assumes the courier left before dawn without paying and keeps the pack against the debt.
  - id: t5
    when: from 8 days before
    who: [travellers]
    where: thing.spring-pool
    what: The body fouls the water. Travellers who drink it, or eat food cooked in it, fall sick with fever and retching.
  - id: t6
    when: from 8 days before
    who: [npc.hist-heartland.greenspring.n3]
    where: place.hist-heartland.greenspring.lodge
    what: Reeh-Shaal stays at the lodge, telling people he is waiting for a boat to Helstrom. He is waiting for the packet's buyer, who has not come.

facts:
  - {id: fact.lh38.pool-office, claim: "Only the spring-keeper may enter the pool under the Hist; anyone else who goes in fouls it.", from: "culture.settlement.greenspring#taboos"}
  - {id: fact.lh38.courier-missing, claim: "A Helstrom courier lodged at Greenspring 12 days ago and was not seen to leave.", from: t1}
  - {id: fact.lh38.rope-sold-late, claim: "Tsono-Ra sold Reeh-Shaal a length of rope after the lodge had closed, the night the courier vanished.", from: t2}
  - {id: fact.lh38.body-in-throat, claim: "The courier's body is staked deep in the spring's throat under the Hist's roots.", from: t3}
  - {id: fact.lh38.stake-blank, claim: "The grave-stake through the body has no story carved on it.", from: t3}
  - {id: fact.lh38.rope-knot, claim: "The rope on the body's wrists is tied with Tsono-Ra's knot.", from: t3}
  - {id: fact.lh38.pack-unpaid, claim: "The courier's pack is in the lodge store and his bill was never paid.", from: t4}
  - {id: fact.lh38.sickness, claim: "Travellers have been falling sick after drinking the spring water or eating food cooked in it.", from: t5}
  - {id: fact.lh38.reeh-waiting, claim: "Reeh-Shaal has stayed at the lodge for ten days, waiting for a boat that has not come.", from: t6}
  - {id: fact.lh38.water-smell, claim: "At dusk the spring water smells faintly of rot.", from: t5}
  - {id: fact.lh38.packet, claim: "Reeh-Shaal carries the courier's satchel, with a sealed packet that the courier's ledger does not list.", from: t3}

cast:
  - id: npc.hist-heartland.greenspring.n2
    name: Mee-Sei
    persona: {race: argonian, sex: female, role: cooks for the household at the fire stand, chattiness: chatty, friendliness: friendly, formality: low, backstory: "hatched in the heartland and has lived in Greenspring all her life (owner brief)", visible: "standing at a cooking fire, cooking; poor marsh clothing", invented: [sex]}
    wants: to stop the sickness, because travellers now avoid her food (fact.lh38.sickness)
    fears: being blamed for the sickness
    knowledge:
      fact.lh38.sickness: knows
      fact.greenspring.why-pressures-3: believes "the salt may not be the cause"
      fact.lh38.pool-office: knows
      fact.lh38.courier-missing: ignorant
    changes: []
  - id: npc.hist-heartland.greenspring.n2-2
    name: Tsono-Ra
    persona: {race: argonian, sex: female, role: mends and sells rope for the lodge, chattiness: plain, friendliness: friendly, formality: low, visible: "pulling and testing rope behind the lodge", invented: [sex, chattiness]}
    wants: to keep selling rope to travellers (culture.group.greenspring.lodge values)
    fears: that the rope she sold that night was used for something bad
    knowledge:
      fact.lh38.rope-sold-late: hides "selling after the lodge closed is against the village's agreed price and hours, and she suspects why he wanted it"
      fact.lh38.sickness: knows
    changes:
      - {atStage: 40, fact: fact.lh38.rope-sold-late, to: knows}
  - id: npc.hist-heartland.greenspring.n1
    name: Haj-Tei
    persona: {race: argonian, sex: male, role: the bed-keeper, runs the lodge, chattiness: plain, friendliness: friendly, formality: plain, visible: "at the lodge door"}
    wants: guests to keep coming (fact.greenspring.why-occupantsMotive-3)
    fears: that a guest came to harm in his lodge
    knowledge:
      fact.lh38.courier-missing: believes "the courier left before dawn without paying"
      fact.lh38.pack-unpaid: hides "a guest vanishing without paying is bad for the lodge's name"
    changes:
      - {atStage: 40, fact: fact.lh38.pack-unpaid, to: knows}
  - id: npc.hist-heartland.greenspring.n3
    name: Reeh-Shaal
    persona: {race: argonian, sex: male, role: a guest who says he is bound for Helstrom, chattiness: chatty, friendliness: friendly, formality: plain, visible: "sitting by the spring house"}
    wants: to sell the packet and leave
    fears: anyone looking in the spring
    knowledge:
      fact.lh38.body-in-throat: hides "he killed the courier"
      fact.lh38.packet: hides "it is why he killed him"
      fact.lh38.reeh-waiting: knows
    changes: []
  - id: npc.hist-heartland.greenspring.spring-keeper
    name: Im-Moro
    persona: {race: argonian, sex: female, role: the spring-keeper; only she may enter the pool, chattiness: plain, friendliness: friendly, formality: ceremonial, visible: "at the stone lip of the spring with a ladle"}
    wants: to keep the spring's good name (culture.settlement.greenspring dissent)
    fears: that the spring could sour for good (her never-said)
    knowledge:
      fact.lh38.sickness: believes "it is the travellers' own food, not the water"
    changes:
      - {atStage: 60, fact: fact.lh38.body-in-throat, to: knows}
  - id: npc.hist-heartland.greenspring.tree-minder
    name: Vees-Wai
    persona: {race: argonian, sex: male, role: the tree-minder, reads the Hist, chattiness: plain, friendliness: friendly, formality: ceremonial, visible: "at the shrine at the Hist's foot"}
    wants: the Hist and the tribe kept well
    fears: the dead left without their story
    knowledge:
      fact.lh38.stake-blank: ignorant
    changes: []

things:
  - {id: thing.spring-pool, kind: pool, source: "existing: sp-pool (layout op)", states: {all: "open; Im-Moro forbids entry"}}
  - {id: thing.spring-throat, kind: underwater shaft, source: new, where: "below thing.spring-pool, between the Hist's roots, deep enough to swim down", states: {all: "dark; body inside"}}
  - {id: thing.courier-body, kind: corpse, source: new, where: thing.spring-throat, states: {before-60: "staked, wrists tied", after-60: "removed"}}
  - {id: thing.grave-stake, kind: activator, source: new, where: thing.courier-body, states: {all: "face uncarved"}}
  - {id: thing.knotted-rope, kind: item, source: new, where: thing.courier-body, states: {all: "tied with Tsono-Ra's knot; can be taken"}}
  - {id: thing.courier-pack, kind: container, source: "new, in the lodge store (parcel.greenspring.lodge)", states: {all: "the courier's pack and his unpaid bill"}}
  - {id: thing.satchel, kind: item, source: new, where: "Reeh-Shaal's inventory", states: {all: "holds the sealed packet"}}
  - {id: thing.sick-guests, kind: npc pair, source: new, where: "lying on mats in the lodge", states: {before-60: "feverish; say they drank at the spring", after-60: "recovering"}}
  - {id: thing.rope-coil-yard, kind: place, source: "existing: behind the lodge (culture.group.greenspring.lodge)", states: {all: "Tsono-Ra's work spot"}}

conclusions:
  - {id: c1, statement: "Something in the spring is making people sick.", clues: [k1, k2, k3]}
  - {id: c2, statement: "The courier did not leave; he was murdered and hidden in the spring.", clues: [k4, k5, k6]}
  - {id: c3, statement: "Reeh-Shaal killed him.", clues: [k7, k8, k9, k10]}

clues:
  - {id: k1, form: line, carrier: npc.hist-heartland.greenspring.n2, gives: [fact.lh38.sickness], supports: [c1]}
  - {id: k2, form: behaviour, carrier: thing.sick-guests, gives: [fact.lh38.sickness], supports: [c1]}
  - {id: k3, form: thing, carrier: thing.spring-pool, gives: [fact.lh38.water-smell], supports: [c1]}
  - {id: k4, form: thing, carrier: thing.courier-body, gives: [fact.lh38.body-in-throat], supports: [c2]}
  - {id: k5, form: thing, carrier: thing.courier-pack, gives: [fact.lh38.pack-unpaid], supports: [c2]}
  - {id: k6, form: line, carrier: npc.hist-heartland.greenspring.n1, gives: [fact.lh38.courier-missing], supports: [c2]}
  - {id: k7, form: thing, carrier: thing.knotted-rope, gives: [fact.lh38.rope-knot], supports: [c3]}
  - {id: k8, form: line, carrier: npc.hist-heartland.greenspring.n2-2, gives: [fact.lh38.rope-sold-late], supports: [c3]}
  - {id: k9, form: line, carrier: npc.hist-heartland.greenspring.tree-minder, gives: [fact.lh38.stake-blank], supports: [c3]}
  - {id: k10, form: behaviour, carrier: npc.hist-heartland.greenspring.n3, gives: [fact.lh38.reeh-waiting], supports: [c3]}

stages:
  - {id: 10, objective: "Find out why travellers are falling sick.", pre: "Mee-Sei's disposition at least 40, or persuaded", post: [flag.lh38.started], learns: [fact.lh38.sickness, fact.lh38.pool-office], directions: "the pool under the Hist, a short walk from the fire stand (landmark: the Hist)"}
  - {id: 20, objective: "Get into the pool under the Hist.", pre: [flag.lh38.started], approaches: ["persuade Im-Moro to let a guest look", "dive at night while Im-Moro sleeps (seen: crime, fouling the pool)"], post: [flag.lh38.in-pool], learns: []}
  - {id: 30, objective: "Search the spring's throat.", pre: [flag.lh38.in-pool], post: [flag.lh38.body-found], learns: [fact.lh38.body-in-throat, fact.lh38.stake-blank, fact.lh38.rope-knot]}
  - {id: 40, objective: "Find out who the dead man was and who killed him.", pre: [flag.lh38.body-found], learns: [fact.lh38.courier-missing, fact.lh38.pack-unpaid, fact.lh38.rope-sold-late, fact.lh38.reeh-waiting], post: [flag.lh38.suspect-known], failForward: "if the player kills or alienates Tsono-Ra, the knot alone and Haj-Tei's guest list still point at Reeh-Shaal"}
  - {id: 50, objective: "Confront Reeh-Shaal.", pre: [flag.lh38.suspect-known], approaches: [accuse with evidence, fight, take his bribe], post: [flag.lh38.resolved], learns: [fact.lh38.packet]}
  - {id: 60, objective: "Tell Im-Moro so the body can be raised.", pre: [flag.lh38.body-found], post: [flag.lh38.raised]}

endings:
  - {id: e-justice, when: "Reeh-Shaal accused with at least two clues", world: "Reeh-Shaal held for the root-herald to take to Helstrom; the body raised and given to the Hist", seen: "Reeh-Shaal gone from the spring house; the sickness stops after 3 days; Im-Moro's greeting changes", rewards: ["free training from Im-Moro (skill to choose)", "Mee-Sei: free meals in Greenspring", "Haj-Tei: free bed", "the packet, to return in Helstrom (leads on)"]}
  - {id: e-fight, when: "Reeh-Shaal killed", world: "as e-justice, without the trial", seen: "as e-justice", rewards: ["as e-justice", "his purse"]}
  - {id: e-bribe, when: "player takes the packet and lets him go", world: "Reeh-Shaal leaves; nobody in Greenspring learns who killed the courier", seen: "Mee-Sei and Im-Moro believe the killer was never found", rewards: ["the packet, to sell", "Im-Moro's training only if the body is raised"]}
  - {id: e-fail, when: "Mee-Sei, Im-Moro or Reeh-Shaal dies before stage 30", world: "the sickness goes on until the body is found by chance (journal closes)", seen: "travellers stop coming", rewards: []}

topics:
  - {topic: latest rumours, person: npc.hist-heartland.greenspring.n2, stages: [0], essential: false, intent: "hook: travellers are falling sick; she doubts it is salt; below 40 she says she keeps her thoughts from strangers", uses: [fact.lh38.sickness, fact.greenspring.why-pressures-3], grants: [sickness at the spring]}
  - {topic: sickness at the spring, person: npc.hist-heartland.greenspring.n2, stages: [10, 20], essential: true, intent: "she thinks something is in the spring; only Im-Moro may enter the pool; ask her, or look at night; she offers free meals", uses: [fact.lh38.sickness, fact.lh38.pool-office], hides: []}
  - {topic: the dead man in the spring, person: npc.hist-heartland.greenspring.n1, stages: [40], essential: true, intent: "at first he says the courier left without paying; shown the body or the pack, he admits the pack is in his store", uses: [fact.lh38.courier-missing, fact.lh38.pack-unpaid], hides: [fact.lh38.pack-unpaid]}
  - {topic: the knotted rope, person: npc.hist-heartland.greenspring.n2-2, stages: [40], essential: true, intent: "she knows her knot; at first evasive; at disposition 40 or shown the rope she admits selling it late to Reeh-Shaal", uses: [fact.lh38.rope-knot, fact.lh38.rope-sold-late], hides: [fact.lh38.rope-sold-late]}
  - {topic: the grave-stake, person: npc.hist-heartland.greenspring.tree-minder, stages: [30, 40], essential: true, intent: "a stake carries the dead person's story; a blank one means the killer knew the custom and chose not to honour the dead", uses: [fact.lh38.stake-blank]}
  - {topic: the dead man in the spring, person: npc.hist-heartland.greenspring.n3, stages: [40, 50], essential: true, intent: "friendly and helpful, points at the salt and at Tsono-Ra; under accusation with evidence he breaks", uses: [fact.lh38.reeh-waiting], hides: [fact.lh38.body-in-throat, fact.lh38.packet]}
  - {topic: the dead man in the spring, person: npc.hist-heartland.greenspring.spring-keeper, stages: [30, 60], essential: true, intent: "refuses to believe it until she sees the body or the rope; then has him raised and thanks the player", uses: [fact.lh38.body-in-throat]}
