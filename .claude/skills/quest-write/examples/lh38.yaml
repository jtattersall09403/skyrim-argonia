- id: 20
  place: place.hist-heartland.greenspring
  journal: text.journal.lh38.20
  journalText: The guests at the Greenspring lodge sicken from the spring, not from Mee-Sei's food. Only Im-Moro, the
    spring-keeper, may go into the pool under the Hist. I'm to get into the pool, with her leave or without it at night.
