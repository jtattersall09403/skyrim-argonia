truth:
- id: t1
  when: 12 days before
  who: [courier Ahzi-Tal, npc.hist-heartland.greenspring.n3]
  where: the lodge
  what: Ahzi-Tal, a Helstrom courier, lodges for one night. Reeh-Shaal, who pays for her bed in salt and travels the same
    road, sees that his satchel holds a sealed packet his ledger does not list.
- id: t2
  when: 12 days before, late evening
  who: [npc.hist-heartland.greenspring.n3, npc.hist-heartland.greenspring.n2-2]
  where: thing.rope-coil-yard
  what: Reeh-Shaal buys a length of rope from Tsono-Ra after the lodge has closed, saying she needs it to tie her pack.
- id: t3
  when: 12 days before, night
  who: [npc.hist-heartland.greenspring.n3, courier Ahzi-Tal]
  where: thing.spring-throat
  what: Reeh-Shaal kills Ahzi-Tal at the stone lip, takes the satchel, ties the body's wrists and pins it with a grave-stake
    in the spring's throat under the Hist's roots, so it will not float up. She leaves the stake's face uncarved.
- id: t4
  when: 11 days before, dawn
  who: [npc.hist-heartland.greenspring.n1]
  where: the lodge
  what: Haj-Tei finds the courier's bed empty, his pack still in the lodge store and his bill unpaid. He decides the courier
    left before dawn without paying and keeps the pack against the debt.
- id: t5
  when: from 8 days before
  who: [travellers]
  where: thing.spring-pool
  what: The body fouls the water. Guests who drink it, or eat food cooked in it, fall sick with fever and retching.
- id: t6
  when: from 8 days before
  who: [npc.hist-heartland.greenspring.n3]
  where: the lodge
  what: Reeh-Shaal stays at the lodge, saying she waits for a boat to Helstrom. She waits for the packet's buyer, who
    has not come, and tells the sick guests it is the fire stand's food.
- id: t7
  when: every night since
  who: [npc.hist-heartland.greenspring.n3]
  where: thing.spring-pool
  what: After the lamps are out, Reeh-Shaal goes to the stone lip and looks down into the water for a while, to be sure
    the body has not come up.
