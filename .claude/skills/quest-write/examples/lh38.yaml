facts:
- {id: fact.lh38.pool-office, claim: Only the spring-keeper may go into the pool under the Hist; anyone else who goes
    in fouls it., from: culture.settlement.greenspring#taboos}
- {id: fact.lh38.courier-missing, claim: A Helstrom courier lodged at Greenspring twelve days ago and was not seen to
    leave., from: t1}
- {id: fact.lh38.rope-sold-late, claim: 'Tsono-Ra sold Reeh-Shaal a length of rope after the lodge had closed, the night
    the courier vanished.', from: t2}
- {id: fact.lh38.body-in-throat, claim: The courier's body is staked deep in the spring's throat under the Hist's roots.,
  from: t3}
- {id: fact.lh38.stake-blank, claim: The grave-stake through the body has no story carved on it., from: t3}
- {id: fact.lh38.rope-knot, claim: The rope on the body's wrists is tied with Tsono-Ra's knot., from: t3}
- {id: fact.lh38.pack-unpaid, claim: The courier's pack is in the lodge store and his bill was never paid., from: t4}
- {id: fact.lh38.sickness, claim: Guests have been falling sick after drinking the spring water or eating food cooked
    in it., from: t5}
- {id: fact.lh38.water-not-food, claim: Water drawn from the pool makes a test brew cloud; food cooked in river water
    does not., from: t5}
- {id: fact.lh38.food-blamed, claim: Reeh-Shaal tells the sick guests that the fire stand's food is making them ill.,
  from: t6}
- {id: fact.lh38.reeh-waiting, claim: 'Reeh-Shaal has stayed at the lodge ten days, waiting for a boat that has not come.',
  from: t6}
- {id: fact.lh38.water-smell, claim: At dusk the spring water smells faintly of rot., from: t5}
- {id: fact.lh38.night-watch, claim: Reeh-Shaal goes to the stone lip every night after the lamps are out and stares into
    the water., from: t7}
- {id: fact.lh38.packet, claim: 'Reeh-Shaal carries the courier''s satchel, with a sealed packet that his ledger does
    not list.', from: t3}
