review:
  reviewer: fresh read by the 0.1 §i lane against quest-review, 2026-10-29 (the agent fitted the format but did not write
    the 2026-10-27 design)
  findings:
  - id: R1
    severity: high
    ids: [shapeData.misdiagnosis, fact.greenspring.why-pressures-3, quest.mr.mr01]
    finding: 'The misdiagnosis (salt from the salt works) and the dive under the Hist were MR01''s, at the same spring:
      a player doing both meets the same reversal twice (novelty rule: same reversal).'
    answer: 'fixed: the sickness is now blamed on the fire stand''s food (Im-Moro''s belief, Reeh-Shaal''s lie); the throat
      is a one-breath shaft under the pool, MR01''s drowned stair is 536 m off at D4.'
  - id: R2
    severity: high
    ids: [cast]
    finding: 'Personas contradicted the registry: npcs.json has Mee-Sei and Tsono-Ra male and Reeh-Shaal female; the record
      had them the other way.'
    answer: 'fixed: persona comes from npcs.json; pronouns in truth and topics follow it.'
  - id: R3
    severity: medium
    ids: [stages.10, stages.20]
    finding: Stage 10 was talk only (persuade); checklist 18.
    answer: 'fixed: an alchemy test of the water is an approach and becomes the evidence for stage 20.'
  - id: R4
    severity: medium
    ids: [stages.90]
    finding: The old fail stage fired on any death; the killer could stall forever (no clock).
    answer: 'fixed: a three-day clock from finding the body (startTimer, daysSince); deaths now route forward (Mee-Sei
      -> 20, Im-Moro -> 30, Reeh-Shaal -> 71).'
  - id: R5
    severity: medium
    ids: [endings]
    finding: Rewards were prose; they must be actions.
    answer: 'fixed: offerTeach, setPrice, changeDisposition, giveGold. Open: spell.water-breathing and service.greenspring.beds
      need ids in 2.6 and 2.9.'
  - id: R6
    severity: open
    ids: [topic.lh38-accusation, stages.20 a-ask]
    finding: present-evidence and accuse have no vocabulary term; the accusation topic's two-exhibit gate cannot be written
      yet.
    answer: 'open: quest-record.md ''needs a decision''; 2.5 and 2.12 build it (0025).'
  - id: R7
    severity: low
    ids: [fact.lh38.pool-office]
    finding: '''Only the spring-keeper may go in'' extends the settlement taboo (fouling the pool).'
    answer: 'kept, flagged: an inferred norm for 2.5 to add to culture.settlement.greenspring.'
  checklist: 'pass 1-7, 9-11, 13-18, 20-24; open: 21 (accusation gate, R6)'
