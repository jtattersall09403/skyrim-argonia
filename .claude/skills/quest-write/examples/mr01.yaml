truth:
- id: t1
  when: about sixty years before
  who: [Greenspring's founding families]
  where: thing.breach
  what: In a dry year the founders went down the root galleries and cut a channel from a brine seam toward the roots of
    a rival grove downstream, to sour its water and take its travellers. The rival grove withered; Greenspring grew.
- id: t2
  when: about sixty years before
  who: [Greenspring's founding families]
  where: the village
  what: The founders carved the descent on their own grave-stakes in the old way, as a deed done for the tribe, and never
    spoke of it to outsiders.
- {id: t3, when: the last three wet seasons, where: thing.breach, what: 'With the grove downstream dead, the channel silted
    on that side; each flood now pushes the brine back up the cut into Greenspring''s own taproots.'}
- id: t4
  when: this year
  who: [npc.hist-heartland.greenspring.tree-minder]
  where: the Hist
  what: Vees-Wai finds the Hist's leaves falling out of season and the sap thin. The village tastes salt in the spring
    and blames the salt works upstream.
- id: t5
  when: a year before
  who: [npc.hist-heartland.greenspring.root-herald]
  where: the herald's house
  what: Ixo-Vaal stopped trading for salt-works salt when the works closed their landing; he now buys upriver rock salt,
    which he keeps in a sack at his door.
playerStart: [fact.greenspring.why-founding-2, fact.greenspring.why-pressures-1, fact.greenspring.why-pressures-2, fact.greenspring.why-pressures-3]
facts:
- {id: fact.mr01.river-fresh, claim: The river above the fork tastes fresh; the salt is not coming down the river., from: t3}
- {id: fact.mr01.works-closed, claim: The salt works upstream closed their landing a year ago and ship nothing down the
    river., from: t5}
- {id: fact.mr01.salt-rises, claim: The water in the root galleries grows saltier the deeper it is., from: t3}
- {id: fact.mr01.breach, claim: In the deepest chamber of the drowned stair a channel has been cut by hand through the
    roots into a brine seam., from: t1}
- {id: fact.mr01.tool-marks, claim: The cut is old and bears the marks of bone adzes like the ones on the founders' stakes.,
