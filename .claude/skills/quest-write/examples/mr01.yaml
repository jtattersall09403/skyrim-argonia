shapeData:
  source: thing.breach
  spread: brine up the taproots from the drowned stair, worst after each flood
  sign: fact.mr01.sap-thin
  cure: seal the cut (costs the roots it runs through), or reopen it downstream (floods the dead grove's land, where the
    founders' rival's descendants now fish)
  firstIllLastWell: the Hist's lowest roots first, then the spring, then the river landing last
  misdiagnosis: {wrong: salt from the salt works upstream, test: taste the river above the fork (k1); the herald's ledger
      (k2)}
  ladder: ['day 0: leaves falling out of season', 'after stage 20: the spring tastes of salt', 'after stage 40: the sap
      stops at the naming bowl']
  rumour: the couriers' shortcut under the roots, four held breaths (catalogue why.occupantsMotive)
  route: Greenspring -> Gate-Side Camp -> the drowned stair; or by boat round the surface route, a day longer
  gate: the second landing is a full dive in the wet season
  prize: the third sample and the sight of the breach
  return: back up the stair with the samples; the air pockets are the rests
  prepHints: 'the couriers at Gate-Side Camp say: four breaths, a light that burns under water, and fire for the swarms'
  pointOfNoReturn: 'the deepest chamber: the player must have breath or water-breathing to come back'
  nonLethalFailure: out of breath, the player wakes at the first landing's air pocket with the sample lost (1.5 death
    rule applies elsewhere)
stages:
- id: 10
  place: place.hist-heartland.greenspring
  journal: text.journal.mr01.10
  journalText: Root-Herald Ixo-Vaal of Greenspring asked me, for the Many-Root Conclave, to find out why the village's
    Hist is sickening. The village blames the salt works upstream. I'm to test the water before I believe them.
  onEnter:
  - {grantTopic: topic.greenspring-sick-root}
  objectives:
  - id: hear-keeper
    text: text.objective.mr01.hear-keeper
    completeWhen:
      topicHeardFrom: [topic.greenspring-sick-root, npc.hist-heartland.greenspring.spring-keeper]
  successors:
  - to: 20
    when:
      topicHeardFrom: [topic.greenspring-sick-root, npc.hist-heartland.greenspring.spring-keeper]
  failForward:
  - to: 20
    when:
      not: {npcAlive: npc.hist-heartland.greenspring.spring-keeper}
  learns: [fact.mr01.river-fresh, fact.mr01.works-closed, fact.mr01.sap-thin]
  directions: The fork lies a short walk upstream of the river landing; the herald's house, with the salt sack at its
    door, faces the Hist.
  actions:
  - {skill: alchemy, use: test-a-sample, setting: open ground by day, note: the river above the fork against the spring}
  - {use: harvest-a-plant, system: harvest}
- id: 20
  place: place.hist-heartland.root-gallery-drowned-stair
  journal: text.journal.mr01.20
  journalText: The salt in Greenspring's spring is not coming down the river. The couriers say the Hist's roots run into
    the flooded galleries of the Drowned Stair. I'm to go down and take water at each landing.
  objectives:
  - id: sample-two
    text: text.objective.mr01.sample-two
    completeWhen: {hasItem: item.mr01.sample-2}
  successors:
  - to: 30
    when: {hasItem: item.mr01.sample-2}
  learns: [fact.mr01.salt-rises]
  directions: From Greenspring take the road to the Gate-Side Camp outside Helstrom's gate; the guides there show the
    stair's mouth, where the deep water starts.
  actions:
  - {skill: athletics, use: dive, setting: 'in a flooded ruin, root-cave or under water'}
  - {skill: destruction, use: burn-a-nest, setting: 'in a flooded ruin, root-cave or under water', target: 'vermin: parasite
      swarms in a root-cave'}
  - {use: take-a-ferry, system: travel}
  outside: {packet: 4.2.hist-heartland}
- id: 30
  place: place.hist-heartland.root-gallery-drowned-stair
  journal: text.journal.mr01.30
  journalText: The water in the Drowned Stair grows saltier the deeper I go. I'm to reach the deepest chamber, beyond
    one breath, and see where the salt comes in.
  objectives:
  - id: see-breach
    text: text.objective.mr01.see-breach
    completeWhen: {hasItem: item.mr01.sample-3}
  successors:
  - to: 40
    when: {hasItem: item.mr01.sample-3}
  approaches:
  - id: a-breath
    actions:
    - {skill: alteration, use: water-breathe, setting: 'in a flooded ruin, root-cave or under water'}
  - id: a-swarm
    actions:
    - {skill: spear, use: fight, target: 'vermin: parasite swarms in a root-cave', note: clears the air pocket on the
        way, setting: 'in a flooded ruin, root-cave or under water'}
  learns: [fact.mr01.breach, fact.mr01.tool-marks, fact.mr01.brine-backflow]
  outside: {packet: 4.2.hist-heartland}
- id: 40
  place: place.hist-heartland.greenspring
  journal: text.journal.mr01.40
  journalText: Deep in the Drowned Stair, a channel has been cut by hand into a brine seam, and the floods push the brine
    into Greenspring's roots. The cut is old. I'm to learn who made it, and Vees-Wai, the tree-minder, reads the old stakes.
  onEnter:
  - {grantTopic: topic.mr01-the-cut}
  objectives:
  - id: read-stakes
    text: text.objective.mr01.read-stakes
    completeWhen:
      topicHeardFrom: [topic.mr01-the-cut, npc.hist-heartland.greenspring.tree-minder]
  successors:
  - to: 50
    when:
      topicHeardFrom: [topic.mr01-the-cut, npc.hist-heartland.greenspring.tree-minder]
  failForward:
  - to: 50
    when:
      not: {npcAlive: npc.hist-heartland.greenspring.tree-minder}
  learns: [fact.mr01.founders-stakes, fact.mr01.rival-grove]
  actions:
  - {skill: speechcraft, use: persuade, note: the stakes are the tribe's story; the tool-marks and the sample are the
      argument, target: Vees-Wai}
- id: 50
  place: place.hist-heartland.greenspring
  journal: text.journal.mr01.50
  journalText: Greenspring's founders cut the channel to kill a rival grove downstream, and their deed is killing their
    own Hist. Ixo-Vaal has called the office-holders to the Hist. I'm to put what I found before them and argue for a
    cure, and for whether the founders are named.
  onEnter:
  - {startScene: scene.mr01.council}
  objectives:
  - id: council
    text: text.objective.mr01.council
    completeWhen:
      any:
      - {flag: flag.mr01.cure-sealed}
      - {flag: flag.mr01.cure-reopened}
  successors:
  - to: 60
    when:
      all:
      - {flag: flag.mr01.cure-sealed}
      - {flag: flag.mr01.founders-named}
  - to: 61
    when:
      all:
      - {flag: flag.mr01.cure-sealed}
      - not: {flag: flag.mr01.founders-named}
  - to: 62
    when: {flag: flag.mr01.cure-reopened}
  failForward:
  - to: 61
    when:
      not: {npcAlive: npc.hist-heartland.greenspring.root-herald}
  approaches:
  - id: a-evidence
    actions:
    - {skill: speechcraft, use: present-evidence, note: the samples and the tool-marks against Im-Moro's belief, setting: 'before
        witnesses (a council, a hearing, a household)'}
  - id: a-bargain
    actions:
    - {skill: mercantile, use: bargain, target: Ixo-Vaal, note: the herald pays for the sealing if the founders stay unnamed}
- {id: 60, place: place.hist-heartland.greenspring, journal: text.journal.mr01.60, journalText: 'The office-holders of
    Greenspring sealed the founders'' cut and named the deed at the Hist. The tree should mend, and Greenspring now owes
    the people of the dead grove an answer.', ending: complete, endingId: e-sealed-named}
- {id: 61, place: place.hist-heartland.greenspring, journal: text.journal.mr01.61, journalText: The office-holders of
    Greenspring sealed the founders' cut and agreed to say nothing of who made it. The tree should mend., ending: complete,
  endingId: e-sealed-silent}
- {id: 62, place: place.hist-heartland.greenspring, journal: text.journal.mr01.62, journalText: 'Greenspring chose to
    reopen the founders'' cut downstream. Their Hist is spared, and the dead grove''s land will flood with brine again.',
  ending: complete, endingId: e-reopened}
