- {id: fact.mr01.rival-grove, claim: 'A grove downstream withered in the founders'' time, and its people left.', from: t1}
- {id: fact.mr01.brine-backflow, claim: Each flood pushes brine back up the old cut into Greenspring's taproots., from: t3}
- {id: fact.mr01.sap-thin, claim: The Hist at Greenspring is dropping leaves out of season and its sap runs thin., from: t4}
- {id: fact.mr01.consent, claim: 'No Hist speaks for all the Hist, and one tree''s will does not bind another''s people.',
