    severity: high
    ids: [essentialTopics, topic.greenspring-sick-root]
    finding: The imported row names topic.greenspring-sick-root as essential, but topics.json has no such row.
    answer: marked new; 2.5 adds it to the topic web.
  - id: R2
    severity: high
    ids: [stages.20, stages.30]
    finding: The imported row stopped at stage 20 outside the slice (packet 4.2); a faction opener whose centre is out
      of the slice cannot be played in Part 2.
    answer: 'open, for the planner: either the drowned stair joins 2.W5 or MR01 is built in 4.2; the record holds the
      whole graph either way.'
  - id: R3
    severity: medium
    ids: [shapeData.misdiagnosis, quest.local.lh38]
    finding: Same spring as LH38; both are CONTAMINATION.
    answer: LH38's misdiagnosis moved to the food (its R1); MR01 keeps the salt.
  - id: R4
    severity: medium
    ids: [stages.50, scene.mr01.council]
    finding: The council's choice sets flags no action sets; the council needs dialogue actions (setFlag on a topic choice).
    answer: the council's topics set the flags; 2.5's topic store carries onDelivered actions (85 §C).
  - id: R5
    severity: low
    ids: [startWhen]
    finding: factionRankAtLeast rank 0 means any member; non-members never see the quest.
    answer: 'kept: a faction quest; Ixo-Vaal''s join offer comes first (2.12).'
  checklist: 'pass 1-7, 9-11, 13-18, 20-24; open: 16a (R2)'
