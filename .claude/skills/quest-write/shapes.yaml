# Routing: each quest's primary shape (first in `shapes`) and its `group` pick the principle files to read and
# the `shapeData` sections the record must hold. Secondary shapes add their files and sections too. Each section is
# described in the shape's principle file under "Record additions".
# brief.py reads this file: a record missing a required section for its shapes is not whole, and a record holding a
# section named under `cut` is told what does that job now.

always: [principles/general.md, principles/actions.md]

lines:   # by the quest row's `group`; `byLine` adds files for one line id
  local: [principles/questlines.md]   # a minor quest needs only its "Local quests" bullet
  faction: [principles/questlines.md]
  line: [principles/questlines.md]
  main: [principles/questlines.md]
  daedric: [principles/questlines.md, principles/otherworldly.md]
  proposed: [principles/questlines.md]
byLine:
  quest.line.detectives: [principles/investigation.md]   # decision 0025

shapes:
  MURDER:        {read: [principles/investigation.md], require: [timeline, lies, nodes, leads, redHerrings, openQuestions, confrontation, endings]}
  MISSING:       {read: [principles/investigation.md], require: [fate, trail, nodes, leads, openQuestions]}
  RECKONING:     {read: [principles/investigation.md], require: [timeline, guiltyParties, nodes, leads]}
  THEFT:         {read: [principles/crime-and-deceit.md], require: [theftMode]}   # theftMode: commit or solve
  THEFT/commit:  {read: [principles/crime-and-deceit.md], require: [prize, kept, tellers, waysIn, goesWrong, afterwards]}
  THEFT/solve:   {read: [principles/crime-and-deceit.md, principles/investigation.md], require: [suspects, redHerrings, confrontation, nodes, leads]}
  FRAUD:         {read: [principles/crime-and-deceit.md, principles/investigation.md], require: [lie, victims, proof, confrontation]}
  SMUGGLING:     {read: [principles/crime-and-deceit.md], require: [cargo, tell, waysThrough, watchers, cargoTruth]}
  DISPUTE:       {read: [principles/social.md], require: [claims, outcomes, revealOrder, whyNow, afterwards]}
  NEGOTIATION:   {read: [principles/social.md], require: [sides, leverage, objections, afterwards]}
  SUCCESSION:    {read: [principles/social.md], require: [legitimacies, candidates, backers, revealOrder, whyNow, afterwards]}
  BONDAGE:       {read: [principles/social.md], require: [theBond, costToTheBound, afterwards]}
  PREDATOR:      {read: [principles/threat-and-journey.md], require: [habit, whyUnsolved, twist, clueChoices, nonCombat, weakSample]}
  CONTAMINATION: {read: [principles/threat-and-journey.md], require: [source, spread, sign, cure, firstIllLastWell, misdiagnosis, stakes]}
  EXPEDITION:    {read: [principles/threat-and-journey.md], require: [rumour, route, gate, prize, return, prepHints, pointOfNoReturn, nonLethalFailure]}
  HAUNTING:      {read: [principles/otherworldly.md], require: [theDead, deathTrace, manifestation, resolutions, wishVsNeed]}
  RITE:          {read: [principles/otherworldly.md], require: [rite, beats, breakPoints]}
  WONDER:        {read: [principles/otherworldly.md], require: [image, rule, answer, familiarGround]}

# Sections a record may still hold whose job is done elsewhere now: fold the content into the named section and
# delete the old one.
cut:
  planTexts: "the ways in are told by people (tellers) and listed in waysIn"
  escape: "nothing is staged after a theft: Skyrim's crime system does the rest; what follows goes in afterwards"
