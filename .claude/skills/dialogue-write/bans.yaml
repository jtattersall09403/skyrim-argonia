# Banned constructions for Argonia dialogue. One entry per ban; add new ones at the end.
# Fields: id, rule (one sentence), bad (examples), good (rewrites), and either
#   detect: a Python regex run by lint.py over every line (a hit is flagged, not auto-rejected), or
#   detect: review   when only a reader can spot it (the self-check and the reviewer go through these).
#   severity: warn   optional: a regex hit is a warning to justify against the lore, never a failure.
# A writer reads the whole list before writing; lint.py runs every regex; the reviewer checks every
# `review` entry by id. Keep each entry short so the list stays cheap to read in full.

- id: B01-personification
  rule: >-
    No personification. An inanimate subject (an object, place, document, institution or abstraction: a roll, a
    hold, a town, a ship, the marsh, a law, a debt) never does a person's act (hears, wants, adds, knows, decides,
    watches, remembers, says, gives, takes). Name the person who does it, or state the plain fact. Check every
    sentence's subject: if it is not a person, creature or Hist, its verb must be something a thing can do.
  bad:
    - The roll adds more months for food.
    - The hold heard you.
    - The village gives us nothing.
    - The lodge talks of salt.
    - Rumours are for the lodge.
    - Beds and rope pay for everything else.
    - The mud will take your boots.
  good:
    - I add more months to the roll for food.
    - We all heard you in the hold.
    - The villagers give us nothing.
    - The people at the lodge talk about nothing but salt.
    - If you want rumours, ask at the lodge. People talk there in the evenings.
    - The water is free. We make our living from the beds and the rope we sell to travellers.
    - Off the path, you will sink to the knee in mud.
  detect: subject-act
  subjects: [roll, rolls, ledger, ledgers, book, books, list, tally, hold, barge, ship, ships, boat, boats, town, towns,
    village, villages, city, camp, house, hall, lodge, place, marsh, marshes, swamp, swamps, bog, fen, river, rivers, water,
    waters, mud, sea, shore, road, roads, path, paths, law, laws, debt, debts, Owing, owing, contract, contracts, letter,
    letters, note, coin, coins, money, gold, market, markets, plantation, estate, estates, dock, docks, pier, fire, reeds,
    rain, wind, wall, walls, gate, door, deck, tower, fort, prison, mine, quarry, field, fields, paddy, paddies, tide, tides,
    flood, storm, dark, night, season, months, beds, rope, spring, tree, trees, rumour, rumours, ink, page, paper, chest,
    cage, chain, chains, fever, coast, island, border, province, crown, treasury, tariff, tax, taxes, toll, tolls, price,
    prices, trade, sword, blade, knife, net, nets, jungle, forest, ground, land, stone, shed, work, salt, rice, Guild, guild]
  acts: [say says said saying, add adds added adding, hear hears heard hearing, want wants wanted wanting,
    know knows knew known knowing, remember remembers remembered remembering, forget forgets forgot forgotten forgetting,
    watch watches watched watching, decide decides decided deciding, wait waits waited waiting, talk talks talked talking,
    tell tells told telling, ask asks asked asking, pay pays paid paying, give gives gave given giving,
    see sees saw seen seeing, listen listens listened listening, like likes liked, hate hates hated, love loves loved,
    care cares cared, forgive forgives forgave, judge judges judged, call calls called calling, demand demands demanded,
    expect expects expected, allow allows allowed, refuse refuses refused, punish punishes punished,
    swallow swallows swallowed, eat eats ate eaten, keep keeps kept keeping, take takes took taken taking,
    claim claims claimed, count counts counted counting, name names named, own owns owned, choose chooses chose chosen,
    wish wishes wished, need needs needed, mourn mourns mourned, welcome welcomes welcomed, warn warns warned,
    promise promises promised, grant grants granted, let lets, owe owes owed, charge charges charged, sell sells sold,
    buy buys bought, speak speaks spoke spoken, whisper whispers whispered, answer answers answered, sleep sleeps slept,
    dream dreams dreamed, accept accepts accepted, reward rewards rewarded, trust trusts trusted, notice notices noticed,
    learn learns learned, hunt hunts hunted, follow follows followed, seek seeks sought, guard guards guarded,
    protect protects protected, weep weeps wept, laugh laughs laughed, mind minds, ignore ignores ignored, feed feeds fed]

- id: B02-verbless-appositive
  rule: Do not open a sentence with a noun phrase, a comma and a description in place of a verb.
  bad:
    - A dead man, under the stone lip.
    - An iron blade, hammered flat.
    - A courier, by the satchel.
  good:
    - There is a dead man under the stone lip.
    - It is an iron blade. Someone has hammered it flat.
    - He was a courier. I could tell by his satchel.
  detect: "(^|[.!?]\\s+)(A|An|The|Some)\\s+[A-Za-z'-]+(\\s+[A-Za-z'-]+){0,3},\\s+(under|over|in|on|by|at|from|with|[a-z]+ed)\\b"

- id: B03-dangling-participle
  rule: An -ing phrase after an object must not be readable as describing that object; say who was doing it.
  bad:
    - I found him filling the lodge jars.
  good:
    - I found him when I was filling the water jars at the lodge.
  detect: "\\b(found|saw|heard|watched|met|caught|left|noticed)\\s+(him|her|them|it)\\s+[a-z]+ing\\b"

- id: B04-opaque-reference
  rule: Name nothing the player cannot know yet without explaining it in the same line (see the brief's player-knows list).
  bad:
    - I fill the lodge jars at first light.
    - Ask the herald.
  good:
    - Every morning I fill the water jars at the lodge, so that guests have water by their beds.
    - Ask Ixo-Vaal, the root-herald. He trades with Helstrom for the village.
  detect: review

- id: B05-compressed-reason
  rule: Give a reason as a plain clause, not a compressed phrase that leaves the player to unpack it.
  bad:
    - We keep quiet, for the beds and the rope.
  good:
    - We keep quiet, because if travellers hear of this, they will stop sleeping here and buying our rope.
  detect: "\\bfor the [a-z]+ and the [a-z]+[.!?]"

- id: B06-full-forms
  rule: Argonian and Khajiit speakers use full forms (do not, it is, you are) except when angry, dismissive or fighting; other races contract at their own rates (voices.md).
  bad:
    - It's not salt. (calm Argonian)
  good:
    - It is not salt.
    - Don't touch my pot! (angry Argonian bark)
  detect: "(?i)\\b\\w+'(re|ll|ve|d|m|t)\\b|\\b(it|that|there|he|she|what|who|here|let|where)'s\\b"
  appliesTo: [argonian, khajiit]

- id: B07-wry-quip
  rule: Argonian speakers are earnest; no dry quips at the end of a line (other races follow voices.md).
  bad:
    - He was not happy. Neither were his boots.
    - Brave travellers do not come back for stew.
  good:
    - He was angry about it, and his boots were soaked through.
    - Do not try to fight it. People who fight a wamasu do not come back.
  detect: review
  appliesTo: [argonian]

- id: B08-american-english
  rule: British spelling and punctuation; no serial comma before the last item in a list.
  bad:
    - color, honor, traveler, gray
    - Fish, roots, and eggs.
  good:
    - colour, honour, traveller, grey
    - Fish, roots and eggs.
  detect: "\\b(color|honor|favor|flavor|labor|neighbor|harbor|armor|traveler|traveling|gray|center|theater|realize|recognize|apologize|organize|defense|offense|catalog)s?\\b|\\b[A-Za-z'-]+(\\s[A-Za-z'-]+){0,2},\\s[A-Za-z'-]+(\\s[A-Za-z'-]+){0,2},\\s(and|or)\\s"

- id: B09-hidden-disposition-gate
  rule: When a line holds information back at low disposition, it must say so, so the player knows to raise it.
  bad:
    - The lodge talks of salt and nothing else. Salt, salt.
  good:
    - People at the lodge say it is salt from upstream. I think otherwise, but I do not share my thoughts with strangers.
  detect: review

- id: B10-bureaucratic-dressing
  rule: Couriers, letters, ledgers, tallies, rolls, registers, clerks, permits, papers and fines only where story/design/province-vibe.md §9 puts them (the state and its agents, Gideon, the ports and customs, ex-Archein crossings and estates, the Rose, foreigners); elsewhere use what Argonian ground uses.
  bad:
    - The tree-minder keeps a ledger of who owes what. (a tribal village)
    - Send a courier to the naheesh with the permit.
  good:
    - The tree-minder heard both of them, and everyone there remembers what was agreed.
    - Go yourself, or ask the root-herald to carry word to the naheesh.
  detect: "(?i)\\b(couriers?|dispatch(es)?|letters?|scrolls? (of|from|to)|messengers?|runners?|ledgers?|tall(y|ies|ied)|work rolls?|registers?|accounts? book|officials?|passes|sealed|seals? of|messages?|envoys?|deeds?|documents?|records(?! of thunder)|clerks?|scribes?|permits?|licen[cs]es?|paperwork|papers|filing|writ|summons|pay a fine|fined|censuses)\\b"
  severity: warn

- id: B11-warm-address
  rule: A warm address ("my friend", "brother", "dear one") at most twice in all of one person's lines, never to a stranger; it follows standing (the friend greeting is its place), not habit.
  bad:
    - Ah, my good friend, the dock is that way. (in every reply)
  good:
    - The dock? Follow the shore east. (to a stranger)
    - You came back, my friend. Sit. (the friend greeting)
  detect: "(?i)\\b(?:my (?:good |dear |old )?(?:friend|brother|sister|cousin)|friend|brother|sister|dear one|dearest|egg-kin|clutch-?mate)\\b"
  max_per_file: 2

- id: B11-macro
  rule: No text macros; Skyrim shows them as written. Use the speaker's own word, or a variant line per player race.
  bad:
    - Hear me, [player race].
  good:
    - Hear me, outlander.
  detect: '\[(player|player race|player rank|name|PCName|PCRace)\]'
