topics:
- id: topic.mn01-where
  label: Where am I?
  person: npc.mn.okeeh
  stages:
  - 10
  - 20
  - 31
  - 32
  - 33
  - 34
  - 35
  - 36
  - 37
  - 40
  essential: true
  intent: 'Okeeh. Tells: "You''re in the hold of the work barge, moored at Ashgate Landing, a reed-cutters'' camp on the
    river west of Loriasel. This is Black Marsh, the Argonians'' country." The barge brought this gang up from the sea to
    serve the Owing: months of owed work given by the marsh in place of a cell, served here cutting reed for the mat-makers
    of Stormhold. She is Okeeh, the gang''s cook. The door is locked from outside, as it is for every new gang, until the
    gang-master, a Dunmer named Dralin Uveran, takes their names onto his roll; it will not be long. She does not know the
    player''s face, and asks their name (a question; its answer is topic.mn01-name). Checks: nothing. Does: nothing.'
  uses:
  - fact.mn01.where
  - fact.mn01.owing
  - fact.mn01.locked
  new: true
- id: topic.mn01-name
  label: My name? I'll tell you.
  person: npc.mn.okeeh
  stages:
  - 10
  essential: true
  intent: 'Okeeh. Tells: she listens and says the name back, so she can shout it at mealtimes. Does: sets stage 20, whose
    start opens the game''s name entry; then she asks what the player did before the marsh caught them: "Every gang has
    a fighter, a hunter, a thief and someone who knows a poultice. What were you?" (a question; its answers are the seven
    trade topics). Checks: nothing.'
  uses: []
  new: true
- id: topic.mn01-trade
  label: What do you mean, my trade?
  person: npc.mn.okeeh
  stages:
  - 20
  essential: true
  intent: 'Okeeh. Tells: what the player did before is what they will be good at here; she lists the answers she has heard
    and what each is good for: a warrior (One-Handed, Two-Handed, Block, Heavy Armor, Smithing), a hunter (Archery, Sneak,
    Light Armor, Alchemy, One-Handed), a thief (Sneak, Lockpicking, Pickpocket, Speech, Light Armor), a battlemage (Destruction,
    Alteration, Conjuration, One-Handed, Heavy Armor), a healer (Restoration, Alchemy, Illusion, Alteration, Speech), a
    nightblade (Illusion, Sneak, One-Handed, Destruction, Light Armor), or "none of those: name me your own five". Whatever
    the player says, those five come a little easier from today. Checks: nothing. Does: nothing.'
  uses: []
  new: true
- id: topic.mn01-trade-warrior
  label: I was a warrior.
  person: npc.mn.okeeh
  stages:
  - 20
  essential: true
  intent: 'Okeeh. Tells: then the player can carry a blade and a shield; she has heard noise on the landing. Does: sets
    stage 31 (One-Handed, Two-Handed, Block, Heavy Armor and Smithing each raised by five; the door unbarred). Checks: nothing.'
  new: true
