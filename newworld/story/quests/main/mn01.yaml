- skill: Speech
  use: persuade
  reason: 'none needed: the opening has no check; the player''s profession picks their skills, which every later quest uses'
- skill: Lockpicking
  use: pick-a-lock
  reason: 'the player starts with two lockpicks for the early quests'' Novice locks (owner-bar: a skill way a level-one
    character can do)'
truth:
- id: t1
  when: four days before the game opens
  who:
  - npc.mn.okeeh
  where: Stormhold's river landing
  what: The player, a stranger with no kin in the marsh, was given months of the Owing for a debt and put on the barge with
    a new reed gang bound for Ashgate Landing. Nobody on the barge knows them.
- id: t2
  when: the night before the game opens
  who:
  - npc.mn.dralin-uveran
  where: Ashgate Landing
  what: The barge moored in the river pool below the camp. Dralin locked the new gang in the hold to sleep, as he does with
    every new gang until their names are on his roll.
- id: t3
  when: the morning the game opens
  who:
  - npc.mn.vosh-leera
  - npc.mn.dralin-uveran
  where: Ashgate Landing
  what: Vosh-Leera, root-herald of Jal-Veesa, came down the road with an order that the stranger's months be struck from
    the roll. Dralin cannot refuse a root-herald. He struck the name and lost a cutter he had paid for. She did not say
    why, and went back to Jal-Veesa. (She acts for the Toh-Reel-Ka, who comb the gangs for strangers with no kin; the player
    learns that in MN02.)
- id: t4
  when: the morning the game opens
  who:
  - npc.mn.jal-veesa-minder
  where: Jal-Veesa
  what: Weeltul, Jal-Veesa's tree-minder, has asked every gang on the river for Sithis' beard, a grey moss that hangs over
    the creek below Reed-Sill Weir, to warm her sick tree's cooling egg-pool.
playerStart:
- The player knows nothing of the marsh
- the gang or why they are here.
