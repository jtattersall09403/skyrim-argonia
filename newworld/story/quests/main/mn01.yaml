- id: 90
  place: outpost-m13-m65
  journal: text.journal.mn01.90
  journalText: Dralin Uveran, the Dunmer gang-master of Ashgate Landing, met me on the landing. My name was struck from
    his roll this morning, on an order brought by Vosh-Leera, the root-herald of Jal-Veesa, so I owe no months. He does
    not know why she wants me, and he is sour about it. I'm to go to Vosh-Leera's house in Jal-Veesa, east up the road.
    On the way, at Reed-Sill Weir, the town's tree-minder wants Sithis' beard, a grey moss that hangs over the creek below
    the weir.
  learns:
  - fact.mn01.struck
  - fact.mn01.go-to-vosh
  - fact.mn01.moss
  ending: complete
  endingId: e-freed
  directions: Jal-Veesa is east up the road from the camp's gate. Reed-Sill Weir is the first camp on the road, where the
    road meets the creek, a short walk from the gate; the town is a little further on past the weir.
  information:
    going: 'I am free of the Owing: Vosh-Leera, root-herald of Jal-Veesa, had my name struck from the roll. I do not know
      why.'
    next: Go east up the road to Vosh-Leera's House in Jal-Veesa; on the way, pick Sithis' beard below Reed-Sill Weir for
      the town's tree-minder.
    ways: The moss is a favour on the road; Vosh-Leera is where the answers are.
    carriers:
    - know: I am free and who freed me
      by:
      - journal
      - line:topic.mn01-dralin-free
    - know: a root-herald speaks for a town and its tree
      by:
