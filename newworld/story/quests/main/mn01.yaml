- id: topic.mn-owing
  label: What is the Owing?
  person: npc.mn.okeeh
  stages:
  - 10
  - 20
  - 31
  - 32
  - 33
  - 34
  - 35
  - 36
  - 37
  - 40
  - 90
  essential: false
  intent: 'Okeeh (and, by his own row, Dralin from stage 90). Tells: the Owing is the marsh''s sentence. Black Marsh''s
    own towns keep no jails; a debtor, a thief or a stranger who broke the peace is given months of owed work instead, and
    a broker sells those months to a gang-master like Dralin, who feeds the gang and works them until the months are served.
    Most of this gang owe six months or a year. Nobody counts a stranger''s months kindly. Checks: nothing. Does: nothing.'
  uses:
  - fact.mn01.owing
  new: true
- id: topic.mn-owing
  label: What is the Owing?
  person: npc.mn.dralin-uveran
  stages:
  - 90
  essential: false
  intent: 'Dralin. Tells: months of work owed instead of a cell; he buys them from the broker at Stormhold and his cutters
    work them off on the reed beds. The player''s months were bought and are gone now, and that is his loss, not theirs.
    Checks: nothing. Does: nothing.'
  uses:
  - fact.mn01.owing
  new: true
- id: topic.mn-hist
  label: What is a Hist?
  person: npc.mn.okeeh
  stages:
  - 10
  - 20
  - 31
  - 32
  - 33
  - 34
  - 35
  - 36
  - 37
  - 40
  - 90
  essential: false
  intent: 'Okeeh, an Argonian. Tells: a Hist is one of the great trees of Black Marsh, and they think. A Hist is as tall
    as a tower, with pale grey bark and roots standing up out of the water, and a pool at its foot where the eggs lie among
    the roots. Every Argonian village is built round its own tree. On a hatchling''s naming day it licks its tree''s sap,
    and the sap shapes it for life; her own tree is far to the south, and she still dreams of it. All the trees are joined
    at the root, so what one knows the others can know. An Argonian with a hand on the bark can hear them. They are not
    just trees: if a village''s tree dies, no egg in its pools will hatch again. Checks: nothing. Does: nothing.'
  uses:
  - fact.mn01.hist
  new: true
- id: topic.mn-hist
  label: What is a Hist?
  person: npc.mn.dralin-uveran
  stages:
  - 90
  essential: false
  intent: 'Dralin, a Dunmer. Tells: the Argonians'' great trees, grey-barked and as big as towers, with an egg-pool at the
    foot; every village stands round one, and they say the trees think. He has seen men stand with a hand on one for an
    hour. Jal-Veesa''s is the tall grey tree in the pool at the middle of the town, and it has looked poorly since the rains.
    Checks: nothing. Does: nothing.'
  uses:
  - fact.mn01.hist
  new: true
