  - 32
  - 33
  - 34
  - 35
  - 36
  - 40
  essential: true
  intent: 'Dralin Uveran, a step from the hold''s door as the player comes out. Tells: he is Dralin Uveran, gang-master
    here. The player''s name is not on his roll: it was struck this morning, before they cut a single reed, on an order
    brought down the road by Vosh-Leera, the root-herald of Jal-Veesa, the one who speaks for that town''s elders and its
    tree to outsiders. He cannot refuse a root-herald. "You must have friends in high places." He paid for the player''s
    months and has lost them. She wants the player at her house in Jal-Veesa, east up the road; he does not know why and
    does not care to. While they are going that way: the town''s tree-minder has asked every gang on the river for Sithis''
    beard, a grey moss that hangs over the creek below Reed-Sill Weir, the weir-wardens'' camp where the road meets the
    creek. Mind the crocodiles under the weir. Does: sets stage 90. Checks: nothing.'
