recordStatus: design
foundation: 'Built from main-plot.md §5 quest 1 (passed by the owner, 2026-11-17) and §1. The game opens in the hold of
  the Owing barge moored at Ashgate Landing; the hold''s door is locked. Okeeh, the gang''s cook, asks the player''s name
  (the "player''s name set from a conversation" block: the stage after her line opens the game''s own name entry) and their
  trade (a profession as in Morrowind: each answer sets a stage that raises five skills by five; one answer lets the player
  name their own five, one at a time, each pick a stage that raises that skill by five). When the trade is given the door
  is unlocked from outside. Dralin Uveran, the gang-master, speaks first on the landing (the quest''s one speaks-first line),
  says the player''s name was struck from his roll this morning on Vosh-Leera''s order, and sends them to her house in Jal-Veesa,
  passing on the tree-minder''s request for Sithis'' beard from Reed-Sill Weir on the way. The player''s pack holds two
  lockpicks. MN02 starts on this quest''s stage 90 and carries the markers on the weir''s moss and on Vosh-Leera''s door.
  The side quest What the Herald Sent is left out: the main quest only. Okeeh and Dralin first answer the line''s shared
  topics Hist, Jal-Veesa and the Owing.'
recordSources:
  place: outpost-m13-m65 (place card --mined, 2026-11-17); the barge's hold is Black Marsh & Valenwood's interior cell 01dock3to4
    ("Ship"), main-plot §9 "The barge"
  lore:
  - story/lore/topics/hist-and-sap.md (lines 15-16
  - 31-32
  - 54-56
  - 78-80
  - 106-107)
  - story/lore/extrapolation/argonia-4e201-state.md §1, §2.5
  - story/lore/topics/labour-and-bondage.md (the Owing)
  - story/design/province-vibe.md §5 §9
