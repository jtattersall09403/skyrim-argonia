- id: fact.mn01.where
  claim: The player is in the hold of an Owing barge moored at Ashgate Landing, a reed-cutters' camp on the river west of
    Loriasel, in Black Marsh.
  from: t2
- id: fact.mn01.owing
  claim: 'The Owing is the marsh''s sentence: months of owed work in place of a cell. The gang is here to serve its months
    cutting reed.'
  from: t1
- id: fact.mn01.locked
  claim: The hold's door is locked from outside until the gang-master takes the new gang's names.
  from: t2
- id: fact.mn01.struck
  claim: 'The player''s name was struck from the gang-master''s roll this morning, on an order brought by Vosh-Leera, the
    root-herald of Jal-Veesa: they owe no months and are free.'
  from: t3
- id: fact.mn01.go-to-vosh
  claim: Vosh-Leera wants to see the player at her house in Jal-Veesa, a town up the road to the east.
  from: t3
- id: fact.mn01.moss
  claim: Jal-Veesa's tree-minder wants Sithis' beard, a grey moss hanging over the creek below Reed-Sill Weir, which is
    on the road to the town.
  from: t4
- id: fact.mn01.hist
  claim: A Hist is a great thinking tree, the size of a tower, with pale grey bark, roots standing out of the water and
    a pool of eggs at its foot; every Argonian village is built round one.
  from: hist-and-sap.md
