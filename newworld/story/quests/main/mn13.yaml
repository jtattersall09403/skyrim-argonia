recordStatus: design
foundation: 'Built from the main plot (§5 quest 13, passed by the owner). The hunt, begun by MN11''s report beside the
  player''s own errand to Fort Chalkmoth (MN12); either may come first. The steward of Bell Station names Teku-Sul and
  marks it, and does not lead the player down; she sells potions of waterbreathing, and the Hist''s blessing, a spell,
  an enchantment or being Argonian serves as well. If the steward is dead, the station''s head diver names the tower
  instead, so neither is a who-must-live row. The tower''s source, Teeth of Sithis, gives the East Xanmeer (the dry east
  halls, where the drowned priests'' attendants walk), the Halls (the gallery and the great gate with three empty sockets,
  King of the Murkmire''s crystal pedestals in a gate of its Xanmeer pieces) and the West Xanmeer behind the gate (for
  MN17 to MN19). The priest''s ghost before the gate is the quest''s one speaker who speaks first; his words say what a
  seal-stone is, where each went and that all three open the gate. The report to Never-Writes-Twice gives the rank of
  Reel-Ka (a cuirass and helm of Stormhold Warrior Armor under our name, free beds in every Archwarden fort and 300
  gold) and marks the three places, starting MN14, MN15 and MN16 together. Who the quest cannot go on without:
  Never-Writes-Twice.'
