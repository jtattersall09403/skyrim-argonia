- id: 30
  place: helstrom
  journal: text.journal.mn13.30
  journalText: 'Before the great gate in Teku-Sul stands the ghost of a priest of the old kings, Sul-Xeeth. The gate has
    three empty sockets, one for each seal-stone the last king''s priests cut, and only all three open it. One lies in
    the warden''s vault at Blackrose Prison, one in the flooded vaults of Gemin, one in the deepest hall of Vorannuhl.
    I''m to tell Never-Writes-Twice in Nesh-Deeka''s House in Helstrom.'
  objectives:
