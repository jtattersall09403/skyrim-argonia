topics:
- id: topic.mn13-which-tower
  label: Which tower does this stone show? (the seven towers in the sea)
  person: npc.mn.meer-tasi
  stages: [10]
  essential: true
  intent: 'Meer-Tasi, steward of Bell Station. Tells: she knows the cut tower at once: Teku-Sul Spire, the drowned tower
    nearest Lilmoth, west of the station on the sea floor; her divers stripped its upper floors long ago; past its east
    halls stands a great gate with three empty sockets that nobody has forced, and divers say a priest''s ghost stands
    before it; the dive is long and drowns the careless: take a Hist''s blessing, a spell or potion of waterbreathing
    (she sells them) or an enchantment, unless you breathe water already; inside there is air; she will not send a diver
    down with the player. Checks: nothing. Does: sets stage 20.'
  uses: [fact.mn13.teku-sul, fact.mn13.dive]
  new: true
- id: topic.mn13-diver-tower
  label: Which tower does this stone show?
  person: npc.mn.bell-diver
  stages: [10]
  essential: true
  when:
    not: {npcAlive: npc.mn.meer-tasi}
  intent: 'Sees-Below, head diver, only while the steward is dead. Tells: the same as the steward: Teku-Sul, the nearest
    drowned tower, its sealed gate, the long dive and what keeps a diver breathing; the potions are in the steward''s
    chest now. Checks: nothing. Does: sets stage 20.'
  uses: [fact.mn13.teku-sul, fact.mn13.dive]
  new: true
- id: topic.mn13-buy-potion
  label: I'll buy potions of waterbreathing.
  person: npc.mn.meer-tasi
  stages: [10, 20, 30, 90, 91]
  essential: false
  intent: 'Meer-Tasi. Tells: she opens her stock; a potion of waterbreathing lasts long enough for the dive down if the
    diver does not dawdle; take two. Checks: nothing. Does: opens her trade.'
  uses: [fact.mn13.dive]
  new: true
- id: topic.mn13-steward-who
  label: Who are you?
  person: npc.mn.meer-tasi
  stages: [10, 20, 30, 90, 91]
  essential: false
  intent: 'Meer-Tasi. Tells: steward of Bell Station for Lilmoth''s merchant council; her crew dive the drowned spires
    and she weighs every find and sets aside the council''s share. Checks: nothing. Does: nothing.'
  uses: [fact.mn13.teku-sul]
  new: true
- id: topic.mn13-teku-sul
  label: Tell me about Teku-Sul.
  person: npc.mn.meer-tasi
  stages: [20, 30, 90, 91]
  essential: false
  intent: 'Meer-Tasi. Tells: the spires stand on the sea floor of Benthic Yobesh, towers of the land that sank before
    the kings fell; Teku-Sul is the nearest to Lilmoth; the drowned priests'' attendants still walk its east halls and
    strike at divers, a great mudcrab keeps one gallery, and her divers pray before they go in. Checks: nothing. Does: nothing.'
  uses: [fact.mn13.teku-sul]
  new: true
- id: topic.mn13-diver-who
  label: Who are you?
  person: npc.mn.bell-diver
  stages: [10, 20, 30, 90, 91]
  essential: false
  intent: 'Sees-Below. Tells: the station''s head diver; he has touched Teku-Sul''s gate and would give a year''s share to
    see it open. Checks: nothing. Does: nothing.'
  uses: [fact.mn13.teku-sul]
  new: true
- id: topic.mn-seal-stones
  label: (the ghost speaks first) Who comes to the gate?
  person: npc.mn.priest-ghost
  kind: speaks-first
  stages: [20]
  essential: true
  intent: 'The Ghost of Sul-Xeeth, first speaker of this shared topic, before the gate. Tells: he was a priest of the
    last king; when the king fell, his priests shut the tower''s lowest halls, the way to the Root (where the roots of every Hist meet under the sea and the Eye sits), behind this gate;
    they cut three seal-stones, one for each socket, and sent them far apart so that no one hand could open it; set all
    three and the gate opens, no fewer; one went with a masked thief who sought the Eye and died in the cells of Blackrose
    Prison, and the warden took it into his vault; one lies in the flooded vaults of Gemin; one in the deepest hall of
    Vorannuhl. Checks: nothing. Does: sets stage 30.'
  uses: [fact.mn13.seal-stones, fact.mn13.where-stones]
  new: true
- id: topic.mn13-stone-places
  label: Tell me again where the stones lie.
  person: npc.mn.priest-ghost
  stages: [30, 90, 91]
  essential: false
  intent: 'The Ghost of Sul-Xeeth. Tells: Blackrose Prison, in the warden''s vault; Gemin, in its drowned lowest hall;
    Vorannuhl, behind a bronze-locked door in its deepest hall. Checks: nothing. Does: nothing.'
  uses: [fact.mn13.where-stones]
  new: true
- id: topic.mn13-ghost-who
  label: Who are you?
  person: npc.mn.priest-ghost
  stages: [20, 30, 90, 91]
  essential: false
  intent: 'The Ghost of Sul-Xeeth. Tells: a priest of the old kings, who served in this tower when it stood in air; he
    keeps the gate until all three stones come back. Checks: nothing. Does: nothing.'
  uses: [fact.mn13.seal-stones]
  new: true
- id: topic.mn13-report
  label: The gate at Teku-Sul needs three seal-stones, and I know where they are.
  person: npc.mn.never-writes-twice
  stages: [30]
  essential: true
  intent: 'Never-Writes-Twice. Tells: she makes the player a Reel-Ka, "Warrior", the order''s third rank, and gives the
    order''s heavier cuirass and helm, three hundred gold and a free bed in every Archwarden fort; her orders are to take
    all three stones before the Unbound do; she marks Blackrose Prison, Gemin and Vorannuhl and says to take them in any
    order, Blackrose the least dangerous and Vorannuhl the worst. Checks: nothing. Does: sets stage 90 (91 if Fort Chalkmoth
    is done).'
  uses: [fact.mn13.orders]
  new: true
- id: topic.mn-ranks
  label: What does Reel-Ka mean?
  person: npc.mn.never-writes-twice
  stages: [90, 91]
  essential: false
  intent: 'Never-Writes-Twice answering the shared topic (first written by Nesh-Deeka in MN05). Tells: Reel-Ka is "Warrior";
    above it are Ka-Deelith, "War-Teacher", and Toh-Nassa, "Leader of the Secret". Checks: nothing. Does: nothing.'
  uses: []
  new: false
