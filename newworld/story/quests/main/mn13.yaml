    text: text.objective.mn13.report
    objectiveText: Tell Never-Writes-Twice in Nesh-Deeka's House, Helstrom, what the ghost said.
    target: npc.mn.never-writes-twice
    completeWhen:
      questStage: [quest.main.mn13, ≥, 90]
