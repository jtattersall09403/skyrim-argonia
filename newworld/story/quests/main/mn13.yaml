- id: 90
  place: helstrom
  journal: text.journal.mn13.90
  journalText: 'Never-Writes-Twice made me a Reel-Ka, a Warrior of the order, and gave me its heavier armour, three hundred
    gold and a free bed in every Archwarden fort. Her orders are to take all three seal-stones before the Unbound do.
    I''m to fetch them from Blackrose Prison, Gemin and Vorannuhl, in any order; all three are marked, Blackrose the
    least dangerous and Vorannuhl the worst. My own errand to Fort Chalkmoth is still open.'
