truth:
- id: t1
  when: the fall of the last of the old kings
  who: [npc.mn.priest-ghost]
  where: Teku-Sul Spire
  what: The last king's priests shut the tower's lowest halls behind a great gate, cut three seal-stones whose sockets
    open it, and sent the stones away from the tower so that no one hand could open it (place record, history; plot §5).
- id: t2
  when: after the fall, over the ages
  who: [npc.mn.priest-ghost]
  where: the gate
  what: 'The stones came to rest where the plot names them: one in a thief''s cell in Blackrose Prison (a masked thief
    who sought the Eye died in the Rose''s cells and his stone lies in the warden''s vault), one in the flooded vaults
    of Gemin, one in the deepest hall of Vorannuhl. The priest''s ghost stands before the gate and knows where each lies.'
- id: t3
  when: for years
  who: [npc.mn.meer-tasi, npc.mn.bell-diver]
  where: Bell Station
  what: The station's divers have stripped Teku-Sul's upper floors and know its great gate, which they have never forced.
    They know the marker stone's cut tower by its shape.
- id: t4
  when: at the report
  who: [npc.mn.never-writes-twice]
  where: Nesh-Deeka's House, Helstrom
  what: Never-Writes-Twice's orders are to take all three stones before the Unbound do.
playerStart: ['The marker stone''s marked tower is one of the drowned spires off Lilmoth, and the divers of Bell Station,
    on an islet east of Lilmoth, will know which (MN11).', 'The Eye of Argonia lies at the Root, behind a gate the old
    kings sealed (MN05).', 'The Unbound want the Eye and are brewing a draught to kill what guards the Root.', 'The player
    is a Toh-Wo; their own errand to Fort Chalkmoth (MN12) may be open or done.']
facts:
- {id: fact.mn13.teku-sul, claim: 'The cut tower on the marker stone is Teku-Sul Spire, the drowned tower nearest Lilmoth,
    whose great gate Bell Station''s divers have never forced.', from: t3}
- {id: fact.mn13.dive, claim: 'The dive to Teku-Sul is long; a diver needs a Hist''s blessing, a spell or potion of waterbreathing
    or an enchantment, unless they are Argonian; there is air inside the tower.', from: t3}
- {id: fact.mn13.seal-stones, claim: 'Three seal-stones, cut by the last king''s priests, each fit one socket of the
    great gate; set all three and the gate opens to the Root.', from: t1}
- {id: fact.mn13.where-stones, claim: 'One seal-stone lies in Blackrose Prison, where a masked thief who sought the Eye
    died in the cells and his stone went to the warden''s vault; one in the flooded vaults of Gemin; one in the deepest
    hall of Vorannuhl.', from: t2}
- {id: fact.mn13.orders, claim: Never-Writes-Twice's orders are to take all three stones before the Unbound do., from: t4}
