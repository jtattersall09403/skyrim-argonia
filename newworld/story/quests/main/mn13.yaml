shapeData:
  route: boat to Lilmoth and on to Bell Station; the long dive from the station to Teku-Sul Spire; back by boat to Helstrom
  hazards: drowning on the long dive; the drowned priests' attendants in the east halls; reef slaughterfish at the lower
    windows and the giant mudcrab in its gallery (the place's own)
  goal: the great gate and what the ghost knows
  wonder: a great carved gate under the sea with three empty sockets, and a priest's ghost who has waited before it since
    the last king fell
  rule: all three seal-stones open the gate; none alone does
