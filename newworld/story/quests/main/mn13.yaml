- id: 20
  place: sunken-ruin-23-m112
  journal: text.journal.mn13.20
  journalText: 'The steward, Meer-Tasi, knew the cut tower at once: Teku-Sul Spire, the drowned tower nearest Lilmoth,
    whose great gate her divers have never forced. The dive is long. I need a Hist''s blessing, a spell or potion of waterbreathing
    (she sells them) or an enchantment, unless I am Argonian; inside the tower there is air. I''m to dive to Teku-Sul
    and find the great gate. The drowned priests'' attendants walk its east halls; I may fight them or slip past.'
