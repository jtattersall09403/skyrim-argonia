- id: 30
  place: sunken-ruin-23-m112
  journal: text.journal.mn17.30
  journalText: "Cuts-the-Old-Knot waited before the Kings' Gate without stones, and told me what the order I serve is.
    The Toh-Reel-Ka are the secret warriors of the Xeech-Leel, the party that rules Black Marsh, made so that no tree
    could bring another Umbriel. They keep dreamers in the cellar of Fort Chalkmoth: people fed sap and made to tell
    the visions the trees send them, so the order sees the whole marsh. She was a dreamer for nine years, and
    Never-Writes-Twice kept the key. She seals the trees she drains so the dreamers cannot see through them. Used where
    it sits, the Eye heals every tree, and the dreamers see through them all again; lifted, it parts the trees, about
    three in ten die, and the dreams end. If I fight her, I take her tomes, staff and draughts, face the guardian
    alone, and cannot give her the Eye. If I believe her, she fights the guardian beside me and giving her the Eye
    stays open. Either way the choice at the Eye is mine, and now I must choose between fighting her and believing
    her."
  objectives:
  - id: choose
    text: text.objective.mn17.choose
    objectiveText: Fight Cuts-the-Old-Knot, or believe her.
