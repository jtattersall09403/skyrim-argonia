topics:
- id: topic.mn-ranks
  label: What do the order's ranks mean?
  person: npc.mn.never-writes-twice
  stages:
  - 10
  - 20
  - 21
  intent: 'Never-Writes-Twice. Tells: the Toh-Reel-Ka''s ranks, lowest first, are Voh-Vastei, "Apprentice"; Toh-Wo, "Secret-Speaker";
    Reel-Ka, "Warrior"; Ka-Deelith, "War-Teacher", who may teach the order''s fighters; and Toh-Nassa, "Leader of the Secret",
    the order''s highest.'
  new: false
- id: topic.mn17-report
  label: I have all three seal-stones.
  person: npc.mn.never-writes-twice
  stages:
  - 10
  essential: true
  when:
    all:
    - hasItem:
      - thing.mn.seal-stone-thief
      - 1
    - hasItem:
      - thing.mn.seal-stone-vault
      - 1
    - hasItem:
      - thing.mn.seal-stone-deep
      - 1
  intent: 'Never-Writes-Twice, at the back of Nesh-Deeka''s House. Tells: she looks at each stone and does not take them;
    the player has done what the order''s best could not and is now a Ka-Deelith, a War-Teacher, the fourth rank, with the
    right to teach the order''s fighters; she gives the gauntlets and boots that finish the order''s heavier armour. Her
    watchers have not seen the Unbound anywhere near Teku-Sul, so the player is ahead of them and must go now. The order:
    dive to Teku-Sul, set the stones in the Kings'' Gate, use the Eye where it sits so that strength runs down every root
    and every tree is healed; do not lift it, for lifted it parts the trees. Then take the stones back from the gate and
    bring them to her, so the chamber is sealed for good and nobody reaches the Eye again. Then find Cuts-the-Old-Knot and
    kill her, and rid the marsh of the Unbound. She asks which weapon of the order the player will carry: the pike or the
    claws (topic.mn17-pike and topic.mn17-claws). Fallback when the stones are not all held: bring all three.'
  uses:
  - fact.mn17.ahead
  - fact.mn17.order
  new: true
- id: topic.mn17-pike
  label: The pike.
  person: npc.mn.never-writes-twice
  stages:
  - 10
  essential: true
  when:
    topicHeardFrom:
    - topic.mn17-report
    - npc.mn.never-writes-twice
  intent: 'Never-Writes-Twice. Tells: a Ka-Deelith''s pike, that drinks the life of what it strikes; go now. Does: sets
    stage 20.'
  new: true
- id: topic.mn17-claws
  label: The claws.
  person: npc.mn.never-writes-twice
  stages:
  - 10
  essential: true
  when:
    topicHeardFrom:
    - topic.mn17-report
    - npc.mn.never-writes-twice
  intent: 'Never-Writes-Twice. Tells: a Ka-Deelith''s claws, that stun and burn what they strike; go now. Does: sets stage
    21.'
  new: true
- id: topic.mn17-how-know
  label: How do you know the Unbound are not at Teku-Sul?
  person: npc.mn.never-writes-twice
  stages:
  - 10
  - 20
  - 21
  intent: 'Never-Writes-Twice. Tells: "We listen." The order hears what passes in the marsh; she turns the question aside,
    as Nesh-Deeka always did.'
  new: true
- id: topic.mn-fort-chalkmoth
  label: Fort Chalkmoth
  person: npc.mn.never-writes-twice
  stages:
  - 10
  - 20
  - 21
  intent: 'Never-Writes-Twice. Tells: a fort like any other; what is in its cellar is the order''s business and not a Ka-Deelith''s
    yet.'
  new: false
- id: topic.mn17-cuts-truth
  label: (speaks first)
  person: npc.mn.cuts-the-old-knot
  kind: speaks-first
  stages:
  - 20
  - 21
  essential: true
  intent: 'Cuts-the-Old-Knot, before the gate, staff lowered, with no stones. Tells, in order: she knows who the player
    is and what they carry; she cannot open the gate without them. "How did your handler always know where to send you?
    Why was there sap in a fort with no tree (the jar of Jal-Veesa sap the player took from the store, thing.mn12.sap-jar)?
    Who did you think was behind the cellar door? And why did nobody warn you that we were here?" The Toh-Reel-Ka keep people
    in the cellar of Fort Chalkmoth, feed them sap and make them tell their dreams; a dreamer sees what any tree has seen,
    anywhere, and through them the order sees the whole marsh. The moans were dreamers. She was one for nine years; Never-Writes-Twice
    kept the key, and her story that Cuts went mad on sap and killed her minders is a lie. The answer to the player''s question:
    she seals each tree she drains so the order draws no sap from it for its dreamers and its dreamers cannot see her through
    it; under the sea there are no trees, so nobody saw her here. She never meant a tree to die of her seal, and some have.
    She grants the order its reason: no second Umbriel, the flying city that the An-Xileel called down on Lilmoth with Lilmoth''s
    mad Hist in 4E 48, whose dead killed the city''s people. But the Xeech-Leel, the party that has ruled Black Marsh since
    the An-Xileel fell and that made the Toh-Reel-Ka, took the marsh by being not the An-Xileel and now rule unseen through
    the trees as the An-Xileel did. The healing the player was sent to do is for the dreamers: a sick tree shows them nothing,
    a healed one shows them everything, and the stones "kept safe" mean only the order can ever reach the Eye. She wants
    the Eye lifted, which parts the trees, ends the dreams and breaks the order; many trees will die of it, with the villages
    under them, and she will not pretend otherwise. She asks the player to stand with her or fight her here (answers: topic.mn17-fight,
    topic.mn17-believe). Does: sets stage 30.'
  uses:
  - fact.mn17.dreamers
  - fact.mn17.she-was-one
  - fact.mn17.why-seal
  - fact.mn17.healing-for-dreamers
  - fact.mn17.lift
  - fact.mn17.unseen-here
  new: true
- id: topic.mn17-cellar
  label: Tell me about the cellar.
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: the dreamers lie behind the locked door the player heard; they are given sap each night and asked
    each morning what they saw; she was there nine years; she found a way out and will not say how, because the way may
    still serve the others.'
  new: true
- id: topic.mn17-why-seal
  label: Why seal a tree you have drained?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: so the order gets no sap from it for its dreamers and its dreamers cannot see through it where she
    goes. The seal is a paralysis poison; it numbs the scar shut. She meant it to close a tree, not kill it, and some have
    died; she carries that.'
  new: true
- id: topic.mn17-what-order-wants
  label: What does the order really want with the Eye?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: every tree healed is a tree their dreamers can see through again; the stones taken home mean nobody
    but them reaches the Eye after; the Xeech-Leel''s rule rests on the dreamers.'
  new: true
- id: topic.mn17-lift
  label: What happens if the Eye is lifted?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: every tree is cut from every other for good; no dreamer sees through them again; the strong trees
    live alone; the weak die, perhaps three in ten, and their villages with them, because no egg in a dead tree''s pool
    hatches. She thinks a free marsh is worth that. If the player asks about Jal-Veesa''s or Teel-Fen''s tree, she says
    she does not know which will die.'
  new: true
- id: topic.mn17-if-fight
  label: And if I fight you?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: then she drinks the draught she brewed for the guardian and the player will have to kill her; they
    may take what she carries, her tomes and her staff and the rest of the draught, and face the guardian alone; and the
    Eye will be theirs to use or lift, never hers.'
  new: true
- id: topic.mn17-if-believe
  label: And if I believe you?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  intent: 'Cuts. Tells: she goes through the gate with them when it opens and fights the guardian at their side; she asks
    for no promise now; at the Eye the choice is theirs, to use it as the order wants, lift it themselves, or let her lift
    it. If they use it while she lives, the sap she has drunk will carry its power through her, and she knows it.'
  new: true
- id: topic.mn17-fight
  label: The order sent me to kill you. I will.
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  essential: true
  intent: 'Cuts. Tells: then so be it; she drinks. Does: sets stage 40; she turns hostile (speaker_hostile) and drinks her
    draught.'
  grants:
  - speakerHostile
  new: true
- id: topic.mn17-believe
  label: I believe you. Open the gate with me.
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  essential: true
  intent: 'Cuts. Tells: then set the stones; she will be at their side beyond the gate. Does: sets stage 90 (flag.mn.cuts-believed).'
  new: true
- id: topic.mn-cuts-the-old-knot
  label: Who are you?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  - 90
  intent: 'Cuts. Tells: she leads the Unbound, the tribeless who belong to no tree''s village; her name is the one she gave
    herself when she got out of the cellar.'
  new: false
- id: topic.mn-umbriel
  label: Umbriel
  person: npc.mn.cuts-the-old-knot
  stages:
  - 30
  - 90
  intent: 'Cuts. Tells: the An-Xileel spoke alone with Lilmoth''s mad tree and brought the city down; the order was made
    so nobody could do it again, and now the order speaks alone with every tree.'
  new: false
- id: topic.mn-the-hunt
  label: Remind me what we are hunting, and why.
  person: npc.mn.never-writes-twice
  stages:
  - 10
  - 20
  - 21
  intent: 'Never-Writes-Twice, at the back of Nesh-Deekas House. Tells: the Eye of Argonia is the old priest-kings jewel,
    cut from Hist amber. It sits at the Root, the place under the sea below Teku-Sul Spire where the roots of every Hist
    meet. Used where it sits, it pours strength down every root and heals every sick tree; lifted from its place, it cuts
    every tree from every other for good. The last king shut it behind the Kings Gate, which opens only with its three seal-stones:
    the thiefs stone in Blackrose Prison, the stone in the flooded vaults of Gemin and the stone in the deepest hall of
    Vorannuhl. A beast guards the Root; Cuts-the-Old-Knot brews a draught from drained sap strong enough to kill it, so
    she can reach the Eye. The orders aim: take the stones first, open the gate, use the Eye in place to heal the trees,
    bring the stones back to her so the chamber is sealed for good, and end the Unbound. She looks at the stones the player
    carries and names the places of those still missing.'
  new: false
