foundation: 'Written 2026-11-17 from main-plot.md quest 16''s leads-on, quest 17 and §7. Whichever stone quest ends last
  ends at its stage 93 (all three held), which starts this quest. Stage 10 is the report with three stones in hand: at Never-Writes-Twice,
  who stands at the back of Nesh-Deeka''s House in Helstrom, the player is made a Ka-Deelith (pike or claws, and the rest
  of the Stormhold set) and given the last order. Then the dive; the Unbound rearguard in the east halls; Cuts-the-Old-Knot
  before the gate speaks first (this quest''s one speaks-first) and tells the truth, calling back to MN05 to MN13; the player
  fights her or believes her. Believing sets flag.mn.cuts-believed, which MN18 reads when the gate opens.'
