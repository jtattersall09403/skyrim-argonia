  information:
    going: 'The Toh-Reel-Ka are the secret warriors of the Xeech-Leel, the party that rules Black Marsh; they were made
      so that no tree could bring another Umbriel, the flying city the An-Xileel called down on Lilmoth with its mad Hist.
      The dreamers are people the order keeps in Fort Chalkmoth''s cellar, fed sap and made to tell what the trees have
      seen. Cuts-the-Old-Knot told me what the Toh-Reel-Ka are: they see the marsh through sap-fed dreamers in Fort Chalkmoth''s
      cellar, the moaning I heard. She seals trees to blind them, not to kill the trees. The healing I was sent to do would
      let the dreamers see again, and the stones in the order''s hands would keep the Eye theirs. She wants the Eye lifted,
      which ends the dreams and kills many trees. This answers the question in my journal. Used where it sits, the Eye heals
      every tree and lets the dreamers see through them all; lifted, it parts the trees for good, about three in ten die,
      and the dreams end'
    next: choose whether to fight her or believe her
    ways: 'fight: the hardest fight yet (she drinks her draught and fights as a battlemage); I get her spell tomes, robes,
