foundation: Built from main-plot.md §5 quest 4. Starts on any of MN03's complete endings (90, 91, 92), all of which leave
  the player holding the note that names Karsh-Naal Camp; this quest's first stage marks the camp on the map. Sesk is caged
  at the camp's edge (Skyrim's whole cage, bars and door, placed; Novice lock); its key is on Jeeta-Sakka, the guard who stands at the fire
  with three others, away from the cage. The player picks the cage, lifts the key or kills the guards; opening the cage
  door (a use hook) moves the quest. Sesk names the Unbound and Cuts-the-Old-Knot, says the sap is for a draught that has
  something to do with "the Eye", and calls the grey paste "the seal". Back in Jal-Veesa Vosh-Leera sends the player to
  the order's handler in Helstrom and pays 100 gold; Weeltul, at the Hist pool, explains the rootworm and its 25-gold fare,
  and the quest ends there; MN05 carries the ride and the handler's house. The fare is taken by the rootworm stop's own
  travel line (the tree-minder is the stop's operator; tools/places/build.py plan_travel writes the line and TIF_ARG_BoatTravel removes the fare), so
  this record only states it. Sesk leaves the camp; the ending switches her off there and on at Helstrom's city landing,
  where she waits for a raft down the river and owes the player (her side quest, main-plot §6, hangs on that line).
