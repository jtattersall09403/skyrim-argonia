- id: 40
  place: jal-veesa
  journal: text.journal.mn04.40
  journalText: "Vosh-Leera says this is more than a herald can judge, and paid me a hundred gold. She is sending me to
    the order's handler, Nesh-Deeka, at her house in Helstrom, far to the south through deadly country. She told me to
    ride the rootworm, a worm with clear flesh that races through the tunnels the Hist roots make, swallows its rider
    whole and lets them off where an air pocket lies under a tree's root pool. A root-tender at each pool takes the
    fare. Here the tender is Weeltul, at the Hist pool in the middle of the town, and the fare is twenty-five gold. I
    should ask her to send me."
  onEnter:
