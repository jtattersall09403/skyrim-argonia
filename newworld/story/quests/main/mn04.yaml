topics:
- id: topic.mn04-sesk-call
  label: "Who's in the cage?"
  person: npc.mn.sesk
  stages:
  - 10
  - 15
  essential: true
  intent: "Sesk, low, through the bars, when the player speaks to her (she never calls out; a sneaking player stays
    unseen). Tells: she is Sesk, a Naga; she drew sap for the people who send their jars here, and they caged her for
    trying to leave with her pay. She asks the player to free her: she knows who takes the sap and what it is for, and
    will tell them everything the moment they get her out. The key is on Jeeta-Sakka, the big one at the fire; the lock
    is a poor one; the guards never look this way, but if they catch the player at the cage or in Jeeta-Sakka's pouch,
    all four will come. Checks: nothing. Does: sets stage 20."
  new: true
- id: topic.mn04-sesk-who
  label: Who are you?
  person: npc.mn.sesk
  stages: [10, 15, 20, 90]
  essential: false
  intent: 'Sesk. Tells: a Naga: the Naga are tribeless Argonians of the deep marsh, tall and hard, who sell their blades
    or their hands to whoever pays. She drew sap for the Unbound and tried to leave with her pay. Checks: nothing. Does:
    nothing.'
  new: true
- id: topic.mn04-sesk-talk
  label: "The cage is open. Tell me about the sap."
  person: npc.mn.sesk
  stages: [10, 15, 20]
  essential: true
  intent: "Sesk, the moment the cage door is open (she stands inside the cage, so this is the first thing she says once
    the player can reach her). Tells: the crews who drain the trees are the Unbound, a cult of the tribeless, and their
    leader is Cuts-the-Old-Knot, an Argonian woman; she never stays where her crews are. Sesk drew sap for them: cut
    the scar, fill the jars, press the grey paste in after. They call the paste \"the seal\"; she never knew what is in
    it, and she was told never to leave a scar open. The jars come here and go on to Cuts-the-Old-Knot. The sap is for
    a draught she brews, and the draught is for something to do with \"the Eye\"; Sesk never learned what. She wants
    out, with the price of a boat, and goes now, before the guards look round. Does: sets stage 30. Checks: nothing."
  uses:
  - fact.mn04.unbound
  - fact.mn04.draught
  - fact.mn04.seal
  new: true
- id: topic.mn04-sesk-landing
  label: You got out of the camp, then.
  person: npc.mn.sesk
  stages:
  - 90
  essential: false
  intent: 'Sesk, at Helstrom''s city landing. Tells: she walked south through the marsh by night and came here for the
    rafts; she waits for one going down the river, as far from the Unbound as the water runs. She has not forgotten the
    cage: she owes the player, and a Naga pays what she owes. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-unbound
  label: Who are the Unbound?
  person: npc.mn.sesk
  stages:
  - 20
  essential: false
  intent: 'Sesk. Tells: tribeless people, Argonians with no tree or kin that will have them, and a few others, who follow
    Cuts-the-Old-Knot. They pay well in coin and say they will set the marsh free; she never learned free of what. They
    move in small crews and meet nowhere twice. Checks: nothing. Does: nothing.'
  uses:
  - fact.mn04.unbound
  new: true
- id: topic.mn-cuts-the-old-knot
  label: Who is Cuts-the-Old-Knot?
  person: npc.mn.sesk
  stages:
  - 20
  essential: false
  intent: 'Sesk. Tells: the Unbound''s leader. Sesk saw her once: an Argonian woman, thin, quiet, who looked at the trees
    as if they had wronged her. She never stays where her crews are. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-the-seal
  label: What is the seal?
  person: npc.mn.sesk
  stages:
  - 20
  essential: false
  intent: 'Sesk. Tells: the grey paste the crews press into a scar after they drain it; the cut closes over it. It comes
    in bottles from Cuts-the-Old-Knot''s people. Sesk does not know what is in it or why they use it. Checks: nothing. Does:
    nothing.'
  uses:
  - fact.mn04.seal
  new: true
- id: topic.mn04-vosh-report
  label: I found where the sap goes.
  person: npc.mn.vosh-leera
  stages:
  - 30
  essential: true
  intent: "Vosh-Leera. Tells: she hears it all: the Unbound, Cuts-the-Old-Knot, a draught, \"the Eye\", the seal. This
    is more than a herald can judge. The order's handler for this country is Nesh-Deeka, who keeps a quiet house in
    Helstrom, the oldest city, far to the south, where the Xeech-Leel's council sits; the door bears her name. The road
    there runs through deadly country, so the player is to ride the rootworm, and she tells them what it is: a worm longer than a boat, with clear flesh, that races through the tunnels the Hist roots make under the mud and the swamp water. It swallows a rider whole and digests so slowly that a rider could live in its belly for months. The rider watches through its clear flesh for bubbles, which mean an air pocket, and pushes up through its soft skin there to get off. Where its tunnels pass under a tree's root pool there is such a pocket, and a root-tender who knows when a worm passes takes the fare and shows the rider where to go down. Here the root-tender is Weeltul, at the Hist pool in the middle of the town; the
    fare is twenty-five gold. At Helstrom it comes up in the pool under the city tree, and the root-tender there can
    point the way to Nesh-Deeka's House. She pays the player a hundred gold. Does: sets stage 40, whose start gives the
    gold. Checks: nothing."
  uses:
  - fact.mn04.handler
  new: true
- id: topic.mn04-vosh-handler
  label: Who is Nesh-Deeka?
  person: npc.mn.vosh-leera
  stages:
  - 40
  - 90
  essential: false
  intent: 'Vosh-Leera. Tells: a handler is the one who takes the order''s reports in a city and gives its work. Nesh-Deeka
    is the handler at Helstrom; Vosh-Leera has met her twice and found her sharp and well informed. Helstrom is the oldest
    city of the Argonians, at the river fork in the middle of the Hist forest, a city no invader ever took. Checks: nothing.
    Does: nothing.'
  new: true
- id: topic.mn04-vosh-early
  label: Have you news for me?
  person: npc.mn.vosh-leera
  stages: [10, 20]
  essential: false
  intent: "Vosh-Leera, before the player has been to Karsh-Naal Camp. Tells: no; the note sends the jars to Karsh-Naal
    Camp, east of Teel-Fen Weir, and she wants to know who takes them there before she says anything to anyone. Go and
    see. Checks: nothing. Does: nothing."
  uses: []
  new: true
- id: topic.mn04-weeltul-early
  label: Can you send me somewhere by the rootworm?
  person: npc.mn.jal-veesa-minder
  stages: [10, 20, 30]
  essential: false
  intent: "Weeltul, before Vosh-Leera sends the player south. Tells: she is the root-tender here; anyone who pays
    twenty-five gold rides the rootworm from this pool to the pool under Helstrom's city tree, stranger or not, as on
    any boat. The ride itself is the stop's travel line. Checks: nothing. Does: nothing."
  uses: []
  new: true
- id: topic.mn04-nesh-early
  label: Are you Nesh-Deeka?
  person: npc.mn.nesh-deeka
  stages: [10, 15, 20, 30]
  essential: false
  intent: "Nesh-Deeka, met in her house before Vosh-Leera sends the player (the rootworm is open to anyone). Tells: she
    is, and she takes no business from strangers who come with no word from anyone she knows. Checks: nothing. Does:
    nothing."
  uses: []
  new: true
- id: topic.mn04-ride
  label: Vosh-Leera says you can send me to Helstrom by the rootworm.
  person: npc.mn.jal-veesa-minder
  stages:
  - 40
  essential: true
  intent: 'Weeltul. Tells: the worm swallows the rider whole and carries them through the root tunnels; the player
    should watch for the bubbles of the air pocket under Helstrom''s city tree and push up through its skin there. The
    fare is twenty-five gold, paid to her when the player is ready to go. Nesh-Deeka''s House is near the city''s raft
    landing; the root-tender at Helstrom, Cheeval-Xu, can point the way. Does: sets stage 90. Checks: nothing.'
  uses:
  - fact.mn04.rootworm
  new: true
- id: topic.mn-rootworm
  label: What is the rootworm?
  person: npc.mn.jal-veesa-minder
  stages:
  - 40
  - 90
  essential: false
  intent: 'Weeltul. Tells: a worm longer than a boat, with clear flesh, that races through the tunnels the Hist roots make under the mud and the swamp water; people call it the Underground Express. It swallows a rider whole and digests so slowly that a rider could live in its belly for months. The rider watches through its clear flesh for bubbles, which mean an air pocket, and pushes up through its soft skin there to get off. Where its tunnels pass under a tree''s root pool there is such a pocket, and a root-tender who knows when a worm passes takes the fare and shows the rider where to go down. Traders by the Hist roots have used it for longer than any road
    has stood. From here it runs to Helstrom. Anyone who pays rides it.
    Checks: nothing. Does: nothing.'
  uses:
  - fact.mn04.rootworm
  new: true
review:
  reviewer: writer lore checks (quest-write §5); quest-reviewer round to follow
  findings:
  - id: L1
    severity: lore
    ids:
    - cast.npc.mn.sesk
    - truth.t1
    finding: Tribeless Naga as hired guards.
    answer: 'sourced: tribal-camp-m2-m68 place card (overview)'
  - id: L2
    severity: lore
    ids:
    - topics.topic.mn-rootworm
    finding: The rootworm and its fare.
    answer: 'changed: the worm is the canon rootworm, the Underground Express: clear-fleshed, racing through tunnels the
      Hist roots form, swallowing riders whole, digesting slowly, left at air pockets shown by bubbles by pushing up
      through its skin (story/lore/topics/hist-placement.md R5; story/lore/topics/loading-facts.md fact.underground-express,
      fact.rootworm-root-tunnels; UESP Lore:Rootworm). Stops under root pools and the root-tender who takes the fare are
      the travel network''s extrapolation (docs/design/travel-network.md); open to every paying rider, like the silt
      striders, since nothing in the story needs a gate'
  - id: L4
    severity: lore
    ids:
    - stages.90
    finding: The rootworm fare of 25 gold is stated but nothing in the record takes it.
    answer: 'sourced: the stop''s travel line takes it. Every stop''s operator gets one line per route that carries the
      fare and removes it from the player before the ride (docs/design/travel-network.md "The service"; tools/places/build.py
      plan_travel; papyrus/TIF_ARG_BoatTravel.psc); Jal-Veesa''s operator is its tree-minder (place card: rootworm-stop).
      The record states the fare and takes nothing.'
  - id: L5
    severity: lore
    ids:
    - endings.e-sent
    - topics.topic.mn04-sesk-landing
    finding: Sesk stood nowhere after the ending, yet main-plot §6 has her give a side quest if freed.
    answer: 'changed: the ending switches her on at Helstrom''s city landing (the raft-masters'' boat stop on the helstrom
      place card; she wants the price of a boat, main-plot §4), with a line that says she owes the player. Her side quest
      is its own record, owed.'
  - id: L3
    severity: lore
    ids:
    - stages.30
    finding: The open question (why seal) is written in the journal.
    answer: 'sourced: main-plot §3; owner-bar (a mystery keeps its question open)'
