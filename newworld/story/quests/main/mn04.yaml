topics:
- id: topic.mn04-sesk-call
  label: Who's in the cage?
  person: npc.mn.sesk
  stages: [10]
  essential: false
  intent: 'Sesk, through the bars. Tells: she is Sesk, and she will tell the player everything about the sap if they
    get her out. The key is on Jeeta-Sakka, the big one at the fire; the lock is a poor one; the guards never look this
    way. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn04-sesk-who
  label: Who are you?
  person: npc.mn.sesk
  stages: [10, 20]
  essential: false
  intent: 'Sesk. Tells: a Naga: the Naga are tribeless Argonians of the deep marsh, tall and hard, who sell their blades
    or their hands to whoever pays. She drew sap for the Unbound and tried to leave with her pay. Checks: nothing. Does:
    nothing.'
  new: true
- id: topic.mn04-sesk-talk
  label: Tell me about the sap.
  person: npc.mn.sesk
  stages: [20]
  essential: true
  intent: 'Sesk, out of the cage. Tells: the crews who drain the trees are the Unbound, a cult of the tribeless, and
    their leader is Cuts-the-Old-Knot. Sesk drew sap for them: cut the scar, fill the jars, press the grey paste in after.
    They call the paste "the seal"; she never knew what is in it, and she was told never to leave a scar open. The jars
    come here and go on to Cuts-the-Old-Knot. The sap is for a draught she brews, and the draught is for something to
    do with "the Eye"; Sesk never learned what. She wants out, with the price of a boat, and goes now, before the guards
    look round. Does: sets stage 30. Checks: nothing.'
  uses: [fact.mn04.unbound, fact.mn04.draught, fact.mn04.seal]
  new: true
- id: topic.mn-unbound
  label: Who are the Unbound?
  person: npc.mn.sesk
  stages: [20]
  essential: false
  intent: 'Sesk. Tells: tribeless people, Argonians with no tree or kin that will have them, and a few others, who follow
    Cuts-the-Old-Knot. They pay well in coin and say they will set the marsh free; she never learned free of what. They
    move in small crews and meet nowhere twice. Checks: nothing. Does: nothing.'
  uses: [fact.mn04.unbound]
  new: true
- id: topic.mn-cuts-the-old-knot
  label: Who is Cuts-the-Old-Knot?
  person: npc.mn.sesk
  stages: [20]
  essential: false
  intent: 'Sesk. Tells: the Unbound''s leader. Sesk saw her once: an Argonian woman, thin, quiet, who looked at the trees
    as if they had wronged her. She never stays where her crews are. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-the-seal
  label: What is the seal?
  person: npc.mn.sesk
  stages: [20]
  essential: false
  intent: 'Sesk. Tells: the grey paste the crews press into a scar after they drain it; the cut closes over it. It comes
    in bottles from Cuts-the-Old-Knot''s people. Sesk does not know what is in it or why they use it. Checks: nothing.
    Does: nothing.'
  uses: [fact.mn04.seal]
  new: true
- id: topic.mn04-vosh-report
  label: I found where the sap goes.
  person: npc.mn.vosh-leera
  stages: [30]
  essential: true
  intent: 'Vosh-Leera. Tells: she hears it all: the Unbound, Cuts-the-Old-Knot, a draught, "the Eye", the seal. This
