- id: 30
  place: jal-veesa
  journal: text.journal.mn04.30
  journalText: "Sesk talked as soon as I opened her cage. She drew sap for the Unbound, a cult of the tribeless whose
    leader is Cuts-the-Old-Knot, an Argonian woman. The sap is for a draught she brews, and the draught has something
    to do with \"the Eye\". They call the grey paste in the scars \"the seal\". Why drain a tree and then seal it, if
    they only want its sap? Vosh-Leera in Jal-Veesa should hear this."
