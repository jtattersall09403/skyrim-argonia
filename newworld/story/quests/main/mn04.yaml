  what: The Unbound, a cult of the tribeless led by Cuts-the-Old-Knot, pay the camp's tribeless Naga to guard the sap their
    crews draw. The jars are stacked by the longhouse until they are carried on. The sap is for a draught that Cuts-the-Old-Knot
