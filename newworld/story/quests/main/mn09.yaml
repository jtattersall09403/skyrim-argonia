stages:
- id: 10
  place: kothringi-ruin-m25-m80
  journal: text.journal.mn09.10
  journalText: Nesh-Deeka sent me to Eurydike, the roofless hall of the Kothringi knights north of Gideon, to open the knight-captain's
    tomb with the keystone; the knights once guarded the kings' road to the Root, the place under the sea where every Hist's
    roots meet and the Eye of Argonia lies. The knights' dead walk the barracks wing, and the Unbound got there before me.
    I'm to search the Unbound's packs by their fire on the way to the tomb. I may fight, slip past, or turn the dead with
    Restoration. All of it is a trail to the Eye of Argonia, the old kings' jewel that can heal every tree, which lies at
    the Root, where all the trees' roots meet under the sea; the order wants it found before the Unbound reach it.
  directions: Ride the rootworm from Helstrom's city tree to Gideon's Hist garden, then walk north out of Gideon to the
    long grey-white hall with its roof gone and a broken gable; the barracks wing stands at the back.
  objectives:
  - id: packs
