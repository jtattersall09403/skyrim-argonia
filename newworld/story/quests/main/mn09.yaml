topics:
- id: topic.mn09-report
  label: The tomb held this bronze disc.
  person: npc.mn.nesh-deeka
  stages:
  - 30
  essential: true
  when:
    hasItem:
    - thing.mn.bronze-disc
    - 1
  intent: 'Nesh-Deeka. Tells: this is one more step towards the Eye of Argonia, the old kings'' jewel that can heal every
    tree, which lies at the Root, where all the trees'' roots meet under the sea; the pick and tower is Vicrium''s mark,
    an old ochre and alum mine in the clay country behind Seafalls, in Okuwun Rahei in the east; the knights kept a strongbox
    there. She says she knew the Unbound had got into Eurydike. She sees the question coming, how she can know this, and
    answers it before it is asked: "We listen.", and turns back to the mine. She does not know why the Unbound seal the
    trees they drain, a poison pressed into a tree they want sap from; madness or spite, she supposes, and it does not
    matter beside the Eye. She pays 100 gold. Does: sets stage 90.'
  new: true
