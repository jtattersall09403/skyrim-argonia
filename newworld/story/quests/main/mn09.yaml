- id: 90
  place: helstrom
  journal: text.journal.mn09.90
  journalText: 'Nesh-Deeka knew the mark: Vicrium, an old mine in the clay country behind Seafalls, in the east. She already
    knew the Unbound had been at Eurydike. Before I could ask how, she said "we listen" and turned to the mine. She does
    not know why the Unbound seal the trees they drain, and says it does not matter. She paid me 100 gold. The question
    stays with me.'
  onEnter:
  - giveGold: 100
  learns:
  - fact.mn09.vicrium
  - fact.mn09.knew
  ending: complete
  endingId: e-read
  information:
    going: 'The disc points to Vicrium. Why the Unbound seal the trees is still open: Nesh-Deeka does not know. She knows
      where they go and will not say how. The hunt''s aim: find the Eye of Argonia, the old kings'' jewel that can heal every tree, at the
      Root, where all the trees'' roots meet under the sea, before the Unbound do.'
    next: MN10 starts; its first entry marks Vicrium.
