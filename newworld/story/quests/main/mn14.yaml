  place: blackrose-prison
  journal: text.journal.mn14.10
  journalText: "Never-Writes-Twice sent me after the three seal-stones. The thief's stone lies in the warden's vault at
    Blackrose Prison, whose people, the Blackguards' heirs, attack strangers on sight. Their gate-captain stands
    outside the gate. I can go in as a guest past him (a toll, words or a duel), slip in unseen, where any guard who
    sees me will attack, or fight my way in."
