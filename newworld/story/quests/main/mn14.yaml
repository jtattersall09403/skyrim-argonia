  directions: Blackrose Prison stands in the marsh water a short walk east of Blackrose's quay, a grey fortress with fires
    on its upper wall. Boats from Helstrom's quay go down to Blackrose. The gate-captain stands outside the main gate on
    the road.
  information:
    going: The Eye of Argonia, the old kings' jewel, sits at the Root under Teku-Sul, where the roots of every Hist meet;
      used there it heals every sick tree. The Kings' Gate shuts it in and opens only with three seal-stones. I am a Reel-Ka
      of the Toh-Reel-Ka, hunting the three seal-stones that open the kings' gate at Teku-Sul before the Unbound get them.
      One lies in the warden's vault in Blackrose Prison. The prison's people attack strangers.
    next: get into the prison; the gate-captain outside the gate is the first person to deal with
    ways: 'pay the gate-captain 300 gold, persuade him (Speech 75) or duel him until he yields: each makes me a guest, and
      the garrison stops attacking me; or slip past the walls unseen (Sneak, Invisibility), and they attack if they see
      me; or fight my way in (any fighting skill), and the whole garrison fights me'
    carriers:
    - know: what the Eye of Argonia, the Root and the seal-stones are
