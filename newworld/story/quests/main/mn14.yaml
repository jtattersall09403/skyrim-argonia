topics:
- id: topic.mn14-gate
  label: (speaks first)
  person: npc.mn.corvus-ulvius
  kind: speaks-first
  stages:
  - 10
  essential: true
  intent: 'Corvus Ulvius, outside the gate. Tells: this is the Rose, and the Blackguards'' heirs born in it hold it now;
    strangers who walk in are killed on the walls. He lets a stranger in as a guest three ways: 300 gold to him, words good
    enough to move him, or a duel with him, fists and steel, until one yields. A guest walks the yard and the hall and nobody
    touches them. Anyone who climbs the walls without his leave is fair game, and anyone who kills him has the whole Rose
    to fight. If the player asks what they want inside, he says the raj-kaal Okaz-Teel keeps the old warden''s vault in
    his hall and the key on his belt, and he already has a buyer for what lies in it, the Imperial in the hall. Offers topic.mn14-toll,
    topic.mn14-persuade and topic.mn14-duel as answers. Does: nothing.'
  uses:
  - fact.mn14.hostile
  - fact.mn14.gate-ways
  - fact.mn14.key-on-chief
  - fact.mn14.collector-here
  new: true
- id: topic.mn14-toll
  label: Here is your toll. (300 gold)
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  essential: true
  intent: 'Corvus. Checks: goldAtLeast 300. Tells: he waves the player in as a guest of the Rose; the walls will let them
    be. Does: takes 300 gold; sets stage 20. Fallback: no coin, no gate; words or steel are the other ways.'
  grants:
  - takeGold: 300
  new: true
- id: topic.mn14-persuade
  label: (Persuade) The Toh-Reel-Ka can send you a hundred like me. Let one in quietly instead.
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  essential: false
  intent: 'Corvus. Checks: skillAtLeast [Speech, 75]. Tells: he laughs and lets the player in as a guest, since a quiet
    Reel-Ka is cheaper than a loud one. Does: sets stage 20. Fallback: words are wind at this gate; the player is left the
    toll or a duel, and this line is not offered again.'
  new: true
- id: topic.mn14-duel
  label: I'll fight you for the gate.
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  essential: true
  intent: 'Corvus. Tells: he likes that; until one of them yields; if he yields, the player walks in as a guest; if the
    player kills him, the Rose fights them. Does: sets stage 15 (the duel begins, the yield block).'
  new: true
- id: topic.mn14-yield
  label: (on yielding)
  person: npc.mn.corvus-ulvius
  stages:
  - 15
  essential: false
  intent: 'Corvus, when he yields. Tells: enough; he gives the gate; the player is a guest of the Rose and nobody on the
    walls will touch them. Does: sets flag.mn14.yielded (stage 20).'
  new: true
- id: topic.mn14-corvus-who
  label: Who are you?
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  - 90
  - 91
  - 92
  - 93
  intent: 'Corvus. Tells: captain of the Rose''s gate, born in its cells like his father and his father''s mother; he keeps
    the gate because he has not lost a fight at it in eleven years.'
  new: true
- id: topic.mn14-heirs
  label: Who are the Blackguards' heirs?
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  intent: 'Corvus. Tells: the Rose was the Empire''s prison, built for Argonians; when the Empire left, the prisoners''
    children took it for their own and call it the Rose; they live by the road and the boat, and they answer to the raj-kaal,
    Okaz-Teel, a Naga of the deep swamp.'
  new: true
- id: topic.mn14-okaz-who
  label: Who are you?
  person: npc.mn.okaz-teel
  stages:
  - 20
  - 22
  - 25
  intent: 'Okaz-Teel, in his hall (talks only to a guest; at 25 a player who speaks to him is seen). Tells: he is the raj-kaal
    of the Rose, the war-chief of its people; a Naga is an Argonian of the deep swamp, and he says it with pride. The warden''s
    vault in his wall holds a thief''s old stone; the Imperial has offered for it and been told to wait; the key is on his
    belt and goes to whoever pays 1,000 gold first. He watches his own belt, and his people watch the vault, and a thief
    they see is a thief they kill.'
  uses:
  - fact.mn14.stone-in-vault
  - fact.mn14.key-on-chief
  new: true
- id: topic.mn14-buy-key
  label: I'll buy the key to the warden's vault. (1000 gold)
  person: npc.mn.okaz-teel
  stages:
  - 20
  essential: false
  intent: 'Okaz-Teel. Checks: goldAtLeast 1000. Tells: the Imperial waited too long; he gives the key and says the stone
    is the player''s. Does: sets stage 22 (takes 1,000 gold, gives the key and the chest''s contents). Fallback: 1,000 gold,
    not a coin less; the Imperial can still outbid a pauper.'
  new: true
- id: topic.mn14-collector-greet
  label: (greeting)
  person: npc.mn.ennodius-vanin
  kind: greeting
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  - 30
  intent: 'The Collector, in the hall (he never fights and never calls the guards). Tells: so the Toh-Reel-Ka''s hound has
    found him again; he left the player a note in Gideon; he has offered for the stone and been told to wait, and he will
    not bid against the order. He has a side errand for a capable hand: a riddle, not a road, and the Eye can wait for it;
    what lies at the end of it is made for whatever guards the Root. (The side quest itself is its own record.)'
  uses:
  - fact.mn14.collector-here
  new: true
- id: topic.mn14-collector-ring
  label: That ring on your finger. What is it?
  person: npc.mn.ennodius-vanin
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  - 30
  - 90
  - 91
  - 92
  - 93
  intent: 'The Collector. Tells: Kothringi silver, from a knight''s barrow in the Kotherra; it steadies the hand at a lock
    or a pocket; it is not for sale. If the player asks what he would lose: alive he is worth more to them than the ring,
    for his errand; a dead man gives no riddles.'
  uses:
  - fact.mn14.ring
  new: true
- id: topic.mn-the-collector
  label: The Collector
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  intent: 'Corvus. Tells: the Imperial paid the toll like an honest man, which nobody here trusts; he sits in the hall as
    the raj-kaal''s guest waiting to buy the stone.'
  new: false
- id: topic.mn-umbriel
  label: Umbriel
  person: npc.mn.corvus-ulvius
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  - 90
  - 91
  - 92
  - 93
  intent: 'Corvus. Tells: the flying city came down on Lilmoth when his grandmother was a girl; its dead came as far as
    the Rose''s walls and the walls held.'
  new: false
- id: topic.mn-the-hunt
  label: Remind me what we are hunting, and why.
  person: npc.mn.never-writes-twice
  stages:
  - 10
  - 15
  - 20
  - 22
  - 25
  - 30
  intent: 'Never-Writes-Twice, at the back of Nesh-Deekas House. Tells: the Eye of Argonia is the old priest-kings jewel,
    cut from Hist amber. It sits at the Root, the place under the sea below Teku-Sul Spire where the roots of every Hist
    meet. Used where it sits, it pours strength down every root and heals every sick tree; lifted from its place, it cuts
    every tree from every other for good. The last king shut it behind the Kings Gate, which opens only with its three seal-stones:
    the thiefs stone in Blackrose Prison, the stone in the flooded vaults of Gemin and the stone in the deepest hall of
    Vorannuhl. A beast guards the Root; Cuts-the-Old-Knot brews a draught from drained sap strong enough to kill it, so
    she can reach the Eye. The orders aim: take the stones first, open the gate, use the Eye in place to heal the trees,
    bring the stones back to her so the chamber is sealed for good, and end the Unbound. She looks at the stones the player
    carries and names the places of those still missing.'
  new: false
review:
  reviewer: writer's lore checks; quest-reviewer round to follow
  findings:
  - id: L1
    severity: lore
    ids:
    - cast.npc.mn.okaz-teel
    finding: A Naga raj-kaal leads the Blackguards' heirs.
    answer: 'sourced: blackrose-prison place card (held by the heirs under a Naga raj-kaal); prisons.md (raj-kaal Drakeeh,
      canon''s precedent)'
  - id: L2
    severity: lore
    ids:
    - stages.20
    finding: Making peace with the garrison by a toll, words or a yield.
    answer: 'main-plot §9: the garrison is placed hostile and the toll, persuasion or yield makes peace with its faction'
  - id: L3
    severity: lore
    ids:
    - stages.25
    finding: Entering unseen is detected by using the hall's door at stage 10.
    answer: the only allowed trigger for "inside" is a use; flag.mn14.inside-unseen is a use hook on the hall door (thing_hook
      row when imported). Detection itself is the crime engine and the hostile faction.
