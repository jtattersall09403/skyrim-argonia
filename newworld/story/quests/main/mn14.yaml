foundation: 'Written 2026-11-17 from main-plot.md quest 14, passed by the owner. Starts with MN15 and MN16 on MN13''s last
  stage (Never-Writes-Twice made the player a Reel-Ka and marked the three places); the order is the player''s. Three ways
  in (toll, Speech 75 or a duel that ends in a yield; unseen; by force) leave three states inside (guest, unseen, enemy),
  each its own stage with its own entry. The quest ends when the stone is taken: four end stages say which other stones
  are still out (their quests keep their own markers). With all three stones held, MN17''s first stage is the report to
  Never-Writes-Twice in Helstrom (Ka-Deelith and her last order). The Collector''s side quest is not in this record; his
  offer and what killing him loses are told here.'
