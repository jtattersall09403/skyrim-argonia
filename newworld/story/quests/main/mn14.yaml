  what: The three seal-stones of the gate were carried off; one passed from hand to hand until a masked thief who sought
    the Eye was taken with it.
- id: t2
  when: the Third Era
  who:
  - the masked thief
  where: Blackrose Prison
  what: The thief died in the Rose's cells. The wardens put his stone in the warden's vault off the great hall, where it
    has lain since.
- id: t3
  when: generations before 4E 201
  who:
  - the Blackguards' heirs
  where: Blackrose Prison
  what: The prison-born heirs of the Rose's inmates took the fortress. In 4E 201 they hold the upper walls under a Naga
    raj-kaal, Okaz-Teel, who carries the vault's key on his belt. They attack strangers on sight. Their gate-captain, Corvus
    Ulvius, stands outside the gate and lets in whom he chooses, for a toll, for good words or for a fight he loses.
- id: t4
  when: days before the player comes
  who:
  - npc.mn.ennodius-vanin
  where: the chief's hall
  what: The Collector came to buy the stone, paid the gate's toll and is the chief's guest. Okaz-Teel told him to wait while
    he learns what the stone is worth. He wears a ring of Kothringi silver that helps hands at locks and pockets.
