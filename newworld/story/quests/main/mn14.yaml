- id: 20
  place: blackrose-prison
  journal: text.journal.mn14.20
  journalText: "Corvus Ulvius let me through the gate as a guest, and the Blackguards' heirs will not attack me now.
    The vault's key is on Okaz-Teel, the Naga raj-kaal in his hall. I can buy the key from him for 1,000 gold, lift it
    from his belt, or pick the vault's Expert lock at night when the hall is quiet; a theft that is seen turns the
    garrison on me. The Collector, Ennodius Vanin, waits in the hall as the chief's guest; his ring of Kothringi silver
    helps a hand at locks and pockets, but a dead man gives no errands."
