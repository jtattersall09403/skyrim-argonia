- id: topic.mn03-heem-who
  label: Who are you?
  person: npc.mn.heem-jasa
  stages: [10, 20, 30, 40, 50, 60, 90, 91]
  essential: false
  intent: "Heem-Jasa. Tells: tree-minder of Teel-Fen Weir; she tends the young tree and makes remedies from its sap and
    the marsh's fungus, and sells them to the wardens. Met before Vosh-Leera sends the player (stages 10 to 30), she
    says no more than that: her tree is not well, and she does not tell its troubles to strangers. Checks: nothing.
    Does: nothing."
  new: true
- id: topic.mn03-heem-scar
  label: Vosh-Leera of Jal-Veesa sent me. What is wrong with your tree?
  person: npc.mn.heem-jasa
  stages:
  - 40
  essential: true
  intent: 'Heem-Jasa. Tells: she shows the player the young tree''s scar, low on the trunk on the platform side: three nights
    ago it closed over a grey paste, and none of her people put it there. Something was pressed into the cut. The tree was
    drained, then sealed. Strangers come and go at the reed hide by the lone dead tree west of the weir; the wardens keep
    away from them. There are three. A warden heard one call the others "Unbound"; Heem-Jasa takes it to mean people with
    no tree and no kin to answer to, and knows nothing more of them. The player can go at them, shoot them from the reeds
    east of the hide, or creep round to the hide''s open west side where they stack their jars. She teaches alchemy and
    sells sap, fungus and eggshells, but only to kin and to those who are straight with her. Does: sets stage 50. Checks:
    nothing.'
  uses:
  - fact.mn03.paste
  - fact.mn03.hide
  new: true
