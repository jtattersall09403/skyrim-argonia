recordStatus: design
foundation: 'Built from main-plot.md §5 quest 3. Vosh-Leera gives the player a cup of sap (Skyrim''s potion bottle under
  our name); the player drinks it in front of her by a line. The stage it sets fades the screen to black and shows the vision''s
  words on a message box while it is black (the approved fade-with-message block); the player then tells it to her line
  by line, and she names Teel-Fen Weir, south of the town, whose young Hist grew from Jal-Veesa''s roots. Heem-Jasa shows
  the grey paste in the young tree''s closed scar and points to the reed hide by the lone dead tree west of the weir, where
  three Unbound sap-takers keep jars of sap. The player fights them, shoots them from cover or passes them by stealth to
  take the note (taking it moves the quest; a jar lies beside it to take as well). Back on the platform Heem-Jasa asks whether
  her tree will live: the truth opens her Alchemy training (Adept) and her stall; a comfort gives three potions of Cure
  Poison on the spot and leaves her training and stall closed. The note orders the crew to bring their jars to Karsh-Naal
  Camp, which starts MN04.'
