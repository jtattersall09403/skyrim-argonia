- id: 50
  place: outpost-m6-m66
  journal: text.journal.mn03.50
  journalText: "Heem-Jasa showed me her young tree's scar. It closed three nights ago over a grey paste that none of
    her people put there. Someone drained the tree and sealed it. Strangers who call themselves the Unbound keep jars
    at the reed hide by the lone dead tree west of the weir, the hide from my vision. I need to take what they have
    there. Heem-Jasa said I can go at them, shoot them from the reeds, or creep round to the hide's open side unseen;
    the hide has no door or lock, and if they see me they will fight."
