messages:
- id: message.mn03.vision
  text: Darkness, and then a young Hist, slender and grey, standing among pale stilt huts. A woven weir crosses a creek
    beside it. West of the weir, on a bank of reeds, a reed hide stands beside a lone dead tree. Clay jars are stacked in
    its shade. Then the darkness again.
