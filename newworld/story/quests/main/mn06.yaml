foundation: 'Built from main-plot.md §5 quest 6, as passed by the owner. Kept: the glass Eye in Gideon''s market, the dealer
  who admits it for a few coins or a little Speech, the smugglers of the South Watch who kept the old silver setting in
  a locked chest in the ruin''s inner room (Old Laboratory''s one interior), the Collector''s courteous note in the chest,
  the ship''s name scratched inside the setting and Nesh-Deeka''s reading of it. Filled from the plot and the lore, smallest
  reading first: the dealer''s name (Ovinius Calo, a Nibenese-descended trader of Gideon); a third way to the dealer''s
  fact (his note from the South Watch, carried, to pickpocket or take from his body); the lock''s level (Apprentice) and
  the key on the smugglers'' boss; the Unbound''s visit to Gideon''s market that Nesh-Deeka already knows of.'
