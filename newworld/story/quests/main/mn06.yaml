- id: 90
  place: helstrom
  journal: text.journal.mn06.90
  journalText: 'Nesh-Deeka read the name inside the setting: the Pale Harvest, a ship that sank in Hatandros Bight, the
    bay on the east coast south of Thorn, with a Gideon dealer''s whole stock aboard. She already knew that two Unbound
    had asked after the glass Eye in Gideon a month ago. Before I could ask how she knew, she said "we listen" and spoke
    of the wreck instead. She paid me 100 gold.'
