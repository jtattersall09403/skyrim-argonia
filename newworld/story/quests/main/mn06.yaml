- id: 20
  place: imperial-ruin-m25-m85
  journal: text.journal.mn06.20
  journalText: The Eye on Ovinius Calo's stall is glass. The smugglers who sold it to him keep the old silver setting it
    came in, at Gideon South Watch, a leaning tower south-east of the quay. I'm to take the setting from their locked chest
    in the tower's inner room. I may fight the smugglers or slip past them; the chest's lock can be picked, and their boss
    carries its key. A man called the Collector, an Imperial relic-hunter, has been asking after the Eye too.
  directions: From Gideon's quay, follow the mangrove edge south-east to the leaning stone tower with the rotted pier; the
    inner room's door opens off the pier.
