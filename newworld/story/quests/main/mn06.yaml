stages:
- id: 10
  place: gideon
  journal: text.journal.mn06.10
  journalText: 'Nesh-Deeka made me a Voh-Vastei of the Toh-Reel-Ka and gave me my first lead: someone in Gideon''s market
    is selling an "Eye of Argonia". I''m to ride the rootworm from Helstrom''s city tree to Gideon and find the dealer who
    sells it. Nesh-Deeka says Gideon''s dealers tell the truth for a little persuasion or a few coins, and keep their papers
    in their pockets.'
  directions: Cheeval-Xu calls the rootworm at the landing under Helstrom's great tree; the fare is 25 gold. In Gideon the
    rootworm comes up at the red-clay stop by the Hist garden; the market lies along Blackwood Way, the one dry street through
    the town.
