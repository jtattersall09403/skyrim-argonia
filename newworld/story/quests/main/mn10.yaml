foundation: 'Built from main-plot.md §5 quest 10 and the rank table. Kept: the miners in the upper galleries (Gloombound
  Mine''s interior), the lower galleries shut behind a locked timber door after a roof fall, the gallery-boss''s key by
  Pickpocket, Speech or 100 gold, the old lower adit on the creek bank whose first passage stands in water where crocodiles
  nest (Whistling Mine''s interior and its door out, a still water plane added), the smugglers in the lower galleries, the
  knights'' strongbox and its parchment map of seven sea towers and a tooth-shaped crag; the rank of Toh-Wo with a rapier
  or a quarterstaff and 200 gold; the hand-over to Never-Writes-Twice, her lie about Cuts-the-Old-Knot and her marking the
  Grey Tooth. Ruled by the lead: Helstrom''s houses are one room, so Never-Writes-Twice stands at the back of the same room
  of Nesh-Deeka''s House; she is switched on by the map''s take, in another interior. Filled: the gallery-boss''s name (Ah-Zish),
  the Speech level (40), the rank pay in place of the report''s 100 gold, and what Nesh-Deeka already knows (the Unbound
  have not reached Vicrium; the smugglers there sell to anyone).'
