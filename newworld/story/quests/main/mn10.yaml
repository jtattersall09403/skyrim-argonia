- id: 15
  place: vicrium
  journal: text.journal.mn10.15
  journalText: "Ah-Zish shut the lower galleries behind a locked timber door after a roof fall, and keeps its key on his
    belt; the door cannot be picked. He hears voices below, smugglers, he thinks, come in by the old adit on the creek
    bank, which is flooded and full of crocodiles. He might give me the key for good words or a hundred gold, or I could
    lift it from him; if he catches me at it, he shouts for his miners. Past the door I need to find the knights'
    strongbox, and the smugglers down there will attack anyone they see."
  objectives:
