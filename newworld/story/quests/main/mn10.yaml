    cut from Hist amber, the solid sap the trees no longer make; it lies at the Root, the place under the sea where the
    roots of every Hist meet, behind a gate the last king sealed; used where it sits it can heal every sick tree. The Unbound
    drain sap for a draught strong enough to kill the beast that guards the Root, so they mean to reach it first; the order''s
    aim is to find the Root before them and have the player use the Eye in place to heal the trees; so far: the knight-captain''s
