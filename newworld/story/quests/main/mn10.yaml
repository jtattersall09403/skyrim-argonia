stages:
- id: 10
  place: vicrium
  journal: text.journal.mn10.10
  journalText: The knight-captain's disc bears the mark of Vicrium, a mine behind Seafalls, where the knights kept a strongbox.
    The lower galleries are shut behind a locked timber door; the gallery-boss, Ah-Zish, keeps the key, and an old adit
    on the creek bank goes round it through water where crocodiles nest. I'm to get into the lower galleries and find the
    knights' strongbox. Ah-Zish might give the key to good words or 100 gold, or it can be lifted from him. Smugglers have
    moved into the lower galleries; I may fight them or sneak past.
  directions: Poles-Upriver's boats run from Helstrom to Archon and on up the coast to Seafalls, the village by the white
    falls. From Seafalls follow the road inland to the hillside cut in rust and yellow bands with a timber headframe; the
    adit's mouth is down on the creek bank below it.
  objectives:
  - id: in
    text: text.objective.mn10.in
    objectiveText: Get into Vicrium's lower galleries, by Ah-Zish's key or the old lower adit.
    target: npc.mn.ah-zish, thing.mn10.timber-door, thing.mn10.adit
    completeWhen:
      questStage:
      - quest.main.mn10
      - ≥
      - 20
  - id: box
