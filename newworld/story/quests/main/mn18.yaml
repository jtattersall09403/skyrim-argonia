foundation: 'Written 2026-11-17 from main-plot.md quest 18 and §7. Setting the stones (a use of the gate with all three
  held) opens it and takes the stones into its sockets. Going through the open gate (a use of the gate as a door, which
  loads the hall) is the stage that, if she was believed, switches Cuts-the-Old-Knot off at the gate and on in the hall
  while the game loads it (§7); she is never seen to move. The hydra fights in phases (the mod''s own); its death ends
  the quest and MN19 marks the door at the hall''s far end. Who must live: nobody (Cuts-the-Old-Knot may die in the
  fight; the endings read her alive or dead), named in review.'
