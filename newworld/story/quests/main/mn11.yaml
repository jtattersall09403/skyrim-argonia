- {id: fact.mn11.marker-stone, claim: 'The kings'' marker stone shows seven drowned towers, with one of them marked.',
  from: t1}
- {id: fact.mn11.recipe, claim: 'The seal is Cuts-the-Old-Knot''s paralysis poison, made to her written recipe.', from: t3}
- {id: fact.mn11.cellar-words, claim: 'Cuts-the-Old-Knot says that whoever serves the Toh-Reel-Ka should ask what moans
    in the cellar of Fort Chalkmoth.', from: t4}
- {id: fact.mn11.lilmoth-spires, claim: 'The marked tower is one of the drowned spires off Lilmoth, and the divers of
    Bell Station will know which.', from: t5}
- {id: fact.mn11.fort-like-any, claim: Never-Writes-Twice says Fort Chalkmoth is an Archwarden fort like any other.,
  from: t5}
