  persona: invented. A young Argonian of the Unbound, tribeless, a scout; she says what she was told and does not know
    what it means
  wants: to live, and to be carried off the beach
  fears: the order's people, who she has been told keep people in a cellar
  knowledge: {fact.mn11.scouts-search: knows, fact.mn11.cellar-words: knows, fact.mn11.recipe: suspects}
