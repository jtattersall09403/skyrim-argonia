# MN11 The Grey Tooth: the quest record's YAML view (a new-world record kept as YAML until its places are in the
# story database; quest-record.md, "A record whose places are not in the story database yet").
id: quest.main.mn11
code: MN11
title: The Grey Tooth
line: quest.line.main
group: main
tier: 0
status: concept
shapes: [EXPEDITION, THEFT]
region: skeith-isle
settlement: peak-39-m79
anchorPlaces: [peak-39-m79, shipwreck-36-m82, helstrom, arorha]
premise: The Toh-Reel-Ka's new Toh-Wo follows the parchment map to the Grey Tooth on Skeith Isle, gets past the
  Collector's men to learn the kings' stone was carried off to the Stormwidow, takes it from under the Unbound scouts in
  the beached wreck's hold, hears a wounded scout's word about the cellar of Fort Chalkmoth, and brings the stone to
  Never-Writes-Twice.
