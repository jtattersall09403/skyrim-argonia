topics:
- id: topic.mn11-errand
  label: Where am I to go now?
  person: npc.mn.never-writes-twice
  stages: [10, 20, 30, 35, 40]
  essential: true
  intent: 'Never-Writes-Twice. Tells: the crag on the map is the Grey Tooth, the seamark of Skeith Isle, a grey-green spire
    sailors steer by; take the boat to Archon and on to Arorha, and walk across to it; the Collector''s hired men are
    camped at the foot of its goat-path and dig in a small cave on its north face, so he knows something; find what they
    found, and fight them or slip past as you like. Checks: nothing. Does: nothing.'
  uses: [fact.mn11.collector-men]
  new: true
- id: topic.mn11-scout-who
  label: Who are you?
  person: npc.mn.tah-leesh
  stages: [10, 20, 30]
  essential: false
  intent: 'Tah-Leesh, lying on the sand below the bow. Tells: she is a scout of the Unbound, tribeless, sent with three
    others to search the Stormwidow''s ballast for a stone of the old kings; she fell through a rotten deck and broke
    her leg, and the others left her; they carry their leader''s recipe for the seal that closes a tree''s scar. She will
    not fight; she cannot stand. Checks: nothing. Does: nothing.'
  uses: [fact.mn11.scouts-search, fact.mn11.recipe]
  new: true
- id: topic.mn11-scout-words
  label: Your people wanted this stone. What else do you know?
  person: npc.mn.tah-leesh
  stages: [30]
  essential: true
  intent: 'Tah-Leesh. Tells: she sees the player is of the Toh-Reel-Ka; her leader, Cuts-the-Old-Knot, says that whoever
    serves the Toh-Reel-Ka should ask what moans in the cellar of Fort Chalkmoth, the Archwardens'' fort on the Chixathe
    Mesa; she does not know what it means, only that her leader says it every time the order is named. Checks: nothing.
    Does: sets stage 40.'
  uses: [fact.mn11.cellar-words]
  new: true
- id: topic.mn11-give-stone
  label: Here is the stone from the Stormwidow, and a question about Fort Chalkmoth.
  person: npc.mn.never-writes-twice
  stages: [35, 40]
  essential: true
  when:
    hasItem: [thing.mn.marker-stone, 1]
  intent: 'Never-Writes-Twice. Checks: hasItem [thing.mn.marker-stone, 1]. Tells: the seven towers are the drowned spires
    off Lilmoth, towers of the old kings'' land that sank, standing on the sea floor of Benthic Yobesh; the divers of
    Bell Station, a salvage station on an islet east of Lilmoth, have dived them for years and will know which tower
    this is; go there by boat from Lilmoth; that is the hunt, and it comes before anything. To the cellar: Fort Chalkmoth
    is an Archwarden fort like any other, on the Chixathe Mesa above Noota Nara, and an Unbound scout''s words are worth
    nothing; carters hear the wind. She pays a hundred gold. Does: sets stage 90, whose start takes the stone.'
  uses: [fact.mn11.lilmoth-spires, fact.mn11.fort-like-any]
  new: true
- id: topic.mn-fort-chalkmoth
  label: What is Fort Chalkmoth?
  person: npc.mn.never-writes-twice
  stages: [40, 90]
  essential: false
  intent: 'Never-Writes-Twice, first speaker of this shared topic. Tells: an old Imperial fort on the Chixathe Mesa above
    Noota Nara; the Archwardens, the Xeech-Leel''s wardens who keep the old Imperial forts, roads and tolls, man it and
    take a toll on the chalk carts; it is a fort like any other; a Toh-Wo may sleep in its barracks. Checks: nothing. Does:
    nothing.'
  uses: [fact.mn11.fort-like-any]
  new: true
- id: topic.mn11-bell-station
  label: What is Bell Station?
  person: npc.mn.never-writes-twice
  stages: [90]
  essential: false
  intent: 'Never-Writes-Twice. Tells: a salvage station of huts on a bare islet east of Lilmoth, named for the ship''s
    bell at its landing; Lilmoth''s merchant council keeps a crew of divers there who bring up bronze and stones from the
    drowned spires; its steward weighs every find and sells potions for breathing water; the boat goes from Lilmoth.
    Checks: nothing. Does: nothing.'
  uses: [fact.mn11.lilmoth-spires]
  new: true
- id: topic.mn11-nwt-greet
  label: (greeting)
  person: npc.mn.never-writes-twice
  kind: greeting
  stages: [90]
  essential: false
  intent: 'Never-Writes-Twice, after the report. Tells: Bell Station first; the Unbound will not wait. Checks: nothing.
    Does: nothing.'
  uses: [fact.mn11.lilmoth-spires]
  new: true
