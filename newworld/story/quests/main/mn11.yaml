  wants: their pay
  knowledge: {fact.mn11.collector-men: knows}
things:
- id: thing.mn.collector-rubbing
  kind: item
  name: Vanin's Rubbing
  source: new (a note under our name, Skyrim's note)
  where: on a crate beside the empty niche in the Grey Tooth Cave
  states: {all: 'in the cave until taken; reading it moves the quest'}
  text: 'Rubbing from the lintel over the niche, Grey Tooth, north face. Scratched in Cyrodilic, a sailor''s hand: STONE
    TO THE STORMWIDOW BY HER CAPTAIN''S ORDER. 181. The niche is empty and has been for twenty years. The ship lies on
    the south-west beach of this island. I have sold her name to people who will dig the sand for me, and I will buy
    what they find from whoever is left standing. Keep digging here in case I am wrong. E.V.'
- id: thing.mn.marker-stone
  kind: item
  name: Kings' Marker Stone
  source: 'new: a carved stone of King of the Murkmire''s, under our name, a quest item'
  where: in thing.mn.ballast-crate
  states: {before-90: in the crate or carried, after-90: with Never-Writes-Twice}
  text: The stone is carved with seven towers standing in water. One of them is cut deeper than the rest.
- id: thing.mn.ballast-crate
  kind: container
  name: Stormwidow's Ballast Crate
  source: new (a crate of Skyrim's, unlocked, unowned)
  where: in the Stormwidow's hold, among the other ballast crates, past the scouts' fire
- id: thing.mn.seal-recipe
  kind: item
  name: Recipe for the Seal
  source: new (a note under our name, Skyrim's note); reading it teaches the ingredients' paralysis effect
  where: on the scouts' bedroll in the hold, with three bottles of the seal
  text: 'For the seal. Grind the grey caps and the dried root together, wet with swamp water, and work it to a paste.
    It numbs whatever it touches. Press it into the scar after the drawing, thick, and the scar closes. Never more than
    a thumb''s weight to a tree. - C.'
- id: thing.mn.paralysis-poison
  kind: item
  name: Unbound Seal
  source: Skyrim's poison of paralysis under our name (stated alike in MN09, where the player first met it)
  where: three bottles beside the recipe in the Stormwidow's hold
- id: thing.mn11.scout-scrap
  kind: item
  name: Tah-Leesh's Scrap of Bark
  source: new (a note under our name)
  where: carried by Tah-Leesh
  text: Ask what moans in the cellar of Fort Chalkmoth.
