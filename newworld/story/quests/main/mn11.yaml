  plot: story/design/quests/lines/main-plot.md §3, §4, §5 quests 10 to 13, §9 (travel, what each quest needs)
  lore: ['story/lore/extrapolation/argonia-4e201-state.md §1, §2.5, §11.2', story/lore/topics/hist-and-sap.md, story/lore/topics/umbriel.md,
    docs/phases/new-worldspace-plan/research/rulers-rename-map.md]
centrepiece: RECOVER
actionPlan:
- {skill: One-Handed, use: fight-guards, reason: the Collector's hired men camp at the foot of the goat-path and dig in
    the cave; any melee build fights them (Two-Handed alike)}
- {skill: Archery, use: shoot-from-cover, reason: the goat-path and the beach give range on the men and the scouts (Destruction
    alike)}
- {skill: Sneak, use: pass-unseen, reason: the men sit at their fire and the scouts dig at the ballast crates; a quiet
    player reaches the rubbing and the crate past them}
- {skill: Alchemy, use: learn-a-recipe, reason: 'the seal''s recipe teaches the paralysis poison''s ingredients, and
    three bottles of it lie with it, for use on the scouts or later'}
truth:
- id: t1
  when: 4E 181
  who: [the Stormwidow's captain]
  where: the small cave on the Grey Tooth's north face
  what: The captain of the Stormwidow, a ship of Bramman's Brethren, found a carved stone of the old kings in a niche
    of the cave and had it carried aboard. His men scratched on the niche's lintel in Cyrodilic that the stone went to
    the Stormwidow by her captain's order. Weeks later the Archwardens' privateers ran the ship onto Skeith Isle's
    south-west beach and killed her crew (the wreck's place history).
- id: t2
  when: a month before the quest
  who: [npc.mn.ennodius-vanin, npc.mn.vanin-hireling-1, npc.mn.vanin-hireling-2, npc.mn.vanin-hireling-3]
  where: the Grey Tooth
  what: The Collector, who hunts the Eye, sent hired men to dig the cave. They found the empty niche. Vanin took a rubbing
    of the lintel's scratch, wrote his own lines under it and left it in the cave for his men, then sold the wreck's
    name to the Unbound for gold (plot §4, the Collector tells what he learns to whoever pays). His men still dig in
    case the stone came back.
- id: t3
  when: days before the quest
  who: [npc.mn.unbound-scout-1, npc.mn.unbound-scout-2, npc.mn.unbound-scout-3, npc.mn.tah-leesh]
  where: the Wreck of the Stormwidow
  what: Unbound scouts camped in the sand-filled hold and search its ballast crates for the stone. They carry their
    leader's recipe for the seal and three bottles of it. Tah-Leesh, one of them, fell through a rotten deck onto the
    beach below the bow, and the others left her there, unable to walk.
- id: t4
  when: before the quest
  who: [npc.mn.tah-leesh]
  where: the Unbound camps
  what: Tah-Leesh has heard Cuts-the-Old-Knot say that whoever serves the Toh-Reel-Ka should ask what moans in the cellar
    of Fort Chalkmoth. She does not know the answer. She scratched the words on a scrap of bark to keep them.
- id: t5
  when: when the player reports
  who: [npc.mn.never-writes-twice]
  where: Nesh-Deeka's House, Helstrom
  what: Never-Writes-Twice reads the marker stone's seven towers as the drowned spires off Lilmoth and sends the player
    to the divers of Bell Station. Asked about Fort Chalkmoth, she says it is a fort like any other. She lies (plot §3).
playerStart: [The player is a Toh-Wo of the Toh-Reel-Ka and reports to Never-Writes-Twice at the back of Nesh-Deeka's
    House in Helstrom., 'The parchment map from Vicrium shows seven towers in the sea and a crag shaped like a tooth on
    an island; Never-Writes-Twice named the crag as the Grey Tooth on Skeith Isle and marked it.', 'The Unbound, led by
    Cuts-the-Old-Knot, drain Hist sap for a draught to kill whatever guards the Root, and seal the trees they drain with
    a grey paste, a paralysis poison; the player''s journal asks why they seal trees they drain.', 'Ennodius Vanin, the
    Collector, an Imperial relic-hunter, hunts the Eye too.', 'Never-Writes-Twice says Cuts-the-Old-Knot was one of the
    order''s own who went mad on sap and killed her minders.', Nesh-Deeka turns aside every question of how she knows
    where the Unbound have been.]
