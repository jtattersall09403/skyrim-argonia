shapeData:
  route: Helstrom by boat to Archon and on to Arorha; on foot across Skeith Isle to the Grey Tooth (about 980 m), then
    to the Stormwidow on the south-west beach (about 820 m from Arorha), and back by boat to Helstrom
  hazards: the Collector's three hired men at the goat-path and in the cave; three Unbound scouts and the hold's mudcrabs
    at the wreck
  goal: the kings' marker stone
  prize: the marker stone, held in an unlocked ballast crate in the Stormwidow's hold; nobody carries a key
  waysIn: through the men and the scouts by fighting (melee, Archery, Destruction), or past them by Sneak
  whatGoesWrong: a seen player is attacked; the cave and the hold are tight, so a fight there is at close quarters
  afterwards: the Unbound learn that the order has the stone; the Collector's men keep digging an empty cave
stages:
- id: 10
  place: peak-39-m79
  journal: text.journal.mn11.10
  journalText: 'Never-Writes-Twice read the parchment map from Vicrium and named the tooth-shaped crag: the Grey Tooth,
    the seamark of Skeith Isle. The Collector''s hired men are camped at the foot of its goat-path and dig in a small cave
    on its north face. I''m to find out what they found in the Grey Tooth Cave. I may fight them or slip past them.'
