    dig in the small cave on its north face.', from: t2}
- {id: fact.mn11.stone-to-ship, claim: 'The stone that stood in the cave''s niche was carried off to the Stormwidow by
    her captain''s order.', from: t1}
- {id: fact.mn11.wreck-where, claim: The Stormwidow lies beached on the south-west shore of Skeith Isle., from: t1}
- {id: fact.mn11.collector-sold, claim: The Collector sold the wreck's name to people who would dig the sand for him.,
  from: t2}
- {id: fact.mn11.scouts-search, claim: Unbound scouts camp in the Stormwidow's sand-filled hold and search its ballast
