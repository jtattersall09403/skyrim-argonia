      on Skeith Isle, and the Collector's men got there first.
    next: Go to the Grey Tooth (boat to Archon, then Arorha, then on foot) and see what the Collector's men found in the
      cave on its north face.
    ways: Fight the three hired men (any weapon or magic), or pass them by stealth.
