startWhen:
  questStage: [quest.main.mn10, '=', 90]
start: 10
recordStatus: design
foundation: 'Built from the main plot (story/design/quests/lines/main-plot.md §5 quest 11, passed by the owner), and
  invents nothing it does not give beyond the names listed in the review (L8). The quest starts on MN10''s last stage
  (taken as 90, its completed ending: the lead to confirm with the MN10 lane): Never-Writes-Twice, now the player''s
  officer at the back of Nesh-Deeka''s House in Helstrom, has read the parchment map and marked the Grey Tooth. It uses
  the crag''s small cave on the north face and the Stormwidow''s sand-filled hold only; the cairn, its cache and the
  stern''s strongbox belong to Bramman''s Brethren and are never named as targets. The Collector''s three hired men at
  the foot of the goat-path and in the cave, and the three Unbound scouts and the wounded scout at the wreck, are
  switched on by stage 10''s start (the player is in Helstrom, another cell far away), so a player of the Brethren''s
  line who comes first meets neither. Each step is a thing read or taken or a line picked: reading the Collector''s
  rubbing moves the player on to the wreck; taking the marker stone moves them to the wounded scout; her words (or, if
  she is dead, the scrap of bark she carried) move them to the report; Never-Writes-Twice''s report line completes the
  quest, which starts MN12 (the player''s own errand to the cellar of Fort Chalkmoth) and MN13 (the hunt: Bell
  Station) together. The seal''s recipe is optional: reading it teaches the poison''s ingredients, and three bottles of
  the poison lie with it. Who the quest cannot go on without: Never-Writes-Twice.'
recordSources:
  places: [newworld place_card peak-39-m79 --mined (Mount Moesring; the cave added from Skyrim's cave pieces), newworld
