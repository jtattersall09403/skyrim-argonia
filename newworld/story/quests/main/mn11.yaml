- id: 90
  place: helstrom
  journal: text.journal.mn11.90
  journalText: 'Never-Writes-Twice read the marker stone. The marked tower is one of the drowned spires off Lilmoth,
    and the divers of Bell Station, east of Lilmoth, will know which; finding the tower is the order''s hunt, and she
    paid me a hundred gold. I asked her about Fort Chalkmoth. She said it is a fort like any other, but someone moans
    in its cellar, and I mean to see it for myself on my own account. I''m to go to Bell Station for the hunt, or to
    Fort Chalkmoth first; either may come first.'
