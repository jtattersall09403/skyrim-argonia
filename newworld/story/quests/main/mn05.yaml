facts:
- id: fact.mn05.eye
  claim: The Eye of Argonia is the lost jewel of the old priest-kings, cut from Hist amber, the solid sap the trees no longer
    make. It lies at the Root, where the roots of every Hist meet under the sea, behind a gate the old kings sealed, in
    a place no living diver has found.
  from: t3
- id: fact.mn05.draught
  claim: Cuts-the-Old-Knot's draught is to make her strong enough to kill the beast that the old songs say keeps the Root.
  from: t3
