recordStatus: design
foundation: 'Built from main-plot.md §5 quest 5 and the rank table. The player rides the rootworm from Jal-Veesa''s pool
  (the travel network''s fare line, 25 gold) to Helstrom''s city tree, where Cheeval-Xu works the rootworm, and finds Nesh-Deeka''s
  House, one of the city''s one-room Argonian houses, its door showing her name. Nesh-Deeka hears the report and tells the
  player what the Eye of Argonia is and where it lies; the player says what the draught must be for and she agrees. To prove
  the player she sends them for a jar of stolen sap kept by Keel-Raa, an Unbound go-between who lodges at the Boatmen''s
  Lodge (Helstrom''s inn, a ship''s hold interior kept by Sleeps-Last) with two hired men beside him, none hostile, in a
  band of ours whose members'' wrongs Helstrom''s levy does not punish (Skyrim''s flag that reports no crimes against its
  members). The jar is in his pack, a knapsack on the crates behind the three. The player lifts it from the pack unseen
  (Sneak), buys it for 100 gold (he gives the player the pack, and so the one jar in it), or fights the three for it. On the
  jar''s hand-in Nesh-Deeka makes the player a Voh-Vastei (the rank, Sign of Cipactli''s light Argonian armour under our
  name, the order''s traders and 200 gold), gives the order''s aim and her one lead, an "Eye of Argonia" for sale in Gideon,
  by the rootworm from Helstrom''s city tree: stage 90, which starts MN06. The rank is given at the end, after the test
  (the rank table: "given after quest 5").'
