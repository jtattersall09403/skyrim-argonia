    finding: Ranks, founding, charge.
    answer: 'sourced: argonia-4e201-state.md §2.5'
  - id: L2
    severity: lore
    ids:
    - topics.topic.mn-eye-of-argonia
    finding: The Eye cut from Hist amber; at the Root.
    answer: 'sourced: hist-and-sap.md 154; main-plot §3 (our extrapolation; eye-of-argonia.md 6-8 leaves it open)'
  - id: L3
    severity: lore
    ids:
    - stages.20
    finding: A band the levy ignores; attacking it is no crime.
    answer: 'sourced: owner-bar (people offered to talk to start non-hostile; attacking outlaws is no crime); helstrom place
      card (the guard has a bad name)'
  - id: L4
    severity: lore
    ids:
    - stages.26
    finding: Buying gave a second copy of the jar while Keel-Raa's stayed in his pack.
    answer: 'changed: the one jar lies in Keel-Raa''s Pack, a knapsack he owns on the crates behind him; buying gives the
      player the pack (giveOwnership, the ceiling''s "give the player a container''s contents"), so the player takes
      that jar and no copy is made. The suggestion of a build step taking the jar from his inventory was not followed:
      the vocabulary has no result that takes a thing from a person, and a build step of one quest''s own is outside the
      ceiling. The pickpocket way becomes lifting the jar from the pack unseen (Sneak); the plot''s words, "lifts the jar
      from his pack", stand.'
