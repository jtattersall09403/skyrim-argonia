topics:
- id: topic.mn05-cheeval
  label: Where is Nesh-Deeka's House?
  person: npc.mn.cheeval-xu
  stages:
  - 10
  essential: false
  intent: "Cheeval-Xu, the root-tender at the root pool under the city tree, where the rootworm comes up. Tells: he
    takes the rootworm's fares here and shows riders where to go down to it. Nesh-Deeka's House is a quiet house south
    of the city tree, down by the city landing where the rafts tie up, a short walk from the Boatmen's Lodge; her name is on the door; she takes visitors by word of mouth. Checks: nothing. Does:
    nothing."
  new: true
- id: topic.mn05-nesh-who
  label: Who are you?
  person: npc.mn.nesh-deeka
  stages:
  - 10
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: the Toh-Reel-Ka''s handler at Helstrom: she takes the reports of the order''s people in this
    country and gives them their work. Vosh-Leera sends her word now and then. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn05-report
  label: Vosh-Leera sent me. The Unbound are draining the trees.
  person: npc.mn.nesh-deeka
  stages:
  - 10
  essential: true
  intent: 'Nesh-Deeka. Tells: she knows; she hears the player out: the sealed scar, the hide, the camp, Sesk''s names. "The
    Eye" is the Eye of Argonia, the lost jewel of the old priest-kings, who ruled the marsh before any history was written;
    they cut it from Hist amber, the solid sap the trees no longer make. It lies at the Root, the place under the sea where
    the roots of every Hist meet, behind a gate that the last king sealed, in a place no living diver has found. The old songs say a
    beast keeps the Root, older than the kings, and nobody living has seen it. Cuts-the-Old-Knot
    wants the Eye. She asks what the player thinks the draught is for (a question; its answer is topic.mn05-draught). Checks:
    nothing. Does: nothing.'
  uses:
  - fact.mn05.eye
  replies:
  - topic.mn05-draught
  new: true
- id: topic.mn05-draught
  label: Sap makes a fighter strong. She means to kill the beast that keeps the Root.
  person: npc.mn.nesh-deeka
  stages:
  - 10
  essential: true
  intent: "Nesh-Deeka. Tells: (after topic.mn05-report: the Eye of Argonia is the priest-kings' jewel of Hist amber, at
    the Root under the sea behind a sealed gate) she agrees: Cuts-the-Old-Knot means to kill the beast that keeps the Root. Now she wants proof of the player. Keel-Raa, an Unbound go-between, lodges at the Boatmen's Lodge, the inn by
    the raft landing on the river, with two hired men and a jar of stolen sap in his pack. Bring her the jar. He is not
    looking for a fight and will talk, so lift it from his pack (if he or his men catch the player at it, all three
    will fight), buy it, or take it by force: his band pays the levy to look away from them, so the levy will not count
    it a crime either. Does: sets stage 20. Checks: nothing."
  uses:
  - fact.mn05.draught
  - fact.mn05.go-between
  new: true
- id: topic.mn-eye-of-argonia
  label: Tell me about the Eye of Argonia.
  person: npc.mn.nesh-deeka
  stages:
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: the priest-kings cut it from Hist amber in the oldest days, when the trees still made sap
    hard as stone. It is said to be the knot that joins every root to every other; used where it sits, it can pour strength
    down every root. Relic-hunters have chased it for centuries; most chase glass. Checks: nothing. Does: nothing.'
  uses:
  - fact.mn05.eye
  new: true
- id: topic.mn-the-root
  label: What is the Root?
  person: npc.mn.nesh-deeka
  stages:
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: every Hist is joined to every other at the root. Under the sea, somewhere off the coast, the
    roots of every tree meet in one place: the Root. The priest-kings built over it, and the last of them sealed its gate.
    Nobody living knows the way down. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-order-history
  label: Tell me the order's history.
  person: npc.mn.nesh-deeka
  stages:
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: Toh-Reel-Ka is Jel for Secret Warriors. The Xeech-Leel made the order in the Void Nights,
    4E 98 to 100, when the moons vanished and the province feared its trees were turning again, as the sworn guard of the
    Root Talk, the great gathering of the tribes at Helstrom, and of Lilmoth''s third tree. Its one charge has not changed:
    no tree, and no person or group allied with a tree, may bring another Umbriel. It answers to the council of the Xeech-Leel
    and to nobody else. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-ranks
  label: What are the order's ranks?
  person: npc.mn.nesh-deeka
  stages:
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: lowest first, Voh-Vastei, "Apprentice"; Toh-Wo, "Secret-Speaker", one who brings secrets in;
    Reel-Ka, "Warrior", a full member; Ka-Deelith, "War-Teacher", who trains the warriors; and Toh-Nassa, "Leader of the
    Secret". Each rank brings gear and gold, and the order''s doors open wider. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn-xeech-leel
  label: Who are the Xeech-Leel?
  person: npc.mn.nesh-deeka
  stages:
  - 20
  - 26
  - 30
  - 90
  essential: false
  intent: 'Nesh-Deeka. Tells: the party that rules the province, the People of the New Beginning; their council sits here
    in Helstrom, a few streets from her door. They swore to govern in the open. She says it without a smile. Checks: nothing.
    Does: nothing.'
  new: true
- id: topic.mn-umbriel
  label: What was Umbriel?
  person: npc.mn.nesh-deeka
  stages:
