- id: 20
  place: helstrom
  journal: text.journal.mn05.20
  journalText: "Nesh-Deeka heard my report. The Eye is the Eye of Argonia, the old priest-kings' jewel of Hist amber.
    It lies at the Root, where every tree's roots meet under the sea, behind a gate the old kings sealed, and no living
    diver has found it. The old songs say a beast keeps the Root, and nobody living has seen it. I said the draught must be to kill that beast, and she agreed. To prove me, she
    wants a jar of stolen sap from Keel-Raa, an Unbound go-between lodging at the Boatmen's Lodge with two hired men. I
    can lift it from his pack on the crates behind them while they are not looking, buy it for a hundred gold, or fight
    the three of them for it, which the levy will not count as a crime. If they catch me at the pack, all three will
    fight me. She wants the jar brought to her."
