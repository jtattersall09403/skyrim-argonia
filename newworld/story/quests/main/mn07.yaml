  journal: text.journal.mn07.90
  journalText: Nesh-Deeka did not know the keystone, but it is of Kothringi make (the Kothringi were the silver-skinned
    people of the marsh, all dead of the Knahaten Flu long ago), and the Chime-Keepers of Toklea keep what is left of Kothringi
    lore. She already knew the Unbound had not found the wreck. Before I could ask how, she said "we listen" and talked
    of Toklea instead. She paid me 100 gold.
