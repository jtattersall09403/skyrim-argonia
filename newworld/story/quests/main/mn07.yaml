  essential: false
  intent: 'Nesh-Deeka. Tells: Poles-Upriver''s boats to Archon and round the coast to Thorn; walk south from Thorn to Ysan,
    a landing of stone-cutters with a dry-stone jetty; the wreck lies a short swim out, with slaughterfish about it. Does:
