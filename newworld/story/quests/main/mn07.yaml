  journal: text.journal.mn07.10
  journalText: Nesh-Deeka sent me to the wreck of the Pale Harvest in Hatandros Bight, a short swim out from Ysan's jetty.
    I'm to get into the hold, where the drowned crew walk, and open the captain's strongbox. I may fight them or steal past
    and pick its lock; the captain carries its key.
  directions: Poles-Upriver's boats run from Helstrom's landing down the rivers to Archon and on round the coast to Thorn.
    From Thorn's quay walk south along the coast to Ysan's stone jetty, then swim east past the slaughterfish to the listing
    hull; its door lets into the hold.
