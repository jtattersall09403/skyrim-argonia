- id: 20
  place: sunken-ruin-23-m112
  journal: text.journal.mn19.20
  journalText: I laid my hand on the Eye of Argonia. I'm to choose what to do with it.
  onEnter:
  - showChoice:
      text: 'The Eye of Argonia sits among the roots of every tree. Under your hand you feel them all.


        USE IT where it sits, as the order ordered. Every tree is healed and the roots stay joined. The order''s dreamers
        see through every tree again, and its rule is made fast. The gate gives the stones back, for Never-Writes-Twice.
        The sap Cuts-the-Old-Knot drank will carry the Eye''s power through her, and she will die.


        TAKE IT. Every tree is parted from every other for good. About three trees in ten die, with their villages. The
        dreams end and the order is broken, and its people will hunt you. No Hist will bless you again. The Eye is yours.


        GIVE IT to Cuts-the-Old-Knot. She lifts it: the same parting and the same deaths. The Eye is hers, and she stands
        with you.'
      buttons:
      - label: Use the Eye
        sets: 30
      - label: Take the Eye
        sets: 40
      - label: Give it to Cuts-the-Old-Knot
        sets: 50
