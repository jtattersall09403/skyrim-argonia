topics:
- id: topic.mn-ranks
  label: What do the order's ranks mean?
  person: npc.mn.never-writes-twice
  stages:
  - 30
  - 31
  - 90
  intent: 'Never-Writes-Twice. Tells: the Toh-Reel-Ka''s ranks, lowest first, are Voh-Vastei, "Apprentice"; Toh-Wo, "Secret-Speaker";
    Reel-Ka, "Warrior"; Ka-Deelith, "War-Teacher", who may teach the order''s fighters; and Toh-Nassa, "Leader of the Secret",
    the order''s highest.'
  new: false
- id: topic.mn-the-root
  label: What is the Root?
  person: npc.mn.never-writes-twice
  stages:
  - 30
  - 31
  intent: 'Never-Writes-Twice. Tells: the Root is the place under the sea where the roots of every Hist meet; the Eye sits
    there and binds them; it is sealed again now, as it should be.'
  new: false
- id: topic.mn19-stones
  label: Here are the three seal-stones. The trees are healed.
  person: npc.mn.never-writes-twice
  stages:
  - 30
  - 31
  essential: true
  when:
    all:
    - hasItem:
      - thing.mn.seal-stone-thief
      - 1
    - hasItem:
      - thing.mn.seal-stone-vault
      - 1
    - hasItem:
      - thing.mn.seal-stone-deep
      - 1
  intent: 'Never-Writes-Twice. Tells: she takes the stones; nobody will open that gate again; she names the player Toh-Nassa,
    Leader of the Secret, and gives them the keep of Fort Chalkmoth for their house, with its smith and its trainer; the
    order''s members will teach them without charge. If asked about the cellar, she says the dreamers are the reason there
    will be no second Umbriel, and the player now keeps the house above them. Does: sets stage 90. Fallback when the stones
    are not held: bring all three.'
  new: true
- id: topic.mn19-cuts-give
  label: (greeting)
  person: npc.mn.cuts-the-old-knot
  kind: greeting
  stages:
  - 50
  intent: 'Cuts, with the Eye. Tells: it is done; the dreams are over; she will not forget the trees it cost. The player
    stands beside her at the head of the Unbound; the power she taught calls her to their side, the other sends her home
    to Karsh-Naal, and the longhouse there is theirs.'
  new: true
- id: topic.mn19-knot-breaker
  label: What is a Knot-Breaker?
  person: npc.mn.cuts-the-old-knot
  stages:
  - 40
  - 50
  when:
    npcAlive: npc.mn.cuts-the-old-knot
  intent: 'Cuts-the-Old-Knot. Tells: the old knot is the bond that tied every tree to every other and every hatchling to
    a tree, the bond that cast out the tribeless; the Unbound take their name from being out of it. A Knot-Breaker is
    one who has cut it, the highest the Unbound name anyone; she took her own name from the same work, and her storm
    spell carries it. The player is one now. Checks: nothing. Does: nothing.'
  new: true
- id: topic.mn19-cuts-take
  label: (greeting)
  person: npc.mn.cuts-the-old-knot
  kind: greeting
  stages:
  - 40
  when:
    npcAlive: npc.mn.cuts-the-old-knot
  intent: 'Cuts, in the guardian''s hall after the Take ending. Tells: she felt it go; the Eye is the player''s, and she
    thanks them; the Unbound are theirs to lead beside her.'
  new: true
