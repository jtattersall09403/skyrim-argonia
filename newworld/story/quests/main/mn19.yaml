  journalText: 'The Root is where the roots of every Hist meet. The Eye of Argonia, the old kings'' jewel, sits among them:
    used where it sits, it heals every tree; lifted, it parts them for good. Beyond the guardian''s hall lies the Root,
    where the roots of every Hist meet, and the Eye of Argonia sits among them. I''m to go to the Eye and decide what to
    do with it.'
