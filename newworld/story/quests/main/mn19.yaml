- id: 30
  place: sunken-ruin-23-m112
  journal: text.journal.mn19.30
  journalText: 'I used the Eye where it sits. I saw the trees of the marsh heal, every one. Cuts-the-Old-Knot died of it
    in the guardian''s hall: the sap she drank carried the Eye''s power through her. The Kings'' Gate gave the three stones
    back to me as it closed. I''m to bring them to Never-Writes-Twice in Nesh-Deeka''s House in Helstrom.'
  onEnter:
  - endingScene: use
    messages:
    - The roots under your hand warm. Light runs out along them, away into the dark, to every tree in the marsh.
    - At Jal-Veesa the grey bark softens and the scar weeps sap. At Teel-Fen Weir the young tree's pool grows warm again.
      In Lilmoth, in Gideon, in a hundred villages, the trees stand green.
    - Far off, in the cellar of Fort Chalkmoth, the dreamers stir and begin to speak. Every tree shows them everything again.
      The Xeech-Leel's rule is made fast for another age.
