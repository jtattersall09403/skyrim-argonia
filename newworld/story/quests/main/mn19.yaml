- id: 40
  place: sunken-ruin-23-m112
  journal: text.journal.mn19.40
  journalText: I lifted the Eye of Argonia from its plinth, and the trees parted. I saw about three in ten of them die.
    The dreamers will see nothing now, and the Unbound will open the cellar. They count me a Knot-Breaker now, their
    highest rank, one who has broken the old knot that tied every tree to every other. Every member and friend of the
    Toh-Reel-Ka will attack me, and no Hist will bless me again. The Eye is mine.
  onEnter:
  - endingScene: take
    messages:
    - You lift the Eye. The roots under it go slack, and a sound like a long breath runs away into the dark.
    - 'Across the marsh the trees stand alone. The strong ones stay green. The weak ones grey and blacken: about three in
      every ten. At Jal-Veesa and at Teel-Fen Weir the pools go cold, and the people leave.'
    - In Fort Chalkmoth the dreamers wake and see nothing. The Unbound break the cellar door. In Helstrom the order's people
      rage, and they will know whose hand did it.
  - setFlag:
    - flag.mn.trees-parted
    - true
  - giveItem:
    - thing.mn.eye-of-argonia
    - 1
  - grantAbility:
    - spell.mn.eyes-gaze
