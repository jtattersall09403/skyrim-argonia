foundation: 'Written 2026-11-17 from main-plot.md quest 19 and §8. Touching the Eye (a use) shows the final choice on a
  message box (the approved block): three buttons if Cuts-the-Old-Knot is alive, two if not (Give is open only while she
  lives). Each button sets an ending stage whose start plays the staged ending scene; until the scenes are made, the scene''s
  messages carry the whole vision on a black screen. Use gives the stones back from the gate, kills Cuts-the-Old-Knot if
  she lives (the approved stage that kills one named person) and ends at the hand-in to Never-Writes-Twice (Toh-Nassa).
  Take and Give part the trees: the dead Hists chosen at their places'' builds are switched on by flag.mn.trees-parted.
  Give moves Cuts-the-Old-Knot to the plinth under the black screen of the ending scene. The world stays open after.'
