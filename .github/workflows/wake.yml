# Wake on reply (chunk 0.0 §a): an owner comment on an owner issue, or any issue the owner opens, starts the stopped
# build VM so the agent reads it and acknowledges it. "Run workflow" (GitHub mobile too) does the same.
# The "play"/"stop" comment switch for the game machine is gone (owner, 2026-10-31: pointless; the play page starts
# and stops it). Only the owner's own comments count: agent posts carry the marker <!-- argonia-agent -->.
name: wake
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:
concurrency:
  group: wake
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
  issues: write
jobs:
  wake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'jtattersall09403' &&
       !contains(github.event.issue.body, '<!-- argonia-agent')) ||
      (github.event.comment.user.login == 'jtattersall09403' &&
       !contains(github.event.comment.body, '<!-- argonia-agent') &&
       (contains(github.event.issue.labels.*.name, 'owner-check') ||
        contains(github.event.issue.labels.*.name, 'owner-call')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_WAKE_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Start the build VM
        id: run
        run: |
          read -r id st < <(aws ec2 describe-instances --region eu-west-2 --filters Name=tag:Name,Values=argonia-build \
            --query 'Reservations[].Instances[?State.Name!=`terminated`][].[InstanceId,State.Name]' --output text | head -1)
          if [ -z "$id" ]; then build=missing
          elif [ "$st" != stopped ]; then build="already-$st"
          elif out=$(aws ec2 start-instances --region eu-west-2 --instance-ids "$id" 2>&1); then build=started
          elif grep -q capacity <<<"$out"; then build=no-capacity
          else echo "$out" >&2; build=error; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "build VM: $build"
      - name: Tell the owner
        if: steps.run.outputs.build == 'no-capacity' || steps.run.outputs.build == 'missing' || steps.run.outputs.build == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.run.outputs.build }}
        run: |
          if [ "$BUILD" = no-capacity ]; then msg="AWS has no spot capacity for my build machine right now; it will start when capacity returns."
          else msg="I could not start my build machine; see the wake workflow log."; fi
          gh issue comment "${{ github.event.issue.number }}" -R "${{ github.repository }}" \
            --body "$msg"$'\n\n<!-- argonia-agent -->' || true
