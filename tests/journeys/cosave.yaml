# 1.1 adapters (owed L4): ArgoniaCore's co-save families survive a rest save, a quit and a relaunch. The scene sets
# nothing in the families; LF83's start (a real topic) gives JRNL, QWCH and TOPC something to carry. Rest is the only
# save (1.5): the journey saves by resting.
id: cosave
runner: 1
step_saves: false        # it counts or tests saves: no step save (run_journey resume)
scene: first-place
steps:
  - name: families-listed
    expect:
      - {read: [core, Families], path: "", contains: STAT}
      - {read: [core, Families], path: "", contains: QWCH}
      - {read: [core, Families], path: "", not_contains: TSTN}
  - name: rest
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationRoadIn 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 4}
      - {console: "player.setangle x 0"}
    expect:
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaRest written (rest)"}, within: 10}
      - {read: [core, SaveCount], path: value, keep: saves, within: 10}
  - name: digests-before
    expect:
      - {read: [core, Families], path: "", keep: families}
      - {read: [core, FamilyDigest, META], path: value, keep: d_meta}
      - {read: [core, FamilyDigest, STAT], path: value, keep: d_stat}
      - {read: [core, FamilyDigest, DISP], path: value, keep: d_disp}
      - {read: [core, FamilyDigest, JRNL], path: value, keep: d_jrnl}
      - {read: [core, FamilyDigest, ITEM], path: value, keep: d_item}
      - {read: [core, FamilyDigest, DETH], path: value, keep: d_deth}
      - {read: [core, FamilyDigest, QSTA], path: value, keep: d_qsta}
      - {read: [core, FamilyDigest, TOPC], path: value, keep: d_topc}
      - {read: [core, FamilyDigest, QWCH], path: value, keep: d_qwch}
      - {read: [core, GetAttribute, strength], path: value, keep: str}
  - name: quit-relaunch-load  # the game process quits and relaunches; the rest save loads
    do: [{relaunch: ArgoniaRest}, {wait: 4}]
    expect: [{log: {name: ArgoniaCore, contains: "co-save"}, within: 30}]
  - name: digests-after
    expect:
      - {read: [core, Families], path: "", eq: {kept: families}, within: 20}
      - {read: [core, FamilyDigest, META], path: value, eq: {kept: d_meta}}
      - {read: [core, FamilyDigest, STAT], path: value, eq: {kept: d_stat}}
      - {read: [core, FamilyDigest, DISP], path: value, eq: {kept: d_disp}}
      - {read: [core, FamilyDigest, JRNL], path: value, eq: {kept: d_jrnl}}
      - {read: [core, FamilyDigest, ITEM], path: value, eq: {kept: d_item}}
      - {read: [core, FamilyDigest, DETH], path: value, eq: {kept: d_deth}}
      - {read: [core, FamilyDigest, QSTA], path: value, eq: {kept: d_qsta}}
      - {read: [core, FamilyDigest, TOPC], path: value, eq: {kept: d_topc}}
      - {read: [core, FamilyDigest, QWCH], path: value, eq: {kept: d_qwch}}
      - {read: [core, SaveCount], path: value, eq: {kept: saves}}
      - {read: [av, Fame, player], path: current, eq: {kept: str}}
