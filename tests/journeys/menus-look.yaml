# 1.12 owner look 1, lane 1.12-menus (L4 stills, the Tab burst L5): every screen the player meets in play, at the play
# camera, from the props scene (a crate, a crate to lock, the ledger, lockpicks, a camp spot). Rows: "Tab opens Wind
# UI's panes with no Dear Diary menu showing first" (the burst, frame by frame), "Esc opens our system menu in the frame
# style, with no Quests entry", "Wait, and every other screen the player meets in play, is in the frame style", "The
# journal opened from the pause menu is the paper book, the same as on J". Each still goes to one reader with its step's
# list and the feel question. The engine's own menus are opened by their keys and props; nothing sets what is tested.
id: menus-look
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium
batch_last: true         # the sitting and the wait change the time and the saves
scene: ui-props
steps:
  - name: play
    do: [{wait: 3}]
    reader: [the play camera, our HUD, nothing of a menu on screen]
  - name: tab-burst          # 20 frames a second over 2 s from just before Tab: no Dear Diary picker in any frame
    do:
      - {burst: {frames: 40, fps: 8}}       # 5 s: Wind UI took 1.8 s to draw after the tween (20261101T143721)
      - {wait: 2}
      - {key: "TAB 120 engine"}
      - {wait: 5}
      - {burst_fetch: tab}
    expect:
      - {log: {name: ArgoniaCore, contains: "pad: Dear Diary's tween hidden at its opening"}, within: 5}
      - {log: {name: ArgoniaCore, contains: "pad: windows open"}, within: 5}
    reader: [Wind UI's windows (inventory, character, magic) and its taskbar in the frame style, no Dear Diary centre picker (inventory, magic, stats, map words on paper) anywhere]
  - name: taskbar-journal    # the taskbar's Journal (a click there): our paper book, as on J, not Wind UI's journal window
    do:
      - {call: [input, mouse, "1138", "1037", both]}
      - {wait: 0.5}
      - {call: [input, click, left]}
      - {wait: 3}
    expect:
      - {log: {name: ArgoniaCore, contains: "pad: Wind UI's taskbar Journal at"}, within: 5}
      - {read: [core, Views], path: value, contains: "journal ready open", within: 8}
    reader: [the paper book (two leaves, bookmark ribbons) in its frame, the same as on J, no black Wind UI journal window and no Wind UI windows over it]
  - name: taskbar-journal-closed
    do: [{close_menu: journal}, {wait: 2}]
  - name: windows-closed
    do: [{key: "ESC 120 engine"}, {wait: 2}]
  - name: journal-key        # J: the same paper book
    do: [{key: "J 120 engine"}, {wait: 3}]
    expect: [{read: [core, Views], path: value, contains: "journal ready open"}]
    reader: [the paper book (two leaves, bookmark ribbons) in its frame]
  - name: journal-key-closed
    do: [{close_menu: journal}, {wait: 1.5}]
  - name: esc-system         # Esc in play: our System pane over the hidden Journal Menu
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect:
      - {event: {kind: menu, match: Journal Menu}}
      - {log: {name: ArgoniaCore, contains: "menus: Esc's Journal Menu hidden; our System pane opens"}, within: 5}
      - {read: [core, Views], path: value, contains: "system ready open", within: 5}
    reader: [one small window in the frame style (green-black pane, gold-green trim, warm text) titled System, entries Settings, Load, Quit to the main menu, Quit to the desktop, a Close button, no Quests entry, nothing of Dear Diary's parchment journal behind or around it]
  - name: system-settings    # Settings: the engine's own settings page
    do: [{call: [core, ViewIntent, '{"type":"system.pick","v":1,"body":{"action":"settings"}}']}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "menus: the System page's SETTINGS pressed"}, within: 5}
      - {log: {name: ArgoniaCore, contains: "Journal Menu handed over (tabs hidden: QuestsTab"}, within: 5}
    reader: [the game's settings list (gameplay, display, audio and the rest) on a dark green-black ground with warm light words (the frame style), no parchment page, no Quests or stats tab]
  - name: settings-back      # Esc backs out to the page's main list: our System pane again
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "menus: back at the System page's main list"}, within: 6}
      - {read: [core, Views], path: value, contains: "system ready open", within: 5}
    reader: [our System pane again, no Dear Diary System list or Quests tab]
  - name: system-load        # Load: the engine's own save list, in the frame style too
    do: [{call: [core, ViewIntent, '{"type":"system.pick","v":1,"body":{"action":"load"}}']}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "menus: the System page's LOAD pressed"}, within: 5}]
    reader: [the save list on a dark green-black ground with warm light words (the frame style), no parchment page, no Quests or stats tab]
  - name: load-back
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect: [{read: [core, Views], path: value, contains: "system ready open", within: 6}]
  - name: system-closed
    do: [{close_menu: system}, {wait: 2}]
    expect: [{event: {kind: menu, match: '"menu": "Journal Menu", "opening": false'}, within: 5}]
  - name: wait-opens         # T: our wait window over the hidden Sleep/Wait Menu
    do: [{key: "T 120 engine"}, {wait: 3}]
    expect:
      - {event: {kind: menu, match: Sleep/Wait Menu}}
      - {read: [core, Views], path: value, contains: "wait ready open", within: 5}
    reader: [one small window in the frame style titled Wait, the time now, the hours with minus and plus, a Wait button, nothing of Dear Diary's parchment wait dialog]
  - name: wait-two-hours     # two hours through the menu's own OK: the clock moves on and the menu closes itself
    do:
      - {call: [core, ViewIntent, '{"type":"wait.pick","v":1,"body":{"hours":2}}']}
      - {wait: 8}
    expect:
      - {log: {name: ArgoniaCore, contains: "menus: wait 2 h through"}, within: 5}
      - {event: {kind: menu, match: '"menu": "Sleep/Wait Menu", "opening": false'}, within: 15}
    reader: [play again after the wait, no menu left on screen]
  - name: props-found
    expect:
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: count, eq: 2}
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: refs.0.ref, keep: chest}
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: refs.1.ref, keep: lockbox}
      - {read: [refs, ARG_Book_StationWaterLedger, "1500"], path: refs.0.ref, keep: book}
  - name: container
    do: [{console: '"{chest}".activate player'}, {wait: 3}]
    expect: [{event: {kind: menu, match: ContainerMenu}}]
    reader: [the crate and the inventory side by side in Wind UI's windows, the frame style]
  - name: container-closed
    do: [{key: "ESC 120 engine"}, {wait: 2}]
  - name: book               # book reading stays parchment by ruling
    do: [{console: '"{book}".activate player'}, {wait: 3}]
    expect: [{event: {kind: menu, match: Book Menu}}]
    reader: [the ledger's pages on paper (parchment by ruling), every word in Pelagiad, no Nordic ornament]
  - name: book-closed
    do: [{close_menu: Book Menu}, {wait: 2}]
  - name: message-box        # an engine message box (Debug.MessageBox, the scripts' own route): the frame style
    do: [{call: [core, MessageBox, "The tide is out."]}, {wait: 3}]
    expect:
      - {event: {kind: menu, match: MessageBoxMenu}}
    reader: [one small message box reading "The tide is out." with an OK button, a dark green-black ground with warm light words (the frame style), no parchment]
  - name: message-box-closed
    do: [{close_menu: MessageBoxMenu}, {wait: 2}]
  - name: rest-sitting       # rest at the camp spot: the sitting, ours
    do: [{rest: ARG_Ref_ClaywaterStationRoadIn}]
    expect: [{read: [core, SittingOpen], path: value, eq: true, within: 10}]
    reader: [the sitting in the frame style, every word in Pelagiad]
