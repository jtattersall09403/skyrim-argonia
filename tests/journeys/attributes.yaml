# 1.1 adapters (owed L4): the 7 attributes live in the STAT family and are mirrored into 7 reserved actor values
# (seam.cpp attribute_mirrors, av-audit.md). Reads through the bridge's `core GetAttribute` and `av`. The setter half
# (SetAttribute, its clamps and the unknown-name path) needs a bridge setter, which `core` refuses by design: owed.
id: attributes
runner: 1
scene: first-place
steps:
  - name: mirrors-equal       # each attribute equals its mirror AV, all 7
    expect:
      - {read: [core, GetAttribute, strength], path: value, keep: a_str}
      - {read: [av, Fame, player], path: current, eq: {kept: a_str}}
      - {read: [core, GetAttribute, intelligence], path: value, keep: a_int}
      - {read: [av, Infamy, player], path: current, eq: {kept: a_int}}
      - {read: [core, GetAttribute, willpower], path: value, keep: a_wil}
      - {read: [av, LastFlattered, player], path: current, eq: {kept: a_wil}}
      - {read: [core, GetAttribute, agility], path: value, keep: a_agi}
      - {read: [av, FavorPointsBonus, player], path: current, eq: {kept: a_agi}}
      - {read: [core, GetAttribute, speed], path: value, keep: a_spd}
      - {read: [av, FavorsPerDay, player], path: current, eq: {kept: a_spd}}
      - {read: [core, GetAttribute, endurance], path: value, keep: a_end}
      - {read: [av, FavorsPerDayTimer, player], path: current, eq: {kept: a_end}}
      - {read: [core, GetAttribute, personality], path: value, keep: a_per}
      - {read: [av, IgnoreCrippledLimbs, player], path: current, eq: {kept: a_per}}
  - name: unknown-attribute   # luck is not one of the 7: the not-found value
    expect: [{read: [core, GetAttribute, luck], path: value, eq: -1.0}]
  - name: set-and-clamp
    owed: a bridge setter for SetAttribute (core refuses setters); then 40+i for each, 10000 -> 255, -5 -> 0
  - name: rest-save           # the only save: rest at the scene's camp spot
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationRoadIn 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 4}
      - {console: "player.setangle x 0"}
    expect: [{read: [core, WakePoint], path: value, ne: "", within: 10}]
  - name: load-rest
    do: [{call: [load, ArgoniaRest]}, {wait: 4}]
  - name: mirrors-after-load  # the mirror is re-applied on load
    expect:
      - {read: [core, GetAttribute, strength], path: value, eq: {kept: a_str}, within: 20}
      - {read: [av, Fame, player], path: current, eq: {kept: a_str}}
      - {read: [av, IgnoreCrippledLimbs, player], path: current, eq: {kept: a_per}}
      - {read: [av, FavorsPerDayTimer, player], path: current, eq: {kept: a_end}}
