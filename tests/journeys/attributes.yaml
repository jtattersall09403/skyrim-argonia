# Draft (1.1 adapters): owed L4, run by 0.3's hands. In 0.3 §d's format, because tools/run_journey.py does not
# exist yet (checked 2026-10-30). 1.1's acceptance: the 7 attributes live in the STAT family and are mirrored into
# 7 reserved actor values (seam.cpp attribute_mirrors, av-audit.md).
id: attributes
status: draft, owed L4
scene: the base save; ArgoniaCore.dll deployed
mirrors: {strength: Fame, intelligence: Infamy, willpower: LastFlattered, agility: FavorPointsBonus,
  speed: FavorsPerDay, endurance: FavorsPerDayTimer, personality: IgnoreCrippledLimbs}
steps:
  - do: for each attribute, read GetAttribute(name) and console `player.GetAV <mirror>`
    expect: the two are equal for all 7
  - do: for each attribute, SetAttribute(name, 40 + i) (i its index 0..6), then read again
    expect: GetAttribute returns 40 + i, and GetAV <mirror> == 40 + i, for all 7
    still: one (the console output)
  - do: SetAttribute("strength", 10000) and SetAttribute("strength", -5)
    expect: each returns the clamped value (255 and 0, seam.cpp kAttributeMax and kAttributeMin), with the mirror equal to it
  - do: SetAttribute("luck", 50) (not one of the 7)
    expect: returns -1.0 (the not-found value) with a warn line in the SKSE log, and no actor value changes
  - do: console `save arg-attr`, then `load arg-attr`
    expect: all 7 GetAV mirrors equal the GetAttribute values after load
pass: every expectation
fails_if: a mirror differs from its attribute, an unknown-actor-value error in the SKSE log, a crash
