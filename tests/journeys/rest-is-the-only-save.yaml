# 1.5 (owed L4), native map S17a's saving half: quicksave, the wait and travel autosaves write nothing; the rest at
# the camp writes the one save; a rest inside a settlement is refused. SaveCount (META) counts every co-save write,
# so a save the game made would move it. A second camp spot is placed at Claywater's well junction (a settlement).
id: rest-is-the-only-save
runner: 1
step_saves: false        # it counts or tests saves: no step save (run_journey resume)
scene: first-place
steps:
  - name: before
    expect:
      - {read: [core, SaveCount], path: value, keep: n0}
      - {read: [core, WakePoint], path: value, keep: wake0}
  - name: quicksave           # F5: nothing written
    do: [{key: "F5 120"}, {wait: 4}]
    expect: [{read: [core, SaveCount], path: value, eq: {kept: n0}}]
  - name: wait-an-hour        # the wait autosave is off
    do: [{game_hours: 1}, {wait: 3}]
    expect: [{read: [core, SaveCount], path: value, eq: {kept: n0}}]
  - name: travel-autosave
    owed: a load door reachable from the first place, named by its ref (the travel autosave through a real door)
  - name: rest                # the one save
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationRoadIn 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 4}
      - {console: "player.setangle x 0"}
    expect:
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaRest written (rest)"}, within: 10}
      - {read: [core, SaveCount], path: value, gt: {kept: n0}}
      - {read: [core, SaveCount], path: value, keep: n1}
      - {read: [core, WakePoint], path: value, keep: wake1}
  - name: settlement-refused  # a camp spot inside Claywater: the wait-only line, no save, the wake point unmoved
    do:
      - {console: "ARG_Ref_ClaywaterStationQuestBoard.placeatme ARG_CampSpot 1"}
      - {console: "player.moveto ARG_Ref_ClaywaterStationQuestBoard 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 3}
      - {console: "player.setangle x 0"}
    expect:
      - {read: [core, RestNotice], path: value, ne: ""}
      - {read: [core, SaveCount], path: value, eq: {kept: n1}}
      - {read: [core, WakePoint], path: value, eq: {kept: wake1}}
  - name: digests-before
    expect:
      - {read: [core, FamilyDigest, STAT], path: value, keep: d_stat}
      - {read: [core, FamilyDigest, DETH], path: value, keep: d_deth}
      - {read: [core, FamilyDigest, META], path: value, keep: d_meta}
  - name: load-rest
    do: [{call: [load, ArgoniaRest]}, {wait: 4}]
  - name: loaded-same
    expect:
      - {read: [core, FamilyDigest, STAT], path: value, eq: {kept: d_stat}, within: 20}
      - {read: [core, FamilyDigest, DETH], path: value, eq: {kept: d_deth}}
      - {read: [core, WakePoint], path: value, eq: {kept: wake1}}
