# Water types (lane 1.15-r5-water-types, owner #37): one shore still per water type, each cell's XCWT the DB's rule
# (water/layer.py cell_type) templating the record the game draws. Teleport, settle, one still each at the play camera,
# 13:00. Generated by `python3 -m tools.journeys refresh` (tools/journeys/gen.py) from the build: never hand-edit.
# Reader checklist: the seven stops read as seven waters: sea (turquoise, Tropical Skyrim's), green marsh, black swamp,
# river (flowing), stream (flowing, clear), tarn (cold teal), brackish rim (between marsh and sea); a still type does
# not drift, a flowing one does; near and far water read as water: no marbling, no black-and-green blotch, no white tiles.
id: water-types
runner: 1
crash_risk: medium
scene: creature-spots
camera: third
