# Water types (lane 1.15-r5-water-types, owner #37): one still per water type, each cell's XCWT the DB's rule
# (water/layer.py cell_type) templating the record the game draws. Each stop stands on dry ground SHORE_BACK_M back from
# the shore, eye 1.6 m up, first person, HUD off, 13:00: the sea from its beach facing open water (horizon in frame),
# the marsh and swamp facing the widest reach of their water, the river and stream from the bank facing downstream
# along the reach (far bank in frame). Generated by `python3 -m tools.journeys refresh` (tools/journeys/gen.py) from the
# build: never hand-edit.
# Reader checklist: the seven stops read as seven waters: sea (turquoise, Tropical Skyrim's), green marsh, black swamp,
# river (flowing), stream (flowing, clear), tarn (cold teal), brackish rim (between marsh and sea); water fills the
# middle of the frame; near and far water read as water: no marbling, no black-and-green blotch, no white tiles.
id: water-types
reach: [esm, "tools/argonia_world/water/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium
scene: creature-spots
camera: first
steps:
- name: sea
  # sea water from cell (-61,-14), level 0.0 m
  # subject: -247808 -83308 0
  do:
  - hud: off
  - console: tgm
  - console: {line: cow ARG_Province -61 -14, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -247808
  - console: player.setpos y -54946
  - console: player.setpos z 1624
  - wait: 6
  - console: player.setangle z 180
  - console: player.setangle x 4
  - wait: 4
  expect:
  - {read: [player], path: pos, keep: sea}
  reader: [the header checklist for this kind of stop]
