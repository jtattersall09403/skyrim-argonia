# 1.12 §9, the L5 row "The open and close hand-offs of the panes, the journal and the dialogue window, a clip".
# Reason for L5 (docs/loops.md): a hand-off is a transition: whether the HUD hides before the windows draw, whether
# a window flashes Skyrim's own menu or the System page between frames, shows only in motion. Each burst is ~6 s at
# 5 fps, read frame by frame by a reader: no frame shows a Skyrim (paper) menu, the HUD over a window, or two of our
# screens on top of each other.
id: ui-handoffs
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: low
scene: claywater
steps:
  - name: settle
    do: [{pad: "LY=1:600"}, {wait: 2}]
  - name: windows-open-close     # Tab opens Wind UI's windows, Tab closes them
    do: [{burst: {frames: 30, fps: 5}}, {wait: 1}, {key: "TAB 120 engine"}, {wait: 2.5}, {key: "TAB 120 engine"}, {wait: 2.5}, {burst_fetch: windows}]
  - name: journal-open-close     # J opens our journal, Esc closes it
    do: [{burst: {frames: 30, fps: 5}}, {wait: 1}, {key: "J 120 engine"}, {wait: 2.5}, {close_menu: journal}, {burst_fetch: journal}]
  - name: map-open-close         # M opens our chart, closed by its own control
    do: [{burst: {frames: 30, fps: 5}}, {wait: 1}, {key: "M 120 engine"}, {wait: 2.5}, {close_menu: MapMenu}, {burst_fetch: map}]
  # The pad's cycle is pad-panes' (its stills); a burst beside the pad's own desktop job collided (final2).
