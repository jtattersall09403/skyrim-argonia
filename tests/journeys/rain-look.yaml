# 1.15 round 6 (checks row 158, owner 19:05 #41: yellow smog fog in rain): the rock-booth rock-1 stand under our wet-rain and
# storm weathers, forced by form id at noon. One still each for a `reader`: grey or slate, no yellow or olive cast.
id: rain-look
reach: ["tools/argonia_world/regions/**", "data/dependencies.json", "records: Weathers", "records: ImageSpaces", "records: Regions", "records: cell -55,63 r1"]   # the pass ledger's inputs (tools/pass_ledger.py)
look: world
runner: 1
independent_steps: true
crash_risk: low
scene: rock-booth
camera: first
steps:
  - name: rock-1-wet-rain
    scan: 6
    # subject: -222823 258927 38246
    do: [{hud: "off"}, {console: {line: "cow ARG_Province -55 63", settle: 60}}, {wait: 8},
         {console: "sw Argonia.esm|0x000E9F"}, {console: "fw Argonia.esm|0x000E9F"}, {settle: {cap: 14, min: 3}},
         {console: "set gamehour to 12"}, {console: "player.setpos x -222834"}, {console: "player.setpos y 258507"},
         {console: "player.setpos z 38083"}, {console: "player.setangle z 1"}, {console: "player.setangle x -6"}, {wait: 6}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_wet_rain, within: 20}]
    reader: [grey or slate fog and sky, no yellow or olive cast anywhere, rain visible, the rock in frame]
  - name: rock-1-storm
    scan: 6
    # subject: -222823 258927 38246
    do: [{hud: "off"}, {console: {line: "cow ARG_Province -55 63", settle: 60}}, {wait: 8},
         {console: "sw Argonia.esm|0x000811"}, {console: "fw Argonia.esm|0x000811"}, {settle: {cap: 14, min: 3}},
         {console: "set gamehour to 12"}, {console: "player.setpos x -222834"}, {console: "player.setpos y 258507"},
         {console: "player.setpos z 38083"}, {console: "player.setangle z 1"}, {console: "player.setangle x -6"}, {wait: 6}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_storm, within: 20}]
    reader: [grey or slate fog and sky, no yellow or olive cast anywhere, rain visible, the rock in frame]
