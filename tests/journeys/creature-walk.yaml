# Creature walk (1.15 §g.4), generated by `python3 -m tools.argonia_world.creatures journey`: three
# stretches walked at day and night, reading the actors near and what attacked; a still per step;
# then a still per big predator at its den. Reader checklist per still: creatures in view are Black Marsh
# kinds (no Skyrim animal), on ground or in water their kind allows, none inside a settlement; at a den
# the predator stands beside it. The planner runs it in the round's batch; never set what it tests.
id: creature-walk
runner: 1
crash_risk: medium
scene: creature-walk
steps:
- name: marsh-day
  # cell (-24,25) deep-sink-basin: 1 spawn refs planned
  do:
  - console: {line: cow ARG_Province -24 25, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -96256
  - console: player.setpos y 104448
  - wait: 2
  - pad: +LY=1:2900 -:100
  - pad: +LY=1:2900 -:100
  - pad: +LY=1:2900 -:100
  - wait: 4
  expect:
  - {read: [actors, "6000"], path: listed, keep: seen_marsh_day}
