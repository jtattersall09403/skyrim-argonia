# 2.W3 §b (owed L4): each traced road leg is on the road surface end to end. The two exit gates and their push are
# world-sample's stop 9 (s09-gate-push-north, s09-segment-push-west) and the signpost its stop 10, so they are not
# repeated here. The hops are derived data (road_point every 100 m, the 2.W1 probe height, the painted LTEX): they
# belong in tools/world_sample.py's generator, never hand-typed, so the leg steps are owed to it.
id: w3-road-hops
runner: 1
scene: world-sample-01-claywater
steps:
  - name: arrive
    do: [{wait: 3}]
    expect: [{read: [player], path: worldspace.editor_id, eq: ARG_Province, within: 20}]
  - name: leg-hops
    owed: road-leg hops generated by tools/world_sample.py from road_point (23 legs, every 100 m, z within 0.5 m, the land texture under the player through a bridge LTEX read, which does not exist)
  - name: tear-road-stage
    owed: the hop at Tear Road Stage (3.4 km off the traced road's border meet), from the same generator
