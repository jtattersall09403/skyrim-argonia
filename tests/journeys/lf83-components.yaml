# LF83's building blocks, headless (owner ruling 2026-10-30, bb7395f): no playthrough; each stage advances from facts
# set through their real paths, read back by state and events. Talks are the real path (E at the speaker opens our
# window through the intercept perk); a topic is the view's own intent (`core ViewIntent`), as a click sends it.
# Fact -> path map: docs/research/2026-10-30/lane-game-10.md §2. The crocodile's death is staged with `kill` (the
# fight itself is game-10's crocodile check, not this one's). Endings 41/90/92/93: lf83-endings.yaml.
# The "journal updated" notice (fixes-2: the engine's HUD message, and the SKSE mod event ArgoniaJournalNotice) is
# asserted at each stage and clue, beside the journal family (`core JournalEntries`, one line per entry). The thing
# hooks (activate or read sets a fact) are read after stage 20.
id: lf83-components
runner: 1
crash_risk: medium
scene: first-place
steps:
  - name: arrived
    expect:
      - {console: "GetStage ARG_Q_LF83", contains: ">> 0"}
      - {read: [core, KnowsTopic, topic.claywater-two-charges], path: value, eq: false}
      - {read: [core, JournalEntries], path: value, not_contains: "quest.local.lf83"}
  # --- stage 10: the hook topic heard of a named speaker (dry season) -------------------------------------------
  - name: talk-takes
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationTakes 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationTakes.moveto player 0 110 0"}
      - {console: "player.setangle x 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.n1-3}
      - {read: [core, KnowsTopic, topic.claywater-two-charges], path: value, eq: true}   # her greeting links it
      # Linking the topic sets stage 10 inside this step, so its notice is seen here (diag-quest-crime.md)
      - {console: "GetStage ARG_Q_LF83", contains: ">> 10", within: 8}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 10 0 ", within: 5}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
  - name: stage-10
    do: [{call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}]
    expect:
      - {console: "GetStage ARG_Q_LF83", contains: ">> 10"}
  - name: hear-station-open     # objective 10: two-charges heard of Livia
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationLivia.moveto player 0 110 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.well-keeper}]
  - name: hear-station
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-two-charges"}}']}
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
    expect:
      - {console: "GetObjectiveCompleted ARG_Q_LF83 10", contains: ">> 1", within: 8}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
      - {console: "GetStage ARG_Q_LF83", contains: ">> 10"}
  # --- stage 20: the landing's side and the clay bend, heard of Signs ------------------------------------------
  - name: hear-landing-open
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationSigns 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationSigns.moveto player 0 110 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.landing-s-poler}]
  - name: hear-landing
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-two-charges"}}']}
    expect:   # two-charges.tell links the clay bend: offered in Signs' list
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: "topic.lf83-clay-bend"}
  - name: stage-20
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.lf83-clay-bend"}}']}
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
    expect:
      - {console: "GetStage ARG_Q_LF83", contains: ">> 20", within: 8}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 20 0 ", within: 5}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
      - {read: [core, KnowsTopic, topic.claywater-landing-terms], path: value, eq: true}   # granted by stage 20
      - {read: [core, KnowsTopic, topic.lf83-cracked-well], path: value, eq: true}
  # --- why-failing: the well water tasted (Takes), then the old mending heard ----------------------------------
  - name: draw-water
    do: [{console: "ARG_Ref_ClaywaterStationWellWater.activate player"}, {wait: 2}]
    expect: [{console: "player.GetItemCount ARG_Misc_Lf83WellWater", not_contains: ">> 0"}]
  - name: cracked-well-offered
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationTakes 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationTakes.moveto player 0 110 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: "topic.lf83-cracked-well"}
  - name: ford-tasted      # cracked-well.tasted takes the water and sets the flag -> objective 20
    do: [{call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.lf83-cracked-well"}}']}]
    expect:
      - {read: [core, GetFlag, flag.lf83.ford-tasted], path: value, eq: true}
      - {console: "GetObjectiveCompleted ARG_Q_LF83 20", contains: ">> 1", within: 8}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
  - name: mending-heard    # asked again after the taste: cracked-well.mending
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.lf83-cracked-well"}}']}
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
    expect: [{read: [core, GetFlag, flag.lf83.mending-heard], path: value, eq: true}]
  # --- the thing hooks (system-wide, fixes-2): activating a thing or reading a document sets its fact ----------
  - name: thing-hooks-perk  # the hidden perk that routes an Examine on a hooked thing to ArgoniaCore
    expect: [{console: "player.HasPerk ARG_Perk_ThingHooks", contains: ">> 1"}]
  - name: well-head        # E on the well head (the perk's Activate entry): flag crack-seen
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationWell 0 -100 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 30"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
      - {console: "player.setangle x 0"}
    expect: [{read: [core, GetFlag, flag.lf83.crack-seen], path: value, eq: true, within: 5}]
  - name: mortar-tub       # E on the mortar tub: flag tub-seen
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationMortarTub 0 -100 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 30"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
      - {console: "player.setangle x 0"}
    expect: [{read: [core, GetFlag, flag.lf83.tub-seen], path: value, eq: true, within: 5}]
  - name: ledger-read      # the ledger read (its Book Menu opening, read by ArgoniaCore's menu sink): flag ledger-read
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLedger 0 -80 0"}
      - {wait: 4}
      - {console: "ARG_Ref_ClaywaterStationLedger.activate player"}
      - {wait: 2}
    expect:
      - {read: [core, GetFlag, flag.lf83.ledger-read], path: value, eq: true, within: 5}
  # --- stage 30: the bend cleared (staged death), the clay got ---------------------------------------------------
  - name: clear-bend
    do: [{console: "ARG_Ref_ClaywaterStationCrocodile.kill"}, {wait: 2}]
    expect:
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDead", contains: ">> 1"}
      - {console: "GetObjectiveCompleted ARG_Q_LF83 21", contains: ">> 1", within: 8}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
  - name: get-clay
    do: [{console: "ARG_Ref_ClaywaterStationClayBasket.activate player"}, {wait: 2}]
    expect:
      - {console: "player.GetItemCount ARG_Misc_Lf83ClayBasket", contains: ">> 1"}
      - {console: "GetStage ARG_Q_LF83", contains: ">> 30", within: 8}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 30 0 ", within: 5}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
      - {read: [core, KnowsTopic, topic.lf83-one-charge], path: value, eq: true}   # granted by stage 30
  # --- stage 40: both keepers agree to one charge (Signs first, then Livia) --------------------------------------
  - name: signs-agrees-open
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationSigns 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationSigns.moveto player 0 110 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.landing-s-poler}]
  - name: signs-agrees
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-landing-terms"}}']}   # Livia agrees only once the landing's terms are heard of Signs
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.lf83-one-charge"}}']}
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
    expect:
      - {read: [core, GetFlag, flag.lf83.one-charge-landing], path: value, eq: true}
      - {console: "GetObjectiveCompleted ARG_Q_LF83 31", contains: ">> 1"}   # old-mending: the mending heard at 20 counts at 30
      - {console: "player.GetItemCount ARG_Misc_Lf83ClayBasket", contains: ">> 0"}
      - {console: "GetStage ARG_Q_LF83", contains: ">> 30"}
  - name: livia-agrees-open
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationLivia.moveto player 0 110 0"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.well-keeper}]
  - name: livia-agrees
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.lf83-one-charge"}}']}
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
    expect:
      - {read: [core, GetFlag, flag.lf83.one-charge-station], path: value, eq: true}
      - {console: "GetStage ARG_Q_LF83", contains: ">> 40", within: 8}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 40 1 ", within: 5}
      - {event: {kind: mod, match: ArgoniaJournalNotice}, within: 5}   # the "journal updated" notice (system-wide)
      - {read: [core, GetFlag, flag.lf83.terms-settled], path: value, eq: true}
      - {console: "GetQuestCompleted ARG_Q_LF83", contains: ">> 1"}
