# The combat trial, group A (the 0.0 stack), as a check of OUR wiring only (owner, 2026-10-30: test our integration,
# not other modders' work; simple checks in real places, no arena). Install: python3 infra/gpu-box/stack.py combat A.
# On the Blackwood Road beyond Claywater's ford (claywater-ambush): the set's plugins are loaded, ArgoniaCore read
# TK Dodge's perk lock and holds it, the sheet is up and feeding the carriers, the roll's anim event fires (our
# Pandora output), TDM's lock-on answers. How far a roll goes, poise, parries and the Papyrus queue under a brawl
# are the mods' own behaviour and are not checked here.
id: combat-trial-a
runner: 1
crash_risk: low
scene: claywater-ambush
steps:
  - name: plugins-loaded
    expect:
      - {read: [actors, "4000"], path: listed.0.ref, keep: opp}
      - {read: [plugin, "Precision.esp"], path: file, eq: "Precision.esp"}
      - {read: [plugin, "TKDodgeAddon.esp"], path: file, eq: "TKDodgeAddon.esp"}
      - {read: [logfile, ArgoniaCore, "combat: TK Dodge perk lock on"], path: found, eq: true}
  - name: sheet-and-perk-lock   # unburdened: our burden tier leaves TK Dodge's perk on the player; the sheet is up
    do: [{console: "player.unequipall"}, {console: "player.additem ARG_Weap_SteelSword 1"}, {console: "player.equipitem ARG_Weap_SteelSword"}, {wait: 2}]
    expect:
      - {console: "player.hasperk TKDodgeAddon.esp|0x809", contains: ">> 1"}
      - {read: [core, GetAttribute, strength], path: value, ge: 1}
      - {read: [logfile, ArgoniaCore, "combat: carriers"], path: found, eq: true}
  - name: roll-event            # the pad's roll reaches the graph: our behaviour build carries TK Dodge's event
    do: [{console: "tgm"}, {pad: "+LX=0,LY=1:300 B:100 wait:900 -:600"}, {console: "tgm"}]
    expect: [{event: {kind: anim, match: TKDR_DodgeStart}}]
  - name: lock-on               # R3 six metres from the deserter: TDM's API reports a lock on it
    do:
      - {console: "player.moveto {opp} 0 -600 0"}
      - {console: "player.setangle z 0"}
      - {wait: 1}
      - {pad: "RS:120 wait:800"}
    expect:
      - {read: [tdm-target], path: locked, eq: true}
      - {read: [tdm-target], path: dist, lt: 2000}
