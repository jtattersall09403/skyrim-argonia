# 1.12 owner look 1, one batch per round for all five lanes (docs/loops.md rule 10): the planner deploys main once
# (make pool-deploy) and runs this; each lane reads its own items' stills and clips. Lanes add their journeys here
# and push; they never run their own. Save-changing and crash-prone items last.
#   tooling/job_guard.sh run --gpu=pick look1 -- python3 tools/run_batch.py tests/journeys/batches/look-1.yaml
id: look-1
relaunch_mb: 6000
relaunch_every: 0
items:
  # the lanes' own checks
  - hud-look
  - hud-minimap-edge
  - chart-look
  - chart-minimap
  - menus-look
  # (1.12-items: items-look; 1.12-loading: loading-look; added by those lanes)
  # what the five lanes' changes can break among 1.12's proven rows
  - magic-pane
  - pad-panes
  - ui-handoffs
  - journal-dialogue
  - ui-sweep
  - system-perks
  - menus-quit
