# 1.12 r4 menus (owed L4; owner play test 3, findings 6-8, 11, and the owner's card comparison of 22:06): each menu
# opens once by pad and keeps a still, on both UI cards. The planner runs it twice in the batch, once after
# `stack.ps1 play-modded -Ui windui` and once after `-Ui custom` (the "Argonia" and "Argonia custom UI" cards); each
# still goes to a reader with its step's list. The last step loads the save from System for a loading-screen still at
# the unfolded phone viewport (2352x2172 stream; the planner sets the stream there for the run).
id: menu-sweep
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium
batch_last: true         # the load at the end changes the scene: last in a batch
scene: ui-props
steps:
  - name: panes
    do: [{pad: "START:150"}, {wait: 2}]
    reader: [the pause panes open, focus visible on one control, every word in Pelagiad, no Nordic ornament]
  - name: inventory
    do: [{pad: "DPAD_DOWN:120"}, {pad: "DPAD_DOWN:120"}, {pad: "RB:150"}, {wait: 1}]
    reader: [the inventory with a focused item row and its detail, the category moved by RB, on the custom card our paper inventory]
  - name: charsheet
    do: [{pad: "RB:150"}, {wait: 1}, {pad: "DPAD_DOWN:120"}]
    reader: [the character sheet with a focused row, on the custom card our paper sheet]
  - name: magic
    do: [{pad: "RB:150"}, {wait: 1}, {pad: "DPAD_DOWN:120"}, {pad: "DPAD_RIGHT:120"}, {pad: "DPAD_DOWN:120"}]
    reader: [our magic pane with focus on a left-hand L that moved down its own column, not onto a spell name]
  - name: system
    do: [{pad: "RB:150"}, {wait: 1}]
    reader: [our System pane on paper, left-hand headings Game and Leave in red clay like the journal's, ink entries readable, Settings focused]
  - name: closed
    do: [{pad: "B:150"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "closed"}]
  - name: load-screen
    do: [{pad: "START:150"}, {wait: 1.5}, {pad: "RB:150"}, {pad: "DPAD_DOWN:120"}, {pad: "A:150"}, {wait: 1}, {pad: "A:150"}, {wait: 1.5}]
    reader: [a loading screen, its fact text not squashed horizontally (letters as tall as wide as in the 1080p still), name the model shown]
  # custom card only (the planner skips these on -Ui windui): our inventory by I, X drops, our sheet takes a perk
  - name: custom-inventory
    do: [{key: "I 120"}, {wait: 2}, {pad: "DPAD_DOWN:120"}, {pad: "X:150"}, {wait: 1}]
    expect: [{read: [core, Views], path: value, contains: "inventory ready open"}]
    reader: [our paper inventory open (not SkyUI's), a stack focused, a notice or a list one stack shorter after X]
  - name: custom-sheet
    do: [{pad: "B:150"}, {wait: 1}, {key: "TAB 120"}, {wait: 1.5}, {pad: "RB:150"}, {wait: 1}]
    reader: [our paper character sheet (not Wind UI's or the constellation), tabs and a focused row]
