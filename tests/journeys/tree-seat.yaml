# The tree-seat journey (lane 1.15-r4-trees; owner play test 3, findings 4 and 32): six placed trees of different
# forms, the ones their mod sinks deepest first (the erut, palm and jungle trees whose roots hung in the air), a
# first-person still each aimed at the trunk base from 6-10 m with nothing over 1 m within 3 m of the eye line (the stand
# rule, BAND_M); then one still per region class from a clearing's edge in the class's fullest cell (no plant over 1 m
# within 4 m of the eye), level into the most trunks, for the variety between classes. Generated from the placer's shards like the rock booth (booth.py).
# 
#     python3 -m tools.argonia_world.vegetation tree-booth --out <shards>
# 
# Reader checklist per tree still: the trunk base meets the ground (no gap under it, roots into the ground, not
# standing on root tips); natural bark and leaf colour (no neon blue-green, no washed-out pale). Per class still: name
# the trees and plants seen; the six classes' stills should not read as one forest.
# 
id: tree-seat
reach: ["data/dependencies.json", "records: Statics", "records: cell -49,60 r1", "records: cell -42,59 r1", "records: cell -36,-31 r1", "records: cell -32,-2 r1", "records: cell -22,-25 r1", "records: cell -16,58 r1", "records: cell -15,-16 r1", "records: cell -8,43 r1", "records: cell -6,-54 r1", "records: cell 9,-42 r1", "records: cell 14,28 r1", "records: cell 29,13 r1"]   # the pass ledger's inputs (tools/pass_ledger.py)
look: world
runner: 1
independent_steps: true
crash_risk: low
scene: rock-booth
camera: first
steps:
- name: tree-1-argoniatreepalmoke04
  scan: 6
  # 155FF4:King of the Murkmire.esp ref DA321A, seat 968 u x scale 1.19; aim at the trunk base 7 m off its 12.7 m footprint, 0 on the aim line, 0 at the eye
  # subject: -199336 249527 40474
  do:
  - hud: off
  - console:
      line: cow ARG_Province -49 60
      settle: 60
  - wait: 8
  - console:
      line: set gamehour to 12
  - console:
      line: player.setpos x -199336
  - console:
      line: player.setpos y 248149
  - console:
      line: player.setpos z 40514
  - console:
      line: player.setangle z 0
  - console:
      line: player.setangle x 7
  - console:
      line: player.setangle y 0
  - wait: 6
  - console: sw Argonia.esm|0x000E9B
  - console: fw Argonia.esm|0x000E9B
  - settle: {cap: 14, min: 3}
  expect:
  - {read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}
