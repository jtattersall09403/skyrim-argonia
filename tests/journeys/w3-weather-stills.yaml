# 2.W3 §a (owed L4): our 4 Black Marsh weathers and the restyled Tropical Skyrim weathers read as humid green-gold
# marsh light, never Nordic blue-grey. The look is under test, so forcing the weather (`fw`) is the setup of each
# still; the cycling is world-sample's stop 11. The stills go to a reader panel with the Nordic-tells checklist
# (blue-grey fog, snow light, pale sun) and the old weather references. Marsh view: world-sample stop 6.
id: w3-weather-stills
runner: 1
crash_risk: medium
scene: world-sample-06-marsh
steps:
  - name: mist-06
    do: [{console: "set gamehour to ARG_Weather_mist"}, {console: "fw 6"}, {wait: 8}]
    expect: [{read: [weather], path: current, contains: 6, within: 10}]
    reader: [humid green-gold marsh light, no blue-grey fog, no snow light or pale sun, no black or white sky, clouds present]
