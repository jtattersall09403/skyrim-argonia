  - wait: 8
  - console: set gamehour to 1
  - teleport: pos -112048 129408 1032
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [actors, "2801"], path: listed.0.dist, lt: 2801}
  - {read: [actors, "2801"], path: listed, keep: marsh_night}
- name: upland-day
  # cell (-36, 25) western-frontier D2 land: list lvln.western-frontier.D2.land
  do:
  - console: {line: cow ARG_Province -36 25, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - teleport: pos -144048 103680 6488
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [actors, "2801"], path: listed.0.dist, lt: 2801}
  - {read: [actors, "2801"], path: listed, keep: upland_day}
- name: upland-night
  # cell (-36, 37) western-frontier D2 land: list lvln.western-frontier.D2.land
  do:
  - console: {line: cow ARG_Province -36 37, settle: 60}
  - wait: 8
  - console: set gamehour to 1
  - teleport: pos -144816 154496 14052
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [actors, "2801"], path: listed.0.dist, lt: 2801}
  - {read: [actors, "2801"], path: listed, keep: upland_night}
- name: den-kaj-thux
  # creature.kaj-thux den in cell (0, 0), flooded-forest D4
  do:
  - console: {line: cow ARG_Province 0 0, settle: 60}
  - wait: 8
  - console: set gamehour to 12
  - teleport: pos -456 2048 2619
  - console: player.setangle z 90
