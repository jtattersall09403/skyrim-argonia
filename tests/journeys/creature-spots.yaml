# Creature spots (1.15 §g.4; round 6), generated by `python3 -m tools.argonia_world.creatures journey`: six
# spawn points (water, marsh, upland, two each in different cells) and one predator den. A state check, no
# stills (owner 19:05 #41, decision 0036 amended): teleport to dry ground 15-25 m from the point, wait, then
# read by the bridge the spawn's own reference (ArgoniaWorld.esm|0x...: present, enabled, 3D loaded, its
# actor a kind of the spot's list) and every actor within 40 m (at least one, at least one a kind of the
# list of that region class and band, a fixed list, never levelled: 0035). The den reads its predator.
# marsh-a-probe* (lane 1.15-r6-land-spawn-probe): the land spawn that read nothing, probed from the same stand.
# A failure names the read; a failed step alone takes a still. No walking, no fighting (owner, 2026-11-01).
id: creature-spots
reach: ["data/dependencies.json", "records: Npcs", "records: LeveledNpcs", "records: EncounterZones", "records: cell -38,29 r1", "records: cell -38,30 r1", "records: cell -37,25 r1", "records: cell -37,40 r1", "records: cell -36,40 r1", "records: cell -26,30 r1", "records: cell -26,31 r1", "records: cell -26,34 r1", "records: cell -24,25 r1"]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
independent_steps: true
crash_risk: medium
scene: creature-spots
stills: false
steps:
- name: water-a
  # cell (-37, 25) western-frontier D3 water: list lvln.western-frontier.D3.water, spawn ref ArgoniaWorld.esm|0xEABAC0; the stand 19 m from it, the next spawn point 54 m
  # subject: -148992 103424 27793
  do:
  - console: tgm
  - console: {line: cow ARG_Province -37 25, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -150323
  - console: player.setpos y 103424
  - console: player.setpos z 14085
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: water_a_arrive}
  - {read: [actors, "2801", "ArgoniaWorld.esm|0xEABAC0"], path: refs.0, ne: null, keep: water_a_spawn}
  - {read: [actors, "2801", "ArgoniaWorld.esm|0xEABAC0"], path: refs.0.disabled, eq: false}
  - {read: [actors, "2801", "ArgoniaWorld.esm|0xEABAC0"], path: refs.0.loaded_3d, eq: true}
  - {read: [actors, "2801", "ArgoniaWorld.esm|0xEABAC0"], path: refs, kinds: {ge: 1, among: ["Giant Leech", "Leech"]}, keep: water_a_spawn_kind}
  - {read: [actors, "2801"], path: listed.0, ne: null, keep: water_a_first}
  - {read: [actors, "2801"], path: listed, keep: water_a}
  - {read: [actors, "2801"], path: listed, kinds: {ge: 1, among: ["Giant Leech", "Leech"]}, keep: water_a_kinds}
