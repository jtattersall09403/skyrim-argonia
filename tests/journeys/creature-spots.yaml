# Creature spots (1.15 §g.4), generated by `python3 -m tools.argonia_world.creatures journey`: six
# spawn points (water, marsh, upland; three by day, three by night) and one predator den, each reached
# by teleport, then a wait, a read of the actors within 40 m and one still. No walking, no fighting
# (owner, 2026-11-01). Fails when no actor stands within 40 m of a point (a list with chance none 0
# and every entry at level 1 always yields one). Reader checklist per still: the creature is a Black
# Marsh kind (no Skyrim animal), on ground or in water its kind allows; at the den the predator beside
# it. The kind of each base read is its creature_form row. The planner runs it in the round's batch.
id: creature-spots
reach: [esm, "tools/argonia_world/creatures/**", data/creature-kind-bars.json, data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium
scene: creature-spots
camera: first
steps:
- name: water-day
  # cell (-37, 25) western-frontier D3 water: list lvln.western-frontier.D3.water
  # subject: -150144 103424 27853
  do:
  - hud: off
  - console: tgm
  - console: {line: cow ARG_Province -37 25, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -150704
  - console: player.setpos y 103424
  - console: player.setpos z 14193
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [actors, "2801"], path: listed, keep: water_day}
- name: water-night
  # cell (-36, 37) western-frontier D2 shore: list lvln.western-frontier.D2.shore
  # subject: -143488 153984 14432
  do:
  - console: {line: cow ARG_Province -36 37, settle: 60}
  - wait: 8
  - console: set gamehour to 1
  - console: player.setpos x -144048
  - console: player.setpos y 153984
  - console: player.setpos z 14486
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [actors, "2801"], path: listed, keep: water_night}
- name: marsh-day
  # cell (-29, 33) flooded-forest D3 land: list lvln.flooded-forest.D3.land
  # subject: -117632 135680 2549
  do:
  - console: {line: cow ARG_Province -29 33, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -117772
  - console: player.setpos y 135680
  - console: player.setpos z 2513
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [actors, "2801"], path: listed, keep: marsh_day}
- name: marsh-night
  # cell (-26, 31) flooded-forest D3 land: list lvln.flooded-forest.D3.land
  # subject: -103296 127488 695
  do:
  - console: {line: cow ARG_Province -26 31, settle: 60}
  - wait: 8
  - console: set gamehour to 1
  - console: player.setpos x -103576
  - console: player.setpos y 127488
  - console: player.setpos z 656
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [actors, "2801"], path: listed, keep: marsh_night}
- name: upland-day
  # cell (-38, 29) western-frontier D3 land: list lvln.western-frontier.D3.land
  # subject: -153088 120960 17408
  do:
  - console: {line: cow ARG_Province -38 29, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -153648
  - console: player.setpos y 120960
  - console: player.setpos z 17739
  - console: player.setangle z 90
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [actors, "2801"], path: listed, keep: upland_day}
- name: upland-night
  # cell (-38, 30) western-frontier D3 land: list lvln.western-frontier.D3.land
