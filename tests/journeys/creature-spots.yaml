# Creature spots (1.15 §g.4; round 6), generated by `python3 -m tools.argonia_world.creatures journey`: six
# spawn points (water, marsh, upland, two each in different cells) and one predator den, all by day in
# ARG_Weather_clear_dry (forced by form id). Each stand is dry, 15-25 m from its point with a clear eye line,
# the point the nearest spawn to it, facing it. Teleport, wait, read the actors within 40 m (the evidence:
# fails when none) and one still. No walking, no fighting (owner, 2026-11-01). Reader checklist per still:
# daylight, no fog wall; a creature in frame, a Black Marsh kind (no Skyrim animal), on ground or in water
# its kind allows; at the den the predator beside it.
id: creature-spots
runner: 1
crash_risk: medium
scene: creature-spots
camera: first
steps:
- name: water-a
  # cell (-37, 25) western-frontier D3 water: list lvln.western-frontier.D3.water; the stand 23 m from it, the next spawn point 77 m
  # subject: -148864 103552 27793
  do:
  - hud: off
  - console: tgm
  - console: {line: cow ARG_Province -37 25, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: sw Argonia.esm|0x000E9B
  - console: fw Argonia.esm|0x000E9B
  - console: player.setpos x -150475
  - console: player.setpos y 103552
  - console: player.setpos z 14105
  - console: player.setangle z 90
  - console: player.setangle x -60
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: arrive}
  - {read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}
  - {read: [actors, "2801"], path: listed.0, ne: null, keep: water_a_first}
  - {read: [actors, "2801"], path: listed, keep: water_a}
