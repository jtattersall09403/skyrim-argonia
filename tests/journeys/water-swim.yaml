# 2.W2 §a (owed L4): a swim down a sample river without falling out of the water. The stepped reach is world-sample's
# stop 4 (reach.949-1591; its two ends' teleports and z bounds are copied from world-sample.yaml, the generator's
# output); this journey swims between them on the pad. Rapids and falls reaches are owed to the generator.
id: water-swim
runner: 1
crash_risk: medium
scene: world-sample-04-rapids
steps:
  - name: top
    do: [{teleport: "pos -131328.0 58240.0 1343.52"}, {wait: 4}, {console: "player.setangle z 105"}]
    expect: [{read: [player], path: in_air, eq: false, within: 3}]
  - name: swim-1              # downstream (east-north-east), the stick held
    do: [{pad: "+LY=1:2900 -:100"}]
    expect:
      - {moved: {gt: 200}}
      - {read: [player], path: in_air, eq: false}
      - {read: [player], path: pos.z, ge: 780.99}
  - name: swim-2
    do: [{pad: "+LY=1:2900 -:100"}]
    expect:
      - {moved: {gt: 200}}
      - {read: [player], path: in_air, eq: false}
      - {read: [player], path: pos.z, ge: 780.99}
  - name: swim-3
    do: [{pad: "+LY=1:2900 -:100"}]
    expect:
      - {moved: {gt: 200}}
      - {read: [player], path: in_air, eq: false}
      - {read: [player], path: pos.z, le: 1278.54}
  - name: rapids-and-falls
    owed: rapids and falls reaches' ends from tools/world_sample.py (stop 5 has the falls' foot only)
