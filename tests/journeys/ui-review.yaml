# Lane ui-review (2026-10-30, owner: "have our new ui screens been seen and reviewed?"): every screen of ours seen in
# the running game at desktop size, one still each for a `reader` against ui/DESIGN.md and the owner's UI goals.
# Our screens: dialogue (topics, a long answer), the HUD (bars, the journal notice), the journal (a quest entry),
# the chart, the sitting; then the paper-themed vanilla menus that remain (Tween, inventory, container, book) and the
# loading menu. Barter: Livia's service topic opens the engine's BarterMenu (lane trader). The title screen is the last step.
# Staged by the scene (ui-props): the place, a camp spot, a crate and the station ledger. The pending level for the
# sitting comes from dev-grow (the fixture, as grow-at-rest); the sitting's look is what is judged.
id: ui-review
runner: 1
crash_risk: medium
batch_last: true         # ends at the main menu
scene: ui-props
steps:
  - name: hud-play
    do: [{wait: 2}]
    expect: [{read: [core, ViewState, hud], path: value.body.bars, contains: "health"}]
    reader: [our bars minimal and in our palette, no compass or marker, Pelagiad]
  - name: dialogue-topics     # Takes: her greeting with linked keywords, the topic list
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationTakes 0 -120 0"}
      - {wait: 6}           # a far moveto loads cells; the next console call waits it out (cold clone disk)
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 0"}
      - {talk: ARG_Ref_ClaywaterStationTakes}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.n1-3}]
    reader: [Morrowind-style window, topics list, hyperlinked keywords in teal, paper theme, Pelagiad legible, no clipping]
  - name: dialogue-answer     # a long answer
    do: [{call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-two-charges"}}']}, {wait: 1}]
    expect: [{read: [core, KnowsTopic, topic.claywater-two-charges], path: value, eq: true}]
    reader: [the long answer readable and not clipped, scroll if needed, keywords linked]
  - name: dialogue-livia      # Livia's side: LF83 starts, its journal entry written
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {wait: 6}           # a far moveto loads cells; the next console call waits it out (cold clone disk)
      - {console: "player.setangle z 0"}
      - {talk: ARG_Ref_ClaywaterStationLivia}
      - {wait: 2}
      - {call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-two-charges"}}']}
      - {wait: 1}
    expect: [{read: [core, JournalEntries], path: value, contains: "quest.local.lf83 10 ", within: 8}]
    reader: [disposition shown, persuasion and Goodbye buttons, layout]
  - name: hud-notice          # back in play: the journal notice on our HUD
    do: [{call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}, {wait: 1}]
    expect: [{read: [core, ViewState, dialogue], path: value, eq: null}]
    reader: [the notice legible on its plate, the HUD minimal]
  - name: barter-talk         # lane trader: Livia, the station's general trader, in her hours (08:00-20:00)
    do:
      - {console: "set gamehour to 12"}
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {wait: 6}           # a far moveto loads cells; the next console call waits it out (cold clone disk)
      - {console: "player.setangle z 0"}
      - {talk: ARG_Ref_ClaywaterStationLivia}
      - {wait: 2}
    expect: [{read: [core, ViewState, dialogue], path: value.body.topics, contains: "topic.service-barter"}]
  - name: barter              # her service topic: her answer, then the engine's BarterMenu with her stock
    do: [{call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.service-barter"}}']}, {wait: 2}]
    expect:
      - {event: {kind: menu, match: BarterMenu}, within: 8}
      - {read: [core, ViewState, dialogue], path: value, eq: null}
    reader: [her stock listed (saltrice flatbread, jeel-sa, frog legs, bread, leeks, potatoes, Alto wine, healing draught, cups, bowls, a pot, torches, paper, leather, lockpicks), her 300 gold shown, the sheet in our palette, every word in Pelagiad, no Nordic ornament]
  - name: barter-closed
    do: [{close_menu: BarterMenu}]
    expect: [{event: {kind: menu, match: '"menu": "BarterMenu", "opening": false'}}]
  - name: journal             # J: the quest entry (after BarterMenu closes the game needs a beat before the key)
    do: [{wait: 2}, {key: "J 120"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "journal ready open"}]
    reader: [reads as a diary, dated entries, the quest entry, Pelagiad, binding and paper]
  - name: journal-closed      # the menu-context keys on the os route are lost (diag3-g15): close_menu, as ui-sweep
    do: [{close_menu: journal}]
    expect: [{read: [core, ViewState, journal], path: value, eq: null}]
  - name: chart
    do: [{key: "M 120"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "chart ready open"}]
    reader: [parchment chart, no Skyrim map, legible labels, Black Marsh feel]
  - name: chart-closed
    do: [{close_menu: MapMenu}]
    expect: [{read: [core, Views], path: value, contains: "chart ready closed"}]
  - name: tween
    do: [{key: "TAB 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: TweenMenu}}]
    reader: [paper theme, Pelagiad, no Nordic ornament]
  - name: tween-closed
    do: [{close_menu: TweenMenu}]
  - name: inventory
    do: [{key: "I 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: InventoryMenu}}]
    reader: [paper theme, Pelagiad, no Nordic ornament]
  - name: inventory-closed
    do: [{close_menu: InventoryMenu}]
  - name: props-found         # back at the road, where the scene placed the props
    do: [{console: "player.moveto ARG_Ref_ClaywaterStationRoadIn"}, {wait: 3}]
    expect:
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: refs.0.ref, keep: chest}
      - {read: [refs, ARG_Book_StationWaterLedger, "1500"], path: refs.0.ref, keep: book}
  - name: container
    do: [{console: '"{chest}".activate player'}, {wait: 2}]
    expect: [{event: {kind: menu, match: ContainerMenu}}]
    reader: [paper theme, Pelagiad, no Nordic ornament]
  - name: container-closed
    do: [{close_menu: ContainerMenu}]
  - name: book
    do: [{console: '"{book}".activate player'}, {wait: 5}]   # the page draws after the menu event (ui-review2 caught only the strip)
    expect: [{event: {kind: menu, match: Book Menu}}]
    reader: [the page in our palette, Pelagiad, no Nordic ornament]
  - name: book-closed         # the player's own close, as ui-sweep: close_menu on the 3D book crashed in BookMenu (ui-review2, twice)
    do: [{key: "TAB 80"}, {wait: 1.5}, {pad: "B:120"}, {wait: 1.5}]   # TAB alone left the book open (ui-review4)
    expect: [{event: {kind: menu, match: '"menu": "Book Menu", "opening": false'}}]
  - name: pending-level       # the fixture: a level pending
    do: [{call: [dev-grow, ARG_Ref_ClaywaterStationCrocodile, "1", "2000"]}]
    expect: [{read: [core, GetPendingLevels], path: value, ge: 1}]
  - name: sitting             # rest at the scene's camp spot: our sitting view
    do: [{rest: ARG_Ref_ClaywaterStationRoadIn}]
    expect: [{read: [core, SittingOpen], path: value, eq: true, within: 10}]
    reader: [the sitting view on paper, attributes legible, Pelagiad, no perk constellation]
  - name: sitting-done
    do: [{call: [core, ViewIntent, '{"type":"sitting.done","v":1,"body":{}}']}, {wait: 4}]
    expect: [{read: [core, SittingOpen], path: value, eq: false}]
  - name: loading-indoors      # an interior first, so the next load is a long one (an interior coc ends before the still)
    do: [{console: "coc LilmothApothecaryHouse"}, {wait: 8}]
  - name: loading-screen       # a far exterior from indoors; the Loading Menu outlives no step's still, so a still loop
    do: [{burst: {frames: 24, fps: 2}}, {wait: 2}, {console: "player.moveto ARG_Ref_ProbeS13Arrive"}]   # runs across it (ui-review4)
    expect: [{event: {kind: menu, match: Loading Menu}, within: 10}]
  - name: loading-frames      # the loop's frames: loading-frames-NN.png
    do: [{burst_fetch: loading-frames}]
    reader: [loading screen in our palette, Pelagiad, no Skyrim art]
  - name: pause               # the player's own pause (ESC): the still names the list the quit walks
    do: [{wait: 4}, {key: "ESC 80"}, {wait: 2}]
  - name: main-menu           # the title screen: the player's own Quit (the pad, as ui-sweep), last
    do:
      - {pad: "DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120"}
      - {pad: "A:120 wait:1500 A:120"}
      - {wait: 8}
    expect: [{event: {kind: menu, match: MainMenu}, within: 30}]
    reader: [the Argonia title on our dark paper, no Skyrim map or wordmark, menu words in Pelagiad]
