# The crocodile placed by us (the shallows den in LF83's pool, cf11cb0), checked as OUR record and wiring (owner,
# 2026-10-30): present, alive, enabled, in the water at its den (IsSwimming; its position kept for the report
# beside the den's water height, which the world-fixes lane owns), and its no-respawn flag (ours) holds: killed by the console, the player leaves, eleven days pass
# (past the engine's 10-day cell reset) and on return it is still dead. How it attacks and how it dies to blows are
# KotM's water ambusher as its author built it, not checked here.
id: croc-den
runner: 1
crash_risk: high   # cell travel and a long wait away
scene: first-place
steps:
  - name: present
    expect:
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDead", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDisabled", contains: ">> 0"}
  - name: in-its-pool      # the player wades in 6 m north of it, so its cell is loaded and its AI runs
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationCrocodile 0 400 0"}
      - {wait: 4}
    expect:
      - {console: "ARG_Ref_ClaywaterStationCrocodile.IsSwimming", contains: ">> 1"}
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDistance player", keep: croc_dist}
      - {read: [actors, "1500", ARG_Ref_ClaywaterStationCrocodile], path: refs.0.dead, eq: false}
      - {read: [actors, "1500", ARG_Ref_ClaywaterStationCrocodile], path: refs.0.dist, lt: 700}
      - {read: [actors, "1500", ARG_Ref_ClaywaterStationCrocodile], path: refs.0.pos, keep: croc_pos}
  - name: killed-away-eleven-days
    do: [{console: "ARG_Ref_ClaywaterStationCrocodile.kill"}, {wait: 2}, {console: "coc ARG_HoldingCell"}, {wait: 6}, {game_hours: 264}]
  - name: return-still-dead
    do: [{teleport: "ref ARG_Ref_ClaywaterStationRoadIn"}, {wait: 6}]
    expect:
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDead", contains: ">> 1"}
