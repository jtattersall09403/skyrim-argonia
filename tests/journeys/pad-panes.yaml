# 1.12 §8 (ledger row "Every pane, the journal and the map open, cycle and close by pad, keyboard and touch, one run
# each"): Wind UI's menu mode opened by the pad's Start, the cursor moved by the left stick, A and X clicking, the
# triggers and right stick as the wheel, the bumpers cycling Wind UI's windows to our journal and map and System last,
# B closing, Select waiting; then the same panes by keyboard (Tab, J, M, Esc). Touch is the stream client's (owed).
# Judged by ArgoniaCore's pad log lines and menu events; a still at each step is the evidence.
id: pad-panes
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
scene: first-place
steps:
  - name: start-opens-windows
    do: [{pad: "START:150"}, {wait: 2}]
    expect:
      - {log: {name: ArgoniaCore, contains: "pad: windows open"}, within: 8}
  - name: left-stick-moves-cursor
    do: [{call: [input, cursor]}, {pad: "LX=1:600"}, {wait: 1}]
    expect: [{read: [input, cursor], path: x, gt: 1000}]
  - name: a-clicks
    do: [{pad: "A:150"}, {wait: 1}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: left down"}}, {log: {name: ArgoniaCore, contains: "pad: left up"}}]
  - name: x-right-clicks
    do: [{pad: "X:150"}, {wait: 1}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: right down"}}, {log: {name: ArgoniaCore, contains: "pad: right up"}}]
  - name: bumper-cycles-windows
    do: [{pad: "RB:150"}, {wait: 1}, {pad: "RB:150"}, {wait: 1}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: pane inventory (next)"}}]
  - name: triggers-and-right-stick-scroll
    do: [{pad: "RT:200"}, {pad: "LT:200"}, {pad: "RY=-1:600"}, {wait: 1}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: wheel down (trigger)"}}, {log: {name: ArgoniaCore, contains: "pad: wheel up (trigger)"}}, {log: {name: ArgoniaCore, contains: "by the right stick"}}]
  - name: bumper-to-magic        # third pane: our magic pane where Wind UI's magic window was (lane-1.12-magicpane)
    do: [{pad: "RB:150"}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: pane magic"}}, {read: [core, Views], path: value, contains: "magic ready open", within: 5}]
    reader: [our magic pane alone, the six school headings, no Wind UI window over or around it]
  - name: magic-closed-by-b      # B leaves it; the windows come back under the pad
    do: [{pad: "B:150"}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: back to Wind UI's windows"}, within: 8}]
  - name: bumper-to-journal
    do: [{pad: "RB:150"}, {wait: 2}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: pane journal"}}]
  - name: journal-closed-by-b    # nav.ts's B leaves our journal; the windows under it take the pad again
    do: [{pad: "B:150"}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: back to Wind UI's windows"}, within: 8}]
  - name: bumper-to-map          # the cycle goes on from the journal to our map
    do: [{pad: "RB:150"}, {wait: 2}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: pane map"}}]
  - name: map-closed
    do: [{close_menu: MapMenu}, {wait: 3}]      # the windows come back once the map closes
    expect: [{log: {name: ArgoniaCore, contains: "pad: back to Wind UI's windows"}, within: 8}]
  - name: bumper-to-system       # System last: the windows close and Skyrim's System page opens
    do: [{pad: "RB:150"}, {wait: 5}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: pane system"}}, {event: {kind: menu, match: Journal Menu}, within: 8}, {log: {name: ArgoniaCore, contains: "System page (switched;"}, within: 8}, {log: {name: ArgoniaCore, contains: "page's own button hints started"}, within: 8}]
  - name: system-closed
    do: [{close_menu: Journal Menu}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: back to Wind UI's windows"}, within: 8}]
  - name: b-closes
    do: [{pad: "B:150"}, {wait: 2}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: windows closed"}, within: 8}]
  - name: select-waits
    do: [{pad: "BACK:150"}, {wait: 2}]
    expect: [{event: {kind: menu, match: Sleep/Wait Menu}}]
  - name: wait-closed
    do: [{close_menu: Sleep/Wait Menu}]
  - name: keyboard-tab-opens
    do: [{key: "TAB 120"}, {wait: 2}, {mouse: "960 540"}, {click: left}, {wheel: "down 2"}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: windows open"}, within: 8}]
  - name: keyboard-tab-closes
    do: [{key: "TAB 120"}, {wait: 2}]
    expect: [{log: {name: ArgoniaCore, contains: "pad: Tab in the windows: closed to play"}, within: 5}]
  - name: keyboard-journal
    do: [{key: "J 120"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "journal ready open"}]
  - name: keyboard-journal-closed
    do: [{close_menu: journal}]
  - name: keyboard-system
    do: [{key: "ESC 80"}, {wait: 5}]
    expect: [{event: {kind: menu, match: Journal Menu}}, {log: {name: ArgoniaCore, contains: "System page (switched;"}, within: 8}, {log: {name: ArgoniaCore, contains: "page's own button hints started"}, within: 8}]
  - name: keyboard-system-closed
    do: [{close_menu: Journal Menu}]
  - name: touch
    owed: "the stream client's touch run (infra/stream-client/e2e/drive.mjs, v5-folded and v5-unfolded)"
