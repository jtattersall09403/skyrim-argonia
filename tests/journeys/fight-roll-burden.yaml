# 1.6-wiring (owed L4): rolls at the burden tiers; wiring rows w.roll.tier, w.roll.distance, w.iframes.*,
# w.stamina.roll. The load is the steel set and ingots added as setup (r = kg / (30 + 3 x Str)); the roll is the
# pad's (sprint tap, stick held). Per-frame i-frame tracing (PresentMon) is owed to a frame-trace read.
id: fight-roll-burden
runner: 1
scene: duel-ring
steps:
  - name: fast
    do: [{console: "player.unequipall"}, {console: "player.moveto ARG_PG_DuelPlayerMarker"}, {wait: 2}]
    expect:
      - {read: [av, Stamina, player], path: current, keep: st}
      - {console: "player.hasperk TKDodgeAddon.esp|0x809", not_contains: ">> 0"}
  - name: roll-fast
    do: [{pad: "+LX=0,LY=1:500 B:100 wait:600 -:1200"}]
    expect:
      - {event: {kind: anim, match: TKDR_DodgeStart}}
      - {moved: {gt: 300}}
      - {read: [av, Stamina, player], path: current, le: {kept: st, plus: -14}}
  - name: load-fat            # steel set and ingots (setup): the fat tier
    do:
      - {console: "player.additem ARG_Armo_Steel_Cuirass 1"}
      - {console: "player.additem ARG_Armo_Steel_Greaves 1"}
      - {console: "player.additem 0005ACE4 20"}
      - {wait: 3}
    expect: [{read: [av, InventoryWeight, player], path: current, keep: carried}]
  - name: roll-fat
    do: [{pad: "+LX=0,LY=1:500 B:100 wait:600 -:1200"}]
    expect: [{event: {kind: anim, match: TKDR_DodgeStart}}]
  - name: overloaded          # far over capacity: TK Dodge's perk taken, no roll
    do: [{console: "player.additem 0005ACE4 300"}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "combat: roll locked (burden overloaded)"}, within: 10}
  - name: no-roll
    do: [{pad: "+LX=0,LY=1:500 B:100 wait:600 -:1200"}]
    expect: [{event: {kind: anim, match: TKDR_DodgeStart, absent: true}}]
  - name: unlocked            # the ingots dropped: the perk given back
    do: [{console: "player.removeitem 0005ACE4 320"}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "roll unlocked"}, within: 10}]
  - name: iframes-per-frame
    owed: a frame-trace read (position, ghost state and health per frame through a swing) for the i-frame window per tier
