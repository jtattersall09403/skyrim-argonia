# Draft (1.6-wiring): owed L4. 1.6 deliverable "rolls at the three burden tiers" and 1.7's duel at light, medium and
# heavy load. Wiring rows: w.roll.tier, w.roll.distance, w.iframes.*, w.stamina.roll, w.stamina.regen*.
id: fight-roll-burden
status: draft, owed L4
scene: duel-ring
loads: [fast (r 0.10), mid (r 0.25), fat (r 0.60), overloaded (r 1.10)]   # r = carried kg / (30 + 3 x Str)
setup_step_0:
  - Strength 50 (capacity 180 kg) set through ArgoniaCore; carried weight set by adding the steel set and ingots
  - the archetype's swing is replaced by a scripted dummy swing at a fixed interval (the scene sets it, never the test)
steps:
  - read ArgoniaCore's burden tier for the load (bridge) and the TK Dodge graph variable TKDR_IframeDuration
  - roll forward through the dummy's swing with SkyLink (sprint tap, stick held); log position, IsGhost/i-frame graph
    state and health every frame (60 fps, PresentMon timestamps), and a still at the roll's mid-point
  - read stamina before and after the roll; then wait and read stamina each 0.1 s until it regenerates
pass:
  - fast, mid, fat: a roll plays; the swing does no damage inside the i-frame window; i-frame window = fIFrameDuration
    (0.3 s) x the tier's iframe_scale once w.iframes.tier is built (until then: equal across tiers, the recorded loss)
  - overloaded: no roll (w.roll.tier, once ArgoniaCore toggles TK Dodge's required perk)
  - roll stamina cost = fDodgeCost (15); regen starts fDamagedStaminaRegenDelay (1.05 s) after the roll
fails_if: a roll at overloaded, damage taken inside the measured window, a stuck ghost state, a crash
