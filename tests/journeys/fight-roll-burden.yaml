# 1.6-wiring: the roll-burden tier from carried weight, as OUR rule (owner, 2026-10-30): ArgoniaCore's burden tier
# (r = kg / (30 + 3 x Str)) takes TK Dodge's required perk when overloaded and gives it back when not (wiring row
# w.roll.tier). On the Blackwood Road beyond Claywater's ford (bat claywater-ambush); the load is ingots added as
# setup. Cut: roll distance, stamina per roll and the i-frame trace (TK Dodge's and the i-frame generator's own).
id: fight-roll-burden
runner: 1
crash_risk: low
scene: claywater-ambush
steps:
  - name: unburdened
    do: [{console: "player.unequipall"}, {wait: 2}]
    expect: [{console: "player.hasperk TKDodgeAddon.esp|0x809", contains: ">> 1"}]
  - name: overloaded          # far over capacity: the perk taken
    do: [{console: "player.additem 0005ACE4 320"}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "combat: roll locked (burden overloaded)"}, within: 10}
      - {console: "player.hasperk TKDodgeAddon.esp|0x809", contains: ">> 0"}
  - name: unlocked            # the ingots dropped: the perk given back
    do: [{console: "player.removeitem 0005ACE4 320"}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "combat: roll unlocked"}, within: 10}
      - {console: "player.hasperk TKDodgeAddon.esp|0x809", contains: ">> 1"}
