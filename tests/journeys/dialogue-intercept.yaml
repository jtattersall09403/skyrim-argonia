# 1.1 adapters (owed L4): talking to an Argonia speaker opens our dialogue view, never the vanilla Dialogue Menu.
# The 2.W5 block is gone: ARG_Speaker (KYWD 0x853) is on Livia's NPC_ (plugin/Argonia/Npcs/ARG_Npc_WellKeeper), N1,
# N13 and the landing's poler. The perk is added by ArgoniaCore on load (engine.cpp EnsurePerk), never the scene.
id: dialogue-intercept
runner: 1
crash_risk: low
scene: first-place
steps:
  - name: closed
    expect:
      - {read: [core, ViewState, dialogue], path: value, eq: null}
      - {read: [events], path: last, keep: ev0}
  - name: speak-livia         # E at her, face to face: our window, within 2 s
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {talk: ARG_Ref_ClaywaterStationLivia}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.well-keeper, within: 2}
      - {read: [core, RouterLog], path: value, contains: "hook dialogueIntercept"}   # the registrations; the speaker id above proves the open (game-15)
      - {event: {kind: menu, match: Dialogue Menu, absent: true}}
  - name: topic               # a topic choice from the state's list, as a click sends it
    do: [{call: [core, ViewIntent, '{"type":"dialogue.topic","v":1,"body":{"topic":"topic.claywater-two-charges"}}']}]
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.well-keeper}
      - {event: {kind: menu, match: Dialogue Menu, absent: true}}
  - name: goodbye             # closed, the controls back: a step forward moves the player
    do: [{call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}, {wait: 1}, {pad: "+LY=1:800 -:100"}]
    expect:
      - {read: [core, ViewState, dialogue], path: value, eq: null}
      - {moved: {gt: 50}}
  - name: control-non-speaker
    owed: a friendly non-speaker NPC form placeable at the first place (the vanilla path, allowed to open the Dialogue Menu)
