# 1.12 owner look 1, lane 1.12-chart (ledger rows "the map in game is the old project's parchment chart", "the land
# around the player is revealed", "the player marker is Morrowind's style", "zoomed in sharp; pan and zoom smooth",
# "leaving the map returns the camera as it was", "the map is a pane in the pause menu"). From `bat claywater` on the
# base save, at the play camera. The scene sets no reveal, no zoom and no camera: the walk reveals, the keys and the
# pad open, zoom, pan and close. Judged by the view's own pixel proof ("chart: reveal ok", logged through
# ArgoniaCore's console hook), the map key's log line, ArgoniaCore's Views read, and a still (or a burst) per look,
# each read by a reader with the row's claim and the feel question.
id: chart-look
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json, esm, "tools/chart/**"]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium   # 33 travels by cow
relaunch_before: true   # a fresh game for the cow travels (run_batch: cow crashes the engine after uptime)
scene: claywater
steps:
  - name: before-third-person                 # the play camera before the map: the camera to compare after it
    do: [{wait: 2}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
    reader: [the third-person play camera behind the player's Argonian on the road, no first-person hands or arms in front of the camera]
  - name: walk                                # the pad walks the road; each new cell joins the seen land
    do: [{pad: "LY=1:3000"}, {pad: "LY=1:3000"}, {pad: "LY=1:3000"}]
    expect: [{moved: {gt: 900}}, {log: {name: ArgoniaCore, contains: "revealed (cell change)"}, within: 10}]
  - name: route                               # round 3: a long journey, so the look is judged on a well-walked chart. The
    # player travels Claywater - Gideon - south - west - the south-west coast - the border - the middle (33 legs of 3
    # cells by `cow`): each arrival is a cell change, which the game's own event records (views.cpp MarkPlayerCell)
    do:
      - {console: "cow ARG_Province -54 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -51 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -48 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -45 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -42 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -39 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 11"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 8"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 5"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 -1"}
      - {wait: 4}
      - {console: "cow ARG_Province -36 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -39 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -42 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -45 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -48 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -51 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -54 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -57 -4"}
      - {wait: 4}
      - {console: "cow ARG_Province -57 -7"}
      - {wait: 4}
      - {console: "cow ARG_Province -57 -10"}
      - {wait: 4}
      - {console: "cow ARG_Province -57 -13"}
      - {wait: 4}
      - {console: "cow ARG_Province -58 -1"}
      - {wait: 4}
      - {console: "cow ARG_Province -58 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -58 5"}
      - {wait: 4}
      - {console: "cow ARG_Province -58 8"}
      - {wait: 4}
      - {console: "cow ARG_Province -55 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -52 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -49 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -46 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -43 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -40 2"}
      - {wait: 4}
      - {console: "cow ARG_Province -48 2"}
      - {wait: 4}
    expect: [{log: {name: ArgoniaCore, contains: "cell -48,2 revealed (cell change)"}, within: 10}]
  - name: chart-open                          # M opens our chart directly; the engine's MapMenu never opens
    do: [{key: "M 120"}, {wait: 4}]
    expect:
      - {log: {name: ArgoniaCore, contains: "the map key opens the chart (MapMenu never opens)"}, within: 6}
      - {read: [core, Views], path: value, contains: "chart ready open"}
      - {log: {name: ArgoniaCore, contains: "chart: reveal ok"}, within: 10}
    reader: [the old project's parchment chart in the dark frame opened close round the player, a long walked band of explored land (warm tint, relief, woods and marsh marks) with its roads in red-brown and rivers in slate, Gideon drawn and named, the province border's dashed line in the west and the south-west coast with its pale wash where the band reaches them, the ink thin and even over the relief as in the old chart, the land not walked blank parchment, a small gilt arrowhead at the player in the middle of a seen patch]
  - name: chart-zoomed-in                     # the triggers zoom toward the player: the largest render, one pixel to one
    do: [{pad: "RT:200"}, {wait: 0.4}, {pad: "RT:200"}, {wait: 0.4}, {pad: "RT:200"}, {wait: 0.4}, {pad: "RT:200"}, {wait: 0.4}, {pad: "RT:200"}, {wait: 0.4}, {pad: "RT:200"}, {wait: 2}]
    reader: [the chart close in round the player, its lines crisp and thin with no blur or blocky pixels, the explored land's contours and marks clear, the gilt marker small at the player]
  - name: chart-motion                        # L5: 40 frames at 15 fps (2.7 s) while the right stick pans; the inputs run some 9 s so
    # the burst, whose start lags its call, falls inside them. The view logs the stick and each glide's frames
    do:
      - {burst: {frames: 60, fps: 15}}
      - {pad: "RX=1:850 wait:200 RY=1:850 wait:200 RX=-1:850"}
      - {pad: "RX=1:850 wait:200 RY=1:850 wait:200 RX=-1:850"}
      - {pad: "RX=1:850 wait:200 RY=1:850 wait:200 RX=-1:850"}
      - {burst_fetch: chart-pan}
    expect:
      - {log: {name: ArgoniaCore, contains: "the pad's right stick forwarded to the chart"}, within: 10}
      - {log: {name: ArgoniaCore, contains: "chart: input stick"}, within: 10}
      - {log: {name: ArgoniaCore, contains: "chart: glide "}, within: 10}
  - name: chart-zoom-motion                   # L5: 40 frames at 15 fps while the triggers zoom out and in (each press logged)
    do:
      - {burst: {frames: 60, fps: 15}}
      - {pad: "LT:150 wait:600 LT:150 wait:600 RT:150 wait:600 RT:150"}
      - {pad: "LT:150 wait:600 LT:150 wait:600 RT:150 wait:600 RT:150"}
      - {pad: "LT:150 wait:600 RT:150"}
      - {burst_fetch: chart-zoom}
    expect:
      - {log: {name: ArgoniaCore, contains: "chart: input zoomOut"}, within: 10}
      - {log: {name: ArgoniaCore, contains: "chart: input zoomIn"}, within: 10}
  - name: chart-closed                        # M again closes it; the play camera comes back as it was
    do: [{key: "M 120"}, {wait: 3}]
    expect: [{read: [core, Views], path: value, contains: "chart ready closed"}]
    reader: [the same third-person play camera as before the map, the player's Argonian seen from behind, no first-person hands or arms in front of the camera]
  - name: windows-with-the-map-pane           # Tab: Wind UI's character, magic and inventory windows, and our map pane beside them
    do: [{key: "TAB 150 engine"}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "the map pane shown beside Wind UI's windows"}, within: 6}]
    reader: [Wind UI's character magic and inventory windows with a fourth window titled Map in the lower right showing the parchment chart close round the player and the gilt marker, the map window not covering the others]
  - name: windows-closed
    do: [{key: "TAB 150 engine"}, {wait: 2}]
    reader: [the third-person play camera, no window and no map pane left on screen, no first-person hands]
