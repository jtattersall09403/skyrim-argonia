# The world panel (1.15 §0, §f; decision 0033 §5), written by `python3 -m tools.argonia_world.panel --write`
# from the generated data: two fixed vantages per region class (shore: dry ground beside water of the
# class's commonest kind; high: the class's highest point, facing its longest view), each at noon (the
# region's clear-dry) and dawn 06:30 (its mist regime's weather), first person (`camera: first`, waited
# for), the HUD `hud: off`. Read by a `reader` with the 1.15 §0 checklist and feel question, docs/design/world/vibe-board.md the
# vibe check (not the bar), and god rays and volumetric fog where the weather has them (dawn mist over
# water; light shafts through canopy; owner, 2026-11-01); each step
# checks only that the teleport landed. The vantages are re-derived from each build and pulled out of foliage
# (`python3 -m tools.journeys refresh`).
