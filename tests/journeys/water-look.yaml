# Draft (2.W2): owed L4. 2.W2 §a: the WATR types are tuned with Community Shaders' water features until a reader
# judges them good against vanilla and modded reference stills.
id: water-look
status: draft, owed L4
scene: water-reaches
types: [sea, brackish, fresh, black]
per_type:
  - teleport to the type's reference view (one sea coast, one lagoon, one lake, one blackwater swamp, chosen by the
    lane from cells.jsonl's waterType), at 12:00 and 18:00 clear and at 12:00 rain
  - a still at the play camera; one under water (Underwater NG)
reader: against the reference stills (vanilla Skyrim river and lake, a Community Shaders water showcase), the
  checklist (colour, opacity, fog under water, reflections, shoreline blend) and the feel question
loop: the lane edits tools/argonia_world/water/layer.py TYPES, rebuilds, re-shoots; stops when the reader passes all
  four or after 3 passes with a written reason
