# 1.3 round 4 (owner play test 3, findings 24, 27, 28): every Claywater person talks with greeting and topics; a
# corpse is searched, never spoken to. L1/L2: test_speakers_talk.py, core.talk every_speaker_greets_with_topics,
# core.views actor_rule, the perk's GetDead/IsInCombat conditions (hooks_records.py). One still per conversation.
id: claywater-talk
reach: [esm, "skse/ArgoniaCore/**", "skse/core/**", "data/quarantine/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: medium   # the kill step
scene: first-place
steps:
  - name: livia
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -120 0"}
      - {talk: ARG_Ref_ClaywaterStationLivia}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.well-keeper, within: 2}
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: topic.about-claywater}
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: topic.service-barter}
    still: livia-topics
  - name: takes
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
      - {console: "player.moveto ARG_Ref_ClaywaterStationTakes 0 -120 0"}
      - {talk: ARG_Ref_ClaywaterStationTakes}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.n1-3, within: 2}
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: topic.claywater-station-people}
    still: takes-topics
  - name: signs
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
      - {console: "player.moveto ARG_Ref_ClaywaterStationSigns 0 -120 0"}
      - {talk: ARG_Ref_ClaywaterStationSigns}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.landing-s-poler, within: 2}
      - {read: [core, ViewState, dialogue], path: value.body.topics, contains: topic.about-onkobra}
    still: signs-topics
  - name: gaius
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
      - {console: "player.moveto ARG_Ref_ClaywaterStationGaius 0 -120 0"}
      - {talk: ARG_Ref_ClaywaterStationGaius}
    expect:
      - {read: [core, ViewState, dialogue], path: value.body.speaker.id, eq: npc.imperial-fringe.claywater-station.n1, within: 2}
    still: gaius-topics
  - name: dead-livia-is-searched   # finding 28: a corpse opens its inventory, never our window
    do:
      - {call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}
      - {console: "ARG_Ref_ClaywaterStationLivia.kill"}
      - {wait: 2}
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -80 0"}
      - {talk: ARG_Ref_ClaywaterStationLivia}
    expect:
      - {event: {kind: menu, match: ContainerMenu}, within: 3}
      - {read: [core, ViewState, dialogue], path: value, eq: null}
    still: dead-livia
