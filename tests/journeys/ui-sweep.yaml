# Draft (1.2 §a, lane 1.2-theme): owed L4, run by a game lane with 0.3's hands (SkyLink and the console).
# In 0.3 §d's format, as the other drafts here, because tools/run_journey.py does not exist yet.
# Acceptance (1.2 §a): every menu the player can open from the first place shows Pelagiad, the theme in our palette
# and the Argonia title; no compass, no quest marker. The reader judges the stills (palette, no Nordic tell).
id: ui-sweep
status: draft, owed L4
scene: the base save at the first place; the profile with argonia-theme laid above dear-diary, wood-and-paper and
  oblivion-loading-menu (installer/steps/ui-theme.md run on the game machine)
setup_checks:
  - read: Data/interface/fontconfig.txt through the VFS (MO2 winner)
    expect: the argonia-theme copy (first line names tools/ui_theme/fontlib.py); fonts_pelagiad.swf present
  - read: Skyrim.ini / SkyrimPrefs.ini [Interface] bShowCompass and bShowQuestMarkers
    expect: both 0 (owed by the game lane: stack.py does not set them yet, see the lane report)
steps:
  - do: quit to the main menu (console `qqq` is not allowed; use the pause menu's Quit to main menu)
    expect: the Argonia title on our dark paper; no Skyrim map, no "Skyrim" wordmark; menu words in Pelagiad
    still: main-menu
  - do: main menu > Load
    expect: the save list sheet in our paper, moss frame, Pelagiad
    still: main-menu-load
  - do: load the base save; open each menu by its key or by the console where no key exists, one still each, closing
      it before the next - Tween (Tab), Inventory (I), Magic (P), Map (M), Journal (J, our view or Dear Diary's per
      the router), Favorites (Q), Sleep/Wait (T), a container (the scene's chest), barter (the scene's merchant),
      a book (the scene's book), a message box (console `ShowMessage` none: use the wait menu's confirm),
      lockpicking (the scene's locked chest), training (the scene's trainer), crafting (the scene's alchemy table),
      the MCM config panel (System > Mod Configuration), the loading screen (coc to the next place)
    expect: each: the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), all text in
      Pelagiad, no Nordic ornament (no horned helmet on the map's side panel, no barbed sigil on enchanting)
    still: one per menu, named by the menu
  - do: close every menu and stand in the open at the first place for 5 s; turn the camera 360 degrees
    expect: no compass and no quest marker in the HUD; read the HUD movie's compass element visibility = false
    still: hud-open
pass: every expectation, and the reader passes every still for palette and Nordic tells
fails_if: a vanilla font (Futura) anywhere, a menu in Dear Diary's original grey and red-brown, the Skyrim map or
  wordmark, a compass or marker, a missing glyph box, a crash
