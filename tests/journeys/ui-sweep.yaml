# 1.2 §a (owed L4): every vanilla and SkyUI menu reachable from the first place shows Pelagiad, our palette, the
# Argonia title, and no compass or quest marker. Each menu opens by its key (judged by its menu event), a still per
# step; the stills go to a `reader` with each step's `reader:` list (palette, Pelagiad, no Nordic tell, no Futura).
# The props scene (tests/scenes/ui-props.txt) stages a crate, a crate to lock, a book and lockpicks; each prop's menu
# opens by activating it from the console (the menu's look is the test). Barter, training and crafting are owed. Ends at the main menu: a save-changing item, last in its batch.
id: ui-sweep
runner: 1
crash_risk: medium
batch_last: true         # it ends at the main menu or changes the saves: last in a batch (run_batch --write-owed)
scene: ui-props
steps:
  - name: hud-open            # no compass, no marker: the vanilla HUD elements are hidden; turn the camera round
    do: [{wait: 2}, {pad: "+RX=1:2500 -:100"}]
    expect: [{read: [core, Views], path: value, contains: "vanilla-hud hidden 4/4"}]
    reader: [no compass and no quest marker anywhere in the HUD, our HUD bars in our palette]
  - name: tween
    do: [{key: "TAB 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: TweenMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: tween-closed
    do: [{key: "TAB 120"}, {wait: 1.5}]
  - name: inventory
    do: [{key: "I 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: InventoryMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: inventory-closed
    do: [{key: "I 120"}, {wait: 1.5}]
  - name: magic
    do: [{key: "P 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: MagicMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: magic-closed
    do: [{key: "P 120"}, {wait: 1.5}]
  - name: map
    do: [{key: "M 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: MapMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: map-closed
    do: [{key: "M 120"}, {wait: 1.5}]
  - name: favorites
    do: [{key: "Q 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: FavoritesMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: favorites-closed
    do: [{key: "Q 120"}, {wait: 1.5}]
  - name: sleep-wait
    do: [{key: "T 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: SleepWaitMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: sleep-wait-closed
    do: [{key: "T 120"}, {wait: 1.5}]
  - name: journal             # our journal view (or Dear Diary's, per the router)
    do: [{key: "J 120"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "journal ready open"}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: journal-closed
    do: [{key: "ESC 80"}, {wait: 1.5}]
  - name: system-tab          # Escape in play: the vanilla Journal Menu's System tab (the MCM lives under it)
    do: [{key: "ESC 80"}, {wait: 2}]
    expect: [{event: {kind: menu, match: Journal Menu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: system-closed
    do: [{key: "ESC 80"}, {wait: 1.5}]
  - name: mcm
    owed: the pad path into System > Mod Configuration (its list position under the SkyUI tab)
  - name: props-found
    expect:
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: count, eq: 2}
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: refs.0.ref, keep: chest}
      - {read: [refs, ARG_Cont_OpeningWorkCampGuardStores, "1500"], path: refs.1.ref, keep: lockbox}
      - {read: [refs, ARG_Book_StationWaterLedger, "1500"], path: refs.0.ref, keep: book}
  - name: container
    do: [{console: '"{chest}".activate player'}, {wait: 2}]
    expect: [{event: {kind: menu, match: ContainerMenu}}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: container-closed
    do: [{key: "ESC 80"}, {wait: 1.5}]
  - name: book
    do: [{console: '"{book}".activate player'}, {wait: 2}]
    expect: [{event: {kind: menu, match: Book Menu}}]
    reader: [the page in our palette, every word in Pelagiad, no Nordic ornament]
  - name: book-closed
    do: [{key: "ESC 80"}, {wait: 1.5}]
  - name: lockpicking
    do: [{console: '"{lockbox}".lock 25'}, {console: '"{lockbox}".activate player'}, {wait: 2}]
    expect: [{event: {kind: menu, match: Lockpicking Menu}}]
    reader: [the lock in our palette, every word in Pelagiad, no Nordic ornament]
  - name: lockpicking-closed
    do: [{key: "ESC 80"}, {wait: 1.5}]
  - name: prop-menus-owed
    owed: a merchant, a trainer and an alchemy table (barter, training, crafting menus) need records of ours or reviewed vanilla bases (0012 §6); none is in the world database yet
  - name: loading-screen      # coc to Claywater's interior and back: the loading menu
    do: [{console: "player.moveto ARG_Ref_ClaywaterStationLivia"}, {wait: 1}, {console: "coc LilmothApothecaryHouse"}, {wait: 1}]
    expect: [{event: {kind: menu, match: Loading Menu}, within: 10}]
    reader: [the sheet in our palette (warm paper, moss or near-black frame, red-clay accents), every word in Pelagiad, no Nordic ornament, the Argonia title where a title shows]
  - name: interface-ini       # the INI as the game holds it
    expect:
      - {read: [ini, "bShowCompass:Interface"], path: value, eq: false}
      - {read: [ini, "bShowQuestMarkers:Interface"], path: value, eq: false}
  - name: main-menu           # the player's own Quit (the pad, as menus-quit), to the main menu
    do:
      - {key: "ESC 80"}
      - {wait: 2}
      - {pad: "DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120 DOWN:80 wait:120"}
      - {pad: "A:120 wait:1500 A:120"}
      - {wait: 8}
    expect: [{event: {kind: menu, match: MainMenu}, within: 30}]
    reader: [the Argonia title on our dark paper, no Skyrim map or wordmark, menu words in Pelagiad]
