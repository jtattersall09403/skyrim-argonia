# 0.4 §d's look loop: vantage stills of Claywater Station at the play camera, for a `reader` against the place's
# design note (world/sources/blueprints, claywater-station) with the Nordic-tells checklist: no Nordic model,
# texture or word; pieces seated on the ground (no floating or buried footing); doors at their doorways; the scour
# pool holding water at the clay cut; people whole (no seam, tone mismatch or dark face). Stills are the evidence;
# each step only checks the teleport landed. Fix and re-shoot until the reader passes them.
id: claywater-look
look: world
reach: ["tools/argonia_world/place_build.py", "tools/argonia_world/pieces.py", "data/pieces-preference.json", "data/mesh-textures.json", "data/dependencies.json", "records: Statics", "records: ref ARG_Ref_ClaywaterStationAmbushDeserter", "records: ref ARG_Ref_ClaywaterStationAmbushPlayer", "records: ref ARG_Ref_ClaywaterStationB1Door", "records: ref ARG_Ref_ClaywaterStationB4Door", "records: ref ARG_Ref_ClaywaterStationB5Door", "records: ref ARG_Ref_ClaywaterStationB6Door", "records: ref ARG_Ref_ClaywaterStationClayBasket", "records: ref ARG_Ref_ClaywaterStationClayBend", "records: ref ARG_Ref_ClaywaterStationCrocodile", "records: ref ARG_Ref_ClaywaterStationCrocodileDen", "records: ref ARG_Ref_ClaywaterStationCrocodileDenShallows", "records: ref ARG_Ref_ClaywaterStationFamilyWork", "records: ref ARG_Ref_ClaywaterStationGaius", "records: ref ARG_Ref_ClaywaterStationKeeperWork", "records: ref ARG_Ref_ClaywaterStationKeptGuar1", "records: ref ARG_Ref_ClaywaterStationKeptGuar1Pen", "records: ref ARG_Ref_ClaywaterStationKeptGuar2", "records: ref ARG_Ref_ClaywaterStationKeptGuar2Pen", "records: ref ARG_Ref_ClaywaterStationLivia", "records: ref ARG_Ref_ClaywaterStationMortarTub", "records: ref ARG_Ref_ClaywaterStationPolerWork", "records: ref ARG_Ref_ClaywaterStationQuestBoard", "records: ref ARG_Ref_ClaywaterStationRaft", "records: ref ARG_Ref_ClaywaterStationRoadIn", "records: ref ARG_Ref_ClaywaterStationSigns", "records: ref ARG_Ref_ClaywaterStationTakes", "records: ref ARG_Ref_ClaywaterStationWell", "records: ref ARG_Ref_ClaywaterStationWellSilt", "records: ref ARG_Ref_ClaywaterStationWellWater", "records: cell -58,11 r1", "records: cell -58,12 r1", "records: cell -57,11 r1", "records: cell -57,12 r1", "records: cell 1,-1 r1", "records: cell 2,-2 r1"]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
independent_steps: true
crash_risk: low
scene: claywater
camera: first
steps:
  - name: road-in
    do: [{hud: "off"}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: well-junction
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationQuestBoard 0 -560 16"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: station-house-front
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB1Door"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: huts-row
