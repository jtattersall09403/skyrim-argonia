    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationClayBend 0 -560 42"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: ford-ambush-road
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationAmbushPlayer 0 -560 24"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: livia-full-body
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -245 16"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: signs-full-body
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationSigns -945 0 63"}, {console: "player.setangle z 90"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: station-house-inside
    scan: 6   # six headings from the stand (owner 19:05 #41, 0036)
    # claywater-walk's stand-off: 70 units out on the porch against the door's heading, facing it (moveto onto the door
    # left the player outside with the prompt shown; diag2-crash-misc)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB1Door 37 60 20"}, {console: "player.setangle z 212"}, {key: "W 80"}, {wait: 2},
         {key: "E 120"}, {wait: 6}]
    weather: any  # the stop ends inside the station house: no sky in the still
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 0"}]
