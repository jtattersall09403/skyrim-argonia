# 0.4 §d's look loop: vantage stills of Claywater Station at the play camera, for a `reader` against the place's
# design note (world/sources/blueprints, claywater-station) with the Nordic-tells checklist: no Nordic model,
# texture or word; pieces seated on the ground (no floating or buried footing); doors at their doorways; the scour
# pool holding water at the clay cut; people whole (no seam, tone mismatch or dark face). Stills are the evidence;
# each step only checks the teleport landed. Fix and re-shoot until the reader passes them.
id: claywater-look
look: world
reach: [esm, tools/argonia_world/place_build.py, tools/argonia_world/pieces.py, data/pieces-preference.json, data/mesh-textures.json, data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
independent_steps: true
crash_risk: low
scene: claywater
camera: first
steps:
  - name: road-in
    do: [{hud: "off"}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: well-junction
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationQuestBoard 0 -560 16"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: station-house-front
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB1Door"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: huts-row
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB6Door"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: family-hut
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB5Door"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: landing-and-raft
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationRaft -1188 -1188 32"}, {console: "player.setangle z 45"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: clay-cut-and-pool
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationClayBend 0 -560 45"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: ford-ambush-road
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationAmbushPlayer 0 -560 47"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: livia-full-body
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -245 16"}, {console: "player.setangle z 0"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: signs-full-body
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationSigns -945 0 63"}, {console: "player.setangle z 90"}, {wait: 3}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
  - name: station-house-inside
    # claywater-walk's stand-off: 70 units out on the porch against the door's heading, facing it (moveto onto the door
    # left the player outside with the prompt shown; diag2-crash-misc)
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.moveto ARG_Ref_ClaywaterStationB1Door 37 60 20"}, {console: "player.setangle z 212"}, {key: "W 80"}, {wait: 2},
         {key: "E 120"}, {wait: 6}]
    weather: any  # the stop ends inside the station house: no sky in the still
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 0"}]
