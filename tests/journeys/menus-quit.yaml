# fixes-1's owed L4 (the menu lag; the quit save, 2.8 §c): a menu opened in play stays open (game-8: the suspend
# save's spinner closed the Journal), no suspend save is written on an opening, and the Journal's Quit (dev-quit-to-menu: the
# engine's resetGame and the Journal's close, as its confirmation does) writes ArgoniaSuspend as the Journal closes. The
# journey ends at the main menu: a batch's next item loads its save. Runs last in a batch, or before a relaunch.
id: menus-quit
runner: 1
crash_risk: high
batch_last: true         # it ends at the main menu or changes the saves: last in a batch (run_batch --write-owed)
step_saves: false        # it counts or tests saves: no step save (run_journey resume)
scene: first-place
steps:
  - name: tween-stays        # Tab opens the pause hub; 5 s on it is still open, and no save was written
    do: [{key: "TAB 120"}, {wait: 5}]
    expect:
      - {event: {kind: menu, match: TweenMenu}}
      - {event: {kind: menu, match: '"opening": false', absent: true}}
  - name: tween-closed
    do: [{key: "TAB 120"}, {wait: 1.5}]
  - name: journal-stays      # our journal (J), 5 s open, still open
    do: [{key: "J 120"}, {wait: 5}]
    expect: [{read: [core, Views], path: value, contains: "journal ready open"}]
  - name: journal-closed
    do: [{close_menu: journal}]
    expect: [{read: [core, Views], path: value, contains: "journal ready closed"}]
  - name: system-opens       # Escape in play: the vanilla Journal Menu (engine), then closed by the close keys
    do: [{key: "ESC 80"}, {wait: 2}]
    expect: [{event: {kind: menu, match: Journal Menu}}]
  - name: system-closed      # closed once with no quit asked (close_menu fails the step when it does not close)
    do: [{close_menu: Journal Menu}, {wait: 2}]
  - name: quit-confirmed     # the Journal's Quit by the dev bridge (game-20: the pad route through the System tab was
    do:                      # unreliable): resetGame set and the Journal shown and closed, as the confirmation does
      - {call: [dev-quit-to-menu]}
      - {wait: 8}
    expect:
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaSuspend written (quit)"}, within: 15}
      - {event: {kind: menu, match: MainMenu}, within: 30}
