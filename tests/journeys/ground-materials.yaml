# 1.15 round 4, lane 1.15-r4-materials (owner play test 3, findings 16-17): the ground no longer shines and the
# flat mossy pebble texture (BM&V riverbededge.dds, LRiverbedEdge01) no longer covers wide fields. Two places picked
# from the data: -9 27 (a 1 km window whose dry ground was 75 % edge texture in round 3) and -50 8 (western-frontier
# upland, a forested hillside). Needs the next deploy's re-lay of tropical-skyrim-sse (19 landscape _n dropped) and
# Argonia.esm (TXST TX01 = Skyrim.esm's normals) and ArgoniaWorld.esm (the new gradient). Midday sun for the sheen.
id: ground-materials
look: world
reach: [esm, "tools/argonia_world/terrain/**", data/mesh-textures.json, data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
independent_steps: true
crash_risk: medium
relaunch_before: false
scene: claywater
camera: first
steps:
  - name: pebble-field
    # cell -9 27: the dry patch nearest its middle with a clear stand 8-15 m off; line 0 canopy 0 grass 33 bad 0, 8.0 m to the subject, heading 330 pitch 14
    # subject: -32575 114321 209
    do:
      - hud: off
      - console: {line: cow ARG_Province -9 27, settle: 60}
      - wait: 8
      - console: set gamehour to 13
      - console: sw Argonia.esm|0x000E9B
      - console: fw Argonia.esm|0x000E9B
      - settle: {cap: 14, min: 3}
      - console: player.setpos x -32295
      - console: player.setpos y 113836
      - console: player.setpos z 224
      - wait: 6
      - console: player.setangle z 330
      - console: player.setangle x 14
      - wait: 4
    expect:
      - {console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}
      - {read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}
    reader: [the ground away from the water's edge is varied forest floor, grass or moss, not one flat grey-green pebble texture over the whole view; the pebbly edge texture only in a thin strip along the water, no ground looks wet, shiny or mirror-like in the sun]
  - name: hillside
    # cell -50 8: the dry patch nearest its middle with a clear stand 8-15 m off; line 0 canopy 0 grass 20 bad 0, 15.0 m to the subject, heading 180 pitch 7
    # subject: -204993 37617 5077
    do:
      - hud: off
      - console: {line: cow ARG_Province -50 8, settle: 60}
      - wait: 8
      - console: set gamehour to 13
      - console: sw Argonia.esm|0x000E9B
      - console: fw Argonia.esm|0x000E9B
      - settle: {cap: 14, min: 3}
      - console: player.setpos x -204993
      - console: player.setpos y 38668
      - console: player.setpos z 5088
      - wait: 6
      - console: player.setangle z 180
      - console: player.setangle x 7
      - wait: 4
    expect:
      - {console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}
      - {read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}
    reader: [the hillside ground is matte with visible relief in its texture (stones, roots, tufts lit from one side), no shiny or reflective sheen on slopes facing the sun]
