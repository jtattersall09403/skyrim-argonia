# 1.6-wiring, native map S14a/S11b: our damage formula's result with our attributes and skills (owner, 2026-10-30:
# simple reads in a real place). On the Blackwood Road beyond Claywater's ford (bat claywater-ambush). The inputs are
# set at each step's start through the dev bridge's `dev-set` (ArgoniaCore's SetAttribute; dev-only SetSkill); one
# light blow on the deserter (calmed, health raised) and its health loss against docs/research/2026-10-30/combat-wiring.md.
# Kept: the pinned vanilla skills, the carriers moving on equip. Cut: the power attack's stamina (kept only, never judged).
id: fight-damage-builds
runner: 1
crash_risk: low
scene: claywater-ambush
steps:
  - name: find
    do: [{console: "player.additem ARG_Weap_SteelSword 1"}, {console: "player.equipitem ARG_Weap_SteelSword"}, {wait: 2}]
    expect:
      - {read: [actors, "4000"], path: listed.0.ref, keep: opp}
      - {read: [av, VoicePoints, player], path: current, keep: vp}
  - name: pinned-skills       # never mirrored; the console's names (the av read refused OneHanded in game-13)
    expect:
      - {console: "player.getbaseav OneHanded", contains: ">> 0.00"}
      - {console: "player.getbaseav TwoHanded", contains: ">> 0.00"}
      - {console: "player.getbaseav Marksman", contains: ">> 0.00"}
  - name: carriers-move-on-equip
    do: [{console: "player.unequipitem ARG_Weap_SteelSword"}, {wait: 2}]
    expect: [{read: [av, VoicePoints, player], path: current, ne: {kept: vp}}]
  - name: arm                 # the deserter calmed and held, the player behind it, weapon drawn
    do:
      - {console: "player.equipitem ARG_Weap_SteelSword"}
      - {console: '"{opp}".stopcombat'}
      - {console: '"{opp}".setav aggression 0'}
      - {console: "player.moveto {opp} 0 -110 0"}
      - {console: "player.setangle z 0"}
      - {key: "W 80"}             # the third-person camera ignores setangle until the player moves (diag3-g15)
      - {key: "R 150"}
      - {wait: 1.5}
    expect:
      - {read: [av, VoicePoints, player], path: current, eq: {kept: vp}}
      - {console: player.IsWeaponOut, not_contains: ">> 0"}
  - name: novice-blow         # Str 40, Agi 40, Long Blade 5: blow 24 x 0.501 x 0.90 = 10.82; the deserter's AR 31.5 mitigates
    # AR/(AR+135.6+0.6x24) = 0.1736 (body_incoming_damage uses the reference blow 24), so health loss = 10.82 x 0.8264 = 8.94 (+-0.5)
    do:
      - {call: [dev-set, SetSkill, longBlade, "5"]}
      - {call: [dev-set, SetAttribute, strength, "40"]}
      - {call: [dev-set, SetAttribute, agility, "40"]}
      - {console: '"{opp}".setav health 2000'}
      - {console: '"{opp}".restoreav health 1000'}   # setav keeps the last blow's damage (game-16: 2000-8.94-29.75)
      - {wait: 1}
      - {strike: "{opp}"}
    expect:
      - {event: {kind: hit, match: "*"}}
      - {read: [av, Health, "{opp}"], path: current, ge: 1990.5}
      - {read: [av, Health, "{opp}"], path: current, le: 1991.5}
  - name: god-blow            # Str 100, Agi 100, Long Blade 100: blow 24 x 1.0 x 1.5 = 36.0; x 0.8264 (AR 31.5 as above) = 29.75 (+-0.5)
    do:
      - {call: [dev-set, SetSkill, longBlade, "100"]}
      - {call: [dev-set, SetAttribute, strength, "100"]}
      - {call: [dev-set, SetAttribute, agility, "100"]}
      - {console: '"{opp}".setav health 2000'}
      - {console: '"{opp}".restoreav health 1000'}   # setav keeps the last blow's damage (game-16: 2000-8.94-29.75)
      - {wait: 1}
      - {strike: "{opp}"}
    expect:
      - {event: {kind: hit, match: "*"}}
      - {read: [av, Health, "{opp}"], path: current, ge: 1969.7}
      - {read: [av, Health, "{opp}"], path: current, le: 1970.7}
  - name: difficulties
    owed: the same ratio at each difficulty (a GetGameSetting read of fDiffMultHPByPCN/ToPCN per difficulty)
