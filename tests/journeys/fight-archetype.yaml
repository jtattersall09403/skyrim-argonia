# 1.6-wiring, the ambush deserter's archetype as OUR record (owner, 2026-10-30: test our integration, simple reads in
# a real place): on the Blackwood Road beyond Claywater's ford (bat claywater-ambush), its level, max health and
# steel kit are the record's values, and its light hit on 0 AR is our number (24 x 1.3333 = 32). Native map S13a.
# Cut: aggro range (Skyrim's AI), the player's blow, parry and riposte (Elden Parry, Rim Parry), the rest respawn.
id: fight-archetype
runner: 1
crash_risk: low
scene: claywater-ambush
steps:
  - name: find
    expect:
      - {read: [actors, "4000"], path: listed.0.ref, keep: opp}
      - {read: [actors, "4000"], path: listed.0.name, keep: opp_name}
  - name: record-values       # level 10, max health 44 (race start + offset -6), steel kit
    expect:
      - {console: '"{opp}".GetLevel', contains: ">> 10"}
      - {read: [av, Health, "{opp}"], path: permanent, eq: 44}
      - {read: [inventory, "{opp}"], path: items, contains: "Steel"}
  - name: its-light-hit       # 24 x 1.3333 = 32 +- 1 on the player's 0 AR
    do: [{console: "player.unequipall"}, {console: '"{opp}".startcombat player'}, {console: "player.moveto {opp} 0 -150 0"}]
    expect:
      - {read: [av, Health, player], path: current, keep: hp}
      - {event: {kind: hit, match: "*"}, within: 8}
      - {read: [av, Health, player], path: current, le: {kept: hp, plus: -31}}
      - {read: [av, Health, player], path: current, ge: {kept: hp, plus: -33}}
