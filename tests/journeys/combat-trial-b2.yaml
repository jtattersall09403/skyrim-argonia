# The combat trial, group B2: Dark Souls Combat's poise and stamina under A's rolls (crits off), as a check of OUR wiring only (owner, 2026-10-30: test our integration, not
# other modders' work; simple checks in real places, no arena). Install: python3 infra/gpu-box/stack.py combat B2
# (set dsc-b2); not in the one batch (tests/journeys/batches/all.yaml runs set A), so it carries `stack: B2`.
# On the Blackwood Road beyond Claywater's ford (claywater-ambush): DSC's plugin loaded, our staged settings read
# back, our Pandora output carries DSC's roll, TDM's lock-on answers. DSC's poise, roll bands, backstab, parry and
# its Papyrus load are DSC's own behaviour, measured for the trial table in docs/research/journals/combat.md, not here.
id: combat-trial-b2
runner: 1
stack: B2
crash_risk: low
scene: claywater-ambush
steps:
  - name: set-wired
    expect:
      - {read: [plugin, "Dark Souls Combat.esp"], path: file, eq: "Dark Souls Combat.esp"}
      - {read: [global, BB_Poise_VarCritsAllowed], path: value, eq: 0}
      - {read: [global, BB_Poise_VarDebugTrace], path: value, eq: 1}
      - {read: [actors, "4000"], path: listed.0.ref, keep: opp}
  - name: pandora-wired    # our Pandora output put DSC's FNIS roll in the graph: the event plays and its root motion moves
    do: [{console: "tgm"}, {console: "player.sae BB_DSC_ForwardRoll_Med"}, {wait: 2}, {console: "tgm"}]
    expect: [{moved: {gt: 150}}]
  - name: lock-on          # R3 six metres from the deserter: TDM's API reports a lock
    do: [{console: "player.moveto {opp} 0 -600 0"}, {console: "player.setangle z 0"}, {wait: 1}, {pad: "RS:120 wait:800"}]
    expect: [{read: [tdm-target], path: locked, eq: true}]
