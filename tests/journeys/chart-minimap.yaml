# 1.12 §5 (L4, owed): the chart and the HUD's minimap in game, from `bat claywater` (the Blackwood Road into Claywater
# Station, ARG_Province). Judged by ArgoniaCore's Views read (skse/ArgoniaCore/src/views.cpp ViewsReport: "chart
# revealed N", "chart places N", "chart player x,y heading H", "minimap shown|hidden revealed N places M heading H",
# "fast-travel off") and menu events; a still per step. The readers' lines are the 1.12 checks.md rows' looks
# (full zoom-out uncut, the player marker, the minimap and its rose); the L3 stills prove the drawing off-game.
# The scene never sets what is tested: no reveal, no discovery, no fast-travel switch is set; the walk is the pad.
id: chart-minimap
runner: 1
crash_risk: low
step_saves: false        # it saves and loads to test the reveal holding
scene: claywater
steps:
  - name: arrived
    expect:
      - {console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}
      - {read: [core, Views], path: value, contains: "fast-travel off"}       # Game.EnableFastTravel(false) at load
      - {read: [core, Views], path: value, contains: "chart player "}
      - {read: [core, Views], path: value, not_contains: "chart player none"}
  - name: no-place-marked-before-discovery   # Claywater's marker is unmarked until Skyrim's discovery fires
    expect: [{read: [core, Views], path: value, contains: "chart places 0"}]
  - name: minimap-north                       # the HUD's minimap top right, its rose turned to heading 0
    do: [{console: "player.setangle z 0"}, {wait: 1}]
    expect: [{read: [core, Views], path: value, contains: "minimap shown"}, {read: [core, Views], path: value, contains: "heading 0"}]
    reader: [a round parchment minimap pinned top right with a gold-green rim, the player's red arrow at its centre pointing up, the rose's N at the top, no Skyrim compass bar, the effects stack below the minimap and clear of the bottom corners]
  - name: minimap-135                         # turned: the rose's N swings to the lower left
    do: [{console: "player.setangle z 135"}, {wait: 1}]
    expect: [{read: [core, Views], path: value, contains: "heading 135"}]
    reader: [the same minimap turned, the rose's N now toward the lower left, the arrow still pointing up]
  - name: walk                                # the real path: the pad walks the road; new cells reveal
    do: [{pad: "LY=1:3000"}, {pad: "LY=1:3000"}, {pad: "LY=1:3000"}]
    expect: [{moved: {gt: 900}}, {log: {name: ArgoniaCore, contains: "revealed (cell change)"}, within: 10}]
  - name: chart-open                          # M opens our chart; the push carries the player
    do: [{key: "M 120"}, {wait: 2}]
    expect: [{event: {kind: menu, match: MapMenu}}, {read: [core, Views], path: value, contains: "chart ready open"}]
    reader: [our parchment chart in the dark green-black frame with gold-green trim, the player's red arrow at the player's place, warmer revealed land along the walked road, no quest or other markers]
  - name: chart-zoomed-out                    # the pad's zoom-out to the whole province: nothing cut off
    do: [{key: "Minus 120"}, {key: "Minus 120"}, {key: "Minus 120"}, {key: "Minus 120"}, {key: "Minus 120"}, {wait: 1}]
    reader: [the whole province from its northern edge to its southern coast inside the sheet, nothing cut off at the top or bottom, the player's arrow shown]
  - name: no-fast-travel-from-the-map         # no place on the chart travels; the engine's switch is off too
    do: [{key: "Enter 120"}, {wait: 2}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}, {read: [core, Views], path: value, contains: "chart ready open"}]
  - name: chart-closed
    do: [{close_menu: MapMenu}]
    expect: [{read: [core, Views], path: value, contains: "chart ready closed"}]
  - name: reveal-holds-after-save-and-load    # the CHRT family: the count after the load is the count before it
    do: [{console: "save chartminimap"}, {wait: 3}, {console: "load chartminimap"}, {wait: 15}]
    expect: [{log: {name: ArgoniaCore, contains: "co-save"}, within: 30}, {read: [core, Views], path: value, contains: "chart revealed "}]
    owed: "the read's count must equal the count before the save: run_journey has no 'equals the earlier read' expectation; the reader compares the two Views reads in report.json"
  - name: place-marked-after-discovery        # Skyrim's discovery fires as the player reaches the place
    owed: "the plugin places no map marker yet (plugin/ has no MapMarker reference; the world track's place generation adds them): reach Claywater's marker, then expect 'chart places 1' and the log line 'chart: discovered Claywater Station'"
