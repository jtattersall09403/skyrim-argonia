# 1.5 / 2.8 §c (owed L4): the hidden suspend save. Opening a menu writes nothing (menus-quit holds the open-menu half);
# the stream client's drop writes it, in combat too; Continue after a quit loads it, and the wake point stays the camp.
# Ends by a relaunch on the suspend save (no scene: the player resumes where it quit): a save-changing item, last in its batch.
id: suspend-save
runner: 1
crash_risk: high
step_saves: false        # it counts or tests saves: no step save (run_journey resume)
scene: first-place
steps:
  - name: rest
    do:
      - {rest: ARG_Ref_ClaywaterStationRoadIn}   # the camp spot at the road-in marker (game-16 rest action)
    expect: [{read: [core, WakePoint], path: value, ne: "", keep: wake, within: 10}]
  - name: menus-write-nothing # Tab, 5 s open: nothing closes it (the suspend save's spinner closed menus, game-8)
    do: [{key: "TAB 120"}, {wait: 5}]
    expect:
      - {event: {kind: menu, match: TweenMenu}}
      - {event: {kind: menu, match: '"opening": false', absent: true}}
  - name: menus-closed        # the step closes it itself, so the close is not counted above (batch 20261030T151243)
    do: [{key: "TAB 120"}, {wait: 1.5}]
  - name: stream-drop
    do: [{call: [core-suspend, stream_drop]}]
    expect: [{log: {name: ArgoniaCore, contains: "saves: ArgoniaSuspend written (stream drop)"}, within: 10}]
  - name: in-combat-drop      # the crocodile's attack; the drop save is written in combat
    do:
      - {console: "tgm"}
      - {console: "ARG_Ref_ClaywaterStationCrocodile.moveto player 0 200 0"}
      - {strike: ARG_Ref_ClaywaterStationCrocodile}   # the player's blow starts the fight (startcombat left the player out of combat: game-16)
      - {wait: 2}
      - {call: [core-suspend, stream_drop]}
    expect:
      - {console: "player.IsInCombat", contains: ">> 1"}
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaSuspend written (stream drop)"}, within: 10}
  - name: interval-not-in-combat
    owed: a 300 s in-combat hold (30 waits) measured once on the game slot before it joins a batch
  - name: walk-away           # 50 m from the camp, out of combat
    do:
      - {console: "ARG_Ref_ClaywaterStationCrocodile.stopcombat"}
      - {console: "tgm"}
      - {console: "player.moveto ARG_Ref_ClaywaterStationRoadIn 0 -3500 0"}
      - {wait: 3}
      - {call: [core-suspend, quit]}
    expect: [{read: [player], path: pos, keep: away}]
  - name: continue            # the game quits and relaunches on the suspend save
    do: [{relaunch: {save: ArgoniaSuspend, scene: false}}, {wait: 4}]
    expect:
      - {read: [core, WakePoint], path: value, eq: {kept: wake}, within: 30}
      - {moved: {lt: 300}}
