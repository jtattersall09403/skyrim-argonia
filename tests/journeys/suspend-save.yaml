# Draft (1.5 build): owed L4, the hidden suspend save (2.8 §c): a quit or a stream drop writes ArgoniaSuspend, and the
# interval writes it while the game runs, never in combat and never with a menu open; opening a menu never does.
id: suspend-save
status: draft, owed L4
scene: >-
  bat camp
step0:
  - rest at the camp (ArgoniaRest written); note ArgoniaSuspend.ess's time if present
steps:
  - do: >-
      open the pause hub (Tab: the TweenMenu), then the Journal (J), each for 5 s
    expect: >-
      no ArgoniaSuspend.ess is written and the log has no "saves: ArgoniaSuspend written"; each menu stays open
      until closed (game-8's lag: the save's spinner closed the Journal)
  - do: >-
      the bridge's `core-suspend stream_drop` (Bridge.suspend_save(), the stream client's hand on a drop; an SKSE
      message to ArgoniaCore, which runs SuspendSave("stream_drop"))
    expect: >-
      ok with the file; ArgoniaSuspend.ess has a new time; `core-suspend pause_hub` is refused (fails on purpose)
  - do: >-
      start a fight (the archetype); while in combat, call SuspendSave("stream_drop") and wait 300 s
    expect: >-
      the stream-drop save is written even in combat; no interval save is written in combat
  - do: >-
      walk 50 m from the camp, quit from the Journal's System tab (Quit, confirm Yes), relaunch, choose Continue
    expect: >-
      the log has "saves: ArgoniaSuspend written (quit)" as the confirmation closes; the game loads ArgoniaSuspend (the newest), the player stands 50 m from the camp, and WakePoint() is
      still the camp; dying now wakes at the camp, not at the suspend point
pass: >-
  every expectation above
fails_if: >-
  the suspend save is offered as a player save; it is written in combat on the interval; Continue loads an
  older save; a crash
