# Draft (2.W4-navmesh, 0.4 §d navmesh (b)): owed L4, run by 0.3's hands.
id: nav-npc-walk
status: draft, owed L4 (not runnable: see docs/research/2026-10-30/lane-journeys-ready.md)
scene: nav-claywater
steps:
  - do: spawn one Argonian NPC (Argonia.esm's test actor) on the road at the block's west edge (cell -60,11, the
      road's first sample there, z on the ground)
    still: one at the play camera
  - do: order it to travel to Claywater Station's well (the place's position row) by the console's travel call
    read: [position every 1 s for 180 s, package, procedure, IsSwimming]
  - do: order it on to a point 200 m away across the ford (a cell-seam crossing and the water triangles)
    read: [the same]
    still: one each time it crosses a cell seam and each time it enters or leaves water
pass: it reaches both points; it crosses at least two cell seams without stopping (the edge links); it swims or
  wades where the triangles are water-flagged; it never stands still for more than 10 s
fails_if: it stands at a seam (a missing or one-way edge link), it walks into the ground or under water, a crash
