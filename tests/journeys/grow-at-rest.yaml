# 1.5 (owed L4), native map S16a-c: skill use earns vastei and never vanilla XP; the level waits for rest. The duel
# ring's deserter is the target (its health raised as setup so the blows land without a kill); a camp spot is placed
# at the player's marker at step 0. Reaching a pending level needs a measured blow count or a bridge setter: owed.
id: grow-at-rest
runner: 1
scene: duel-ring
steps:
  - name: setup
    do:
      - {console: "ARG_PG_DuelPlayerMarker.placeatme ARG_CampSpot 1"}
      - {console: "player.additem ARG_Weap_SteelSword 1"}
      - {console: "player.equipitem ARG_Weap_SteelSword"}
      - {wait: 2}
    expect:
      - {read: [actors, "3000"], path: listed.0.ref, keep: opp}
      - {read: [core, GetVastei], path: value, keep: v0}
      - {read: [core, GetLevel], path: value, keep: lvl0}
      - {read: [core, GetSkill, longBlade], path: value, keep: lb0}
      - {read: [av, OneHanded, player], path: base, keep: oh0}
  - name: arm
    do:
      - {console: "{opp}.setav health 2000"}
      - {console: "player.moveto {opp} 0 -110 0"}
      - {console: "player.setangle z 0"}
      - {pad: "RB:120 wait:1500"}
    expect: [{console: player.IsWeaponOut, not_contains: ">> 0"}]
  - name: ten-blows           # the player's attacks, not a console hit
    do:
      - {pad: "RB:120 wait:550 RB:120 wait:550 RB:120 wait:550 RB:120 wait:550"}
      - {pad: "RB:120 wait:550 RB:120 wait:550 RB:120 wait:550 RB:120 wait:550"}
      - {pad: "RB:120 wait:550 RB:120 wait:550"}
      - {wait: 1}
    expect:
      - {event: {kind: hit, match: "*"}}
      - {log: {name: ArgoniaCore, contains: "grow: hit longBlade"}}
      - {read: [core, GetVastei], path: value, gt: {kept: v0}}
      - {read: [av, OneHanded, player], path: base, eq: {kept: oh0}}   # P4: vanilla XP never moves
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0}}          # the level waits for rest
      - {event: {kind: menu, match: LevelUp Menu, absent: true}}
  - name: pending-level
    owed: a measured blow count to GetPendingLevels 1 (or a dev setter); then the sitting at the camp, sitting.buy endurance, sitting.done
  - name: rest-no-pending     # with no level pending the rest saves and no sitting opens
    do:
      - {console: "{opp}.stopcombat"}
      - {console: "player.moveto ARG_PG_DuelPlayerMarker 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 4}
      - {console: "player.setangle x 0"}
    expect:
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaRest written (rest)"}, within: 10}
      - {read: [core, SittingOpen], path: value, eq: false}
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0}}
