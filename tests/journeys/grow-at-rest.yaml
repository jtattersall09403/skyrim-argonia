# 1.5 (owed L4), native map S16a-c: skill use earns vastei and never vanilla XP; the level waits for rest. The Blackwood
# Road's ambush deserter is the target (calmed at step 0 so a rest is allowed) (its health raised as setup so the blows land without a kill); a camp spot is placed
# at the player's marker at step 0. The pending level comes from landed blows sent by the dev bridge's `dev-grow` into
# ArgoniaCore's own hit sink (the count is measured and kept); the rest and the sitting are what is tested.
id: grow-at-rest
runner: 1
crash_risk: medium   # a long fight and two rests (each writes the rest save)
scene: claywater-ambush
steps:
  - name: setup
    do:
      - {console: "ARG_Ref_ClaywaterStationAmbushPlayer.placeatme ARG_CampSpot 1"}
      - {console: "player.additem ARG_Weap_SteelSword 1"}
      - {console: "player.equipitem ARG_Weap_SteelSword"}
      - {wait: 2}
    expect:
      - {read: [actors, "4000"], path: listed.0.ref, keep: opp}
      - {read: [core, GetVastei], path: value, keep: v0}
      - {read: [core, GetLevel], path: value, keep: lvl0}
      - {read: [core, GetSkill, longBlade], path: value, keep: lb0}
      - {console: "player.getbaseav OneHanded", keep: oh0}   # the av read refuses vanilla names (game-13)
  - name: arm
    do:
      - {console: '"{opp}".stopcombat'}
      - {console: '"{opp}".setav aggression 0'}
      - {console: '"{opp}".setav health 2000'}
      - {console: "player.moveto {opp} 0 -110 0"}
      - {console: "player.setangle z 0"}
      - {key: "W 80"}             # the third-person camera ignores setangle until the player moves (diag3-g15)
      - {wait: 1}
    expect: [{console: player.IsWeaponOut, contains: ">>"}]   # strike draws (R here sheathed a drawn blade: game-16)
  - name: ten-blows           # the player's attacks, not a console hit
    do:
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {strike: "{opp}"}
      - {wait: 1}
    expect:
      - {event: {kind: hit, match: "*"}}
      - {log: {name: ArgoniaCore, contains: "grow: hit longBlade"}}
      - {read: [core, GetVastei], path: value, gt: {kept: v0}}
      - {console: "player.getbaseav OneHanded", eq: {kept: oh0}}   # P4: vanilla XP never moves
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0}}          # the level waits for rest
      - {event: {kind: menu, match: LevelUp Menu, absent: true}}
  - name: rest-no-pending     # with no level pending the rest saves and no sitting opens
    do:
      - {console: '"{opp}".stopcombat'}
      - {rest: ARG_Ref_ClaywaterStationAmbushPlayer}   # stops combat, aims at the camp spot, E until the rest logs (game-16)
    expect:
      - {log: {name: ArgoniaCore, contains: "saves: ArgoniaRest written (rest)"}, within: 10}
      - {read: [core, SittingOpen], path: value, eq: false}
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0}}
  - name: pending-level       # blows until a level is pending; the level still waits for rest
    do: [{call: [dev-grow, "{opp}", "1", "2000"]}, {console: '"{opp}".stopcombat'}]
    expect:
      - {read: [core, GetPendingLevels], path: value, eq: 1}
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0}}
      - {read: [core, GetAttribute, endurance], path: value, keep: end0}
  - name: rest-opens-sitting
    do:
      - {rest: ARG_Ref_ClaywaterStationAmbushPlayer}   # stops combat, aims at the camp spot, E until the rest logs (game-16)
    expect:
      - {read: [core, SittingOpen], path: value, eq: true, within: 10}
      - {read: [core, ViewState, sitting], path: value.type, eq: sitting.state}
  - name: sitting-buy
    do: [{call: [core, ViewIntent, '{"type":"sitting.buy","v":1,"body":{"attribute":"endurance"}}']}]
    expect: [{read: [core, ViewState, sitting], path: value.type, eq: sitting.state}]
  - name: sitting-done
    do: [{call: [core, ViewIntent, '{"type":"sitting.done","v":1,"body":{}}']}, {wait: 4}]
    expect:
      - {read: [core, SittingOpen], path: value, eq: false}
      - {read: [core, GetPendingLevels], path: value, eq: 0}
      - {read: [core, GetLevel], path: value, eq: {kept: lvl0, plus: 1}}
      - {read: [core, GetAttribute, endurance], path: value, gt: {kept: end0}}
