# Rock booth (1.15 §e.2), generated by `python3 -m tools.argonia_world.vegetation booth --write`: six of
# our placed rocks (sunk by their OBND, conformed to the slope), a first-person still each, standing on
# the ground 4 bound radii (300 units at least) downhill, eye 120 units up, aimed at the rock's middle, `camera: first`, noon in the region's
# own clear weather (no fog over the base). Reader checklist per still: sunk (no open bottom), no gap
# under the downhill lip, no hollow back, leans with the slope not against it. Never set what it tests.
id: rock-booth
reach: [esm, "tools/argonia_world/vegetation/**", data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: low
scene: rock-booth
camera: first
steps:
- name: rock-1-arg_rock_gl_rock09
  # 0C0008:ArgoniaWorld.esm ref DD1A00 in cell (-55,63), tilt 49.3 deg, scale 1.00, bound radius 76 u, stand 304 u off
  # subject: -222823 258927 38246
  do:
  - console:
      line: cow ARG_Province -55 63
      settle: 60
  - wait: 8
  - console:
      line: fw ARG_Weather_clear_dry
  - console:
      line: set gamehour to 12
  - console:
      line: player.setpos x -222628
  - console:
      line: player.setpos y 259161
  - console:
      line: player.setpos z 38450
  - console:
      line: player.setangle z 220
  - console:
      line: player.setangle x 47
  - wait: 6
  - console: prid ArgoniaWorld.esm|0xDD1A00
  expect:
  - console: getpos x
    keep: rock_x
  - console: getpos y
    keep: rock_y
  - console: getpos z
    keep: rock_z
