         {console: "set gamehour to 12"}, {console: "player.setpos x -122901"}, {console: "player.setpos y 71426"},
         {console: "player.setpos z 1278"}, {console: "player.setangle z 303"}, {console: "player.setangle x 3"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20},
             {read: [player], path: pos, keep: glenbridge_step_deck},
