# 1.15 round 6 (checks row 164: the six step crossings bridged; lane 1.15-r6-bridge-journeys): one still at each of the three
# cypress scaffold bridges (King of the Murkmire stockadescaffoldbridge04, 17.56 m x 3.80 m, seated on Skyrim's Bridge01 method;
# docs/research/2026-11-04/lane-1.15-r6-bridges.md), clear-dry at noon, from the road 12 m back from the deck's end, aimed at the
# deck's middle; then the player teleported onto the deck's middle must stand within 0.3 m of the deck top (the state read).
# Stands are on the build's ground at the time of writing; the r6-land3 regenerate seats the approaches, so a stand that
# then fails `python3 -m tools.journeys check` is re-seated (the same line, the ground under it).
id: bridge-look
reach: [esm, "tools/argonia_world/regions/**", "tools/argonia_world/routes/**", data/dependencies.json]
look: world
runner: 1
independent_steps: true
crash_risk: low
scene: claywater
camera: first
steps:
  - name: gideon-step
    scan: 6
    # subject: -141596 49318 4840
    do: [{hud: "off"}, {console: {line: "cow ARG_Province -35 11", settle: 60}}, {wait: 8},
         {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "set gamehour to 12"}, {console: "player.setpos x -141222"}, {console: "player.setpos y 47912"},
         {console: "player.setpos z 4759"}, {console: "player.setangle z 345"}, {console: "player.setangle x 2"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
    reader: [a wooden plank bridge spanning the water step along the road (gideon-soulrest and gideon-stormhold), both ends meeting the road, no gap at either end, no float, no Nordic piece]
  - name: gideon-step-deck
    scan: 6
    # the player on the deck's middle (1604.44, 3039.16 m, deck top 69.11 m = 4840 u): feet within 0.3 m (21 u) of the deck top
    do: [{hud: "off"}, {console: {line: "cow ARG_Province -35 11", settle: 60}}, {wait: 8},
         {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "set gamehour to 12"}, {console: "player.setpos x -141596"}, {console: "player.setpos y 49318"},
         {console: "player.setpos z 4856"}, {console: "player.setangle z 345"}, {console: "player.setangle x 3"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20},
             {read: [player], path: pos, keep: gideon_step_deck},
             {read: [player], path: pos.z, ge: 4819, within: 10}, {read: [player], path: pos.z, le: 4861, within: 10},
             {console: "player.getpos z", contains: ">>"}]
    reader: [standing on a wooden plank deck, the road continuing level past the far end, no gap, no float, no Nordic piece]
  - name: glenbridge-step
    scan: 6
    # subject: -122901 71426 1262
    do: [{hud: "off"}, {console: {line: "cow ARG_Province -30 17", settle: 60}}, {wait: 8},
         {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "set gamehour to 12"}, {console: "player.setpos x -121674"}, {console: "player.setpos y 70644"},
         {console: "player.setpos z 1019"}, {console: "player.setangle z 303"}, {console: "player.setangle x -5"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
    reader: [a wooden plank bridge spanning the water step along the road (gideon-stormhold, glenbridge and the rootworm line), both ends meeting the road, no gap at either end, no float, no Nordic piece]
  - name: glenbridge-step-deck
