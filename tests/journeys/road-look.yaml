# 1.15 round 4 (owner play test 3, finding 21: "roads poorly implemented: just flat texture"): three stills of the
# Blackwood Road at the play camera, for a `reader` against routes/shape.py's measured Skyrim road: the road the low
# line of a shallow worn trough (ground rising ~0.3 m at 4 m out), its dirt paint blending into the land over ~4 m
# each side (no hard stripe), no spike, wall or step along it, no Nordic piece. Vantages re-derived 1.15-r4-roads-2 from the
# re-traced road. Lane 1.15-r6-road-stop: each stand on the DB centreline (gen.road_stand: <= 2 m, <= 20 deg, the trough in the middle third), slid along it to clear; 20 % lies under water, so it stands at 28.5 %; the flat marsh
# window (46 %) and the slope window (57 %) of the L3 stills; each faces along the road. Stills are the evidence;
# each step only checks the player landed in the province.
id: road-look
look: world
runner: 1
independent_steps: true
crash_risk: low
scene: claywater
camera: first
steps:
  - name: road-in
    do: [{hud: "off"}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: blackwood-20
    scan: 6
    # subject: -168257 30778 4820
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.setpos x -166754"}, {console: "player.setpos y 31672"}, {console: "player.setpos z 4852"},
         {console: "player.setangle z 239"}, {console: "player.setangle x 5"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
    reader: [the road the low line of a shallow worn trough along the middle of the frame, its dirt blending into the land over ~4 m each side, no spike, wall or step along it, no Nordic piece]
  - name: blackwood-flat-46
    scan: 6
    # subject: -193612 40901 4970
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.setpos x -191886"}, {console: "player.setpos y 41148"}, {console: "player.setpos z 4991"},
         {console: "player.setangle z 262"}, {console: "player.setangle x 5"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
    reader: [the road the low line of a shallow worn trough along the middle of the frame, its dirt blending into the land over ~4 m each side, no spike, wall or step along it, no Nordic piece]
  - name: blackwood-slope-57
    scan: 6
    # subject: -210100 39884 4919
    do: [{hud: "off"}, {console: "sw Argonia.esm|0x000E9B"}, {console: "fw Argonia.esm|0x000E9B"}, {settle: {cap: 14, min: 3}},
         {console: "player.setpos x -209686"}, {console: "player.setpos y 41582"}, {console: "player.setpos z 4920"},
         {console: "player.setangle z 194"}, {console: "player.setangle x 4"}, {wait: 4}]
    expect: [{read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}]
    reader: [the road the low line of a shallow worn trough along the middle of the frame, its dirt blending into the land over ~4 m each side, no spike, wall or step along it, no Nordic piece]
