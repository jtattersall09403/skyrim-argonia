    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: blackwood-20
    do: [{console: "player.setpos x -166236"}, {console: "player.setpos y 32022"}, {console: "player.setpos z 4708"},
         {console: "player.setangle z 240"}, {wait: 4}]
  - name: blackwood-flat-46
    do: [{console: "player.setpos x -195572"}, {console: "player.setpos y 40894"}, {console: "player.setpos z 5115"},
         {console: "player.setangle z 272"}, {wait: 4}]
  - name: blackwood-slope-57
    do: [{console: "player.setpos x -209265"}, {console: "player.setpos y 41818"}, {console: "player.setpos z 5159"},
         {console: "player.setangle z 281"}, {wait: 4}]
