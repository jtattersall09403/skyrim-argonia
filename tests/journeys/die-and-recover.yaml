# 1.5 (owed L4), native map S17a: die with vastei -> wake at the camp with no load -> the pile holds it -> take it
# back, the same amount. The vastei is earned by blows (no setter through the bridge); the player's health is forced
# low as setup only, and the deserter's own attacks deal the death.
id: die-and-recover
runner: 1
scene: duel-ring
steps:
  - name: setup
    do:
      - {console: "ARG_PG_DuelPlayerMarker.placeatme ARG_CampSpot 1"}
      - {console: "player.additem ARG_Weap_SteelSword 1"}
      - {console: "player.equipitem ARG_Weap_SteelSword"}
      - {wait: 2}
    expect: [{read: [actors, "3000"], path: listed.0.ref, keep: opp}]
  - name: rest                # the wake point is the camp
    do:
      - {console: "player.moveto ARG_PG_DuelPlayerMarker 0 -90 0"}
      - {console: "player.setangle z 0"}
      - {console: "player.setangle x 40"}
      - {wait: 3}
      - {key: "E 120"}
      - {wait: 4}
      - {console: "player.setangle x 0"}
    expect: [{read: [core, WakePoint], path: value, ne: "", keep: wake, within: 10}]
  - name: earn                # blows on the deserter (its health raised as setup)
    do:
      - {console: "{opp}.setav health 2000"}
      - {console: "player.moveto {opp} 0 -110 0"}
      - {console: "player.setangle z 0"}
      - {pad: "RB:120 wait:1500"}
      - {pad: "RB:120 wait:550 RB:120 wait:550 RB:120 wait:550 RB:120 wait:550"}
    expect:
      - {read: [core, GetVastei], path: value, gt: 0}
      - {read: [core, GetVastei], path: value, keep: v}
  - name: die                 # the deserter's attacks; no death camera, no load
    do:
      - {console: "player.forceav health 5"}
      - {console: "{opp}.startcombat player"}
      - {wait: 10}
    expect:
      - {log: {name: ArgoniaCore, contains: "death: fell"}, within: 20}
      - {log: {name: ArgoniaCore, contains: "death: woke"}, within: 10}
  - name: woke-at-camp
    expect:
      - {read: [core, GetVastei], path: value, eq: 0}
      - {read: [core, WakePoint], path: value, eq: {kept: wake}}
      - {read: [core, PileState], path: value, ne: "", keep: pile}
      - {read: [player], path: dead, eq: false}
  - name: take-pile           # stand on the pile, look down at it, activate
    do:
      - {console: "{opp}.stopcombat"}
      - {teleport: "pos {pile.0} {pile.1} {pile.2}"}
      - {console: "player.setangle x 80"}
      - {wait: 2}
      - {key: "E 120"}
      - {wait: 2}
      - {console: "player.setangle x 0"}
    expect:
      - {read: [core, GetVastei], path: value, eq: {kept: v}}
      - {read: [core, PileState], path: value, eq: ""}
  - name: second-death-replaces
    owed: a pile-count read (the form scan) to show exactly one pile after a second and third death
