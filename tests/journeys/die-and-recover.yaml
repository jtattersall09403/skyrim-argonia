# 1.5 (owed L4), native map S17a: die with vastei -> wake at the camp with no load -> the pile holds it -> take it
# back, the same amount. The vastei is set by dev-set SetVastei (setup); the player's health is forced
# low as setup only, and the deserter's own attacks deal the death.
id: die-and-recover
runner: 1
crash_risk: high     # death and wake three times
batch_last: true         # it ends at the main menu or changes the saves: last in a batch (run_batch --write-owed)
scene: claywater-ambush
steps:
  - name: setup
    do:
      - {console: "ARG_Ref_ClaywaterStationAmbushPlayer.placeatme ARG_CampSpot 1"}
      - {console: "player.additem ARG_Weap_SteelSword 1"}
      - {console: "player.equipitem ARG_Weap_SteelSword"}
      - {wait: 2}
    expect: [{read: [actors, "4000"], path: listed.0.ref, keep: opp}]
  - name: rest                # the wake point is the camp; the deserter out of combat ("cannot rest with enemies nearby")
    do:
      - {console: '"{opp}".stopcombat'}
      - {console: '"{opp}".disable'}   # the hostile deserter out of the way: the engine rightly refuses a rest beside him (game-16)
      - {rest: ARG_Ref_ClaywaterStationAmbushPlayer}   # stops combat, aims at the camp spot, E until the rest logs (game-16)
      - {console: '"{opp}".moveto player 0 300 0'}   # loaded beside the player before enable (diag4)
      - {console: '"{opp}".enable'}
    expect: [{read: [core, WakePoint], path: value, ne: "", keep: wake, within: 10}]
  - name: earn                # the vastei carried, set (the check is the pile on death, not earning it)
    do: [{call: [dev-set, SetVastei, "50"]}]
    expect:
      - {read: [core, GetVastei], path: value, gt: 0}
      - {read: [core, GetVastei], path: value, keep: v}
  - name: die                 # the deserter's attacks; no death camera, no load
    do:
      - {console: "player.damageav health 39"}   # 44 -> 5; damageav, so the wake restores to full (diag6 §4)
      - {console: '"{opp}".startcombat player'}
      - {wait: 10}
    expect:
      - {log: {name: ArgoniaCore, contains: "death: fell"}, within: 20}
      - {log: {name: ArgoniaCore, contains: "death: woke"}, within: 10}
      - {log: {name: ArgoniaCore, contains: "death: bleedout ended"}, within: 10}   # logged with the wake, inside this step (g18b)
  - name: woke-at-camp
    expect:
      - {read: [core, GetVastei], path: value, eq: 0}
      - {read: [core, WakePoint], path: value, eq: {kept: wake}}
      - {read: [core, PileState], path: value, ne: "", keep: pile}
      - {read: [refs, ARG_VasteiPileActivator], path: refs.0.ref, keep: pile_ref}
      - {read: [player], path: dead, eq: false}
  - name: take-pile           # stand on the pile, look down at it, activate
    do:
      - {console: '"{opp}".stopcombat'}
      - {console: "player.moveto {pile_ref}"}   # a raw pos teleport missed the pile (game-17) and is crash-prone (diag4)
      - {console: "player.setangle x 80"}
      - {wait: 2}
      - {key: "E 120"}
      - {wait: 2}
      - {console: "player.setangle x 0"}
    expect:
      - {read: [core, GetVastei], path: value, eq: {kept: v}}
      - {read: [core, PileState], path: value, eq: ""}
  - name: second-death        # the pile is dropped again: one pile in the form map
    do:
      - {console: "player.damageav health 39"}   # 44 -> 5; damageav, so the wake restores to full (diag6 §4)
      - {console: '"{opp}".startcombat player'}
      - {wait: 10}
    expect:
      - {log: {name: ArgoniaCore, contains: "death: woke"}, within: 20}
      - {read: [refs, ARG_VasteiPileActivator], path: enabled, eq: 1}
  - name: third-death-replaces  # dying again with the pile untaken replaces it: still one
    do:
      - {console: "player.damageav health 39"}   # 44 -> 5; damageav, so the wake restores to full (diag6 §4)
      - {console: '"{opp}".startcombat player'}
      - {wait: 10}
    expect:
      - {log: {name: ArgoniaCore, contains: "death: woke"}, within: 20}
      - {read: [refs, ARG_VasteiPileActivator], path: enabled, eq: 1}
