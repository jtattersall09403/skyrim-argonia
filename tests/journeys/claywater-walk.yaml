# 0.4 §d acceptance, in game from `bat claywater`: the player walks the road into Claywater Station and into an
# interior; the people stand at their posts by day; LF83's things are placed and enabled. Judged by console state;
# a still per step. The schedules (sandbox by day, sleep by night) are nav-sandbox-20's and a night step here.
id: claywater-walk
runner: 1
crash_risk: low
scene: claywater
steps:
  - name: arrived
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: walk-in
    do: [{pad: "LY=1:3000"}, {pad: "LY=1:3000"}]
    expect: [{moved: {gt: 600}}]
  - name: people-placed
    expect:
      - {console: "ARG_Ref_ClaywaterStationLivia.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationSigns.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationTakes.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationGaius.GetDisabled", contains: ">> 0"}
  - name: lf83-things-placed
    expect:
      - {console: "ARG_Ref_ClaywaterStationWell.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationMortarTub.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationRaft.GetDisabled", contains: ">> 0"}
      - {console: "ARG_Ref_ClaywaterStationCrocodile.GetDead", contains: ">> 0"}
  - name: to-the-station-door
    # 70 units out on the porch, against the door's heading (212 deg), facing it: moveto onto the door left the camera
    # in the thatch and E found nothing; the stilt house of a6a2748 has its porch on this side (game-7)
    do: [{console: "player.moveto ARG_Ref_ClaywaterStationB1Door 37 60 20"}, {console: "player.setangle z 212"}, {wait: 2}]
  - name: enter-the-station-house   # the real path: activate the load door
    do: [{key: "E 120"}, {wait: 6}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 0"}]
  - name: out-again   # the arrival faces into the room: stand before the house's own (KotM) door and face it
    do: [{console: "player.moveto ARG_Ref_ClaywaterStationStationHouseDoor 0 -120 0"}, {console: "player.setangle z 0"},
         {wait: 2}, {key: "E 120"}, {wait: 6}]
    expect: [{console: "player.GetInWorldspace ARG_Province", contains: ">> 1"}]
  - name: night
    owed: "the bed is indoors (KotM 088933BE) and the stilt house's porch and load door are off the navmesh (no door or placed-object walk triangles, 2.W4): Livia takes her sleep package and cannot path to it; moved onto the bed she sleeps (game-8)"
    do: [{console: "set gamehour to 23"}, {wait: 8}]
    expect: [{console: "ARG_Ref_ClaywaterStationLivia.GetSleeping", not_contains: ">> 0", within: 60}]
