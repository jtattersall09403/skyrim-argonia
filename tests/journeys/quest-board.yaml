# 1.1 adapters (owed L4): LF83 runs by the journal and its fail-forward fires. The main run (stages 10-40) and the
# staged endings (41, 90, 92, 93) are lf83-components and lf83-endings; this journey is the one they leave: the
# fail-forward 92 from a keeper killed by the player's own attacks (lf83-endings stages the death with `kill`).
# Livia's health is lowered as setup (the means), never her death.
id: quest-board
runner: 1
crash_risk: low
scene: first-place
steps:
  - name: talk-takes          # stage 10 the real way: Takes' greeting links the hook topic
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationTakes 0 -120 0"}
      - {console: "player.setangle z 0"}
      - {talk: ARG_Ref_ClaywaterStationTakes}
      - {wait: 2}
    expect: [{read: [core, KnowsTopic, topic.claywater-two-charges], path: value, eq: true}]
  - name: stage-10
    do: [{call: [core, ViewIntent, '{"type":"dialogue.goodbye","v":1,"body":{}}']}]
    expect:
      - {console: "GetStage ARG_Q_LF83", contains: ">> 10", within: 8}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 10 0 "}
  - name: arm                 # the means: weapon out at Livia, her health low; she is not killed by the scene
    do:
      - {console: "player.moveto ARG_Ref_ClaywaterStationLivia 0 -110 0"}
      - {console: "player.setangle z 0"}
      - {console: "ARG_Ref_ClaywaterStationLivia.moveto player 0 100 0"}
      - {console: "ARG_Ref_ClaywaterStationLivia.damageav health 1000"}
      - {console: "ARG_Ref_ClaywaterStationLivia.restoreav health 5"}
      - {pad: "RB:120 wait:1500"}
    expect: [{console: player.IsWeaponOut, not_contains: ">> 0"}]
  - name: strike              # the player's blows
    do: [{pad: "RB:120 wait:900"}, {pad: "RB:120 wait:900"}, {pad: "RB:120 wait:900"}]   # one pad call each: 3 x 1020 ms is over the 3 s cap
    expect:
      - {event: {kind: hit, match: "*"}}
      - {console: "ARG_Ref_ClaywaterStationLivia.GetDead", contains: ">> 1", within: 8}
  - name: fail-forward-92
    expect:
      - {console: "GetStage ARG_Q_LF83", contains: ">> 92", within: 5}
      - {read: [core, JournalEntries], path: value, contains: "quest.local.lf83 92 2 "}
      - {read: [quest, ARG_Q_LF83], path: running, eq: false, within: 5}
