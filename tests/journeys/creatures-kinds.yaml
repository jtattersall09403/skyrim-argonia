  do:
  - console: tgm
  - console: {line: cow ARG_Province 17 15, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - settle: {cap: 14, min: 3}
  - console: player.setpos x 73310
  - console: player.setpos y 60450
  - console: player.setpos z 277
  - wait: 10
  expect:
  - {read: [player], path: pos, keep: coastal_lagoon_stand}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE98D40"], path: refs.0, ne: null, keep: coastal_lagoon_spawn}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE98D40"], path: refs.0.disabled, eq: false}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE98D40"], path: refs.0.loaded_3d, eq: true}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE98D40"], path: refs, kinds: {ge: 1, among: ["Baby Mock Turtle", "Crocodile", "Great Mock Turtle", "Kingfisher", "Kotu Gava", "Mock Turtle", "Mudcrab", "Oystercatcher", "Pectoral Sandpiper", "Salt Crocodile", "Seagull", "Swamp Crocodile", "Turtle"]}, keep: coastal_lagoon_spawn_kind}
  - {read: [actors, "8192"], path: listed, keep: coastal_lagoon}
  - {read: [actors, "8192"], path: listed, kinds: {ge: 4, among: ["Baby Mock Turtle", "Betty Swamp Jelly", "Bull Swamp Jelly", "Crocodile", "Crow", "Dreugh", "Fleshflies", "Forest Spider", "Giant Centipede", "Giant Leech", "Giant Snail", "Great Mock Turtle", "Hackwing", "Jassa Red Slug", "Jungle Centipede", "Jungle Rattler", "Kingfisher", "Kotu Gava", "Leech", "Mock Turtle", "Moon-Adder", "Mudcrab", "Mudrunner", "Netch Calf", "Oystercatcher", "Pectoral Sandpiper", "Raven", "Salt Crocodile", "Sea Drake", "Seagull", "Shark", "Swamp Crocodile", "Swamp Rat", "Swamp Slaughterfish", "Turtle", "Verminous Stalker", "Viper"]}, keep: coastal_lagoon_kinds}
