# Creature kinds per region (lane 1.15-r5-creatures-journey; owner #37: never fewer kinds per region than Skyrim or the
# Black Marsh mod). Generated by `python3 -m tools.argonia_world.creatures kinds` (tools/journeys/gen.py) from the build:
# never hand-edit. A state check, no stills (owner 19:05 #41, decision 0036 amended; lane 1.15-r6-creatures-state).
# Three region classes, one stop each at a planned spawn point of the build (creature planner, the whole province): the
# land or shore spawn with its class on the most cells two out (all 25 where the class is wide enough), then the most spawn points
# within 90 m, and 3+ cells from any place. Each stop teleports to dry ground 15-25 m from the spawn, waits,
# and reads by the bridge: the spawn's own reference (ArgoniaWorld.esm|0x...: present, enabled, 3D loaded, a kind of its
# own list) and every actor loaded within two cells (8192 units), FAILING unless at least 4 distinct kinds of that
# class's lists are among them (`kinds`: an actor is a kind when its name ends the kind's name or the kind's name ends
# its name, so "Leech" is "Giant Leech"; dead actors do not count). The reads go into report.json (kept: <class>,
# <class>_kinds, <class>_spawn). The fourth stop is Claywater's guar pen: both kept guar (lane 1.15-r5-creatures) read
# present, alive, enabled and near. A failed step alone takes a still.
id: creatures-kinds
reach: [esm, "tools/argonia_world/creatures/**", data/creature-kind-bars.json, data/dependencies.json]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
independent_steps: true
crash_risk: medium
scene: creature-spots
stills: false
steps:
- name: coastal-lagoon
  # cell (3, 18) coastal-lagoon, spawn lvln.coastal-lagoon.D4.shore (D4) ref ArgoniaWorld.esm|0xE9E840, the class on 13 of the 25 cells round it, 7 spawn points within 90 m; the stand is 15 m from it
  # subject: 16128 77568 115
  do:
  - console: tgm
  - console: {line: cow ARG_Province 3 18, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - settle: {cap: 14, min: 3}
  - console: player.setpos x 15385
  - console: player.setpos y 78311
  - console: player.setpos z 88
  - wait: 10
  expect:
  - {read: [player], path: pos, keep: coastal_lagoon_stand}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE9E840"], path: refs.0, ne: null, keep: coastal_lagoon_spawn}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE9E840"], path: refs.0.disabled, eq: false}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE9E840"], path: refs.0.loaded_3d, eq: true}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE9E840"], path: refs, kinds: {ge: 1, among: ["Burglar Crab", "Crocodile", "Haj Mota", "Kotu Gava", "Marsh Bird", "Marsh Turtle"]}, keep: coastal_lagoon_spawn_kind}
  - {read: [actors, "8192"], path: listed, keep: coastal_lagoon}
  - {read: [actors, "8192"], path: listed, kinds: {ge: 4, among: ["Burglar Crab", "Crocodile", "Crow", "Dreugh", "Fellrunner", "Fleshfly Swarm", "Giant Centipede", "Giant Leech", "Giant Snail", "Giant Snake", "Giant Wasp", "Hackwing", "Haj Mota", "Hoarvor", "Jassa Red Slug", "Kotu Gava", "Marsh Bird", "Marsh Rat", "Marsh Turtle", "Moon Adder", "Pad-sa Shark", "Red Hooped Tree-Viper", "Sea-Drake", "Slaughterfish", "Swamp Jelly", "Wamasu"]}, keep: coastal_lagoon_kinds}
- name: northern-transition
  # cell (-61, 60) northern-transition, spawn lvln.northern-transition.D3.shore (D3) ref ArgoniaWorld.esm|0xEF0341, the class on 20 of the 25 cells round it, 9 spawn points within 90 m; the stand is 15 m from it
  # subject: -249728 249728 17211
  do:
  - console: {line: cow ARG_Province -61 60, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - settle: {cap: 14, min: 3}
  - console: player.setpos x -249728
  - console: player.setpos y 250778
  - console: player.setpos z 17030
  - wait: 10
  expect:
  - {read: [player], path: pos, keep: northern_transition_stand}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xEF0341"], path: refs.0, ne: null, keep: northern_transition_spawn}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xEF0341"], path: refs.0.disabled, eq: false}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xEF0341"], path: refs.0.loaded_3d, eq: true}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xEF0341"], path: refs, kinds: {ge: 1, among: ["Crocodile", "Dragon Frog", "Haj Mota", "Kotu Gava", "Marsh Bird", "Marsh Turtle", "Singing Frog", "Voriplasm"]}, keep: northern_transition_spawn_kind}
  - {read: [actors, "8192"], path: listed, keep: northern_transition}
  - {read: [actors, "8192"], path: listed, kinds: {ge: 4, among: ["Alit", "Bog Dog", "Crocodile", "Crow", "Dragon Frog", "Dreugh", "Fellrunner", "Fleshfly Swarm", "Giant Centipede", "Giant Leech", "Giant Snail", "Giant Snake", "Giant Wasp", "Hackwing", "Haj Mota", "Hoarvor", "Jassa Red Slug", "Kotu Gava", "Marsh Bird", "Marsh Rat", "Marsh Turtle", "Moon Adder", "Red Hooped Tree-Viper", "Singing Frog", "Voriplasm", "Wamasu"]}, keep: northern_transition_kinds}
- name: western-frontier
  # cell (-34, -4) western-frontier, spawn lvln.western-frontier.D3.land (D3) ref ArgoniaWorld.esm|0xE72A01, the class on 25 of the 25 cells round it, 9 spawn points within 90 m; the stand is 20 m from it
  # subject: -139008 -16384 1371
  do:
  - console: {line: cow ARG_Province -34 -4, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - settle: {cap: 14, min: 3}
  - console: player.setpos x -140409
  - console: player.setpos y -16384
  - console: player.setpos z 1463
  - wait: 10
  expect:
  - {read: [player], path: pos, keep: western_frontier_stand}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE72A01"], path: refs.0, ne: null, keep: western_frontier_spawn}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE72A01"], path: refs.0.disabled, eq: false}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE72A01"], path: refs.0.loaded_3d, eq: true}
  - {read: [actors, "8192", "ArgoniaWorld.esm|0xE72A01"], path: refs, kinds: {ge: 1, among: ["Alit", "Bog Dog", "Crow", "Fellrunner", "Fleshfly Swarm", "Giant Centipede", "Giant Snail", "Giant Wasp", "Hackwing", "Hoarvor", "Jassa Red Slug", "Marsh Rat", "Moon Adder", "Red Hooped Tree-Viper"]}, keep: western_frontier_spawn_kind}
  - {read: [actors, "8192"], path: listed, keep: western_frontier}
  - {read: [actors, "8192"], path: listed, kinds: {ge: 4, among: ["Alit", "Bog Dog", "Crocodile", "Crow", "Death Hopper", "Dragon Frog", "Fellrunner", "Fleshfly Swarm", "Giant Centipede", "Giant Leech", "Giant Snail", "Giant Snake", "Giant Wasp", "Hackwing", "Haj Mota", "Hoarvor", "Jassa Red Slug", "Kotu Gava", "Marsh Bird", "Marsh Rat", "Marsh Turtle", "Moon Adder", "Red Hooped Tree-Viper", "Singing Frog", "Voriplasm", "Wamasu"]}, keep: western_frontier_kinds}
- name: guar-pen
  # Claywater Station's pen (the pen markers 22.8 m east of the centre): both kept guar
  # subject: -231228 47914 4902
  do:
  - console: {line: cow ARG_Province -57 11, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -231228
  - console: player.setpos y 47354
  - console: player.setpos z 4848
  - wait: 6
  expect:
  - {read: [player], path: pos, keep: guar_stand}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar1], path: refs.0.dead, eq: false}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar1], path: refs.0.disabled, eq: false}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar1], path: refs.0.dist, lt: 1500}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar2], path: refs.0.dead, eq: false}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar2], path: refs.0.disabled, eq: false}
  - {read: [actors, "1500", ARG_Ref_ClaywaterStationKeptGuar2], path: refs.0.dist, lt: 1500}
  - {read: [actors, "1500"], path: listed, keep: guar_pen}
