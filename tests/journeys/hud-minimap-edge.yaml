# 1.12 owner look 1, lane 1.12-hud (L4): the minimap shows only the seen land, as the chart does. From world-sample stop
# 3, a far western corner the base save never walked: a still on arrival, then a long walk by the pad reveals a patch,
# and a still with the patch's edge in view, the seen land on one side and blank parchment on the other.
id: hud-minimap-edge
reach: ["ui/**", "tools/ui_theme/**", "skse/ArgoniaCore/**", "skse/core/**", data/dependencies.json, esm, "tools/chart/**"]   # the pass ledger's inputs (tools/pass_ledger.py)
runner: 1
crash_risk: low
scene: world-sample-03-corner
steps:
  - name: arrived
    do: [{pad: "LY=1:600"}, {wait: 2}]
    expect: [{read: [core, Views], path: value, contains: "minimap shown"}]
    reader: [the square minimap top right, mostly blank parchment with at most a small drawn patch about the arrow]
  - name: walked
    do: [{pad: "LY=1:3000"}, {pad: "LY=1:3000"}, {pad: "LY=1:3000"}, {pad: "LY=1:3000"}, {wait: 2}]
    expect: [{moved: {gt: 900}}]
    reader: [the minimap shows drawn land (roads, ink, colour) only in a patch along the walked path, fading to blank parchment at its edge, nothing drawn beyond it]
