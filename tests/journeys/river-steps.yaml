# River steps (lane 1.15-r4-water, owner play test 3 findings 19 and 20): three of the steepest kept steps,
# three reaches turned to dry gullies, two still bodies; teleport, settle, one still each at the play camera.
# Reader checklist: at a step, the rapids line sits on the upper water at the edge and flows down; the skirt and
# ring sit on the lower water at the foot; no piece in the air or facing uphill; no water sheet edge hanging over
# ground. At a gully: no water surface, a dry bed. At a still body: the surface does not flow (no drift).
# z is placed high and the player falls (tgm); the planner runs it in the round's batch.
id: river-steps
runner: 1
crash_risk: medium
scene: creature-spots
steps:
- name: step-1
  # kept 19.6 m step (-50,47) s
  do:
  - hud: off
  - console: tgm
  - console: {line: cow ARG_Province -50 47, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: player.setpos x -202944
  - console: player.setpos y 193112
  - console: player.setpos z 30142.0
  - wait: 6
  - camera: third
  - console: player.setangle z 180
  - wait: 4
  expect:
  - {read: [player], path: pos, keep: step-1}
  reader: [the header checklist for this kind of stop]
