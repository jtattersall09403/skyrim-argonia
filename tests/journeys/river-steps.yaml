# River steps (lane 1.15-r4-water, owner play test 3 findings 19 and 20): the three steepest kept steps of the water
# solve (water_step), three reaches turned to dry gullies, two still bodies; teleport, settle, one still each at the
# first person, HUD off, clear-dry weather forced, 13:00; a step from its side, 15-25 m off, its drop mid-frame; each
# still body twice from one stand a few seconds apart (a, b) so drift reads. Generated by `python3 -m tools.journeys refresh` (tools/journeys/gen.py) from the build: never hand-edit.
# Reader checklist: at a step, the rapids line sits on the upper water at the edge and flows down; the skirt and
# ring sit on the lower water at the foot; no piece in the air or facing uphill; no water sheet edge hanging over
# ground. At a gully: no water surface, a dry bed. At a still body: the surface does not flow (no drift).
# Every stop (lane 1.15-r4-water-look): near and far water read as water, no marbled or blocky white-and-dark tiles.
id: river-steps
runner: 1
independent_steps: true
crash_risk: medium
scene: creature-spots
camera: first
steps:
- name: step-1
  # kept 19.6 m step (-50,47) s, seen from its side
  # subject: -202944 192512 26455
  do:
  - hud: off
  - console: tgm
  - console: {line: cow ARG_Province -50 46, settle: 60}
  - wait: 8
  - console: set gamehour to 13
  - console: sw Argonia.esm|0x000E9B
  - console: fw Argonia.esm|0x000E9B
  - settle: {cap: 14, min: 3}
  - console: player.setpos x -201794
  - console: player.setpos y 192204
  - console: player.setpos z 27657
  - wait: 6
  - console: player.setangle z 285
  - console: player.setangle x 48
  - wait: 4
  expect:
  - {read: [player], path: pos, keep: step-1}
  - {read: [weather], path: current.editor_id, eq: ARG_Weather_clear_dry, within: 20}
  reader: [the header checklist for this kind of stop]
