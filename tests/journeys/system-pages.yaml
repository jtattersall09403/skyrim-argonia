# The System pane and the two pages behind it (Settings, Load) alone: the owner's rule (2026-11-03) is to re-check only
# what changed; these pages were restyled by lane 1.12-r5-system-pages (e57e1e4a). The rest of menus-look has passed.
id: system-pages
runner: 1
crash_risk: low
scene: ui-props
steps:
  - name: esc-system         # Esc in play: our System pane over the hidden Journal Menu
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect:
      - {event: {kind: menu, match: Journal Menu}}
      - {log: {name: ArgoniaCore, contains: "menus: Esc's Journal Menu hidden; our System pane opens"}, within: 5}
      - {read: [core, Views], path: value, contains: "system ready open", within: 5}
    reader: [one small window in the frame style (green-black pane, gold-green trim, warm text) titled System, entries Settings, Load, Quit to the main menu, Quit to the desktop, a Close button, no Quests entry, nothing of Dear Diary's parchment journal behind or around it]
  - name: system-settings    # Settings: the engine's own settings page
    do: [{call: [core, ViewIntent, '{"type":"system.pick","v":1,"body":{"action":"settings"}}']}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "menus: the System page's SETTINGS pressed"}, within: 5}
      - {log: {name: ArgoniaCore, contains: "Journal Menu handed over (tabs hidden: QuestsTab"}, within: 5}
    reader: [the game's settings list (gameplay, display, audio and the rest) on a dark green-black ground with warm light words (the frame style), no parchment page, no Quests or stats tab]
  - name: settings-back      # Esc backs out to the page's main list: our System pane again
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect:
      - {log: {name: ArgoniaCore, contains: "menus: back at the System page's main list"}, within: 6}
      - {read: [core, Views], path: value, contains: "system ready open", within: 5}
    reader: [our System pane again, no Dear Diary System list or Quests tab]
  - name: system-load        # Load: the engine's own save list, in the frame style too
    do: [{call: [core, ViewIntent, '{"type":"system.pick","v":1,"body":{"action":"load"}}']}, {wait: 3}]
    expect: [{log: {name: ArgoniaCore, contains: "menus: the System page's LOAD pressed"}, within: 5}]
    reader: [the save list on a dark green-black ground with warm light words (the frame style), no parchment page, no Quests or stats tab]
  - name: load-back
    do: [{key: "ESC 120 engine"}, {wait: 3}]
    expect: [{read: [core, Views], path: value, contains: "system ready open", within: 6}]
  - name: system-closed
    do: [{close_menu: system}, {wait: 2}]
    expect: [{event: {kind: menu, match: '"menu": "Journal Menu", "opening": false'}, within: 5}]
