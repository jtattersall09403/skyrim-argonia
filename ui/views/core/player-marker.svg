<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Argonia's player marker: a bevelled gilt arrowhead pointing north (rotate the element to the camera's
       heading). Our own drawing in the likeness of Morrowind's map marker; no game file (decision 0003).
       Draw at 14-18 px on the chart and the minimap. -->
  <defs>
    <linearGradient id="pmL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/><stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
    <linearGradient id="pmR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87a28"/><stop offset="1" stop-color="#5e4114"/>
    </linearGradient>
  </defs>
  <g stroke="#1d1308" stroke-width="1.6" stroke-linejoin="round">
    <path d="M16 2 L27 28 L16 21 L5 28 Z" fill="#2a1c0a"/>
  </g>
  <path d="M16 3.6 L16 20.2 L6.6 26.2 Z" fill="url(#pmL)"/>
  <path d="M16 3.6 L25.4 26.2 L16 20.2 Z" fill="url(#pmR)"/>
  <path d="M16 3.6 L16 20.2" stroke="#fff3c4" stroke-width="0.6" opacity="0.7"/>
</svg>
